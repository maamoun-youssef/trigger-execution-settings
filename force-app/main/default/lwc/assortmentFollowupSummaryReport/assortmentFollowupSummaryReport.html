<template>
    <div class="slds-card">
        <div class="main-header">
            <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header">
                <div class="slds-col slds-has-flexi-truncate">
                    <!-- HEADING AREA -->
                    <!-- MEDIA OBJECT = FIGURE + BODY -->
                    <div class="slds-media slds-no-space slds-grow">
                        <div
                            class="slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small slds-icon_container">
                            <lightning-icon icon-name="standard:report">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body slds-p-around_x-small">
                            <p class="slds-text-title slds-line-height_reset">
                                <!-- {assortmentBULabel.labelPlural} --> Assortment
                            </p>
                            <p class="slds-m-right_small slds-align-middle slds-truncate">
                                <!-- {orgaBuSelected}  --> {selectedYear}
                            </p>
                        </div>
                    </div>
                </div>
                <!-- <lightning-button-icon class="slds-button header_button slds-m-around_xx-small slds-align_absolute-center"  label="exportTargetExcel" alternative-text="exportTargetExcel" icon-name="doctype:csv"
                    onclick={exportExcel}></lightning-button-icon> -->
                <lightning-button class="slds-button header_button slds-m-around_xx-small" variant="border-filled"
                    label={labels.LBL_Back_To_Home_Page} onclick={handleBackToHomePage}></lightning-button>
                <lightning-button-icon icon-name="utility:filterList" alternative-text="Filter" variant="border-filled"
                    class="slds-button slds-button-icon slds-m-around_xx-small" onclick={toggleFilter}>
                </lightning-button-icon>
            </div>
        </div>
        <div class=" slds-grid">
            <div class="table-div slds-card slds-col slds-no-flex slds-grid slds-size_9-of-12 main-panel">
                <template if:true={tableLoading}>
                    <div class="slds-spinner_container">
                        <div class="loader slds-spinner_container slds-align--absolute-center">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </template>
                <template if:true={isEmptyList}>
                    <div class="slds-media__body">
                        <h1
                            class="slds-text-heading_medium slds-text-color_destructive slds-align_absolute-center slds-m-around_xx-large slds-size_1-of-1">
                            {labels.LBL_No_Record_To_Display}
                        </h1>
                    </div>
                </template>
                <template if:false={isEmptyList}>
                    <div class="main-table">
                        <table
                            class="slds-table slds-table_bordered slds-table_col-bordered main-table slds-border--left slds-no-row-hover">
                            <thead>
                                <tr>
                                    <th style="background-color:#0d807d;color:white;" rowspan="2">{labels.LBL_Scope_Name}</th>
                                    <template for:each={headerTopicsList} for:item="headerTopic">
                                        <th key={headerTopic} colspan="4" style={headerTopic.style}>{headerTopic.topic}
                                        </th>
                                    </template>
                                </tr>
                                <tr>
                                    <template for:each={headerTopicsList} for:item="headerTopic">
                                        <th key={headerTopic} style={headerTopic.style}>{labels.LBL_Budget}</th>
                                        <th key={headerTopic} style={headerTopic.style}>{labels.LBL_Target}</th>
                                        <th key={headerTopic} style={headerTopic.style}>{labels.LBL_Nego}</th>
                                        <th key={headerTopic} style={headerTopic.style}>{labels.LBL_Nego_vs_Target}</th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={asdWList} for:item="busource">
                                    <tr key={busource}>
                                        <td>
                                            <a href={busource.link} target="_blank">
                                                {busource.Name}
                                            </a>
                                        </td>
                                        <template for:each={busource.fields} for:item="field">
                                            <td key={field} style={field.style}>
                                                <lightning-formatted-number value={field.fieldValue}
                                                    minimum-fraction-digits={field.scale}
                                                    maximum-fraction-digits={field.scale}></lightning-formatted-number>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
            <div class="filter-panel slds-size_3-of-12 slds-card slds-m-around_none ">
                <div class="filter-header slds-panel__header">
                    <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate">
                        {labels.LBL_Filter}</h2>
                    <lightning-button-icon variant="bare" icon-name="utility:close" onclick={toggleFilter}>
                    </lightning-button-icon>
                </div>
                <div class="filter-section slds-p-around_xx-small ">
                    <lightning-combobox label={labels.LBL_Year} value={selectedYear} options={yearsArray}
                        onchange={handleYearChange}></lightning-combobox>
                </div>
                <div class="slds-grid slds-card__footer ">
                    <lightning-button variant="brand" class="slds-size_1-of-1" onclick={handleSearch}
                        label={labels.Search}></lightning-button>
                </div>
            </div>
        </div>
    </div>
</template>
