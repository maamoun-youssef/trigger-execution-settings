<template>
    <div if:true={showHeader}>
        <div class="slds-card mainContainer">
            <div class="header slds-page-header slds-m-bottom_xxx-small slds-clearfix">
                <div class="slds-grid sticky-header">
                    <div class="slds-col slds-p-around_xx-small slds-has-flexi-truncate">
                        <div class="slds-media sticky-header slds-no-space slds-grow">
                            <lightning-icon icon-name="standard:forecasts" size="medium" class="slds-m-right_small">
                            </lightning-icon>
                            <div class="slds-media__body">
                                <p class="slds-text-title_caps slds-line-height_reset">
                                    {labels.LBL_NS_Manager_Title}
                                </p>
                                <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
                                    <template lwc:if={isNewNS}>
                                        {labels.LBL_NS_Manager_New_NS_SubTitle}
                                    </template>
                                    <template lwc:elseif={isNewSubNS}>
                                        {labels.LBL_NS_Manager_New_Sub_NS_SubTitle}
                                    </template>
                                    <template lwc:else>
                                        {negoScope.Name}
                                    </template>
                                </h1>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-no-flex slds-grid">
                        <lightning-button label={labels.LBL_Back} class="slds-m-left_small" onclick={handleCancel}>
                        </lightning-button>
                        <lightning-button variant="brand" label={labels.Save} class="slds-m-left_small"
                            onclick={saveNegoScopeInfo} disabled={disableSave}>
                        </lightning-button>
                        <c-dynamicchatter label="Ask about this screen" heading="Ask about Negotiation Scope"
                            screen-key={screenKey} live-data={liveData}>
                        </c-dynamicchatter>
                    </div>
                </div>
            </div>
            <div>
                <lightning-spinner style="z-index: 9" variant="brand" size="large" if:true={loading}>
                </lightning-spinner>
                <!-- tabs -->
                <lightning-tabset if:true={activeTab} variant="vertical" onclick={handleTabClick}
                    active-tab-value={activeTab} class="tab-set-style slds-m-bottom_x-small">
                    <!-- Tab NS-->
                    <lightning-tab label={labels.LBL_NS_Tab_Information} title={labels.LBL_NS_Tab_Information}
                        value="NS" icon-name="utility:info_alt" style="padding:0px;"
                        class="slds-scrollable_y sectionNS">
                        <div style={mainPanelHeight} class="slds-border--left">
                            <template if:true={guidedMode}>
                                <div class="slds-p-around--medium" style="font-weight: bold;">
                                    {selectedCaseDescription}
                                </div>
                            </template>
                            <div class="slds-grid slds-wrap">
                                <template for:each={displayedNSFields} for:item="field" for:index="fieldIndex">
                                    <div key={field.fieldName} class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                                        <template if:true={field.isInputField}>
                                            <div lwc:if={field.isNameField}
                                                class="slds-form-element slds-form-element_horizontal">
                                                <label class="slds-form-element__label">{field.fieldLabel}</label>
                                                <div class="slds-form-element__control">
                                                    <div class="slds-grid">
                                                        <lightning-input data-field={field.fieldName}
                                                            onchange={handleFieldEdits} label={field.fieldLabel}
                                                            variant="label-hidden" value={negoScope.Name}
                                                            class="slds-m-right_small slds-size_2-of-3">
                                                        </lightning-input>
                                                        <lightning-button label={labels.LBL_NS_Suggest_Name}
                                                            onclick={handleSuggestName} class="slds-size_1-of-3">
                                                        </lightning-button>
                                                    </div>
                                                </div>
                                            </div>
                                            <lightning-input lwc:elseif={field.isText} data-field={field.fieldName}
                                                onchange={handleFieldEdits} label={field.fieldLabel}
                                                variant="label-inline" value={field.fieldValue}>
                                            </lightning-input>
                                            <lightning-textarea lwc:elseif={field.isTextarea}
                                                data-field={field.fieldName} onchange={handleFieldEdits}
                                                label={field.fieldLabel} variant="label-inline"
                                                value={field.fieldValue}>
                                            </lightning-textarea>
                                            <lightning-input lwc:elseif={field.isNumberField} type="number"
                                                data-field={field.fieldName} onchange={handleFieldEdits}
                                                label={field.fieldLabel} variant="label-inline" step={field.step}
                                                value={field.fieldValue} class="input-right">
                                            </lightning-input>
                                            <lightning-record-edit-form lwc:elseif={field.isReference}
                                                object-api-name={API_NAMES.NegoScope__c.objectApiName}
                                                record-id={negoScope.Id}>
                                                <lightning-input-field field-name={field.fieldName}
                                                    if:false={field.isOwner} data-field={field.fieldName}
                                                    onchange={handleFieldEdits} label={field.fieldLabel}
                                                    variant="label-inline" value={field.fieldValue}>
                                                </lightning-input-field>
                                                <c-neg-optim-custom-lookup if:true={field.isOwner}
                                                    search-term={selectedOwnerName}
                                                    object-name={API_NAMES.User.objectApiName}
                                                    field-name={API_NAMES.User.UserName__c} is-multi="false"
                                                    icon-name="" selected-event={Events.selectOwnerAction}
                                                    onselectowneraction={selectOwnerAction}
                                                    search-fields={searchOwnerFields} data-search="true"
                                                    place-holder={objectNSInfo.fieldsLabel.OwnerId}
                                                    label={objectNSInfo.fieldsLabel.OwnerId}
                                                    label-variant="label-inline" filter-token={ownerFilter}>
                                                </c-neg-optim-custom-lookup>
                                            </lightning-record-edit-form>
                                            <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                label={field.fieldLabel} variant="label-inline" data-isboolean="true"
                                                data-field={field.fieldName} onchange={handleFieldEdits}
                                                checked={field.fieldValue}>
                                            </lightning-input>
                                            <template lwc:elseif={field.isPicklist}>
                                                <div class="slds-form-element slds-form-element_horizontal">
                                                    <label class="slds-form-element__label">{field.fieldLabel}</label>
                                                    <div class="slds-form-element__control">
                                                        <select onchange={handleFieldEdits}
                                                            data-field={field.fieldName}>
                                                            <template for:each={field.picklistOptions}
                                                                for:item="option">
                                                                <template lwc:if={option.isDisabled}>
                                                                    <option key={option.value} value={option.value}
                                                                        selected={option.isSelected} disabled>
                                                                        {option.label}
                                                                    </option>
                                                                </template>
                                                                <template lwc:else>
                                                                    <option key={option.value} value={option.value}
                                                                        selected={option.isSelected}>
                                                                        {option.label}
                                                                    </option>
                                                                </template>
                                                            </template>
                                                        </select>
                                                    </div>
                                                </div>
                                            </template>
                                            <lightning-input lwc:elseif={field.isDate} type="date"
                                                data-categindex={categIndex} data-field={field.fieldName}
                                                onchange={handleFieldEdits} label={field.fieldLabel}
                                                variant="label-inline" value={field.fieldValue}>
                                            </lightning-input>
                                            <lightning-input lwc:elseif={field.isDateTime} type="datetime"
                                                data-categindex={categIndex} data-field={field.fieldName}
                                                onchange={handleFieldEdits} label={field.fieldLabel}
                                                variant="label-inline" value={field.fieldValue}>
                                            </lightning-input>
                                        </template>
                                        <template if:false={field.isInputField}>
                                            <div class="slds-form-element slds-form-element_horizontal">
                                                <label class="slds-form-element__label">{field.fieldLabel}</label>
                                                <div class="slds-form-element__control">
                                                    <lightning-formatted-number lwc:if={field.isNumberField}
                                                        maximum-fraction-digits={field.scale} value={field.fieldValue}
                                                        label={field.fieldLabel} variant="label-inline">
                                                    </lightning-formatted-number>
                                                    <template lwc:elseif={field.isText}>
                                                        <template lwc:if={field.isHTMLFormatted}>
                                                            <lightning-formatted-rich-text value={field.fieldValue}
                                                                label={field.fieldLabel} variant="label-inline">
                                                            </lightning-formatted-rich-text>
                                                        </template>
                                                        <template lwc:else>
                                                            {field.fieldValue}
                                                        </template>
                                                    </template>
                                                    <template lwc:elseif={field.isReference}>
                                                        <a href={field.link} target="_blank">
                                                            {field.fieldValue}</a>
                                                    </template>
                                                    <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                        class="input-center" variant="label-hidden"
                                                        checked={field.fieldValue} disabled>
                                                    </lightning-input>
                                                    <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                        value={field.fieldValue} year="numeric" month="2-digit"
                                                        day="2-digit"></lightning-formatted-date-time>
                                                    <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                        value={field.fieldValue} year="numeric" month="2-digit"
                                                        day="2-digit" hour="2-digit" minute="2-digit">
                                                    </lightning-formatted-date-time>
                                                    <template lwc:elseif={field.isPicklist}>
                                                        {field.fieldValue}
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <template if:false={guidedMode}>
                                <div lwc:if={isAdvancedTabActive} class="slds-has-divider_top slds-p-around--small">
                                    <div if:false={isSubAdvanced}>
                                        <div class="slds-grid slds-wrap slds-no-flex" style="color: #0c769e;">
                                            <div class="sectionTitle slds-col">
                                                {labels.LBL_NS_Manager_Configuration}
                                            </div>
                                        </div>
                                        <div
                                            class="slds-grid slds-wrap slds-align--absolute-center slds-p-around--x-small slds-scrollable">
                                            <table
                                                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-border_right slds-border_left slds-no-row-hover slds-scrollable_y">
                                                <tbody>
                                                    <tr style="background-color:#dae9f8">
                                                        <td style="width:5%">
                                                            1
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.ConditionsCaptureLevel__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.ConditionsCaptureLevel__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.ConditionsCaptureLevel__c}
                                                                options={objectNSInfo.picklistOptions.ConditionsCaptureLevel__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.ConditionsCaptureLevel__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.ConditionsCaptureLevel__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#EFF6FD">
                                                        <td style="width:5%">
                                                            2
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.ContractingLevel__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.ContractingLevel__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.ContractingLevel__c}
                                                                options={objectNSInfo.picklistOptions.ContractingLevel__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.ContractingLevel__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.ContractingLevel__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#dae9f8">
                                                        <td style="width:5%">
                                                            3
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.ConditionsDispatchLevel__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.ConditionsDispatchLevel__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.ConditionsDispatchLevel__c}
                                                                options={objectNSInfo.picklistOptions.ConditionsDispatchLevel__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.ConditionsDispatchLevel__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.ConditionsDispatchLevel__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#EFF6FD">
                                                        <td style="width:5%">
                                                            4
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.NegoBaseManagement__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.NegoBaseManagement__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.NegoBaseManagement__c}
                                                                options={objectNSInfo.picklistOptions.NegoBaseManagement__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.NegoBaseManagement__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.NegoBaseManagement__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#dae9f8">
                                                        <td style="width:5%">
                                                            5
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.SlabsApplication__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.SlabsApplication__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.SlabsApplication__c}
                                                                options={objectNSInfo.picklistOptions.SlabsApplication__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.SlabsApplication__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.SlabsApplication__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#EFF6FD">
                                                        <td style="width:5%">
                                                            6
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.SellinDeclarationLevel__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.SellinDeclarationLevel__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.SellinDeclarationLevel__c}
                                                                options={objectNSInfo.picklistOptions.SellinDeclarationLevel__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.SellinDeclarationLevel__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.SellinDeclarationLevel__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                    <tr style="background-color:#dae9f8">
                                                        <td style="width:5%">
                                                            7
                                                        </td>
                                                        <td style="width:25%">
                                                            {objectNSInfo.fieldsLabel.InvoicingLevel__c}
                                                        </td>
                                                        <td style="width:30%">
                                                            <lightning-combobox
                                                                name={objectNSInfo.fieldsAPI.InvoicingLevel__c}
                                                                variant="label-hidden" dropdown-alignment="auto"
                                                                value={objectNSInfo.fieldsValue.InvoicingLevel__c}
                                                                options={objectNSInfo.picklistOptions.InvoicingLevel__c}
                                                                onchange={handleFieldEdits}
                                                                data-field={objectNSInfo.fieldsAPI.InvoicingLevel__c}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td style="width:40%;text-wrap:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={objectNSInfo.fieldsInlineHelpText.InvoicingLevel__c}>
                                                            </lightning-formatted-rich-text>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </lightning-tab>
                    <template if:false={isNewNS}>
                        <!-- Tab Hierarchies -->
                        <lightning-tab lwc:if={isNotAdvancedTabActive} label={labels.LBL_NS_Tab_HEs} value="Hierarchies"
                            onclick={handleTabClick} title={labels.LBL_NS_Tab_HEs} icon-name="standard:hierarchy"
                            style="padding:0px;" class="slds-scrollable_y sectionHE">
                            <div style={mainPanelHeight} class="">
                                <!-- Hierarchies tab content -->
                                <div class="slds-card__header slds-grid slds-box slds-m-around--x-small">
                                    <div class="slds-col">
                                        <lightning-input type="toggle" message-toggle-active=""
                                            message-toggle-inactive=""
                                            data-field={objectNSInfo.fieldsAPI.IncludeAllHEs__c}
                                            label={objectNSInfo.fieldsLabel.IncludeAllHEs__c} checked={includeAllHENS}
                                            onchange={handleFieldEdits}>
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col" if:false={includeAllHENS}>
                                        <lightning-input type="search" onblur={handleBlurSearchHierarchy}
                                            onchange={handleHESearchChange} onkeypress={handleFilterHierarchy}
                                            class="slds-show slds-is-relative slds-var-m-bottom_small"
                                            variant="label-hidden" placeholder={labels.LBL_HE_Search}>
                                        </lightning-input>
                                    </div>
                                </div>
                                <template lwc:if={includeAllHENS}>
                                    <div class="slds-card__body slds-card__body_inner slds-m-around--x-small">
                                        <div class="slds-align--absolute-center" style={noDataHeight}>
                                            <div class="slds-illustration slds-illustration_large"
                                                style={noDataImageStyle} aria-hidden="true">
                                                <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg"
                                                    alt="" />
                                                <div class="slds-text-color_weak">
                                                    <b class="slds-text-heading_medium">{labels.LBL_NS_All_HE_Selected}
                                                    </b>
                                                </div>
                                                <div class="slds-align--absolute-center">
                                                    <span class="slds-popover__body">
                                                        <lightning-formatted-rich-text
                                                            value={labels.LBL_NS_All_HE_Selected_Help}>
                                                        </lightning-formatted-rich-text>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div
                                        class="slds-card__body slds-grid structureElementsContent slds-m-around--x-small">
                                        <div class="slds-scrollable slds-col slds-m-top_large" style="width:60%;">
                                            <div class="slds-scrollable_y he-sections treeGrid"
                                                if:false={loadingHierarchyTree}>
                                                <lightning-tree-grid lwc:if={hierarchyTreeMap}
                                                    resize-column-disabled="true" columns={gridHierarchyColumns}
                                                    data={hierarchyTreeMap} is-loading={isLoading} key-field="Id"
                                                    ontoggle={handleOnToggleHierarchy}
                                                    onrowaction={handleHierarchyRowAction}
                                                    onrowselection={handleHierarchyRowAction}
                                                    hide-checkbox-column="true"></lightning-tree-grid>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-m-left_small he-sections slds-m-top_xx-small"
                                            style="width:40%;height:100%">
                                            <div>
                                                <b class="slds-tile__title slds-wrap slds-truncate">
                                                    {labels.LBL_NSHE_Summary}
                                                </b>
                                            </div>
                                            <div
                                                class="gridHE slds-scrollable slds-border_right slds-border_left slds-border_bottom">
                                                <div id="nsheTableContent"
                                                    class="slds-scrollable_y he-sections nsheTableContent">
                                                    <table
                                                        class="slds-table slds-table_cell-buffer slds-table_bordered slds-table-header-fixed_container slds-no-row-hover slds-scrollable_y">
                                                        <thead style="position: sticky; top: 0px; z-index: 5;">
                                                            <tr class="slds-line-height_reset sticky-header">
                                                                <th
                                                                    class="slds-cell-fixed slds-text-align_center sticky-header">
                                                                    {hierarchyObjInfo.fieldsLabel.Code}
                                                                </th>
                                                                <th
                                                                    class="slds-cell-fixed slds-text-align_center sticky-header">
                                                                    {hierarchyObjInfo.fieldsLabel.Name}
                                                                </th>
                                                                <th
                                                                    class="slds-cell-fixed slds-text-align_center sticky-header">
                                                                    {NSHEObjInfo.fieldsLabel.Choice}
                                                                </th>
                                                                <th
                                                                    class="slds-cell-fixed slds-text-align_center sticky-header">
                                                                </th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template lwc:if={hasHierachy} for:each={selectedNSHE}
                                                                for:item="hierarchy" for:index="index">
                                                                <tr key={hierarchy.Id} class={hierarchy.class}>
                                                                    <td class="slds-text-align_center">
                                                                        {hierarchy.code}
                                                                    </td>
                                                                    <td class="slds-text-align_center">
                                                                        {hierarchy.hierarchyName}
                                                                    </td>
                                                                    <td class="slds-text-align_center">
                                                                        <template if:true={hierarchy.isInclude}>
                                                                            <lightning-badge class="slds-badge_inverse"
                                                                                label={hierarchy.choice}
                                                                                style="width: 60px;background-color:#62B7ED;justify-content:center;">
                                                                            </lightning-badge>
                                                                        </template>
                                                                        <template if:false={hierarchy.isInclude}>
                                                                            <lightning-badge class="slds-badge_inverse"
                                                                                label={hierarchy.choice}
                                                                                style="width: 60px;background-color:#EF6E64;justify-content:center;">
                                                                            </lightning-badge>
                                                                        </template>
                                                                    </td>
                                                                    <td class="slds-text-align_center">
                                                                        <div class="slds-shrink-none">
                                                                            <lightning-icon size="xx-small"
                                                                                class="red-icon slds-icon slds-input__icon_right slds-icon-text-default slds-align_absolute-center slds-button--icon-border"
                                                                                icon-name="utility:delete"
                                                                                data-index={index}
                                                                                data-id={hierarchy.hierarchyId}
                                                                                data-level={hierarchy.level}
                                                                                onclick={removeHierarchy}>
                                                                            </lightning-icon>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                            <template lwc:else>
                                                                <tr>
                                                                    <td colspan="3">
