<template>
    <div class="mainContainer" style="position: relative;">
        <template lwc:if={isLoading}>
            <div class="slds-spinner_container spinnerDiv">
                <div class="loader slds-spinner_container slds-align_absolute-center">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </template>
        <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header pageHeader">
            <div class="slds-col slds-has-flexi-truncate">
                <div
                    class="slds-media slds-media_center slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small">
                    <div>
                        <lightning-icon icon-name="standard:hierarchy" alternative-text={title} title={title}
                            size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-text-heading_small slds-text-title_bold slds-m-left--small">{title}</div>
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-align--absolute-center" if:true={showExpandCollapseButtons}>
                <lightning-button label="Expand All" onclick={handleExpandAll}>
                </lightning-button>
                <lightning-button label="Collapse All" onclick={handleCollapseAll} class="slds-m-left--x-small">
                </lightning-button>
            </div>
        </div>
        <!-- <div class="slds-page-header pageHeader">
            <div class="slds-page-header__row slds-var-p-around_small">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure slds-align_absolute-center">
                            <lightning-icon icon-name="standard:hierarchy" alternative-text={title} title={title}
                                size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-var-m-right_small slds-align-middle slds-truncate">
                                {title}
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
        </div> -->
        <div class="slds-card" style="margin-top: 0; border: 0;">
            <div
                class="pageBody slds-card tableDiv slds-scrollable slds-border_left slds-border_right slds-border_bottom">
                <template if:false={treeList.length}>
                    <div class="noDataText slds-text-align_center slds-var-m-around_large">
                        {labels.LBL_No_Item_To_Display}
                    </div>
                </template>
                <template if:true={treeList.length}>
                    <table class="pgTable slds-table slds-table_bordered slds-border--left slds-border--right">
                        <thead>
                            <tr class="slds-border_top slds-border_bottom sticky-thead header-row-1">
                                <th style="min-width: 30vh;z-index: 4;" class="assortmentTd1 firstColumn">
                                    {nameFieldLabel}
                                </th>
                                <template for:each={fieldsToDisplay} for:item="field">
                                    <th key={field.fieldName} class="assortmentTd1" style={field.headerstyle}>
                                        <div class="headerTds slds-text-align_center slds-grid"
                                            style="place-content: center;">
                                            {field.fieldLabel}
                                        </div>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={treeList} for:item="item">
                                <template if:true={item.show}>
                                    <tr key={item.key} aria-expanded={item.ariaExpanded} aria-level={item.level}
                                        aria-posinset="2" aria-selected="false" aria-setsize="4">
                                        <th class="slds-tree__item firstColumn" data-label={item.Name} scope="row">
                                            <template if:true={item.showChevronButton}>
                                                <button type="button" onclick={expandAndCollapse}
                                                    data-recordid={item.key}
                                                    class="slds-button slds-button_icon slds-button_icon-x-small slds-var-m-right_x-small">
                                                    <svg class="slds-button__icon slds-button__icon_small"
                                                        aria-hidden="true">
                                                        <use
                                                            xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#chevronright">
                                                        </use>
                                                    </svg>
                                                </button>
                                            </template>
                                            <template if:false={item.showChevronButton}>
                                                <span
                                                    class="slds-button slds-button_icon slds-button_icon-x-small slds-var-m-right_x-small"
                                                    style="visibility: hidden;"></span>
                                            </template>
                                            <div class="slds-truncate" title={item.Name}>
                                                <a href="javascript:void(0);" onclick={navigateToHierarchy}
                                                    data-recordid={item.key} class="slds-text-link hierarchyLink">
                                                    {item.Name}
                                                </a>
                                            </div>
                                        </th>
                                        <template for:each={item.values} for:item="field">
                                            <td key={field.fieldName} class="slds-text-align_left">
                                                <lightning-formatted-number lwc:if={field.isNumberField}
                                                    maximum-fraction-digits={field.scale}
                                                    minimum-fraction-digits={field.scale} value={field.value}
                                                    variant="label-hidden">
                                                </lightning-formatted-number>
                                                <template lwc:elseif={field.isText}>
                                                    <template lwc:if={field.isHTMLFormatted}>
                                                        <lightning-formatted-rich-text value={field.value}
                                                            variant="label-hidden">
                                                        </lightning-formatted-rich-text>
                                                    </template>
                                                    <template lwc:else>
                                                        {field.value}
                                                    </template>
                                                </template>
                                                <template lwc:elseif={field.isReference}>
                                                    <a href={field.link} target="_blank">
                                                        {field.value}</a>
                                                </template>
                                                <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                    class="input-center" variant="label-hidden" checked={field.value}
                                                    disabled>
                                                </lightning-input>
                                                <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                    value={field.value} year="numeric" month="2-digit"
                                                    day="2-digit"></lightning-formatted-date-time>
                                                <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                    value={field.value} year="numeric" month="2-digit" day="2-digit"
                                                    hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                                <template lwc:elseif={field.isPicklist}>
                                                    {field.value}
                                                </template>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>
        </div>
    </div>
</template>
