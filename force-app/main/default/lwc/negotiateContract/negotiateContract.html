<template>
    <div class="slds-is-relative">
        <table
            class="slds-no-row-hover slds-table slds-table_tree slds-tree slds-border_left slds-border_right contract-table">
            <thead class={headerClass} style="position: sticky; top: 0; z-index: 1;">
                <tr class="slds-line-height_reset">
                    <th colspan="7">
                        <div class="slds-grid_vertical">
                            <div class="slds-grid">
                                <div class="slds-align_absolute-center">
                                    <a data-id={contractId} href={linkContractName} target="_blank"
                                        class="slds-p-right_x-small">
                                        {contractName}
                                    </a>
                                    <div if:true={isOnTopSimulation} class="slds-p-right_x-small On_Top">
                                        <lightning-icon icon-name="utility:trail" size="x-small"
                                            title={Labels.LBL_Is_OnTop_Simulation}>
                                        </lightning-icon>
                                    </div>
                                    <a class="slds-p-right_x-small slds-hidden"
                                        style="padding: 0; width: 0px; margin: 0;">
                                        <lightning-icon icon-name="utility:approval" size="x-small"
                                            title={Labels.LBL_Executive_Summary}>
                                        </lightning-icon>
                                    </a>
                                    <!-- <a href={executiveSummaryUrl} target="_blank" if:true={executiveSummaryUrl} -->
                                    <a if:true={executiveSummaryUrl} onclick={openExecutiveSummary}
                                        class="slds-p-right_x-small">
                                        <lightning-icon icon-name="utility:approval" size="x-small"
                                            title={Labels.LBL_Executive_Summary}>
                                        </lightning-icon>
                                    </a>
                                    <template if:false={canUserModifyAll}>
                                        <template if:true={isLocked}>
                                            <lightning-icon icon-name="utility:lock" size="x-small"
                                                title={Labels.LBL_Locked_By_Approval_Process}>
                                            </lightning-icon>
                                        </template>
                                    </template>
                                    <template if:true={canUserModifyAll}>
                                        <template if:true={isLocked}>
                                            <lightning-icon icon-name="utility:unlock" size="x-small"
                                                title={Labels.LBL_Unlock} onclick={unlockContract}>
                                            </lightning-icon>
                                        </template>
                                    </template>
                                    <template if:false={loadingLockedActions}>
                                        <template if:false={lockedActions}>
                                            <button type="button" if:true={isAvailableForClone} class="slds-button">
                                                <lightning-icon icon-name="utility:copy" data-id="cloneIcon"
                                                    size="x-small" title={cloneLabel} onclick={createNewContract}>
                                                </lightning-icon>
                                            </button>
                                            <template if:false={readOnly}>
                                                <template if:false={isLockedByAprovalProcess}>
                                                    <button type="button" if:true={isSimulation} class="slds-button"
                                                        title={Labels.LBL_Update_Contract_BDate}>
                                                        <lightning-icon icon-name="utility:date_input" size="x-small"
                                                            onclick={openeditContract}>
                                                        </lightning-icon>
                                                    </button>
                                                    <template if:false={hasTopNotSimulation}>
                                                        <template if:false={isOnTopSimulation}>
                                                            <button type="button" if:true={isSimulation}
                                                                class="slds-button">
                                                                <lightning-icon icon-name="utility:trail" size="x-small"
                                                                    onclick={setOnTop}
                                                                    title={Labels.LBL_Is_OnTop_Simulation}>
                                                                </lightning-icon>
                                                            </button>
                                                        </template>
                                                    </template>
                                                    <template if:true={isCPG}>
                                                        <button type="button" if:true={isAvailableForDelete}
                                                            class="slds-button">
                                                            <lightning-icon icon-name="utility:delete" size="x-small"
                                                                onclick={openDeletePopup}>
                                                            </lightning-icon>
                                                        </button>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>
                                    </template>
                                </div>
                            </div>
                            <div>
                                <div class="slds-align_absolute-center slds-text-body_small slds-text-font_monospace">
                                    {dateContract}
                                </div>
                            </div>
                        </div>
                    </th>
                </tr>
                <tr class={indexesClass}>
                    <th colspan="7" style="height: 184px; padding: 0; background-color: white !important;">
                        <c-negotiate-indexes nonce={nonce} is-ref-nego-base={isRefNegoBase} post-signed={postSigned}
                            is-nego-base-init-nego-year={isNegoBaseInitNegoYear} data-id="negotiate-indexes-cmp"
                            contract-id={contractId} is-on-top-simulation={isOnTopSimulation}
                            is-safe-balance={isSafeBalance}>
                        </c-negotiate-indexes>
                    </th>
                </tr>
                <tr style="height: 12px;" class={indexesClass}>
                    <th colspan="7" style="background-color: white !important;"></th>
                </tr>
                <tr style="height: 27.6px;" class={indexesClass}>
                    <th class="nego-type-cell" colspan="4">
                    </th>
                    <th class="nego-type-cell" colspan="3">
                        <div class="slds-grid">
                            {Labels.LBL_Total_TO_Tariff_Nego__c}
                            <div class="slds-p-left_small slds-col_bump-left output-number-field">
                                <lightning-formatted-number value={wIndex.totalToTariffNego} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </th>
                </tr>
                <tr style="height: 27.6px;" class={indexesClass}>
                    <th class="nego-type-cell" colspan="4">
                        <div class="slds-grid">
                            {Labels.LBL_Depreciation_Rise_Rate}:
                            <template if:false={loadingLockedActions}>
                                <template if:false={lockedActions}>
                                    <div if:true={readOnly}
                                        class="slds-p-left_small slds-col_bump-left slds-grid output-number-field">
                                        <lightning-formatted-number value={depreciationRate} maximum-fraction-digits={contractFieldsScaleStepMap.depreciationRate.scale}
                                            minimum-fraction-digits={contractFieldsScaleStepMap.depreciationRate.scale}>
                                        </lightning-formatted-number>
                                    </div>
                                    <div if:false={readOnly} class="slds-p-left_small slds-col_bump-left slds-grid">
                                        <!-- <lightning-record-edit-form
                                            object-api-name={API_NAMES.Contract__c.objectApiName}>
                                            <lightning-input-field variant="label-hidden"
                                                field-name={API_NAMES.Contract__c.Depreciation_Rate__c}
                                                value={depreciationRate}
                                                data-field-api-name={API_NAMES.Contract__c.Depreciation_Rate__c}
                                                data-field="depreciationRate" onchange={handleContractFieldChange}
                                                data-contract-id={contractId} onkeydown={blockSubmit}
                                                class={depreciationRateClass}>
                                            </lightning-input-field>
                                        </lightning-record-edit-form> -->
                                        <lightning-input value={depreciationRate} type="number" step={contractFieldsScaleStepMap.depreciationRate.step}
                                            data-field-api-name={API_NAMES.Contract__c.Depreciation_Rate__c}
                                            data-field="depreciationRate" onblur={handleContractFieldChange}
                                            data-contract-id={contractId} onkeydown={blockSubmit}
                                            class={depreciationRateClass}></lightning-input>
                                    </div>
                                </template>
                                <div if:true={lockedActions}
                                    class="slds-p-left_small slds-col_bump-left slds-grid output-number-field">
                                    <lightning-formatted-number value={depreciationRate} maximum-fraction-digits={contractFieldsScaleStepMap.depreciationRate.scale}
                                        minimum-fraction-digits={contractFieldsScaleStepMap.depreciationRate.scale}>
                                    </lightning-formatted-number>
                                </div>
                            </template>
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <div class="slds-align-middle">
                            {Labels.LBL_TO}:
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <div class="slds-p-right_x-small slds-grid_vertical">
                            <div style={gapTOStyle}>
                                <lightning-formatted-number value={diffTO} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>
                                (<lightning-formatted-number value={gapTO} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>)
                            </div>
                            <div style={gapSBTOStyle}>
                                <lightning-formatted-number value={gapSBTO} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <template if:false={loadingLockedActions}>
                            <template if:false={lockedActions}>
                                <div if:true={readOnly} class="output-number-field slds-col slds-align-middle">
                                    <lightning-formatted-number value={purchase} maximum-fraction-digits={contractFieldsScaleStepMap.to.scale}
                                        minimum-fraction-digits={contractFieldsScaleStepMap.to.scale}>
                                    </lightning-formatted-number>
                                </div>
                                <div if:false={readOnly} class="slds-align-middle">
                                    <!-- <lightning-record-edit-form object-api-name={API_NAMES.Contract__c.objectApiName}>
                                        <lightning-input-field variant="label-hidden"
                                            field-name={API_NAMES.Contract__c.TO1__c} value={purchase}
                                            data-field-api-name={API_NAMES.Contract__c.TO1__c} data-field="purchase"
                                            onchange={handleContractFieldChange} data-contract-id={contractId}
                                            onkeydown={blockSubmit}>
                                        </lightning-input-field>
                                    </lightning-record-edit-form> -->
                                    <lightning-input value={purchase} type="number" step={contractFieldsScaleStepMap.to.step}
                                        data-field-api-name={API_NAMES.Contract__c.TO1__c} data-field="purchase"
                                        onblur={handleContractFieldChange} data-contract-id={contractId}
                                        onkeydown={blockSubmit}>
                                    </lightning-input>
                                </div>
                            </template>
                            <div if:true={lockedActions} class="output-number-field slds-col slds-align-middle">
                                <lightning-formatted-number value={purchase} maximum-fraction-digits={contractFieldsScaleStepMap.to.scale}
                                    minimum-fraction-digits={contractFieldsScaleStepMap.to.scale}>
                                </lightning-formatted-number>
                            </div>
                        </template>
                    </th>
                </tr>
                <tr style="height: 27.6px;" class={indexesClass}>
                    <th class="nego-type-cell" colspan="4">
                        <div class="slds-grid">
                            {Labels.LBL_Rise_Rate}:
                            <template if:false={loadingLockedActions}>
                                <template if:false={lockedActions}>
                                    <div if:true={readOnly}
                                        class="slds-p-left_small slds-col_bump-left slds-grid output-number-field">
                                        <lightning-formatted-number value={riseRate} maximum-fraction-digits={contractFieldsScaleStepMap.riseRate.scale}
                                            minimum-fraction-digits={contractFieldsScaleStepMap.riseRate.scale}>
                                        </lightning-formatted-number>
                                    </div>
                                    <div if:false={readOnly} class="slds-p-left_small slds-col_bump-left slds-grid">
                                        <!-- <lightning-record-edit-form
                                            object-api-name={API_NAMES.Contract__c.objectApiName}>
                                            <lightning-input-field variant="label-hidden"
                                                field-name={API_NAMES.Contract__c.Rise_Rate__c} value={riseRate}
                                                data-field-api-name={API_NAMES.Contract__c.Rise_Rate__c}
                                                data-field="riseRate" onchange={handleContractFieldChange}
                                                data-contract-id={contractId} onkeydown={blockSubmit}
                                                class={riseRateClass}>
                                            </lightning-input-field>
                                        </lightning-record-edit-form> -->
                                        <lightning-input value={riseRate} type="number" step={contractFieldsScaleStepMap.riseRate.step}
                                            data-field-api-name={API_NAMES.Contract__c.Rise_Rate__c}
                                            data-field="riseRate" onblur={handleContractFieldChange}
                                            data-contract-id={contractId} onkeydown={blockSubmit} class={riseRateClass}>
                                        </lightning-input>
                                    </div>
                                </template>
                                <div if:true={lockedActions}
                                    class="slds-p-left_small slds-col_bump-left slds-grid output-number-field">
                                    <lightning-formatted-number value={riseRate} maximum-fraction-digits={contractFieldsScaleStepMap.riseRate.scale}
                                        minimum-fraction-digits={contractFieldsScaleStepMap.riseRate.scale}>
                                    </lightning-formatted-number>
                                </div>
                            </template>
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <div class="slds-align-middle">
                            {Labels.LBL_QTY}:
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <div class="slds-p-right_x-small slds-grid_vertical">
                            <div style={gapQtyStyle}>
                                <lightning-formatted-number value={diffQty} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>
                                (<lightning-formatted-number value={gapQty} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>)
                            </div>
                            <div style={gapSBQtyStyle}>
                                <lightning-formatted-number value={gapSBQty} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2" format-style="percent">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </th>
                    <th class="nego-type-cell">
                        <template if:false={loadingLockedActions}>
                            <template if:false={lockedActions}>
                                <div if:true={readOnly} class="output-number-field slds-col slds-align-middle">
                                    <lightning-formatted-number value={quantity} maximum-fraction-digits={contractFieldsScaleStepMap.qty.scale}
                                        minimum-fraction-digits={contractFieldsScaleStepMap.qty.scale}>
                                    </lightning-formatted-number>
                                </div>
                                <div if:false={readOnly} class="slds-align-middle">
                                    <!-- <lightning-record-edit-form object-api-name={API_NAMES.Contract__c.objectApiName}>
                                        <lightning-input-field variant="label-hidden"
                                            field-name={API_NAMES.Contract__c.Qty1__c} value={quantity}
                                            data-field-api-name={API_NAMES.Contract__c.Qty1__c} data-field="quantity"
                                            onchange={handleContractFieldChange} data-contract-id={contractId}
                                            onkeydown={blockSubmit}>
                                        </lightning-input-field>
                                    </lightning-record-edit-form> -->
                                    <lightning-input value={quantity} type="number" step={contractFieldsScaleStepMap.qty.step}
                                        data-field-api-name={API_NAMES.Contract__c.Qty1__c} data-field="quantity"
                                        onblur={handleContractFieldChange} data-contract-id={contractId}
                                        onkeydown={blockSubmit}></lightning-input>
                                </div>
                            </template>
                            <div if:true={lockedActions} class="output-number-field slds-col slds-align-middle">
                                <lightning-formatted-number value={quantity} maximum-fraction-digits={contractFieldsScaleStepMap.qty.scale}
                                    minimum-fraction-digits={contractFieldsScaleStepMap.qty.scale}>
                                </lightning-formatted-number>
                            </div>
                        </template>
                    </th>
                </tr>
                <tr style="height: 12px;">
                    <th colspan="7" style="background-color: white !important;"></th>
                </tr>
                <tr class="third-header" style="height: 27.6px;">
                    <th>%</th>
                    <th>{Labels.Amount}</th>
                    <th></th>
                    <th>{Labels.TotalComputed}</th>
                    <th>{Labels.LBL_Index_val__c}</th>
                    <th>{Labels.LBL_Index_perc__c}</th>
                    <th>
                        <template if:false={loadingLockedActions}>
                            <template if:false={lockedActions}>
                                <template if:false={readOnly}>
                                    <template if:true={hasIndexTarget}>
                                        <button type="button" class="slds-button" if:true={isSimulationOrisSafeBalance}
                                            title={Labels.LBL_Add_Condition}>
                                            <lightning-icon icon-name="utility:add" size="x-small"
                                                onclick={addIndexTargetCondition}>
                                            </lightning-icon>
                                        </button>
                                    </template>
                                </template>
                            </template>
                        </template>
                    </th>
                </tr>
            </thead>
            <tbody class={headerClass}>
                <template for:each={arraysCondtion} for:item="item">
                    <tr key={item.key} data-label={item.key} aria-level={item.level}>
                        <td class="index-cell slds-text-align_center">
                            <lightning-formatted-number value={item.percent} maximum-fraction-digits="2"
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </td>
                        <td class="index-cell slds-text-align_center"></td>
                        <td class="index-cell slds-text-align_center"></td>
                        <td class="index-cell slds-text-align_center">
                            <lightning-formatted-number value={item.computedAmount} maximum-fraction-digits="0"
                                minimum-fraction-digits="0">
                            </lightning-formatted-number>
                        </td>
                        <td class="index-cell slds-text-align_center">
                            <lightning-formatted-number value={item.indexVal} maximum-fraction-digits="2"
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </td>
                        <td class="index-cell slds-text-align_center"></td>
                        <td class="index-cell slds-text-align_center"></td>
                    </tr>
                    <template for:each={item.negodiscounts} for:item="discounttype">
                        <tr key={discounttype.key} aria-level={discounttype.level} class={item.rowClass}>
                            <td class="nego-type-cell slds-text-align_center"></td>
                            <td class="nego-type-cell slds-text-align_center"></td>
                            <td class="nego-type-cell slds-text-align_center"></td>
                            <td class="nego-type-cell slds-text-align_center">
                                <lightning-formatted-number value={discounttype.computedAmount}
                                    maximum-fraction-digits="0" minimum-fraction-digits="0">
                                </lightning-formatted-number>
                            </td>
                            <td class="nego-type-cell slds-text-align_center"></td>
                            <td class="nego-type-cell slds-text-align_center">
                                <lightning-formatted-number value={discounttype.indexPer} maximum-fraction-digits="2"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </td>
                            <td class="nego-type-cell slds-text-align_center"></td>
                        </tr>
                        <template for:each={discounttype.conditions} for:item="condition" for:index="index">
                            <tr key={condition} aria-level={condition.level} class={condition.rowClass}>
                                <template if:false={condition.hideRow}>
                                    <td class={condition.cellClass}>
                                        <template if:true={condition.enablePercentage}>
                                            <lightning-formatted-number value={condition._Value_per__c}
                                                maximum-fraction-digits={discountPercentScale}
                                                minimum-fraction-digits={discountPercentScale}>
                                            </lightning-formatted-number>
                                        </template>
                                    </td>
                                    <td class={condition.cellClass}>
                                        <template if:true={condition.enableAmt}>
                                            <lightning-formatted-number value={condition._Value_amt__c}
                                                maximum-fraction-digits="0" minimum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </template>
                                    </td>
                                    <td class={condition.cellClass}>
                                        <lightning-icon size="x-small" icon-name="utility:home"
                                            if:false={condition.matchBu}
                                            title={Labels.Conditions_not_diffused_country_level}>
                                        </lightning-icon>
                                        <lightning-icon size="x-small" icon-name="utility:bookmark"
                                            if:false={condition.matchNegoscope}
                                            title={Labels.LBL_Conditions_not_default_negoscope}>
                                        </lightning-icon>
                                    </td>
                                    <td class={condition.cellClass}>
                                        <lightning-formatted-number value={condition._YTD_Nego_Computed__c}
                                            maximum-fraction-digits="0" minimum-fraction-digits="0">
                                        </lightning-formatted-number>
                                    </td>
                                    <td class={condition.cellClass}>
                                        <lightning-formatted-number value={condition._Index_val__c}
                                            maximum-fraction-digits="2" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td class={condition.cellClass}>
                                        <lightning-formatted-number value={condition._Index_perc__c}
                                            maximum-fraction-digits="2" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td class={condition.cellClassIcons} onmouseenter={toggleShowEdit}
                                        onmouseleave={toggleShowInfo} data-index={item.key}
                                        data-negotiatetype={discounttype.key} data-rowindex={index}>
                                        <lightning-icon icon-name="utility:ban" variant="error" size="xx-small"
                                            class="slds-cell-edit__button slds-m-left_x-small slds-p-top_xx-small"
                                            title={Labels.MSG_Invalid_Condition} if:false={condition.isValid}>
                                        </lightning-icon>
                                        <template if:false={loadingLockedActions}>
                                            <template if:true={lockedActions}>
                                                <lightning-button-icon icon-name="utility:info" variant="bare"
                                                    class="slds-cell-edit__button slds-m-left_x-small">
                                                </lightning-button-icon>
                                            </template>
                                            <template if:false={lockedActions}>
                                                <template if:true={readOnly}>
                                                    <lightning-button-icon icon-name="utility:info" variant="bare"
                                                        class="slds-cell-edit__button slds-m-left_x-small">
                                                    </lightning-button-icon>
                                                </template>
                                                <template if:false={readOnly}>
                                                    <template if:true={condition.readOnly}>
                                                        <lightning-button-icon icon-name="utility:info" variant="bare"
                                                            class="slds-cell-edit__button slds-m-left_x-small">
                                                        </lightning-button-icon>
                                                    </template>
                                                    <template if:false={condition.readOnly}>
                                                        <lightning-button variant="base" label={Labels.LBL_Slabs}
                                                            data-index={item.key} data-negotiatetype={discounttype.key}
                                                            data-rowindex={index} onclick={openEditSlabsConditionModel}
                                                            if:true={condition.isConditional} class="slabs-button">
                                                        </lightning-button>
                                                        <lightning-button-icon icon-name="utility:info" variant="bare"
                                                            class="slds-cell-edit__button slds-m-left_x-small"
                                                            if:false={condition.hideInfo}>
                                                        </lightning-button-icon>
                                                        <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                            data-index={item.key} data-negotiatetype={discounttype.key}
                                                            data-rowindex={index}
                                                            class="slds-cell-edit__button slds-m-left_x-small"
                                                            onclick={openEditConditionModel}
                                                            if:true={condition.hideInfo}>
                                                        </lightning-button-icon>
                                                    </template>
                                                </template>
                                                <lightning-button-icon if:true={condition.deleteActive}
                                                    key={condition.Name} icon-name="utility:delete" variant="bare"
                                                    data-index={item.key} data-negotiatetype={discounttype.key}
                                                    data-rowindex={index}
                                                    class="slds-cell-edit__button slds-m-left_x-small delete-icon"
                                                    onclick={deleteHandler}>
                                                </lightning-button-icon>
                                            </template>
                                        </template>
                                        <section if:true={condition.passedFirstLoad} class={condition.popOverClass}
                                            style={condition.popOverStyle} role="dialog">
                                            <header class="slds-popover__header"
                                                style="border-left:1px solid #c9c9c9;border-right:1px solid #c9c9c9;padding:6px !important;">
                                                <div class="slds-media slds-media_center slds-has-flexi-truncate">
                                                    <div class="slds-media__body">
                                                        <h2 class="slds-truncate slds-text-heading_medium"
                                                            style="font-size:13px !important">
                                                            {condition.Condition_Type.Name}
                                                        </h2>
                                                    </div>
                                                </div>
                                            </header>
                                            <div class="slds-popover__body slds-text-align_left popover-content"
                                                style="background:white;white-space: break-spaces;border:1px solid #c9c9c9;padding:0px !important;border-bottom:none">
                                                <lightning-record-edit-form

                                        onchange={handleEditContractChange} onkeydown={blockSubmit}>
                                    </lightning-input-field>

                    <footer class="slds-modal__footer">

class="slds-text-color_error slds-text-title_bold slds-icon-text-error">
<lightning-icon icon-name="utility:warning" size="x-small" variant="error"
class="slds-p-bottom_xx-small">
</lightning-icon>
{Labels.MSG_Prompt_PT_Deletion}

                                    </lightning-input-field>
                                </div>
                            </div>

                        <div if:true={showWarningMessagePeWillBeDeleted}

                            </lightning-icon>

                    <footer class="slds-modal__footer">
