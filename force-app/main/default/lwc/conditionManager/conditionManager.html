if:true={isEnableSimulateAmount} onclick={simulateInvoicesGenerationForDiscounts}>

                                            </template>
                                        </template>
                                        <th rowspan="2" style="z-index: 1;min-width:100px;" class={tableHeader}>

                                            </div>
                                        </th>

                                                    <div>{field.fieldLabel}</div>
                                                    <lightning-helptext content={field.helpText}
                                                        if:true={field.hasHelpText}></lightning-helptext>
                                                </div>
                                            </th>
                                        </template>
                                    </tr>
                                    <tr>
                                        <template for:each={labels.conditionLabels} for:item="year">
                                            <template for:each={year.fields} for:item="field" if:true={year.display}>
                                                <th class={yearHeader} key={field.fieldName} style={field.headerStyle}>
                                                    <div
                                                        class="slds-align_absolute-center slds-grid slds-p-horizontal_xx-small">
                                                        <div>{field.fieldLabel}</div>
                                                        <lightning-helptext content={field.helpText}
                                                            if:true={field.hasHelpText}></lightning-helptext>
                                                    </div>
                                                </th>
                                            </template>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody class="no-help-text" style="z-index: 1;">
                                    <template for:each={wDiscList} for:item="discountWrapper" for:index="index">
                                        <tr key={discountWrapper.discount.Id} class={discountWrapper.trClass}>
                                            <td class={discountWrapper.tdClass} data-index={discountWrapper.Index}
                                                data-id={discountWrapper.discount.Id}>
                                                <div class="loader"></div>
                                                <div class="slds-form-element__row slds-grid">
                                                    <template if:true={discountWrapper.loading}>
                                                        <lightning-spinner size="small" variant="brand">
                                                        </lightning-spinner>
                                                    </template>
                                                    <div class="slds-form-element slds-align_absolute-center">
                                                        <template if:false={isReadOnly}>
                                                            <template if:true={discountWrapper.controlledByAdvanced}>
                                                                <lightning-input type="checkbox" disabled>
                                                                </lightning-input>
                                                            </template>
                                                            <template if:false={discountWrapper.controlledByAdvanced}>
                                                                <lightning-input checked={discountWrapper.isSelected}
                                                                    onchange={handleDiscountSelection}
                                                                    data-checkbox="true"
                                                                    data-index={discountWrapper.Index}
                                                                    data-id={discountWrapper.discount.Id}
                                                                    type="checkbox">
                                                                </lightning-input>
                                                            </template>
                                                        </template>
                                                    </div>
                                                    <template if:true={hasDiscErrors}>
                                                        <template if:true={discountWrapper.hasErrors}>
                                                            <div style="margin: 5px ;"
                                                                class="slds-form-element__control slds-wizard__list slds-button__icon">
                                                                <lightning-icon icon-name="utility:error"
                                                                    data-index={discountWrapper.Index}
                                                                    title={discountWrapper.errorMessagesTitle}
                                                                    data-id={discountWrapper.discount.Id}
                                                                    onclick={handleErrorMessagePopover} size="xx-small"
                                                                    variant="error">
                                                                </lightning-icon>
                                                            </div>
                                                        </template>
                                                        <template if:false={discountWrapper.hasErrors}>
                                                            <div style="margin: 5px ;"
                                                                class="slds-hidden slds-form-element__control slds-wizard__list slds-button__icon">
                                                                <lightning-icon icon-name="utility:error"
                                                                    data-index={discountWrapper.Index}
                                                                    title={discountWrapper.errorMessagesTitle}
                                                                    data-id={discountWrapper.discount.Id}
                                                                    onclick={handleErrorMessagePopover} size="xx-small"
                                                                    variant="error">
                                                                </lightning-icon>
                                                            </div>
                                                        </template>
                                                    </template>
                                                    <div class="slds-form-element__control">
                                                        <template if:true={hasPromoDiscs}>
                                                            <lightning-icon if:true={discountWrapper.isPromoDisc}
                                                                icon-name="standard:product" size="x-small"
                                                                title={discountWrapper.promoDiscTooltip}
                                                                data-index={discountWrapper.Index}
                                                                data-id={discountWrapper.discount.Id}
                                                                onclick={togglePDSDPopup}></lightning-icon>
                                                            <lightning-icon if:false={discountWrapper.isPromoDisc}
                                                                icon-name="standard:product" size="x-small"
                                                                class="slds-hidden"></lightning-icon>
                                                        </template>

                                                                    </lightning-button-icon>
                                                                </template>

        <div if:true={savePopUp}>
            <div role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small"
                aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title slds-hyphenate">
                            {currentStatusMSG}
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-var-p-around_medium slds-is-relative">
                        <div class="slds-p-around_large">
                            <lightning-spinner alternative-text="Loading" variant='brand'>
                            </lightning-spinner>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
        <template if:true={contractDiscountInfoLoaded}>
            <template if:false={loading}>
                <template if:true={openSubPanel}>
                    <div if:true={showaspopup}>
                        <div role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                            class="slds-modal slds-fade-in-open slds-modal_large">
                            <div class="slds-modal__container">
                                <lightning-button-icon variant="bare-inverse" size="large" class="slds-text-align_right"
                                    icon-name="utility:close" onclick={closeSubConditionPopUp}>
                                </lightning-button-icon>
                                <div class="slds-modal__header">
                                    <h1 id="modal-heading-06" class="slds-modal__title slds-hyphenate">
                                        {labels.LBL_Condition_Manager_Sub_Discount_Popup_Title} - 
                                        {currentJSDiscountWrapper.conditionTypeName}
                                        ({currentJSDiscountWrapper.discount.Name})
                                    </h1>
                                </div>
                                <div class="slds-modal__content slds-scrollable_none">
                                    <div if:true={currentJSDiscountWrapper.showMessageOnSubDiscounts}>
                                        <template if:true={isCPG}>
                                            <div class="slds-p-vertical_xx-small slds-p-bottom_x-small slds-theme_alert-texture slds-theme_warning"
                                                if:true={showWarningPercent}>
                                                <div>
                                                    <lightning-icon icon-name="utility:warning" size="x-small"
                                                        variant="bare-inverse" class="iconColor slds-p-left_small">
                                                    </lightning-icon>
                                                    <span class="slds-p-left_small">{perWarningMessage}</span>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={isCPG}>
                                            <div class="slds-p-vertical_xx-small slds-p-bottom_x-small slds-theme_alert-texture slds-theme_error"
                                                if:true={showWarningPercent}>
                                                <div>
                                                    <lightning-icon icon-name="utility:error" size="x-small"
                                                        variant="bare-inverse" class="iconColor slds-p-left_small">
                                                    </lightning-icon>
                                                    <span class="slds-p-left_small">{perWarningMessage}</span>
                                                </div>
                                            </div>
                                        </template>
                                        <div class="slds-p-vertical_xx-small slds-theme_alert-texture slds-theme_error"
                                            if:true={showErrorPercent}>
                                            <div>
                                                <lightning-icon icon-name="utility:error" size="x-small"
                                                    variant="bare-inverse" title={labels.LBL_Error}
                                                    class="iconColor slds-p-left_small">
                                                </lightning-icon>
                                                <span class="slds-p-left_small">{perErrorMessage}</span>
                                            </div>
                                        </div>
                                        <template if:true={isCPG}>
                                            <div class="slds-p-vertical_xx-small slds-p-bottom_small slds-theme_alert-texture slds-theme_warning"
                                                if:true={showWarningAmount}>
                                                <div>
                                                    <lightning-icon icon-name="utility:warning" size="x-small"
                                                        variant="bare-inverse" class="iconColor slds-p-left_small">
                                                    </lightning-icon>
                                                    <span class="slds-p-left_small">{amtWarningMessage}</span>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={isCPG}>
                                            <div class="slds-p-vertical_xx-small slds-p-bottom_small slds-theme_alert-texture slds-theme_error"
                                                if:true={showWarningAmount}>
                                                <div>
                                                    <lightning-icon icon-name="utility:error" size="x-small"
                                                        variant="bare-inverse" title={labels.LBL_Error}
                                                        class="iconColor slds-p-left_small">
                                                    </lightning-icon>
                                                    <span class="slds-p-left_small">{amtWarningMessage}</span>
                                                </div>
                                            </div>
                                        </template>
                                        <div class="slds-p-vertical_xx-small slds-p-bottom_small slds-theme_alert-texture slds-theme_error"
                                            if:true={showErrorAmount}>
                                            <div>
                                                <lightning-icon icon-name="utility:error" size="x-small"
                                                    variant="bare-inverse" title={labels.LBL_Error}
                                                    class="iconColor slds-p-left_small">
                                                </lightning-icon>
                                                <span class="slds-p-left_small">{amtErrorMessage}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-p-left_small">{currentJSDiscountWrapper.conditionTypeLongName}
                                    </div>
                                    
                                    <!-- Show form view when NO sub discounts exist (parent has no children) -->
                                    <template if:false={loadingSubDiscounts}>
                                        <div class="slds-modal__content slds-scrollable_none"
                                            if:false={subDiscountList.length}>
                                            <lightning-record-edit-form
                                                object-api-name={API_NAMES.Contract_Discount__c.object.objectApiName}
                                                record-id={currentJSDiscountWrapper.discount.Id}>
                                                <div class="slds-grid slds-grid_vertical slds-wrap slds-m-around--x-small">
                                                    <div class="slds-size_1-of-1">
                                                        <lightning-input-field data-index={currentJSDiscountWrapper.Index}
                                                            data-field={API_NAMES.Contract_Discount__c.Discount_Terms__c}
                                                            data-id={currentJSDiscountWrapper.discount.Id}
                                                            onchange={handleFieldEdits}
                                                            field-name={API_NAMES.Contract_Discount__c.Discount_Terms__c}
                                                            value={currentJSDiscountWrapper.discountTerms}>
                                                        </lightning-input-field>
                                                    </div>
                                                    <div class="slds-size_1-of-1">
                                                        <lightning-input-field data-index={currentJSDiscountWrapper.Index}
                                                            data-field={API_NAMES.Contract_Discount__c.Proof_counterparty_number_total__c}
                                                            data-id={currentJSDiscountWrapper.discount.Id}
                                                            onchange={handleFieldEdits}
                                                            field-name={API_NAMES.Contract_Discount__c.Proof_counterparty_number_total__c}
                                                            value={currentJSDiscountWrapper.proofCounterPartyTotal}>
                                                        </lightning-input-field>
                                                    </div>
                                                    <div class="slds-size_1-of-1">
                                                        <lightning-input-field data-index={currentJSDiscountWrapper.Index}
                                                            data-field={API_NAMES.Contract_Discount__c.Proof_counterparty_description__c}
                                                            data-id={currentJSDiscountWrapper.discount.Id}
                                                            onchange={handleFieldEdits}
                                                            field-name={API_NAMES.Contract_Discount__c.Proof_counterparty_description__c}
                                                            value={currentJSDiscountWrapper.proofCounterPartyDesciption}>
                                                        </lightning-input-field>
                                                    </div>
                                                </div>
                                            </lightning-record-edit-form>
                                        </div>
                                    </template>
                                    
                                    <!-- Show grid view when sub discounts exist (parent has children) -->
                                    <div class="slds-scrollable" style="max-height: 40vh;" if:true={subDiscountList.length}>
                                        <c-sub-condition-manager onupdatesubdiscount={updateSubdiscount}
                                            is-read-only={isReadOnly} ontogglepopup={closeSubConditionPopUp}
                                            sbusinesstype={sBusinessType}
                                            currentjsdiscountwrapper={currentJSDiscountWrapper}
                                            showaspopup={showaspopup} onoverflow={overflow} onequality={equality}
                                            bu={subBUs} negoscopes={negoscopes} tableheader={tableHeader} labels={labels}
                                            conditionpage={conditionPage} class="subDiscountLWC"
                                            discount-percent-scale={discountPercentScale}
                                            grid-settings={conditionPage.subGridSettings}
                                            page-settings={pageSettings}>
                                        </c-sub-condition-manager>
                                    </div>
                                </div>
                                <div class="slds-modal__footer">
                                    <lightning-button label={labels.LBL_Cancel} title={labels.LBL_Cancel}
                                        onclick={closeSubConditionPopUp}>
                                    </lightning-button>
                                    <lightning-button class="slds-m-left--xx-small" variant="brand"
                                        label={labels.LBL_Save} title={labels.LBL_Save}
                                        onclick={confirmSubConditionPopUp}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                    </div>
                </template>
            </template>
        </template>
        <template if:true={showPDSDPopup}>
            <div role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal--large">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={togglePDSDPopup}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                onclick={togglePDSDPopup} size="small">
                            </lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium slds-hyphenate" if:true={currentJSDiscountWrapper}>
                            {currentJSDiscountWrapper.PDSDTitle}
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-var-p-around_medium slds-is-relative slds-scrollable">
                        <template lwc:if={PDSDWrapper.PDSWrapper.length}>
                            <table
                                class="slds-table slds-scrollable slds-table_bordered slds-table_col-bordered main-table slds-no-row-hover slds-border--left slds-border--right">
                                <thead>
                                    <tr>
                                        <template for:each={PDSDWrapper.fields} for:item="field">
                                            <th key={field.fieldName}>{field.fieldLabel}</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={PDSDWrapper.PDSWrapper} for:item="PDS">
                                        <tr key={PDS.Name}>
                                            <td colspan={PDSDWrapper.fields.length} style="font-weight:bold;">{PDS.Name}
                                            </td>
                                        </tr>
                                        <template for:each={PDS.PDSDList} for:item="row">
                                            <tr key={row.Id}>
                                                <template for:each={row.fieldValues} for:item="field">
                                                    <td key={field.fieldName}>
                                                        <lightning-formatted-number lwc:if={field.isNumberField}
                                                            maximum-fraction-digits={field.scale}
                                                            minimum-fraction-digits={field.scale}
                                                            value={field.fieldValue} variant="label-hidden">
                                                        </lightning-formatted-number>
                                                        <template lwc:elseif={field.isReference}>
                                                            <a href={field.link} target="_blank">
                                                                {field.fieldValue}</a>
                                                        </template>
                                                        <template lwc:elseif={field.isText}>
                                                            <template lwc:if={field.isHTMLFormatted}>
                                                                <lightning-formatted-rich-text value={field.fieldValue}
                                                                    variant="label-hidden">
                                                                </lightning-formatted-rich-text>
                                                            </template>
                                                            <template lwc:else>
                                                                {field.fieldValue}
                                                            </template>
                                                        </template>
                                                        <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                            class="input-center" variant="label-hidden"
                                                            checked={field.fieldValue} disabled>
                                                        </lightning-input>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit"></lightning-formatted-date-time>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit" hour="2-digit"
                                                            minute="2-digit"></lightning-formatted-date-time>
                                                        <template lwc:elseif={field.isPicklist}>
                                                            {field.fieldValue}
                                                        </template>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <div class="slds-text-align_center">
                                {labels.LBL_No_Record_To_Display}
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button class="slds-button" label={labels.LBL_Cancel} onclick={togglePDSDPopup}>
                        </lightning-button>
                    </footer>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
