<template>
    <div class="main-container mainContainer">
        <div class="slds-is-relative">
            <template if:true={Loading}>
                <!-- <lightning-spinner variant="brand" size="large"></lightning-spinner> -->
                <div class="slds-spinner_container">
                    <div class="loader slds-spinner_container slds-align--absolute-center">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </template>
            <div class="pageHeader negoptimHeader slds-page-header">
                <!-- LAYOUT GRID -->
                <div class="header ">
                    <div class="slds-grid slds-show_small">
                        <!-- GRID COL -->
                        <div class="slds-col">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:matrix"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-line-height_reset">{Label.LBL_PageLayoutSettings}</p>
                                    <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                        title={Label.LBl_LayoutPageSettings_Subtitle}>
                                        <div class="slds-grid">
                                            <div>{Label.LBl_LayoutPageSettings_Subtitle}</div>
                                            <div if:true={instance.currentLayout.settings.name}>
                                                <span>: {instance.currentLayout.settings.name}</span>
                                            </div>
                                        </div>
                                    </h1>
                                </div>
                            </div>
                        </div>
                        <!-- <lightning-button value={Label.LBL_Close} label={Label.LBL_Close} onclick={cancelBtnHandler}
                            class="slds-p-right--xx-small slds-button_text-destructive" if:true={instance.showButtons}>
                        </lightning-button>
                        <lightning-button label={Label.LBL_Customize_List_View_Order} if:false={instance.showButtons}
                            variant="success" class="slds-p-right--xx-small" onclick={openListViewPopup}>
                        </lightning-button> -->
                        <template if:false={showTemplate}>
                            <lightning-button value={Label.LBL_New} label={Label.LBL_New} onclick={handleNew}
                                class="slds-p-right--xxx-small">
                            </lightning-button>
                        </template>
                        <template if:true={showTemplate}>
                            <lightning-button onclick={handleCancel} label={Label.LBL_Close}
                                class="slds-p-right--xx-small slds-button_text-destructive">
                            </lightning-button>
                            <lightning-button variant="brand" label={Label.LBL_Save} onclick={handleSave}>
                            </lightning-button>
                            <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                                class="slds-p-left--xxx-small" if:false={disableSaveAs}>
                                <lightning-menu-item onclick={openSaveAsPopup} label={Label.LBL_Save_As}
                                    prefix-icon-name="utility:save">
                                </lightning-menu-item>
                                <!-- <lightning-menu-divider></lightning-menu-divider> -->
                            </lightning-button-menu>
                        </template>
                    </div>
                    <div class="slds-grid slds-wrap slds-hide_small">
                        <div class="slds-size_1-of-1">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:settings"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-line-height_reset">
                                        {Label.LBL_PageLayoutSettings}
                                    </p>
                                    <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                        title={Label.LBl_LayoutPageSettings_Subtitle}>
                                        <div class="slds-grid">
                                            <div>{Label.LBl_LayoutPageSettings_Subtitle}</div>
                                            <div if:true={instance.currentLayout.settings.name}>
                                                <span>: {instance.currentLayout.settings.name}</span>
                                            </div>
                                        </div>
                                    </h1>
                                </div>
                            </div>
                        </div>
                        <div class="slds-size_1-of-1 slds-grid slds-p-top_x-small">
                            <!-- sidebar toggle is now pinned to the sidebar edge -->
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__detail-row slds-grid slds-wrap pageBody"
                    style="padding: 0; position: relative;">
                    <template if:false={isSidebarOpen}>
                        <div class="sidebarToggleAnchor sidebarToggleAnchor_closed">
                            <lightning-button-icon icon-name={sidebarToggleIcon} alternative-text={sidebarToggleTitle}
                                title={sidebarToggleTitle} onclick={handleToggleSidebar} variant="bare"
                                class="sidebarToggleButton">
                            </lightning-button-icon>
                        </div>
                    </template>
                    <div class="slds-col slds-grid slds-truncate" style="height: -webkit-fill-available;">
                        <div class={sidebarClass} style="background-color: white; height: inherit; position: relative;">
                            <template if:true={isSidebarOpen}>
                                <div class="sidebarToggleAnchor sidebarToggleAnchor_open">
                                    <lightning-button-icon icon-name={sidebarToggleIcon}
                                        alternative-text={sidebarToggleTitle} title={sidebarToggleTitle}
                                        onclick={handleToggleSidebar} variant="bare" class="sidebarToggleButton">
                                    </lightning-button-icon>
                                </div>
                            </template>
                            <div class="templatesSplitView slds-split-view_container slds-panel_docked-left slds-is-open"
                                style="height: -webkit-fill-available;">
                                <div class="slds-panel__header slds-p-around_x-small searchBox" id="filterHeader">
                                    <div style="padding: 0; margin-bottom: 0.75rem;"
                                        class="slds-page-header__col-details">
                                        <lightning-input type="search" data-form="first" variant="label-hidden"
                                            autocomplete="off" onfocus={focusTemplateInput} onchange={searchTemplate}
                                            onblur={closeDropdownTemplate} onkeyup={searchTemplate}
                                            onkeydown={searchTemplate} value={searchTermTemplate}>
                                        </lightning-input>
                                    </div>
                                </div>
                                <template if:false={hasLayouts}>
                                    <div class="slds-align_absolute-center slds-m-vertical_small">
                                        <span class="slds-truncate" title={Label.LBL_No_Item_To_Display}>
                                            {Label.LBL_No_Item_To_Display}
                                        </span>
                                    </div>
                                </template>
                                <div class="slds-scrollable--y" if:true={hasLayouts}>
                                    <article aria-hidden="false" id="split-view-id"
                                        class="slds-split-view slds-grid slds-grid_vertical slds-scrollable">
                                        <div class="slds-grid slds-grid_vertical">
                                            <ul aria-multiselectable="true" class="slds-scrollable_y" role="listbox"
                                                aria-label="Select an item to open it in a new workspace tab.">
                                                <template if:true={hasLayouts} for:each={layouts} for:item="layout">
                                                    <li class={layout.listItemClass} role="presentation"
                                                        key={layout.value} data-id={layout.value}
                                                        onclick={TemplateChangeHandler}>
                                                        <a href="#" role="option" data-id={layout.value}
                                                            class="menuItem slds-split-view__list-item-action slds-grow slds-has-flexi-truncate"
                                                            tabindex="0">
                                                            <div class="slds-grid slds-wrap">
                                                                <b>
                                                                    <span
                                                                        class="slds-truncate slds-text-body_regular slds-text-color_default"
                                                                        title={layout.label}>{layout.label}</span>
                                                                </b>
                                                                <span class="slds-truncate slds-col_bump-left"
                                                                    title="packageIcon">
                                                                    <lightning-icon if:true={layout.namespacePrefix}
                                                                        icon-name="utility:package" size="xx-small">
                                                                    </lightning-icon>
                                                                </span>
                                                            </div>
                                                            <div class="slds-grid">
                                                                <span class="slds-truncate"
                                                                    title={layout.currentObject}>{layout.currentObject}
                                                                </span>
                                                            </div>
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </article>
                                </div>
                            </div>
                        </div>
                        <div class={tabContainerClass}>
                            <template if:true={showTemplate}>
                                <lightning-tabset>
                                    <lightning-tab class="slds-p-around_small contentHeight"
                                        label={Label.LBL_GeneralInformationTitle} onactive={handleTabActive}>
                                        <div class="slds-p-bottom--medium">
                                            <!-- <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-bottom_small">
                                                <template if:false={isNewTemplate}>
                                                    <div class="slds-m-left_small slds-grid slds-grid_vertical-align-center slds-wrap slds-color__text-gray-7"
                                                        style="background-color: #e9e9e9; padding: 6px; border-radius: 32px;">
                                                        <lightning-icon icon-name="utility:orders" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                        <span class="slds-text-title_caps">{Label.LBl_PageLayoutSettings_TemplateApiName} :</span>
                                                        <span class="slds-m-left_xx-small"><strong>{instance.currentLayout.settings.name}</strong></span>
                                                    </div>
                                                </template>
                                            </div> -->
                                            <div
                                                class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-bottom_x-small">
                                                <template if:false={isNewTemplate}>
                                                    <div class="slds-m-left_x-small slds-grid slds-grid_vertical-align-center slds-wrap slds-color__text-gray-7"
                                                        style="background-color: #e9e9e9; padding: 6px; border-radius: 32px;">
                                                        <lightning-icon icon-name="utility:orders" size="xx-small"
                                                            class="slds-m-right_xx-small"></lightning-icon>
                                                        <!-- <span class="slds-text-title_caps">Object :</span> -->
                                                        <span
                                                            class="slds-m-left_xx-small"><strong>{instance.currentLayout.settings.objectApiName}</strong></span>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="slds-form slds-form_stacked">
                                                <div
                                                    class="slds-grid slds-grid_vertical slds-m-bottom_x-small slds-m-left_x-small">
                                                    <div class="slds-col slds-size_2-of-12 slds-p-bottom_x-small">
                                                        <span
                                                            class="section-label header-title slds-grid slds-grid_vertical-align-center">
                                                            {Label.LBL_TemplateName}
                                                            <lightning-helptext
                                                                content={Label.LBL_TemplateName}></lightning-helptext>
                                                        </span>
                                                    </div>
                                                    <div class="slds-col slds-size_3-of-12">
                                                        <lightning-input value={instance.currentLayout.settings.name}
                                                            data-field="name" onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-input>
                                                    </div>
                                                </div>
                                                <div
                                                    class="slds-grid slds-grid_vertical slds-m-bottom_medium slds-m-left_x-small">
                                                    <div class="slds-col slds-size_2-of-12 slds-p-bottom_x-small">
                                                        <span
                                                            class="section-label header-title slds-grid slds-grid_vertical-align-center">
                                                            {Label.LBL_Source}
                                                            <lightning-helptext content="Help"></lightning-helptext>
                                                        </span>
                                                    </div>
                                                    <div class="slds-col slds-size_3-of-12">
                                                        <lightning-input value={instance.currentLayout.settings.source}
                                                            data-field="source"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-input>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-tab>
                                    <div class="slds-scrollable">
                                        <lightning-tab class="slds-p-around_small tabsContent" label={Label.LBL_PageLayoutSettings_TemplateFilter} onactive={handleTabActive}>
                                            <lightning-layout multiple-rows="true" horizontal-align="start" vertical-align="center">
                                                <lightning-layout-item class="slds-p-vertical_xx-small slds-p-horizontal_small" size="12">
                                                    <div class="slds-border--bottom" style="height:350px;max-width:100%;overflow-x:auto;">
                                                        <c-field-picker
                                                            main-object={instance.currentLayout.settings.objectApiName}
                                                            onselectfield={handleManageTemplateFilterActions}
                                                            onretrievefield={handleManageTemplateFilterActions}
                                                            data-id="fieldPicker"
                                                            get-options="true"
                                                            filter="[]"
                                                            onloading={fieldPickerLoadingHandler}
                                                            data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.FIELD_PICKER}>
                                                        </c-field-picker>
                                                    </div>
                                                </lightning-layout-item>
                                                <lightning-layout-item class="slds-p-vertical_xx-small slds-p-horizontal_small" size="12">
                                                    <div style="display:flex;flex-direction:row;align-items:stretch;">
                                                        <div style="display:flex;flex-direction:column;align-items:stretch;width:35%;">
                                                            <template lwc:if={templateFilterCriteriaWrapper.selectedField}>
                                                                <lightning-input label="Field" type="text" disabled  class="slds-text-align_left" value={templateFilterCriteriaWrapper.currentCriteria.fieldName}
                                                                    title={templateFilterCriteriaWrapper.currentCriteria.fieldName}>
                                                                </lightning-input>
                                                                <lightning-combobox label="Operator"
                                                                    value={templateFilterCriteriaWrapper.currentCriteria.operator}
                                                                    options={templateFilterCriteriaWrapper.selectedField.options} data-field="operator"
                                                                    onchange={handleManageTemplateFilterActions} data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.CRITERIA_FIELD_CHANGE} dropdown-alignment="bottom-left">
                                                                </lightning-combobox>
                                                                <template lwc:if={templateFilterCriteriaWrapper.selectedField.isPicklist}>
                                                                    <lightning-combobox
                                                                        label="Value" value={templateFilterCriteriaWrapper.currentCriteria.value}
                                                                        options={templateFilterCriteriaWrapper.selectedField.picklistValues} data-field="value"
                                                                        onchange={handleManageTemplateFilterActions} data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.CRITERIA_FIELD_CHANGE}
                                                                        dropdown-alignment="bottom-left">
                                                                    </lightning-combobox>
                                                                </template>
                                                                <template lwc:else>
                                                                    <template lwc:if={templateFilterCriteriaWrapper.selectedField.showValueInput}>
                                                                        <lightning-input label="Value" type={templateFilterCriteriaWrapper.selectedField.inputType}
                                                                            data-field="value" value={templateFilterCriteriaWrapper.currentCriteria.value}
                                                                            onchange={handleManageTemplateFilterActions} data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.CRITERIA_FIELD_CHANGE}>
                                                                        </lightning-input>
                                                                    </template>
                                                                </template>
                                                            </template>
                                                        </div>
                                                        <div class="slds-p-left_x-large slds-p-right_medium slds-p-top_small" style="display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;">
                                                            <lightning-icon icon-name="utility:add" title="Add" size="xx-small" class="slds-p-vertical_medium"
                                                                onclick={handleManageTemplateFilterActions} data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.ADD_CRITERIA}>
                                                            </lightning-icon>
                                                            <lightning-icon
                                                                icon-name="utility:delete"
                                                                title="Delete"
                                                                size="xx-small"
                                                                class="slds-p-vertical_medium"
                                                                onclick={handleManageTemplateFilterActions}
                                                                data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.DELETE_CRITERIA}>
                                                            </lightning-icon>
                                                            <lightning-icon icon-name="utility:chevronright" title="Update" size="xx-small" class="slds-p-vertical_medium"
                                                                onclick={handleManageTemplateFilterActions} data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.EDIT_CRITERIA}>
                                                            </lightning-icon>
                                                        </div>
                                                        <div style="display:flex;  flex-direction:column; align-items:stretch; width:35%;">
                                                            <label class="slds-form-element__label slds-m-bottom_none">
                                                                Filter Criteria
                                                            </label>
                                                            <select multiple class="slds-select slds-m-top_xxx-small" style="height:100%;">
                                                                <template for:each={instance.currentLayout.settingsWrappers.templateCriteriaDisplayWrapper} for:item="filterCriteria">
                                                                    <option key={filterCriteria.rowKey} value={filterCriteria.listIndex} onclick={handleManageTemplateFilterActions}
                                                                     data-action={MANAGE_TEMPLATE_FILTER_ACTIONS.SELECT_CRITERIA}>
                                                                        {filterCriteria.expression}
                                                                    </option>
                                                                </template>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </lightning-layout-item>
                                            </lightning-layout>
                                        </lightning-tab>
                                    </div>
                                    <lightning-tab class="slds-p-around_small contentHeight" style="height: 100%;"
                                        label={Label.LBL_TopLeftSettingsTitle} onactive={handleTabActive}>
                                        <div class="slds-grid slds-grid_vertical">
                                            <div class="slds-grid slds-grid_vertical">
                                                <div
                                                    class="section-label header-title slds-grid slds-grid_vertical-align-center slds-glutters">
                                                    {Label.LBL_HeaderFields} <lightning-helptext
                                                        content={Label.LBl_PageLayoutSettings_HeaderFieldsHelpText}></lightning-helptext>
                                                </div>
                                                <lightning-dual-listbox name="fields" label="" class="slds-size--3-of-4"
                                                    source-label="Available" selected-label="Selected"
                                                    options={instance.fieldNameOptions} data-field="topLeftCornerFields"
                                                    onchange={handlePageLayoutSettingsChange}
                                                    value={instance.currentLayout.settings.topLeftCornerFields}></lightning-dual-listbox>
                                            </div>
                                            <!-- Icon Section -->
                                            <div class="slds-grid slds-m-top_medium">
                                                <div class="section-label header-title slds-col slds-size_1-of-8">
                                                    {Label.LBL_PrimaryIcon} <lightning-helptext
                                                        content={Label.LBL_PageLayoutSettings_TopPrimaryHelpText}></lightning-helptext>
                                                </div>
                                                <lightning-radio-group name="topLeftCornerLogo1" variant="label-hidden"
                                                    options={iconOptions} value={topLeftCornerLogo1Value}
                                                    class="slds-col slds-size_1-of-8"
                                                    onchange={handlePageLayoutSettingsChange}
                                                    data-field="topLeftCornerLogo1" data-type="isStaticRessource">
                                                </lightning-radio-group>
                                                <template
                                                    if:true={instance.currentLayout.settings.topLeftCornerLogo1.isStaticRessource}>
                                                    <lightning-input class="slds-col slds-size_1-of-8"
                                                        placeholder="/resource/"
                                                        value={instance.currentLayout.settings.topLeftCornerLogo1.value}
                                                        style="width:20%;" data-field="topLeftCornerLogo1"
                                                        data-type="value" onchange={handlePageLayoutSettingsChange}
                                                        variant="label-hidden">
                                                    </lightning-input>
                                                </template>
                                                <template
                                                    if:false={instance.currentLayout.settings.topLeftCornerLogo1.isStaticRessource}>
                                                    <lightning-combobox class="slds-col slds-size_1-of-7"
                                                        name="fieldSelector" style="width:20%;"
                                                        value={instance.currentLayout.settings.topLeftCornerLogo1.value}
                                                        placeholder="" options={instance.fieldNameOptions}
                                                        data-field="topLeftCornerLogo1" data-type="value"
                                                        onchange={handlePageLayoutSettingsChange}
                                                        variant="label-hidden">
                                                    </lightning-combobox>
                                                </template>
                                            </div>
                                            <div class="slds-grid slds-m-top_medium">
                                                <div class="section-label header-title slds-col slds-size_1-of-8">
                                                    {Label.LBL_SecondaryIcon} <lightning-helptext
                                                        content={Label.LBL_PageLayoutSettings_TopSecondaryIconHelpText}></lightning-helptext>
                                                </div>
                                                <lightning-radio-group name="topLeftCornerLogo2" variant="label-hidden"
                                                    options={iconOptions} value={topLeftCornerLogo2Value}
                                                    class="slds-col slds-size_1-of-8"
                                                    onchange={handlePageLayoutSettingsChange}
                                                    data-field="topLeftCornerLogo2" data-type="isStaticRessource">
                                                </lightning-radio-group>
                                                <template
                                                    if:true={instance.currentLayout.settings.topLeftCornerLogo2.isStaticRessource}>
                                                    <lightning-input placeholder="/resource/"
                                                        class="slds-col slds-size_1-of-8"
                                                        value={instance.currentLayout.settings.topLeftCornerLogo2.value}
                                                        style="width:20%;" onchange={handlePageLayoutSettingsChange}
                                                        data-field="topLeftCornerLogo2" data-type="value"
                                                        variant="label-hidden">
                                                    </lightning-input>
                                                </template>
                                                <template
                                                    if:false={instance.currentLayout.settings.topLeftCornerLogo2.isStaticRessource}>
                                                    <lightning-combobox name="fieldSelector"
                                                        class="slds-col slds-size_1-of-8" style="width:20%;"
                                                        value={instance.currentLayout.settings.topLeftCornerLogo2.value}
                                                        placeholder="" options={instance.fieldNameOptions}
                                                        onchange={handlePageLayoutSettingsChange}
                                                        data-field="topLeftCornerLogo2" data-type="value"
                                                        variant="label-hidden">
                                                    </lightning-combobox>
                                                </template>
                                            </div>
                                        </div>
                                    </lightning-tab>
                                    <lightning-tab class="slds-p-around_small contentHeight" style="height: 100%;"
                                        label={Label.LBL_BottomLeftCornerSettingsTitle} onactive={handleTabActive}>
                                        <div class="slds-grid slds-grid_vertical">
                                            <div class="slds-grid slds-grid_vertical">
                                                <div
                                                    class="section-label header-title slds-grid slds-grid_vertical-align-center slds-glutters">
                                                    {Label.LBL_SideBarFields} <lightning-helptext
                                                        content={Label.LBl_PageLayoutSettings_SidebarFieldsHelpText}></lightning-helptext>
                                                </div>
                                                <lightning-dual-listbox class="slds-size--3-of-4" name="fields" label=""
                                                    source-label="Available" selected-label="Selected"
                                                    options={instance.fieldNameOptions}
                                                    data-field="bottomLeftCornerFields"
                                                    onchange={handlePageLayoutSettingsChange}
                                                    value={instance.currentLayout.settings.bottomLeftCornerFields}></lightning-dual-listbox>
                                            </div>
                                            <!-- Icon Section -->
                                            <div>
                                                <div class="slds-grid slds-m-top_medium">
                                                    <div class="section-label header-title slds-col slds-size_1-of-8">
                                                        {Label.LBL_PrimaryIcon} <lightning-helptext
                                                            content={Label.LBL_PageLayoutSettings_BottomPrimaryHelpText}></lightning-helptext>
                                                    </div>
                                                    <lightning-radio-group name="bottomLeftCornerLogo1"
                                                        variant="label-hidden" options={iconOptions}
                                                        value={bottomLeftCornerLogo1Value}
                                                        class="slds-col slds-size_1-of-8"
                                                        onchange={handlePageLayoutSettingsChange}
                                                        data-field="bottomLeftCornerLogo1"
                                                        data-type="isStaticRessource">
                                                    </lightning-radio-group>
                                                    <template
                                                        if:true={instance.currentLayout.settings.bottomLeftCornerLogo1.isStaticRessource}>
                                                        <lightning-input placeholder="/resource/"
                                                            class="slds-col slds-size_1-of-7" style="width:20%;"
                                                            value={instance.currentLayout.settings.bottomLeftCornerLogo1.value}
                                                            data-field="bottomLeftCornerLogo1" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-input>
                                                    </template>
                                                    <template
                                                        if:false={instance.currentLayout.settings.bottomLeftCornerLogo1.isStaticRessource}>
                                                        <lightning-combobox class="slds-col slds-size_1-of-7"
                                                            style="width:20%;" name="fieldSelector"
                                                            value={instance.currentLayout.settings.bottomLeftCornerLogo1.value}
                                                            placeholder="" options={instance.fieldNameOptions}
                                                            data-field="bottomLeftCornerLogo1" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-combobox>
                                                    </template>
                                                </div>
                                                <div class="slds-grid slds-m-top_medium">
                                                    <div class="section-label header-title slds-col slds-size_1-of-8">

                                                    </div>
                                                    <lightning-radio-group name="statusIcon" variant="label-hidden"
                                                        options={iconOptions} value={statusIconValue}
                                                        class="slds-col slds-size--2-of-12" data-field="statusIcon"
                                                        data-type="isStaticRessource"
                                                        onchange={handlePageLayoutSettingsChange}>
                                                    </lightning-radio-group>
                                                    <template
                                                        if:true={instance.currentLayout.settings.statusIcon.isStaticRessource}>
                                                        <lightning-input class="slds-col slds-size--5-of-12"
                                                            placeholder="/resource/" data-field="statusIcon"
                                                            data-type="value"
                                                            value={instance.currentLayout.settings.statusIcon.value}
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-input>
                                                    </template>
                                                    <template
                                                        if:false={instance.currentLayout.settings.statusIcon.isStaticRessource}>
                                                        <lightning-combobox name="fieldSelector"
                                                            class="slds-col slds-size--5-of-12"
                                                            value={instance.currentLayout.settings.statusIcon.value}
                                                            placeholder="" options={instance.fieldNameOptions}
                                                            data-field="statusIcon" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-combobox>
                                                    </template>
                                                </div>
                                                <div
                                                    class="slds-grid slds-grid_vertical slds-m-top_medium slds-m-left_small">
                                                    <div
                                                        class="section-label header-title slds-grid slds-grid_vertical-align-center slds-glutters">
                                                        {Label.LBL_TopRightFields} <lightning-helptext
                                                            content={Label.LBL_PageLayoutSettings_StatusFieldsHelpText}></lightning-helptext>
                                                    </div>
                                                    <lightning-dual-listbox name="fields" label=""
                                                        source-label="Available" selected-label="Selected"
                                                        options={instance.fieldNameOptions}
                                                        onchange={handlePageLayoutSettingsChange}
                                                        data-field="topRightCornerFields"
                                                        value={instance.currentLayout.settings.topRightCornerFields}></lightning-dual-listbox>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size--1-of-2 slds-grid slds-grid_vertical">
                                                <div
                                                    class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                                    <div class="section-label header-title slds-col slds-size--3-of-12">
                                                        {Label.LBL_ActivityLeftLogo} <lightning-helptext
                                                            content={Label.LBL_PageLayoutSettings_ActivityLeftIconHelpText}></lightning-helptext>
                                                    </div>
                                                    <lightning-radio-group name="activityLeftIcon"
                                                        variant="label-hidden" options={iconOptions}
                                                        value={activityLeftIconValue}
                                                        class="slds-col slds-size--2-of-12"
                                                        data-field="activityLeftIcon" data-type="isStaticRessource"
                                                        onchange={handlePageLayoutSettingsChange}>
                                                    </lightning-radio-group>
                                                    <template
                                                        if:true={instance.currentLayout.settings.activityLeftIcon.isStaticRessource}>
                                                        <lightning-input class="slds-col slds-size--5-of-12"
                                                            placeholder="/resource/"
                                                            value={instance.currentLayout.settings.activityLeftIcon.value}
                                                            data-field="activityLeftIcon" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-input>
                                                    </template>
                                                    <template
                                                        if:false={instance.currentLayout.settings.activityLeftIcon.isStaticRessource}>
                                                        <lightning-combobox name="fieldSelector"
                                                            class="slds-col slds-size--5-of-12"
                                                            value={instance.currentLayout.settings.activityLeftIcon.value}
                                                            placeholder="" options={activityObjectFields}
                                                            data-field="activityLeftIcon" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-combobox>
                                                    </template>
                                                </div>
                                                <div
                                                    class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                                    <div class="section-label header-title slds-col slds-size--3-of-12">
                                                        {Label.LBL_ActivityRightLogo} <lightning-helptext
                                                            content={Label.LBL_PageLayoutSettings_ActivityRightIconHelpText}></lightning-helptext>
                                                    </div>
                                                    <lightning-radio-group name="activityRightIcon"
                                                        variant="label-hidden" options={iconOptions}
                                                        value={activityRightIconValue}
                                                        class="slds-col slds-size--2-of-12"
                                                        data-field="activityRightIcon" data-type="isStaticRessource"
                                                        onchange={handlePageLayoutSettingsChange}>
                                                    </lightning-radio-group>
                                                    <template
                                                        if:true={instance.currentLayout.settings.activityRightIcon.isStaticRessource}>
                                                        <lightning-input class="slds-col slds-size--5-of-12"
                                                            placeholder="/resource/"
                                                            value={instance.currentLayout.settings.activityRightIcon.value}
                                                            variant="label-hidden" data-field="activityRightIcon"
                                                            data-type="value" onchange={handlePageLayoutSettingsChange}>
                                                        </lightning-input>
                                                    </template>
                                                    <template
                                                        if:false={instance.currentLayout.settings.activityRightIcon.isStaticRessource}>
                                                        <lightning-combobox class="slds-col slds-size--5-of-12"
                                                            name="fieldSelector"
                                                            value={instance.currentLayout.settings.activityRightIcon.value}
                                                            placeholder="" options={activityObjectFields}
                                                            data-field="activityRightIcon" data-type="value"
                                                            onchange={handlePageLayoutSettingsChange}
                                                            variant="label-hidden">
                                                        </lightning-combobox>
                                                    </template>
                                                </div>
                                                <div
                                                    class="slds-grid slds-grid_vertical slds-m-top_small slds-m-left_small">
                                                    <div
                                                        class="section-label header-title slds-grid slds-grid_vertical-align-center slds-glutters">
                                                        {Label.LBL_ActivityFields} <lightning-helptext
                                                            content={Label.LBL_PageLayoutSettings_ActivityFieldsHelpText}></lightning-helptext>
                                                    </div>
                                                    <lightning-dual-listbox name="fields" label=""
                                                        source-label="Available" selected-label="Selected"
                                                        options={activityObjectFields}
                                                        onchange={handlePageLayoutSettingsChange}
                                                        data-field="activityFields"
                                                        value={instance.currentLayout.settings.activityFields}></lightning-dual-listbox>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-tab>
                                    <lightning-tab class="slds-p-around_small contentHeight" style="height: 100%;"
                                        label={Label.LBL_TaskSettingsTitle} onactive={handleTabActive}>
                                        <div>
                                            <div
                                                class="section-label header-title slds-p-left_xx-small slds-p-bottom_x-small">
                                                {Label.LBL_AddTaskFlow} <lightning-helptext
                                                    content={Label.LBL_PageLayoutSettings_AddTaskFlowHelpText}></lightning-helptext>
                                            </div>
                                            <lightning-combobox class="slds-size--1-of-3" name="flowCombobox"
                                                variant="label-hidden"
                                                value={instance.currentLayout.settings.newTaskFlow}
                                                placeholder="Select Flow" data-field="newTaskFlow"
                                                options={instance.screenFlowsList}
                                                onchange={handlePageLayoutSettingsChange}>
                                            </lightning-combobox>
                                            <div class="slds-grid slds-grid_vertical">
                                                <div
                                                    class="section-label header-title slds-grid slds-grid_vertical-align-center slds-glutters">
                                                    {Label.LBL_TaskFields} <lightning-helptext
                                                        content={Label.LBL_PageLayoutSettings_DisplayedTaskFieldHelpText}></lightning-helptext>
                                                </div>
                                                <lightning-dual-listbox class="slds-size--2-of-3" name="tasks"
                                                    variant="label-hidden"
                                                    value={instance.currentLayout.settings.taskFields}
                                                    source-label="Available" max="3" selected-label="Selected"
                                                    options={taskObjectFields} data-field="taskFields"
                                                    onchange={handlePageLayoutSettingsChange}>
                                                </lightning-dual-listbox>
                                            </div>
                                        </div>
                                    </lightning-tab>
                                </lightning-tabset>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <template if:true={popups.tabParams.isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-button slds-button_icon slds-modal__close">
                    <lightning-button-icon variant="bare" size="large" icon-name="utility:close"
                        onclick={popups.tabParams.close}></lightning-button-icon>
                </div>
                <div class="slds-modal__header">
                    <h1 class="slds-modal__title slds-hyphenate">Configuration</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={popups.tabParams.params} for:item="param" for:index="paramindex">
                        <template lwc:if={param.isCombobox}>
                            <lightning-combobox key={param.name} data-name={param.name} data-index={paramindex}
                                label={param.label} value={param.value} field-level-help={param.description}
                                options={param.datasourceList} onchange={popups.tabParams.handleTabParamChange}
                                required={param.required}></lightning-combobox>
                        </template>
                        <template lwc:elseif={param.isString}>
                            <lightning-input key={param.name} data-name={param.name} data-index={paramindex}
                                label={param.label} value={param.value} field-level-help={param.description}
                                onchange={popups.tabParams.handleTabParamChange}
                                required={param.required}></lightning-input>
                        </template>
                        <template lwc:elseif={param.isBoolean}>
                            <lightning-input type="checkbox" key={param.name} data-name={param.name}
                                data-index={paramindex} label={param.label} checked={param.value}
                                field-level-help={param.description} onchange={popups.tabParams.handleTabParamChange}
                                required={param.required}>
                            </lightning-input>
                        </template>
                        <template lwc:elseif={param.isInteger}>
                            <lightning-input type="number" key={param.name} data-name={param.name}
                                data-index={paramindex} label={param.label} value={param.value}
                                field-level-help={param.description} onchange={popups.tabParams.handleTabParamChange}
                                required={param.required}></lightning-input>
                        </template>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <div class="slds-grid slds-grid_align-end slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label={Label.Cancel} onclick={popups.tabParams.close}>
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button label={Label.LBL_Save} variant="brand" onclick={popups.tabParams.confirm}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    <div if:true={showSaveAsMenu}>
        <!-- Modal/Popup Box starts here-->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
            aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open ">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box Header Starts here-->
                <header class="slds-modal__header">
                    <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        {Label.LBL_Save_As}
                    </div>
                </header>
                <!--Modal/Popup Box Body Starts here-->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <lightning-input label={Label.LBL_New_Template_Name} variant="label-hidden" max-length="40"
                        placeholder={Label.LBL_New_Template_Name} onchange={saveAsTemplateNameChangeHandler}
                        value={saveAsTemplateName}>
                    </lightning-input>
                </div>
                <!--Modal/Popup Box Footer Starts here-->
                <footer class="slds-modal__footer">
                    <lightning-button title={Label.Cancel} label={Label.Cancel} onclick={cancelSaveAs}
                        class="slds-p-right--xxx-small">
                    </lightning-button>
                    <lightning-button title={Label.LBL_Save} label={Label.LBL_Save} variant="brand"
                        onclick={saveAsNewTemplateName} disabled={saveAsButtonDisabled}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
    </div>
    <div if:true={newTemplatePopup.isOpen}>
        <!-- Modal/Popup Box starts here-->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-13" aria-modal="true"
            aria-describedby="modal-content-id-13" class="slds-modal slds-fade-in-open ">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box Header Starts here-->
                <header class="slds-modal__header">
                    <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        {Label.LBL_PageLayoutSettings_NewTemplate}
                    </div>
                </header>
                <!--Modal/Popup Box Body Starts here-->
                <div class="slds-modal__content slds-p-around_medium slds-grid slds-wrap" id="modal-content-id-13"
                    style="overflow: unset;">
                    <!-- <div class="section-Container slds-m-top_medium slds-size--1-of-1">
                        <div class="section-label header-title ">{Label.LBL_TemplateName} <lightning-helptext content="Help"></lightning-helptext></div> -->
                    <lightning-input value={instance.currentLayout.settings.name} data-field="name"
                        onchange={handlePageLayoutSettingsChange} label={Label.LBL_TemplateName}
                        field-level-help="help">
                    </lightning-input>
                    <!-- </div> -->
                    <!-- Select Object Section -->
                    <div class="section-Container  slds-size--1-of-1">
                        <template if:true={isNewTemplate}>
                            <!-- <div class="section-label header-title ">{Label.LBL_SelectObject} <lightning-helptext content="Help"></lightning-helptext></div> -->
                            <!-- Search Input -->
                            <div class="slds-is-relative" style="width: 100%;">
                                <lightning-input onfocus={showallObjects} type="search" data-field="objectApiName"
                                    value={instance.currentLayout.settings.objectApiName} label={Label.LBL_SelectObject}
                                    field-level-help="help">
                                </lightning-input>
                                <!-- Dropdown List -->
                                <template if:true={instance.showObjectDropdown}>
                                    <div lwc:if={instance.objectsList.length}
                                        class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                            <template for:each={instance.objectsList} for:item="searchResult">
                                                <li key={searchResult.value} data-value={searchResult.value}
                                                    data-field="objectApiName" data-label={searchResult.label}
                                                    role="presentation" onclick={handleChangeLayoutObject}
                                                    class="slds-listbox__item">
                                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                        role="option" data-value={searchResult.value}
                                                        onclick={handleChangeLayoutObject}
                                                        data-label={searchResult.label} data-field="objectApiName">
                                                        <span class="slds-media__body" data-value={searchResult.value}
                                                            data-label={searchResult.label} data-field="objectApiName">
                                                            <span class="slds-truncate" title={searchResult.label}
                                                                data-value={searchResult.value}
                                                                data-label={searchResult.label}
                                                                data-field="objectApiName">
                                                                {searchResult.label}
                                                            </span>
                                                        </span>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <lightning-input label={Label.LBL_Source} field-level-help="help"
                        value={instance.currentLayout.settings.source} data-field="source"
                        onchange={handlePageLayoutSettingsChange}>
                    </lightning-input>
                </div>
                <!--Modal/Popup Box Footer Starts here-->
                <footer class="slds-modal__footer">
                    <lightning-button title={Label.Cancel} label={Label.Cancel} onclick={handleCancelNewTemplate}
                        class="slds-p-right--xxx-small">
                    </lightning-button>
                    <lightning-button title={Label.LBL_Save} label={Label.LBL_Save} variant="brand"
                        onclick={createNewTemplate}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
    </div>
    <template if:true={popups.relatedInformations.isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open related-informations-modal">
            <div class="slds-modal__container related-informations-modal__container">
                <div class="slds-button slds-button_icon slds-modal__close">
                    <lightning-button-icon variant="bare" size="large" icon-name="utility:close"
                        onclick={closeRelatedInformationsPopup}></lightning-button-icon>
                </div>
                <div class="slds-modal__header">
                    <h1 class="slds-modal__title slds-hyphenate">{Label.LBL_RelatedInformationSettings}</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="section-label header-title  slds-m-bottom_small">{Label.LBL_Filter} (AND)</div>
                    <template for:each={popups.relatedInformations.filters} for:item="filter" for:index="index">
                        <div key={filter.rowKey}
                            class="related-informations-filter-row slds-grid slds-gutters_medium slds-m-bottom_small slds-grid_vertical-align-center">
                            <div class="slds-col slds-size_4-of-12 related-informations-filter-field">
                                <c-field-selector-input object-name={popups.relatedInformations.objectApiName}
                                    value={filter.fieldName} data-index={index}
                                    onfieldselect={handleRelatedInformationsFieldSelect}
                                    onfieldrestore={handleRelatedInformationsFieldRestore}>
                                </c-field-selector-input>
                            </div>
                            <div class="slds-col slds-size_3-of-12 related-informations-filter-operator">
                                <lightning-combobox options={filter.operationsOptions} value={filter.operator}
                                    data-index={index} data-field="operator"
                                    onchange={handleRelatedInformationsFilterChange}
                                    variant="label-hidden"></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_4-of-12 related-informations-filter-value">
                                <template if:false={filter.disableValue}>
                                    <template if:true={filter.isReference}>
                                        <lightning-record-edit-form object-api-name={filter.previousObject}>
                                            <lightning-input-field field-name={filter.refFieldName} value={filter.value}
                                                data-index={index} data-field="value"
                                                onchange={handleRelatedInformationsFilterChange} variant="label-hidden">
                                            </lightning-input-field>
                                        </lightning-record-edit-form>
                                    </template>
                                    <template if:false={filter.isReference}>
                                        <template if:true={filter.isPicklist}>
                                            <lightning-combobox options={filter.picklistValues} value={filter.value}
                                                data-index={index} data-field="value"
                                                onchange={handleRelatedInformationsFilterChange} variant="label-hidden">
                                            </lightning-combobox>
                                        </template>
                                        <template if:false={filter.isPicklist}>
                                            <lightning-input type={filter.inputType} value={filter.value}
                                                data-index={index} data-field="value"
                                                onchange={handleRelatedInformationsFilterChange} variant="label-hidden">
                                            </lightning-input>
                                        </template>
                                    </template>
                                </template>
                            </div>
                            <div
                                class="slds-icon_container edit-icon custom-icon-delete slds-size_1-of-12 slds-p-left--x-small">
                                <lightning-icon icon-name='utility:delete' size="x-small" data-rowindex={index}
                                    data-action="delete" onclick={handleRelatedInformationsFilterRows}
                                    class="delete-trans" style="margin-right: 7px;">
                                </lightning-icon>
                            </div>
                        </div>
                    </template>
                    <lightning-button label={Label.LBL_AddFilter} data-action="add" icon-name="utility:add"
                        icon-position="left" onclick={handleRelatedInformationsFilterRows}></lightning-button>
                </div>
                <div class="slds-modal__footer">
                    <div class="slds-grid slds-grid_align-end slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label={Label.Cancel}
                                onclick={closeRelatedInformationsPopup}></lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button label={Label.LBL_Save} variant="brand"
                                data-index={popups.relatedInformations.relatedInformationRowIndex}
                                onclick={confirmRelatedInformationsPopup}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
