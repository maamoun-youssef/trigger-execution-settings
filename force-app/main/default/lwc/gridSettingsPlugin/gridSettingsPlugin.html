<template>
    <div class="mainContainer slds-card">
        <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header pageHeader">
            <div class="slds-col slds-has-flexi-truncate">
                <div
                    class="slds-media slds-media_center slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small">
                    <div>
                        <template lwc:if={pluginIcon}>
                            <img lwc:if={pluginIcon} src={pluginIcon}
                                style="width:30px; height:30px; margin-left:6px; cursor:pointer; border-radius:3px;" />
                        </template>
                        <lightning-icon lwc:else icon-name={headerConfig.iconName} class="slds-m-right--small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-text-title">{headerConfig.title}</div>
                        <div class="slds-list--inline">
                            <div class="slds-text-heading_small slds-text-title_bold">{headerConfig.subTitle}</div>
                            <template lwc:if={includeInListView}>
                                <template lwc:if={listViewLayoutOptions.length}>
                                    <lightning-button-menu variant="bare"
                                        class="slds-button_icon-small slds-m-left--small" icon-size="small"
                                        menu-alignment="right">
                                        <template for:each={listViewLayoutOptions} for:item="listView">
                                            <lightning-menu-item key={listView.value} label={listView.label}
                                                value={listView.value}
                                                onclick={listViewChangeHandler}></lightning-menu-item>
                                        </template>
                                    </lightning-button-menu>
                                </template>
                                <template lwc:else>
                                    <lightning-button-menu variant="bare"
                                        class="slds-button_icon-small slds-m-left--small"
                                        title={Labels.LBL_No_Templates_Selected_as_List_View} icon-size="small"
                                        menu-alignment="right" disabled>
                                    </lightning-button-menu>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-wrap slds-align-middle">
                <div class="slds-grid slds-align--absolute-center slds-size_1-of-1">
                    <lightning-input variant="label-hidden" oncommit={handleSearch} onkeypress={handleSearch}
                        type="search" class="slds-m-right--xx-small">
                    </lightning-input>
                    <template if:false={isTreeGrid}>
                        <lightning-button lwc:if={displayNewButton} title={Labels.LBL_New} label={Labels.LBL_New}
                            onclick={handleAddNewRecord} class="slds-m-right--xx-small">
                        </lightning-button>
                        <lightning-button lwc:if={displayNewInlineButton} title={labelNewInlineButton}
                            label={labelNewInlineButton} onclick={handleAddNewInlineRecord}
                            class="slds-m-right--xx-small">
                        </lightning-button>
                        <lightning-button title={Labels.LBL_Cancel} label={Labels.LBL_Cancel}
                            onclick={cancelChangesHandler} if:true={hasChanges} class="slds-m-right--xx-small">
                        </lightning-button>
                        <lightning-button title={Labels.LBL_Save} label={Labels.LBL_Save} variant="brand"
                            if:true={hasChanges} onclick={handleSave} class="slds-m-right--xx-small">
                        </lightning-button>
                    </template>
                    <template for:each={flows.icons} for:item="flow">
                        <img key={flow.value} src={flow.icon} alt={flow.label} class="slds-m-right--xx-small"
                            data-flow-name={flow.value} data-flow-label={flow.label} onclick={toggleFlow}
                            style="width:30px; height:30px; cursor:pointer; border-radius:3px;" />
                    </template>
                    <template for:each={flows.buttons} for:item="flow">
                        <lightning-button key={flow.value} label={flow.label} class="slds-m-right--xx-small"
                            data-flow-name={flow.value} data-flow-label={flow.label} onclick={toggleFlow}>
                        </lightning-button>
                    </template>
                    <template if:false={isTreeGrid}>
                        <lightning-button-menu icon-name="doctype:excel" menu-alignment="right" nubbin
                            class="slds-m-right--xx-small" lwc:if={hasImportExport}>
                            <lightning-menu-item label={Labels.LBL_Import}
                                onclick={toggleImportPopup}></lightning-menu-item>
                            <lightning-menu-item label={Labels.LBL_Export}
                                onclick={handleExportExcel}></lightning-menu-item>
                        </lightning-button-menu>
                        <template lwc:else>
                            <lightning-button-icon-stateful lwc:if={allowExport} title={Labels.LBL_Export}
                                icon-name="doctype:excel" class="slds-m-right--xx-small" variant="border-filled"
                                onclick={handleExportExcel}>
                            </lightning-button-icon-stateful>
                            <lightning-button-icon-stateful lwc:if={allowImport} title={Labels.LBL_Import}
                                icon-name="doctype:excel" class="slds-m-right--xx-small" variant="border-filled"
                                onclick={toggleImportPopup}>
                            </lightning-button-icon-stateful>
                        </template>
                    </template>
                    <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                        class="slds-m-right--xx-small" lwc:if={hasMenu}>
                        <template if:false={isTreeGrid}>
                            <template lwc:if={allowDelete}>
                                <lightning-menu-item label={Labels.LBL_Delete} data-type="mass"
                                    prefix-icon-name="utility:delete" onclick={toggleDeletePopUp}
                                    disabled={noRecordsSelected}></lightning-menu-item>
                            </template>
                        </template>
                        <template if:true={displayShowHideColumns}>
                            <lightning-menu-item label={Labels.LBL_Show_Hide_Columns}
                                prefix-icon-name="utility:freeze_column" onclick={toggleShowHideColumns}>
                            </lightning-menu-item>
                        </template>
                        <template lwc:if={displayListViewActions}>
                            <template lwc:if={showFirstDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                            <template for:each={selectedActions} for:item="action">
                                <lightning-menu-item class="slds-var-p-left-xx-small" key={action.Id}
                                    label={action.MasterLabel} data-url={action.Url} data-link-type={action.LinkType}
                                    data-label={action.MasterLabel} data-page-id={action.ScontrolId}
                                    onclick={handleActionsChange}>
                                </lightning-menu-item>
                            </template>
                            <template lwc:if={showSecondDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                        </template>
                        <template for:each={flows.actions} for:item="flow">
                            <lightning-menu-item key={flow.value} label={flow.label} prefix-icon-name={flow.icon}
                                data-flow-name={flow.value} data-flow-label={flow.label} onclick={toggleFlow}>
                            </lightning-menu-item>
                        </template>
                    </lightning-button-menu>
                    <lightning-button-icon icon-name="utility:refresh" onclick={loadData} variant="border-filled"
                        class="slds-m-right--xx-small">
                    </lightning-button-icon>
                    <template if:false={isTreeGrid}>
                        <lightning-button-icon-stateful lwc:if={allowFilter} icon-name="utility:filterList"
                            selected={isFilterOpen} variant="border-filled" onclick={toggleFilter}
                            class="slds-m-right--xx-small">
                        </lightning-button-icon-stateful>
                    </template>
                </div>
                <template lwc:if={showFileGenerationBar}>
                    <div class="slds-size_1-of-1 slds-p-top_xx-small">
                        {fileGenerationLabel} <lightning-progress-bar value={fileGenerationValue}
                            variant="circular"></lightning-progress-bar>
                    </div>
                </template>
                <template lwc:if={showFileDownloadBar}>
                    <div class="slds-size_1-of-1 slds-p-top_xx-small">
                        {Labels.LBL_File_Download} <lightning-progress-bar value={fileDownloadValue}
                            variant="circular"></lightning-progress-bar>
                    </div>
                </template>
            </div>
        </div>
        <template lwc:if={isLoading}>
            <div class="slds-spinner_container">
                <div class="loader slds-spinner_container slds-align--absolute-center">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </template>
        <div class="slds-card" style="margin-top: 0;">
            <div class="slds-grid slds-grid--vertical">
                <div class="slds-size_1-of-1 slds-grid">
                    <div class="slds-col slds-grid slds-wrap slds-scrollable">
                        <div class="main-panel slds-scrollable pageBody">
                            <table
                                class="initial-table slds-table slds-table_bordered no-help-text slds-scrollable_y slds-table slds-table_col-bordered slds-no-row-hover slds-border_right">
                                <thead>
                                    <tr class="slds-line-height_reset" style="height: 40px; min-height: 40px;">
                                        <template if:false={isTreeGrid}>
                                            <th lwc:if={isGrouped} class="sticky-header"
                                                style={groupedField.headerStyle}>
                                                <div>{groupedField.fieldLabel}</div>
                                                <div class="icons-container slds-grid">
                                                    <div lwc:if={groupedField.isSortable}>
                                                        <template lwc:if={groupedField.sortedField}>
                                                            <lightning-icon lwc:if={isSortASC}
                                                                icon-name="utility:arrowup" size="xx-small"
                                                                variant="brand" data-field={groupedField.fieldName}
                                                                onclick={changeSortDirection}>
                                                            </lightning-icon>
                                                            <lightning-icon lwc:else icon-name="utility:arrowdown"
                                                                size="xx-small" variant="brand"
                                                                data-field={groupedField.fieldName}
                                                                onclick={changeSortDirection}>
                                                            </lightning-icon>
                                                        </template>
                                                        <template if:false={groupedField.sortedField}>
                                                            <lightning-icon style={groupedField.iconStyle}
                                                                icon-name="utility:arrowup" size="xx-small"
                                                                data-field={groupedField.fieldName}
                                                                onclick={changeSortDirection}>
                                                            </lightning-icon>
                                                        </template>
                                                    </div>
                                                    <div
                                                        lwc:if={initDataWrapper.gridSettingsManager.isShowFilterOnColumnHeader}>
                                                        <div lwc:if={groupedField.isFilterable}>
                                                            <lightning-icon lwc:if={groupedField.hasFilter}
                                                                variant="brand" size="xx-small"
                                                                icon-name="utility:filterList"
                                                                data-field={groupedField.fieldName}
                                                                onclick={toggleHeaderFilter}
                                                                alternative-text={Labels.LBL_Filter}
                                                                title={Labels.LBL_Filter}>
                                                            </lightning-icon>
                                                            <lightning-icon lwc:else style={groupedField.iconStyle}
                                                                size="xx-small" icon-name="utility:filterList"
                                                                data-field={groupedField.fieldName}
                                                                onclick={toggleHeaderFilter}
                                                                alternative-text={Labels.LBL_Filter}
                                                                title={Labels.LBL_Filter}>
                                                            </lightning-icon>
                                                            <div class="slds-hide slds-dropdown slds-p-horizontal--medium"
                                                                data-filter-field={groupedField.fieldName}
                                                                style="box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px; top: 100%; z-index:6;left: 0; right: auto; transform: none;">
                                                                <span
                                                                    style="position: absolute;right: 0;top: 0; z-index: 7;">
                                                                    <lightning-button-icon variant="container"
                                                                        size="small" icon-name="utility:close"
                                                                        data-field={groupedField.fieldName}
                                                                        onclick={toggleHeaderFilter}
                                                                        alternative-text="close">
                                                                    </lightning-button-icon>
                                                                </span>
                                                                <ul class="slds-dropdown__list slds-scrollable--y"
                                                                    role="menu" aria-label="Show More"
                                                                    style={groupedField.headerFilterPopUpStyle}>
                                                                    <li class="slds-dropdown__item" role="presentation"
                                                                        style="text-align: left;margin-top: 5px;">
                                                                        <lightning-checkbox-group
                                                                            lwc:if={groupedField.isSearchableCheckboxes}
                                                                            name="filter" variant="label-hidden"
                                                                            options={groupedField.pickListValues}
                                                                            data-field={groupedField.fieldName}
                                                                            value={groupedField.filterValue.values}
                                                                            onchange={handleChangeFilter}
                                                                            style="top:10px">
                                                                        </lightning-checkbox-group>
                                                                        <lightning-input
                                                                            lwc:elseif={groupedField.isSearchableText}
                                                                            type="text" variant="label-hidden"
                                                                            placeholder={Labels.LBL_Search}
                                                                            data-field={groupedField.fieldName}
                                                                            value={groupedField.filterValue.searchValue}
                                                                            onchange={handleChangeFilter}
                                                                            style="top:10px">
                                                                        </lightning-input>
                                                                        <div class="slds-form-element__control slds-grid slds-gutters"
                                                                            lwc:elseif={groupedField.isSearchableInput}>
                                                                            <lightning-input type="number"
                                                                                variant="label-hidden"
                                                                                placeholder={Labels.LBL_Minimum}
                                                                                data-field={groupedField.fieldName}
                                                                                step={groupedField.step}
                                                                                data-range="value1"
                                                                                value={groupedField.filterValue.value1}
                                                                                onchange={handleChangeFilter}
                                                                                style="top:10px;width:100px;"
                                                                                class="slds-m-horizontal--medium">
                                                                            </lightning-input>
                                                                            <span style="margin-top: 1.75rem;">-</span>
                                                                            <lightning-input type="number"
                                                                                variant="label-hidden"
                                                                                placeholder={Labels.LBL_Maximum}
                                                                                data-field={groupedField.fieldName}
                                                                                step={groupedField.step}
                                                                                data-range="value2"
                                                                                value={groupedField.filterValue.value2}
                                                                                onchange={handleChangeFilter}
                                                                                style="top:10px;width:100px;"
                                                                                class="slds-m-horizontal--medium">
                                                                            </lightning-input>
                                                                        </div>
                                                                        <div class="slds-form-element__control slds-grid slds-gutters"
                                                                            lwc:if={groupedField.isSearchableDateInput}>
                                                                            <lightning-input type="date"
                                                                                variant="label-hidden"
                                                                                placeholder={Labels.LBL_Minimum}
                                                                                data-field={groupedField.fieldName}
                                                                                data-range="value1"
                                                                                value={groupedField.filterValue.value1}
                                                                                onchange={handleChangeFilter}
                                                                                style="top:10px;width:100px;"
                                                                                class="slds-m-horizontal--medium">
                                                                            </lightning-input>
                                                                            <span style="margin-top: 1.75rem;">-</span>
                                                                            <lightning-input type="date"
                                                                                variant="label-hidden"
                                                                                placeholder={Labels.LBL_Maximum}
                                                                                data-field={groupedField.fieldName}
                                                                                data-range="value2"
                                                                                value={groupedField.filterValue.value2}
                                                                                onchange={handleChangeFilter}
                                                                                style="top:10px;width:100px;"
                                                                                class="slds-m-horizontal--medium">
                                                                            </lightning-input>
                                                                        </div>
                                                                    </li>
                                                                    <li class="slds-has-divider_top-space"
                                                                        role="separator">
                                                                    </li>
                                                                </ul>
                                                                <div class="slds-grid">
                                                                    <div style="width: max-content;"
                                                                        class="slds-col slds-align--absolute-center slds-m-right--x-small">
                                                                        <button type="submit" title={Labels.LBL_Reset}
                                                                            data-field={groupedField.fieldName}
                                                                            data-type="reset"
                                                                            onclick={toggleHeaderFilter}
                                                                            class="slds-button slds-button_neutral">
                                                                            {Labels.LBL_Reset}
                                                                        </button>
                                                                    </div>
                                                                    <div style="width: max-content;"
                                                                        class="slds-col slds-align--absolute-center">
                                                                        <button type="submit" title={Labels.LBL_Apply}
                                                                            data-field={groupedField.fieldName}
                                                                            data-type="apply"
                                                                            onclick={toggleHeaderFilter}
                                                                            class="slds-button slds-button_brand">
                                                                            {Labels.LBL_Apply}
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div lwc:if={groupedField.hasHelpText}>
                                                        <lightning-icon style={groupedField.iconStyle} size="xx-small"
                                                            icon-name="utility:info" title={groupedField.helpText}>
                                                        </lightning-icon>
                                                    </div>
                                                </div>
                                            </th>
                                            <th class="slds-grid--vertical-align-center slds-text-align--center sticky-header"
                                                scope="col" lwc:if={allowSelectRecords} style={firstThStyle}>
                                                <lightning-input type="checkbox" checked={isAllRecordsSelected}
                                                    variant="label-hidden" onchange={toggleSelectAllRecords}>
                                                </lightning-input>
                                            </th>
                                            <th class="sticky-header" style={firstThStyle} scope="col"
                                                lwc:if={displayCloneButton}>
                                            </th>
                                        </template>
                                        <template for:each={displayedFields} for:item="field" for:index="index">
                                            <th if:false={field.isHidden} key={field.fieldName}
                                                style={field.headerStyle} class="sticky-header">
                                                <div>{field.fieldLabel}</div>
                                                <div class="icons-container slds-grid">
                                                    <template if:false={isTreeGrid}>
                                                        <div lwc:if={field.isMassUpdate}>
                                                            <lightning-icon style={field.iconStyle}
                                                                icon-name="utility:edit" size="xx-small"
                                                                data-field={field.fieldName}
                                                                onclick={toggleMassUpdatePanel}
                                                                title={Labels.LBL_Mass_update}>
                                                            </lightning-icon>
                                                        </div>
                                                        <div lwc:if={field.isMassUpdate}
                                                            class="slds-hide slds-dropdown slds-p-around_x-small slds-col_bump-left"
                                                            data-updatefield={field.fieldName}
                                                            style={MassUpdatePopupStyle}>
                                                            <span
                                                                style="position: absolute;right: 0;top: 0; z-index: 5;">
                                                                <lightning-button-icon variant="container" size="small"
                                                                    icon-name="utility:close"
                                                                    data-field={field.fieldName}
                                                                    onclick={toggleMassUpdatePanel} title="Close">
                                                                </lightning-button-icon>
                                                            </span>
                                                            <ul class="slds-dropdown__list slds-p-top--medium"
                                                                role="menu" aria-label="Show More">
                                                                <li class="slds-dropdown__item" role="presentation"
                                                                    style="text-align: left;">
                                                                    <lightning-input lwc:if={field.isText}
                                                                        value={field.massUpdateValue}
                                                                        variant="label-hidden"
                                                                        data-field-name={field.fieldName}
                                                                        data-index={index} onchange={massUpdateHandler}>
                                                                    </lightning-input>
                                                                    <div lwc:elseif={field.isBoolean}
                                                                        class="slds-align--absolute-center">
                                                                        <lightning-input type="checkbox"
                                                                            checked={field.massUpdateValue}
                                                                            variant="label-hidden"
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            onchange={massUpdateHandler}>
                                                                        </lightning-input>
                                                                    </div>
                                                                    <template lwc:elseif={field.isTextarea}>
                                                                        <lightning-input-rich-text
                                                                            lwc:if={field.isRichText}
                                                                            value={field.massUpdateValue}
                                                                            variant="label-hidden"
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            onchange={massUpdateHandler}>
                                                                        </lightning-input-rich-text>
                                                                        <lightning-textarea lwc:else
                                                                            value={field.massUpdateValue}
                                                                            variant="label-hidden"
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            onchange={massUpdateHandler}>
                                                                        </lightning-textarea>
                                                                    </template>
                                                                    <lightning-input lwc:elseif={field.isOnlyNumber}
                                                                        type="number" value={field.massUpdateValue}
                                                                        variant="label-hidden" class="input-right"
                                                                        data-field-name={field.fieldName}
                                                                        data-index={index} onchange={massUpdateHandler}>
                                                                    </lightning-input>
                                                                    <lightning-input lwc:elseif={field.isCurrency}
                                                                        type="number" value={field.massUpdateValue}
                                                                        variant="label-hidden" class="input-right"
                                                                        data-field-name={field.fieldName}
                                                                        data-index={index} onchange={massUpdateHandler}>
                                                                    </lightning-input>
                                                                    <lightning-input lwc:elseif={field.isPercent}
                                                                        type="number" value={field.massUpdateValue}
                                                                        variant="label-hidden" class="input-right"
                                                                        formatter="percent-fixed"
                                                                        data-field-name={field.fieldName}
                                                                        data-index={index} onchange={massUpdateHandler}>
                                                                    </lightning-input>
                                                                    <!-- Picklist -->
                                                                    <template lwc:elseif={field.isPicklist}>
                                                                        <!-- normal picklist -->
                                                                        <lightning-select
                                                                            if:false={field.hasDependentPicklist}
                                                                            variant="label-hidden"
                                                                            value={field.massUpdateValue}
                                                                            options={field.pickListValues}
                                                                            onchange={massUpdateHandler}
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            data-field-dependancy="principal"
                                                                            class="slds-m-vertical--small">
                                                                        </lightning-select>

                                                                        <!-- dependent picklist -->
                                                                        <template lwc:if={field.hasDependentPicklist}>
                                                                            <template
                                                                                for:each={field.controlledByFields}
                                                                                for:item="controlledField"
                                                                                for:index="dependancyIndex">
                                                                                <div key={controlledField.controlledByName}
                                                                                    class="slds-m-vertical--small">
                                                                                    <lightning-select
                                                                                        label={controlledField.controlledByLabel}
                                                                                        options={controlledField.options}
                                                                                        onchange={massUpdateHandler}
                                                                                        data-field-name={controlledField.controlledByName}
                                                                                        data-index={index}
                                                                                        data-field-dependancy="controlledBy"
                                                                                        data-field-dependancy-index={dependancyIndex}
                                                                                        disabled={controlledField.disabled}>
                                                                                    </lightning-select>
                                                                                </div>
                                                                            </template>
                                                                        </template>
                                                                    </template>
                                                                    <!-- MultiPicklist -->
                                                                    <lightning-record-edit-form
                                                                        lwc:elseif={field.isMultiPicklist}
                                                                        object-api-name={initDataWrapper.gridSettingsManager.OBJECT_NAME}>
                                                                        <lightning-input-field
                                                                            value={field.massUpdateValue}
                                                                            variant="label-hidden"
                                                                            field-name={field.fieldName}
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            onchange={massUpdateHandler}>
                                                                        </lightning-input-field>
                                                                    </lightning-record-edit-form>
                                                                    <template lwc:elseif={field.isReference}>
                                                                        <lightning-select lwc:if={field.isRecordType}
                                                                            value={field.massUpdateValue}
                                                                            variant="label-hidden"
                                                                            options={field.pickListValues}
                                                                            data-field-name={field.fieldName}
                                                                            onchange={massUpdateHandler}
                                                                            data-index={index}>
                                                                        </lightning-select>
                                                                        <lightning-record-edit-form lwc:else
                                                                            onmouseenter={handleEnterHasDropDownElementSticky}
                                                                            object-api-name={initDataWrapper.gridSettingsManager.OBJECT_NAME}
                                                                            class="lookup">
                                                                            <lightning-input-field
                                                                                variant="label-hidden"
                                                                                value={field.massUpdateValue}
                                                                                field-name={field.fieldName}
                                                                                data-field-name={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input-field>
                                                                        </lightning-record-edit-form>
                                                                    </template>
                                                                    <template lwc:elseif={field.isUrl}>
                                                                        <lightning-input value={field.value}
                                                                            variant="label-hidden"
                                                                            if:false={field.hasFileInput}
                                                                            data-field-name={field.fieldName}
                                                                            data-index={index}
                                                                            onchange={massUpdateHandler}>
                                                                        </lightning-input>
                                                                    </template>
                                                                    <lightning-input lwc:elseif={field.isDate}

                            </table>
                        </div>
                    </div>
                    <!-- filter section -->
