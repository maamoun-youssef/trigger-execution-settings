<template>
    <template if:true={loading}>
        <div class="slds-spinner_container">
            <div class="slds-spinner_container greyBg">
                <div class="loader slds-spinner_container slds-align_absolute-center"></div>
            </div>
        </div>
    </template>
    <div class="slds-card">
        <div class="slds-grid slds-grid_align-end">
            <div class="slds-col save-button-container">
                <lightning-button class="slds-button slds-m-right_x-small" variant="brand" label={labels.LBL_Save}
                    onclick={handleSave}>
                </lightning-button>
                <!-- <button class="slds-button slds-button_neutral slds-m-right_x-small" onclick={handleSave}>
                    {labels.LBL_Save}
                </button> -->
            </div>
        </div>
        <div>
            <div>
                <div class="slds-media__body slds-p-around_x-small stickyHeader">
                    <div class="sectionTitle">
                        {labels.LBL_PRD_Stg_General_Settings}
                    </div>
                </div>
                <div class="section-m">
                    <div class="slds-m-vertical_medium definition-mode">
                        <div class="recordTypeContainer slds-m-top_medium" if:false={loading}>
                            <div class="label">
                                {labels.LBL_PRD_Stg_ProductRecordTypes_Phrase}
                            </div>
                            <div class="label">
                                {labels.productRecordTypesHelpText}
                            </div>
                        </div>
                    </div>
                    <div class="section-Container slds-m-top_medium" if:false={loading}>
                        <div class="section-label">
                        </div>
                        <div class="list-Container">
                            <lightning-dual-listbox name="recordTypes" variant="label-hidden"
                                value={productSettings.productRecordTypes} source-label={labels.LBL_Available}
                                selected-label={labels.LBL_Selected} options={productRecordTypesOptions}
                                onchange={handleFieldEdits} data-field="productRecordTypes" class="dual-list-w"
                                size="4"></lightning-dual-listbox>
                        </div>
                    </div>
                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.LBL_PRD_Stg_IsAutoNumberProductName_Phrase}
                        </div>
                        <div>
                            <lightning-input type="toggle" value={productSettings.isAutoNumberProductName} label=" "
                                variant="label-hidden" checked={productSettings.isAutoNumberProductName}
                                data-field="isAutoNumberProductName" onchange={handleFieldEdits}></lightning-input>
                        </div>
                    </div>

                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.isAutoNumberProductNameHelpText}
                        </div>
                        <div>
                            <lightning-input value={productSettings.autoNumberPrefix}
                                label={labels.autoNumberPrefixLabel} data-field="autoNumberPrefix"
                                onchange={handleFieldEdits}></lightning-input>
                            <p class="exampleClass">{labels.LBL_Example}: {productSettings.autoNumberPrefix}0000</p>
                        </div>
                    </div>
                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.LBL_PRD_Stg_MassProductImportSettings_Phrase}
                        </div>
                        <div class="slds-size--1-of-8">
                            <lightning-combobox variant="label-hidden" dropdown-alignment="auto"
                                value={productSettings.massProductImportSettings} options={importSettingsOptionsProduct}
                                onchange={handleFieldEdits}
                                data-field="massProductImportSettings">
                            </lightning-combobox>
                        </div>
                    </div>
                    <div class="add-breaks"> </div>
                </div>
            </div>
            <div>
                <div class="slds-media__body slds-p-around_x-small stickyHeader">
                    <div class="sectionTitle">
                        {labels.LBL_PRD_Stg_PriceList_Manager_Settings}
                    </div>
                </div>
                <div class="section-m">
                    <div class="recordTypeContainer slds-m-top_medium slds-m-vertical_large">
                        <div class="label">
                            {labels.LBL_PRD_Stg_PriceList_Grid_Settings_Phrase} <a href={gridSettingsLink}
                                target="_blank" class="grid-settings-link">{labels.LBL_Grid_Settings}</a>
                        </div>
                    </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label display-divs">
                            {labels.priceListManagerPLDGridLabel}
                            <div class="infoIcon display-divs">
                                <lightning-helptext content={labels.priceListManagerPLDGridHelpText}>
                                </lightning-helptext>
                                <section lwc:if={PLDInfoOpen} aria-describedby="dialog-body-id-110"
                                    aria-label="Dialog Title" class="infoPopover slds-popover slds-nubbin_left"
                                    role="dialog">
                                    <div class="slds-popover__body">
                                        <div class="slds-media">
                                            <div class="slds-media__body">
                                                <p>{labels.priceListManagerPLDGridHelpText}</p>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>
                        <div class="info-container-w">
                            <lightning-combobox name="priceListManagerPLDGrid" label=" " variant="label-hidden"
                                dropdown-alignment="auto" value={productSettings.priceListManagerPLDGrid}
                                options={PLDGridOptions} onchange={handleFieldEdits}
                                data-field="priceListManagerPLDGrid">
                            </lightning-combobox>
                        </div>
                    </div>
                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.isPriceListDataUpdatePGsLabel}
                        </div>
                        <div class="slds-col isPriceListDataUpdatePGsInput button-m">
                            <lightning-input type="toggle" value={productSettings.isPriceListDataUpdatePGs}
                                variant="label-hidden" checked={productSettings.isPriceListDataUpdatePGs}
                                data-field="isPriceListDataUpdatePGs" onchange={handleFieldEdits}></lightning-input>
                        </div>
                    </div>
                    <div class="recordTypeContainer slds-m-top_medium slds-m-vertical_large">
                        <div class="label">
                            {labels.isPriceListDataUpdatePGsHelpText}
                        </div>
                    </div>
                    <div class="add-breaks"> </div>
                </div>
            </div>
        </div>
    </div>
</template>
