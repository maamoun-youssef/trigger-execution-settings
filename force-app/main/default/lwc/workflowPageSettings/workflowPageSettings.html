<template>
    <template if:true={Loading}>
        <!-- <lightning-spinner variant="brand" size="large"></lightning-spinner> -->
        <div class="slds-spinner_container">
            <div class="loader slds-spinner_container slds-align--absolute-center">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </template>
    <div class="slds-p-around_none workflow-container">
        <div class="workflow-header">
            <div class="slds-grid slds-grid_vertical-align-center slds-p-vertical_small slds-p-horizontal_medium" style="background: #ffffff;">
                <div class="slds-col">
                    <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xxx-small" style="font-size: 0.65rem; letter-spacing: 0.05rem;">WORKFLOW PAGE</p>
                    <h1 class="slds-text-heading_medium slds-truncate" style="color: #008b9b; font-weight: 600;">
                        Paramètre de la Workflow Page
                    </h1>
                </div>
                <div class="slds-col slds-grow-none">
                    <div class="slds-button-group" role="group">
                        <button class="slds-button slds-button_neutral custom-btn-radius" onclick={handleCancel}>{labels.Cancel}</button>
                        <button class="slds-button slds-button_destructive custom-btn-radius" onclick={handleDelete}>{labels.LBL_Delete}</button>
                        <button class="slds-button slds-button_brand custom-btn-radius" onclick={handleSave}>{labels.LBL_Save}</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="workflow-body" style={_bodySize}>
            <lightning-tabset class="tabset">
                <lightning-tab label={labels.LBL_GeneralInformationTitle}>
                    <div class="custom-content-block" style={_tabContentSize}>
                    <!-- <div class="custom-teal-banner slds-p-vertical_small slds-p-horizontal_medium">
                        <h2 class="slds-text-heading_small slds-text-color_inverse" style="font-weight: bold; font-size: 1.15rem;">
                            {labels.LBL_GeneralInformationTitle}
                        </h2>
                    </div> -->
                    <div class="slds-p-around_medium" style="background: #ffffff;">
                        <p class="slds-text-color_weak slds-m-bottom_medium slds-text-title_italic" style="color: #6a6a6a;">
                            enter the template name and select the object it applies to
                        </p>
                        <div class="slds-p-bottom--medium">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-form slds-form_stacked">
                                        <div class="slds-grid slds-grid_vertical slds-m-bottom_x-small slds-m-left_x-small">
                                            <div class="slds-col slds-size_8-of-12">
                                                <lightning-input
                                                    label={labels.LBL_TemplateName}
                                                    value={instance.currentLayout.settings.label}
                                                    data-field="label" disabled={templateNameDisabled}
                                                    field-level-help={labels.LBL_TemplateName}
                                                    onchange={handlePageLayoutSettingsChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-bottom_x-small slds-m-left_x-small">
                                        <template lwc:if={isNewTemplate}>
                                            <div class="slds-col slds-size_8-of-12">
                                                <c-combo-box-input default-value={instance.currentLayout.settings.objectApiName}
                                                    label={labels.LBL_SelectObject}
                                                    options={objectsList}
                                                    onchange={handleChangeLayoutObject}
                                                    field-level-help="Object"
                                                    data-field="objectApiName">
                                                </c-combo-box-input>
                                                <!-- <div class="slds-is-relative">
                                                    <lightning-input
                                                        type="search"
                                                        label={labels.LBL_SelectObject}
                                                        field-level-help="Object"
                                                        data-field="objectApiName"
                                                        data-options="object"
                                                        value={searchKeys.objectSearchKey}
                                                        oninput={handleSearch}>
                                                    </lightning-input>
                                                    <template if:true={showObjectDropdown}>
                                                        <div lwc:if={objectsList.length} class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                            role="listbox">
                                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                                <template for:each={filteredObjectsList} for:item="searchResult">
                                                                    <li
                                                                        key={searchResult.value}
                                                                        class="slds-listbox__item"
                                                                        role="presentation"
                                                                        data-value={searchResult.value}
                                                                        data-label={searchResult.label}
                                                                        data-field="objectApiName"
                                                                        onclick={handleChangeLayoutObject}>
                                                                        <div
                                                                            class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                            role="option"
                                                                            data-value={searchResult.value}
                                                                            data-label={searchResult.label}
                                                                            data-field="objectApiName"
                                                                            onclick={handleChangeLayoutObject}>
                                                                            <span
                                                                                class="slds-media__body"
                                                                                data-value={searchResult.value}
                                                                                data-label={searchResult.label}
                                                                                data-field="objectApiName">
                                                                                <span
                                                                                    class="slds-truncate"
                                                                                    title={searchResult.label}
                                                                                    data-value={searchResult.value}
                                                                                    data-label={searchResult.label}
                                                                                    data-field="objectApiName">
                                                                                    {searchResult.label}
                                                                                </span>
                                                                            </span>
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div> -->
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div
                                                class="slds-m-left_x-small slds-grid slds-grid_vertical-align-center slds-wrap slds-color__text-gray-7"
                                                style="background-color: #e9e9e9; padding: 6px; border-radius: 32px;">
                                                <lightning-icon
                                                    icon-name="utility:orders"
                                                    size="xx-small"
                                                    class="slds-m-right_xx-small">
                                                </lightning-icon>
                                                <span class="slds-m-left_xx-small">
                                                    <strong>{instance.currentLayout.settings.objectApiName}</strong>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-form slds-form_stacked">
                                        <div class="slds-grid slds-grid_vertical slds-m-bottom_x-small slds-m-left_x-small">
                                            <div class="slds-col slds-size_8-of-12">
                                                <lightning-textarea
                                                    data-field="description" label={labels.LBL_AddDescription} 
                                                    field-level-help={labels.LBL_AddDescription}
                                                    onchange={handlePageLayoutSettingsChange}
                                                    value={instance.currentLayout.settings.description}>
                                                </lightning-textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-form slds-form_stacked">
                                        <div class="slds-grid slds-grid_vertical-align-end slds-m-bottom_x-small slds-m-left_x-small">
                                            <div class="slds-col slds-size_8-of-12">
                                                <lightning-combobox
                                                    label={labels.LBL_Theme}
                                                    value={instance.currentLayout.settings.theme}
                                                    options={themesList}
                                                    data-field="theme"
                                                    field-level-help={labels.LBL_TemplateName}
                                                    onchange={handlePageLayoutSettingsChange}>
                                                </lightning-combobox>
                                            </div>
                                            <div class="theme-color-preview slds-m-left_small slds-m-bottom_small" style={selectedThemeStyle} title={instance.currentLayout.settings.theme}>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-p-bottom--medium" style="float: inline-end;">
                                <lightning-button label={labels.LBL_AddSectionGroup} class="slds-m-around_xx-small slds-button button-mt"
                                    onclick={handleSectionGroupBtn} data-action="add" icon-name="utility:add" icon-position="left">
                                </lightning-button>
                            </div>
                            <div class="negoptim-tablesection slds-p-around_small">
                                <!-- Clean, borderless layout setup -->
                                <table class="table-base">
                                    <thead>
                                        <tr>
                                            <th class="col-icon"></th>
                                            <th class="col-medium" style="text-align:center;">{labels.LBL_Label}</th>
                                            <th class="col-medium" style="text-align:center;">{labels.LBL_Color}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template lwc:if={instance.currentLayout.settings.sectionGroupTab.length}>
                                            <template for:each={instance.currentLayout.settings.sectionGroupTab} for:item="btn" for:index="rowindex">
                                                <tr key={btn.key} class="custom-table-row">
                                                    <td class="td-icon-col">
                                                        <button class="row-delete-btn"
                                                                data-field="sectionGroupTab"
                                                                data-rowindex={rowindex}
                                                                data-action="delete"
                                                                data-stylevariant="sectionGroupTab"
                                                                onclick={handleDeleteItem}>
                                                            <lightning-icon icon-name="utility:delete" size="x-small" class="delete-icon-fill"></lightning-icon>
                                                        </button>
                                                    </td>
                                                    <td class="td-label-col">
                                                        <div class="search-input-container">
                                                            <lightning-input
                                                                value={btn.label}
                                                                data-rowindex={rowindex} 
                                                                data-type="label"
                                                                data-field="sectionGroupTab"
                                                                onchange={handlePageLayoutSettingsChange} 
                                                                variant="label-hidden"
                                                                class="pill-input padding-search">
                                                            </lightning-input>
                                                        </div>
                                                    </td>
                                                    <td class="td-label-col" style="text-align:center;">
                                                        <div class="search-input-container">
                                                            <lightning-input 
                                                                type="color"
                                                                value={btn.color}
                                                                data-rowindex={rowindex} 
                                                                data-type="color"
                                                                data-field="sectionGroupTab"
                                                                onchange={handlePageLayoutSettingsChange} 
                                                                variant="label-hidden"
                                                                class="pill-input padding-search">
                                                            </lightning-input>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <td colspan="4" class="slds-text-align_center slds-text-color_weak">
                                                No groups added yet
                                            </td>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                </lightning-tab>
                <template for:each={wrapperTabs} for:item="tab">
                    <lightning-tab key={tab.wrapper} label={tab.label}>
                        <div class="custom-content-block" style={_tabContentSize}>
                            <div class="slds-p-bottom_small slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col">
                                    <!-- <h2 class="slds-text-heading_small slds-text-color_inverse">
                                        {tab.label}
                                    </h2> -->
                                </div>
                                <div class="slds-col slds-grow-none">
                                    <lightning-button-menu label={labels.LBL_WorkflowPage_AddSection} variant="neutral"  icon-name="utility:add" data-wrapper={tab.wrapper} data-region={tab.region} onselect={handleAddSection}>
                                        <lightning-menu-item value="HeaderCard" label={labels.LBL_WorkFlowPage_MenuList_HeaderCard}></lightning-menu-item>
                                        <lightning-menu-item value="imageFields" label={labels.LBL_WorkFlowPage_MenuList_imageFields}></lightning-menu-item>
                                        <lightning-menu-item value="fieldGroup" label={labels.LBL_WorkFlowPage_MenuList_fieldGroup}></lightning-menu-item>
                                        <lightning-menu-item value="actionBar" label={labels.LBL_WorkFlowPage_MenuList_actionBar}></lightning-menu-item>
                                        <lightning-menu-item value="Component" label={labels.LBL_WorkFlowPage_MenuList_Component}></lightning-menu-item>
                                        <lightning-menu-item value="tabset" label={labels.LBL_WorkFlowPage_MenuList_tabset}></lightning-menu-item>
                                        <lightning-menu-item value="statusCard" label={labels.LBL_WorkFlowPage_MenuList_statusCard}></lightning-menu-item>
                                        <lightning-menu-item value="TimelineCard" label={labels.LBL_WorkFlowPage_MenuList_TimelineCard}></lightning-menu-item>
                                        <lightning-menu-item value="taskList" label={labels.LBL_WorkFlowPage_MenuList_taskList}></lightning-menu-item>
                                        <lightning-menu-item value="AgregatesCard" label={labels.LBL_WorkFlowPage_MenuList_AgregatesCard}></lightning-menu-item>
                                    </lightning-button-menu>
                                </div>
                            </div>
                            <div class="custom-fields-body"> 
                                <div class="sections-stack">
                                    <lightning-accordion allow-multiple-sections-open>
                                        <template for:each={tab.sections} for:item="section" for:index="index">
                                            <div
                                                key={section.containerKey}
                                                draggable="true"
                                                class="custom-draggable-wrapper"
                                                data-sectionindex={section.sectionIndex}
                                                data-wrapper={tab.wrapper}
                                                data-index={index}
                                                ondragstart={handleDragStart}
                                                ondragover={handleDragOver}
                                                ondrop={handleDrop}>
                                                <div class="drag-hover-indicator" aria-hidden="true">
                                                    <lightning-icon 
                                                        icon-name="utility:drag_and_drop" 
                                                        size="xx-small" 
                                                        variant="weak">
                                                    </lightning-icon>
                                                </div>
                                            <lightning-accordion-section key={section.containerKey} name={section.sectionIndex} label={section.sectionWrapper.title} class="customAccordion">
                                                <lightning-button-menu
                                                    slot="actions"
                                                    alternative-text="Section Actions"
                                                    icon-size="x-small"
                                                    menu-alignment="right"
                                                    data-sectionindex={section.sectionIndex}
                                                    data-wrapper={tab.wrapper}
                                                    data-stylevariant="section"
                                                    data-wrapperindex={index}
                                                    onselect={handleSectionMenu}>
                                                    <lightning-menu-item
                                                        value="settings"
                                                        label="Settings">
                                                    </lightning-menu-item>
                                                    <lightning-menu-item
                                                        value="delete"
                                                        label="Delete">
                                                    </lightning-menu-item>
                                                </lightning-button-menu>
                                                        <template if:true={section.isFieldGroup}>
                                                           <div class="slds-grid slds-gutters">
                                                                <div class="slds-col slds-size_1-of-2">
                                                                    <lightning-input
                                                                        type="text"
                                                                        label={labels.LBl_PageLayoutSettings_SectionTitle}
                                                                        value={section.sectionWrapper.title}
                                                                        onchange={handlePageLayoutSettingsChange}
                                                                        data-sectionindex={section.sectionIndex}
                                                                        data-wrapper={tab.wrapper}
                                                                        data-wrapperindex={index}
                                                                        data-field="title"
                                                                        field-level-help={labels.LBl_PageLayoutSettings_SectionTitle}>
                                                                    </lightning-input>
                                                                </div>
                                                                <div class="slds-col slds-size_1-of-2">
                                                                    <lightning-combobox
                                                                        value={section.sectionWrapper.sectionGroupTab}
                                                                        label={labels.LBl_PageLayoutSettings_SectionGroup}
                                                                        data-sectionindex={section.sectionIndex}
                                                                        data-wrapper={tab.wrapper}
                                                                        data-wrapperindex={index}
                                                                        data-field="sectionGroupTab"
                                                                        options={sectionsGroupOptions}
                                                                        onchange={handlePageLayoutSettingsChange}
                                                                        class="comboBox">
                                                                    </lightning-combobox>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div class="section-label header-title slds-grid slds-grid_vertical-align-center slds-p-bottom_small">
                                                                    {labels.LBL_EditMode}
                                                                    <lightning-helptext content={labels.LBL_PageLayoutSettings_EditModeHelpText}></lightning-helptext>
                                                                </div>
                                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                                    <div class="slds-col slds-size_1-of-12">
                                                                        <lightning-input
                                                                            type="toggle"
                                                                            checked={section.wrapper.isFlowMode}
                                                                            onchange={handlePageLayoutFieldsGroupChange}
                                                                            message-toggle-active={labels.LBL_EditModeFlow}
                                                                            message-toggle-inactive={labels.LBL_EditModeManual}
                                                                            data-sectionindex={section.sectionIndex} 
                                                                            data-wrapper={tab.wrapper}
                                                                            data-wrapperindex={index} 
                                                                            data-field="isFlowMode"
                                                                            variant="label-hidden">
                                                                        </lightning-input>
                                                                    </div>
                                                                    <div class="slds-col slds-size_4-of-12 flow-combobox-wrapper">
                                                                        <!-- <lightning-combobox
                                                                            if:true={section.wrapper.isFlowMode}
                                                                            value={section.wrapper.actions.redirectionValue}
                                                                            data-sectionindex={section.sectionIndex} 
                                                                            data-wrapper={tab.wrapper}
                                                                            data-wrapperindex={index} 
                                                                            data-field="actions"
                                                                            data-type="redirectionValue"
                                                                            options={screenFlowsList}
                                                                            onchange={handlePageLayoutFieldsGroupChange}
                                                                            class="comboBox"
                                                                            variant="label-hidden">
                                                                        </lightning-combobox> -->
                                                                        <c-combo-box-input default-value={section.wrapper.actions.redirectionValue}
                                                                            if:true={section.wrapper.isFlowMode}
                                                                            data-sectionindex={section.sectionIndex} 
                                                                            data-wrapper={tab.wrapper}
                                                                            data-wrapperindex={index} 
                                                                            data-field="actions"
                                                                            data-type="redirectionValue"
                                                                            options={screenFlowsList}
                                                                            onchange={handlePageLayoutFieldsGroupChange}
                                                                            class="comboBox"
                                                                            variant="label-hidden">
                                                                        </c-combo-box-input>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div>
                                                                    <div class="slds-m-top_medium slds-size--1-of-1 slds-grid slds-grid_vertical slds-m-top_medium">
                                                                        <div class="section-label header-title header-title"> {labels.LBL_HeaderField} <lightning-helptext content={labels.LBL_PageLayoutSettings_DisplayedHeaderFieldHelpText}></lightning-helptext></div>
                                                                        <div class="slds-box slds-m-top_small slds-size--1-of-4 header-field">
                                                                            <!-- Field Name -->
                                                                            <!-- <lightning-combobox label={labels.LBL_FieldName}
                                                                                value={section.wrapper.header.fieldName} options={instance.fieldNameOptions}
                                                                                data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index} 
                                                                                placeholder="" onchange={handlePageLayoutFieldsGroupChange} data-field="header" data-type="fieldName">
                                                                            </lightning-combobox> -->
                                                                            <c-combo-box-input
                                                                                label={labels.LBL_FieldName}
                                                                                options={instance.fieldNameOptions} default-value={section.wrapper.header.fieldName}
                                                                                data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index} 
                                                                                onchange={handlePageLayoutFieldsGroupChange} data-field="header" data-type="fieldName">
                                                                            </c-combo-box-input>
                                                                            <!-- Mandatory -->
                                                                            <div>
                                                                                <lightning-input type="checkbox" label={labels.LBL_Mandatory}
                                                                                    onchange={handlePageLayoutFieldsGroupChange} disabled={section.wrapper.header.isReadOnly}
                                                                                    data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index}
                                                                                    checked={section.wrapper.header.isMandatory} data-field="header" data-type="isMandatory">
                                                                                </lightning-input>
                                                                                <!-- Read-Only -->
                                                                                <lightning-input type="checkbox" label={labels.LBL_ReadOnly}
                                                                                    class="slds-m-top_large"
                                                                                    onchange={handlePageLayoutFieldsGroupChange} disabled={section.wrapper.header.isMandatory}
                                                                                    data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index}
                                                                                    checked={section.wrapper.header.isReadOnly} data-field="header" data-type="isReadOnly">
                                                                                </lightning-input>
                                                                                <lightning-input type="checkbox" label='Standard'
                                                                                    class="slds-m-top_large"
                                                                                    onchange={handlePageLayoutFieldsGroupChange}
                                                                                    data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index}
                                                                                    checked={section.wrapper.header.standard} data-field="header" data-type="standard">
                                                                                </lightning-input>
                                                                                <template lwc:if={isRecordPage}>
                                                                                    <lightning-input type="checkbox" label={labels.LBL_PageLayout_StickyBar}
                                                                                        class="slds-m-top_large"
                                                                                        onchange={handlePageLayoutFieldsGroupChange}
                                                                                        data-sectionindex={section.sectionIndex} data-wrapper={tab.wrapper} data-wrapperindex={index}
                                                                                        checked={section.wrapper.header.stickyBare} data-field="header" data-type="stickyBare">
                                                                                    </lightning-input>
                                                                                </template>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <!-- Rows Configuration Header -->
                                                                <!-- Header -->
                                                                <div class="slds-m-bottom_small slds-m-top_small">
                                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                                            <div class="section-label header-title">
                                                                                {labels.LBL_RowsPerTemp}
                                                                            </div>
                                                                            <lightning-helptext
                                                                                class="slds-m-left_x-small custom-helptext"
                                                                                content={labels.LBL_PageLayoutSettings_RowPerTemplateHelpText}>
                                                                            </lightning-helptext>
                                                                        </div>
                                                                        <lightning-button
                                                                            label={labels.LBL_PageLayoutSettings_AddRow}
                                                                            icon-name="utility:add"
                                                                            variant="neutral"
                                                                            class="custom-button"
                                                                            data-sectionindex={section.sectionIndex} 
                                                                            data-wrapper={tab.wrapper}
                                                                            data-wrapperindex={index}
                                                                            data-field="fields"
                                                                            data-action="add"
                                                                            onclick={handleRowsChange}>
                                                                        </lightning-button>
                                                                    </div>
                                                                </div>
                                                                <template for:each={section.wrapper.fieldsWrapper} for:item="row">
                                                                    <div key={row.rowKey} class="slds-box slds-m-bottom_small custom-row-container header-field">
                                                                        <!-- Header -->
                                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                                <div data-rowindex={row.rowKey} data-action="toggle" data-sectionindex={section.sectionIndex}
                                                                                    data-wrapper={tab.wrapper} data-wrapperindex={index}
                                                                                    onclick={handleRowsChange} style="cursor:pointer;" class="slds-grid slds-grid_vertical-align-center slds-m-top_xxx-small">
                                                                                    <template lwc:if={row.expanded}>
                                                                                        <lightning-icon
                                                                                            icon-name="utility:chevrondown"
                                                                                            size="small">
                                                                                        </lightning-icon>
                                                                                    </template>
                                                                                    <template lwc:else>
                                                                                        <lightning-icon
                                                                                            icon-name="utility:chevronright"
                                                                                            size="small">
                                                                                        </lightning-icon>
                                                                                    </template>
                                                                                </div>
                                                                                <div class="row-number-circle">
                                                                                    {row.rowNumber}
                                                                                </div>
                                                                                <span class="slds-text-title_bold slds-m-left_small">
                                                                                    Row {row.rowNumber}
                                                                                </span>
                                                                            </div>
                                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                                <span class="slds-text-title_bold slds-m-right_medium">
                                                                                    {labels.LBL_FieldsPerRow}
                                                                                </span>
                                                                                <div class="slds-m-right_large slds-m-top_x-small" style="width:200px;">

                    <button class="slds-button slds-button_brand slds-m-left_small" onclick={handleConfirm}>
                        {modalConfig.confirmLabel}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
