<template>
    <div class="slds-card mainContainer">
        <div class="slds-page-header pageHeader">
            <template if:false={isLoading}>
                <!-- Page Header -->
                <div class="slds-page-header__row slds-p-top--medium slds-p-left--medium">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure slds-align_absolute-center">
                                <lightning-icon icon-name="standard:change_request"
                                    alternative-text={labels.LBL_Matrix_Comparator_Title}
                                    title={labels.LBL_Matrix_Comparator_Title} size="medium"></lightning-icon>
                            </div>
                            <div lwc:if={hasNoData} class="slds-media__body ">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h1>
                                            <span class="headerTitle slds-page-header__title slds-truncate"
                                                title={labels.LBL_Matrix_Comparator_Title}>
                                                {labels.LBL_Matrix_Comparator_Title} </span>
                                        </h1>
                                    </div>
                                </div>
                            </div>
                            <div lwc:else class="slds-media__body">
                                <p class="slds-text-title slds-line-height_reset">
                                    {labels.LBL_Matrix_Comparator_Title}
                                </p>
                                <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
                                    <template if:false={isDataLoading}>{title}</template>
                                </h1>
                            </div>
                        </div>
                    </div>
                    <div class="slds-page-header__col-actions slds-align-bottom slds-p-right--medium">
                        <div class="slds-page-header__controls">
                            <div if:false={isLoading} class="slds-page-header__control slds-grid">
                                <template if:false={searched}>
                                    <button class="slds-button slds-button_neutral slds-m-left--x-small"
                                        onclick={handleSearch}>{labels.LBL_Search}</button>
                                </template>
                                <template if:false={hasNoData}>
                                    <lightning-button class="slds-button slds-m-around_xx-small" variant="border-filled"
                                        label={labels.LBL_Cancel} onclick={handleCancel}></lightning-button>
                                    <lightning-button class="slds-button slds-m-around_xx-small" variant="brand"
                                        label={labels.LBL_Save} onclick={handleSave}></lightning-button>
                                    <lightning-button-icon icon-name="doctype:excel" variant="border-filled"
                                        class="slds-button slds-button-icon slds-m-left--x-small"
                                        onclick={handleExportExcel}>
                                    </lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:hierarchy" variant="border-filled"
                                        class="slds-button slds-button-icon slds-m-left--x-small"
                                        onclick={handleShowTotal}>
                                    </lightning-button-icon>
                                </template>
                                <template if:true={searched}>
                                    <lightning-button-icon onclick={toggleFilter} icon-name="utility:filterList"
                                        variant="border-filled"
                                        class="slds-button slds-button-icon slds-m-left--x-small"
                                        alternative-text={labels.LBL_Filter} title={labels.LBL_Filter}
                                        size="medium"></lightning-button-icon>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-details" style="padding: 0;">
                        <ul if:false={searched} class="slds-page-header__detail-row pm0">
                            <li class="slds-page-header__detail-block pr0 slds-m-around--medium">
                                <div class="slds-text-title filterInput" title={labels.BusinessUnit__c.Format__c}>
                                    <c-neg-optim-custom-picklist data-name={API_NAMES.BusinessUnit__c.Format__c}
                                        placeholder={labels.BusinessUnit__c.Format__c}
                                        selected-values={selectedFormatsJSON} options={formatOriginOptions}
                                        selected-event={Events.handleChangeFormat}
                                        data-field={API_NAMES.BusinessUnit__c.Format__c}
                                        onhandlechangeformat={handleChangeFormat}>
                                    </c-neg-optim-custom-picklist>
                                </div>
                            </li>
                            <li class="slds-m-left--medium pr0 slds-m-around--medium">
                                <div class="slds-text-title filterInput" title={labels.LBL_Client}>
                                    <lightning-record-picker class="requiredField" label={labels.LBL_Client}
                                        filter={BUfilter} variant="label-hidden" required value={filterWrapper.buTarget}
                                        placeholder={labels.LBL_Client} onchange={handleChangeBU}
                                        object-api-name={API_NAMES.BusinessUnit__c.objectApiName}>
                                    </lightning-record-picker>
                                </div>
                            </li>
                            <li class="slds-m-left--medium pr0 slds-m-around--medium">
                                <div class="slds-text-title filterInput" title={labels.Assortment__c.Hierarchy__c}>
                                    <lightning-record-picker class="requiredField"
                                        label={labels.Assortment__c.Hierarchy__c} variant="label-hidden" required
                                        value={filterWrapper.orgaHe} placeholder={labels.Assortment__c.Hierarchy__c}
                                        onchange={handleChangeHE}
                                        object-api-name={API_NAMES.Hierarchy__c.objectApiName}>
                                    </lightning-record-picker>
                                </div>
                            </li>
                            <li class="slds-m-left--medium pr0 slds-m-around--medium">
                                <div class="slds-text-title filterInput" title={labels.Assortment__c.Year__c}>
                                    <lightning-input class="requiredField" type="number" value={filterWrapper.year}
                                        placeholder={labels.Assortment__c.Year__c} variant="label-hidden"
                                        onchange={handleChangeYear} required>
                                    </lightning-input>
                                </div>
                            </li>
                            <li class="slds-m-left--medium pr0 slds-m-around--medium">
                                <lightning-button-group>
                                    <template for:each={recordTypeOptions} for:item="optionRT">
                                        <lightning-button key={optionRT.value} label={optionRT.label} variant="brand"
                                            onclick={handleSelectRecordType} data-recordtype={optionRT.value}
                                            if:true={optionRT.isSelected}></lightning-button>
                                        <lightning-button key={optionRT.value} label={optionRT.label} variant="neutral"
                                            onclick={handleSelectRecordType} data-recordtype={optionRT.value}
                                            if:false={optionRT.isSelected}></lightning-button>
                                    </template>
                                </lightning-button-group>
                            </li>
                        </ul>
                    </div>
                </div>
                <template if:false={hasNoData}>
                    <div if:true={searched} class="slds-p-left--medium slds-text-title_bold slds-p-bottom--xx-small">
                        <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"
                            class="slds-m-right_x-small slds-align-middle">
                        </lightning-icon>
                        {labels.LBL_Matrix_Comparator_WarningMessage}
                    </div>
                </template>
            </template>
        </div>
        <template lwc:if={searched}>
            <template if:true={isLoading}>
                <div class="slds-spinner_container spinnerDiv">
                    <div class="loader slds-spinner_container slds-align--absolute-center">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </template>
            <template if:false={isLoading}>
            <div class="slds-grid main-panel" if:false={loading}>
                <template lwc:if={isDataLoading}>
                    <div class="noDataText loadingContainer">
                        <div class="slds-spinner_container spinnerDiv">
                            <div class="loader slds-spinner_container slds-align--absolute-center">
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </template>
                <template lwc:elseif={hasNoData}>
                    <div class="slds-col noDataText slds-text-align--center" style={tableStyleHeight}>
                        {labels.LBL_No_Item_To_Display}
                    </div>
                </template>               
                <div if:false={hasNoData} class="slds-col slds-scrollable">
                    <table if:false={isDataLoading}
                        class="main-table slds-table slds-table_bordered slds-table_col-bordered slds-border--left slds-border--right slds-no-row-hover">
                        <thead>
                            <tr class="slds-border_top slds-border_bottom sticky-thead header-row-1">
                                <!-- PRODUCT FIELD HEADERS -->
                                <template for:each={displayedProductFields} for:item="field">
                                    <th key={field.fieldName} rowspan="2" class="color1 medWidth stickyHeader">
                                        <div class="headerTds slds-text-align--center">
                                            {field.fieldLabel}
                                        </div>
                                    </th>
                                </template>
                                <th colspan="2" class="color2 stickyHeader slds-border--right">
                                    <div class="headerTds slds-text-align--center">
                                        {labels.LBL_Assortment_Conso}
                                    </div>
                                </th>
                                <template for:each={assortmentList} for:item="assortment">
                                        <th key={assortment.Id} class="stickyHeader slds-border_right color3"
                                            colspan="6" style="white-space:unset;">
                                        <div class="headerTds slds-text-align--center slds-grid"
                                            style="place-content: center;">
                                            <a style="place-content: center;color: white" href={assortment.link}
                                                target="_blank">
                                                {assortment.Name} - {assortment.status}
                                            </a>
                                            <lightning-button-icon if:false={assortment.validateDisabled}
                                                class="slds-m-left--medium"
                                                    style="--slds-c-icon-color-foreground: white;"
                                                    label={labels.Validate} variant="bare" data-id={assortment.Id}
                                                    icon-name="utility:approval" onclick={handleValidate}>
                                            </lightning-button-icon>
                                        </div>
                                    </th>
                                </template>
                            </tr>
                            <tr>
                                <!-- conso fields -->
                                <template for:each={displayedASDConsoFields} for:item="field">
                                        <th key={field.fieldName}
                                            class="color2 medWidth stickyHeader slds-border--right">
                                        <div class="headerTds slds-text-align--center">
                                            {field.fieldLabel}
                                        </div>
                                    </th>
                                </template>
                                <!-- Detail Fields -->
                                <template for:each={assortmentList} for:item="assortment">
                                    <template for:each={displayedASDFields} for:item="field">
                                        <th key={assortment.Id} class="stickyHeader color3 medWidth">
                                            <div class="headerTds slds-text-align--center">
                                                {field.fieldLabel}
                                            </div>
                                        </th>
                                    </template>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={categoryWrapperList} for:item="categoryWrap" for:index="index">
                                <tr key={categoryWrap.Id} class="subTotalRow">
                                    <td>
                                        <a href={categoryWrap.link} target="_blank" style="color: white">
                                            {categoryWrap.Name}
                                        </a>
                                    </td>
                                    <td></td>
                                    <td></td>
                                    <template for:each={categoryWrap.consoFields} for:item="field">
                                        <td class="slds-text-align--right" key={categoryWrap.Id}>
                                            <lightning-formatted-number minimum-fraction-digits={field.scale}
                                                maximum-fraction-digits={field.scale} value={field.fieldValue}>
                                            </lightning-formatted-number>
                                        </td>
                                    </template>
                                    <template for:each={categoryWrap.subTotalList} for:item="subTotal">
                                        <td key={subTotal.Id}></td>
                                        <td key={subTotal.Id}></td>
                                        <template for:each={subTotal.consoFields} for:item="field">
                                            <td class="slds-text-align--right" key={subTotal.Id}>
                                                <lightning-formatted-number minimum-fraction-digits={field.scale}
                                                    maximum-fraction-digits={field.scale} value={field.fieldValue}>
                                                </lightning-formatted-number>
                                            </td>
                                        </template>
                                        <td key={subTotal.Id}></td>
                                    </template>
                                </tr>
                                <template for:each={categoryWrap.productWrapperList} for:item="productWrap"
                                    for:index="index">
                                    <tr key={productWrap.Id} data-id={productWrap.Id}>
                                        <template for:each={productWrap.fields} for:item="field">
                                            <template lwc:if={field.isProductName}>
                                                <td key={field.fieldName} class="slds-text-align--left whiteBg">
                                                    <a href={productWrap.link} target="_blank">
                                                        {productWrap.Name}
                                                    </a>
                                                </td>
                                            </template>
                                            <template lwc:elseif={field.isProductInnoRanking}>
                                                <td key={field.fieldName}
                                                    class="slds-text-align--center whiteBg  slds-border--right">
                                                    {productWrap.ProductInnoRanking}
                                                </td>
                                            </template>
                                            <template lwc:elseif={field.isProductCode}>
                                                <td key={field.fieldName} class="slds-text-align--left whiteBg">
                                                    {field.fieldValue}
                                                </td>
                                            </template>
                                            <template lwc:else>
                                                <td key={field.fieldName} class="slds-text-align--center whiteBg">
                                                    {field.fieldValue}
                                                </td>
                                            </template>
                                        </template>
                                        <template for:each={productWrap.consoFields} for:item="field">
                                            <td key={field.fieldName} class="slds-text-align--right consoCell">
                                                <lightning-formatted-number minimum-fraction-digits={field.scale}
                                                    maximum-fraction-digits={field.scale} value={field.fieldValue}>
                                                </lightning-formatted-number>
                                            </td>
                                        </template>
                                        <template for:each={productWrap.detailWrapperList} for:item="detailWrap"
                                            for:index="index">
                                            <template lwc:if={detailWrap.isEmpty}>
                                                <td colspan="6"
                                                    class="slds-text-align--center slds-border--left detailCell"
                                                    key={detailWrap.Id}>
                                                    <span class="blankCell"></span>
                                                </td>
                                            </template>
                                            <template lwc:else>
                                                <template for:each={detailWrap.fields} for:item="field"
                                                    for:index="fieldIndex">
                                                    <template lwc:if={field.isProductCluster}>
                                                        <td class="slds-text-align--center slds-border--left detailCell"
                                                            key={detailWrap.Id}>
                                                            <div class="slds-select_container">
                                                                <select class="slds-select"
                                                                    data-field={API_NAMES.AssortmentDetail__c.ProductCluster__c}
                                                                    data-id={detailWrap.Id}
                                                                    data-product={productWrap.Id}
                                                                    data-buid={detailWrap.buTargetId}
                                                                    onchange={handleFieldEdits}>
                                                                    <template
                                                                        for:each={detailWrap.clustersSelectOptions}
                                                                        for:item="option">
                                                                        <template lwc:if={option.isDisabled}>
                                                                            <option value={option.value}
                                                                                key={option.value} disabled>
                                                                                {option.label} </option>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <option value={option.value}
                                                                                data-cluster-name={option.clusterName}
                                                                                data-index={option.index}
                                                                                key={option.value}
                                                                                selected={option.selected}>
                                                                                {option.label} </option>
                                                                        </template>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </td>
                                                    </template>
                                                    <template lwc:elseif={field.isProductLifeStatusAss}>
                                                        <td class="slds-text-align--center detailCell"
                                                            key={detailWrap.Id}>
                                                            <div class="slds-select_container">
                                                                <select class="slds-select"
                                                                    data-field={API_NAMES.AssortmentDetail__c.ProductLifeStatusAss__c}
                                                                    data-id={detailWrap.Id}
                                                                    data-product={productWrap.Id}
                                                                    onchange={handleFieldEdits}>
                                                                    <template
                                                                        for:each={detailWrap.productLifeMapOptionsList}
                                                                        for:item="option">
                                                                        <template lwc:if={option.isDisabled}>
                                                                            <option value={option.value}
                                                                                key={option.value}
                                                                                selected={option.selected} disabled>
                                                                                {option.label} </option>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <option value={option.value}
                                                                                key={option.value}
                                                                                selected={option.selected}>
                                                                                {option.label}
                                                                            </option>
                                                                        </template>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </td>
                                                    </template>
                                                    <template lwc:else>
                                                            <td class="detailCell" key={detailWrap.Id}
                                                                style={field.style}>
                                                            <template lwc:if={field.isInput}>
                                                                <lightning-input lwc:if={field.isText}
                                                                        data-id={detailWrap.Id}
                                                                        data-field={field.fieldName}
                                                                        onchange={handleFieldEdits}
                                                                        variant="label-hidden" value={field.fieldValue}>
                                                                </lightning-input>
                                                                <lightning-input lwc:elseif={field.isNumberField}
                                                                    type="number" data-id={detailWrap.Id}
                                                                    data-field={field.fieldName}
                                                                        onchange={handleFieldEdits}
                                                                        variant="label-hidden" step={field.step}
                                                                        value={field.fieldValue} class="input-right">
                                                                </lightning-input>
                                                                <lightning-record-edit-form
                                                                    lwc:elseif={field.isReference}
                                                                    object-api-name={API_NAMES.AssortmentDetail__c.objectApiName}
                                                                    record-id={detailWrap.Id}>
                                                                        <lightning-input-field
                                                                            field-name={field.fieldName}
                                                                        data-id={detailWrap.Id}
                                                                        data-field={field.fieldName}
                                                                        onchange={handleFieldEdits}
                                                                            variant="label-hidden"
                                                                            value={field.fieldValue}>
                                                                    </lightning-input-field>
                                                                </lightning-record-edit-form>
                                                                <lightning-input lwc:elseif={field.isBoolean}
                                                                    type="checkbox" variant="label-hidden"
                                                                    class="input-center" data-isboolean="true"
                                                                        data-id={detailWrap.Id}
                                                                        data-field={field.fieldName}
                                                                    onchange={handleFieldEdits}
                                                                    checked={field.fieldValue}>
                                                                </lightning-input>
                                                                <select lwc:elseif={field.isPicklist}
                                                                        onchange={handleFieldEdits}
                                                                        data-id={detailWrap.Id}
                                                                    data-field={field.fieldName}>
                                                                    <template for:each={field.picklistOptions}
                                                                        for:item="option">
                                                                        <template lwc:if={option.isDisabled}>
                                                                            <option key={option.value}
                                                                                value={option.value}
                                                                                    selected={option.isSelected}
                                                                                    disabled>
                                                                                {option.label}
                                                                            </option>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <option key={option.value}
                                                                                value={option.value}
                                                                                selected={option.isSelected}>
                                                                                {option.label}
                                                                            </option>
                                                                        </template>
                                                                    </template>
                                                                </select>
                                                                    <lightning-input lwc:elseif={field.isDate}
                                                                        type="date" data-id={detailWrap.Id}
                                                                        data-field={field.fieldName}
                                                                        onchange={handleFieldEdits}
                                                                        variant="label-hidden" value={field.fieldValue}>
                                                                </lightning-input>
                                                            </template>
                                                            <template lwc:else>
                                                                    <lightning-formatted-number
                                                                        lwc:if={field.isNumberField}
                                                                    maximum-fraction-digits={field.scale}
                                                                    minimum-fraction-digits={field.scale}
                                                                    value={field.fieldValue}>
                                                                </lightning-formatted-number>
                                                                <template lwc:elseif={field.isText}>
                                                                    <template lwc:if={field.isHTMLFormatted}>
                                                                        <lightning-formatted-rich-text
                                                                            value={field.fieldValue}>
                                                                        </lightning-formatted-rich-text>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        {field.fieldValue}
                                                                    </template>
                                                                </template>
                                                                <template lwc:elseif={field.isReference}>
                                                                    {field.fieldValue}
                                                                </template>
                                                                <lightning-input lwc:elseif={field.isBoolean}
                                                                    type="checkbox" class="input-center"
                                                                        variant="label-hidden"
                                                                        checked={field.fieldValue} disabled>
                                                                </lightning-input>
                                                                    <lightning-formatted-date-time
                                                                        lwc:elseif={field.isDate}
                                                                    value={field.fieldValue} year="numeric"
                                                                    month="2-digit" day="2-digit">
                                                                </lightning-formatted-date-time>
                                                                <lightning-formatted-date-time
                                                                    lwc:elseif={field.isDateTime}
                                                                    value={field.fieldValue} year="numeric"
                                                                    month="2-digit" day="2-digit" hour="2-digit"
                                                                    minute="2-digit">
                                                                </lightning-formatted-date-time>
                                                                <template lwc:else>
                                                                    {field.fieldValue}
                                                                </template>
                                                            </template>
                                                        </td>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>            
                <div class="filter-section slds-col slds-hide" style="float: right; z-index:7;">
                    <div id="filter-panel" style="height: 100%;" class="slds-grid slds-no-flex">
                        <div class="slds-panel slds-size_medium slds-panel_docked slds-panel_docked-right slds-grid slds-grid_vertical"
                            style="overflow: unset;">
                            <div class="slds-panel__header filterPanelHeader">
                                <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate"
                                    title={labels.LBL_Filter}>
                                    {labels.LBL_Filter}
                                </h2>
                                    <lightning-button-icon variant="bare" icon-name="utility:close"
                                        onclick={toggleFilter}>
                                </lightning-button-icon>
                            </div>
                            <div class="slds-col slds-scrollable filterPanelBody">
                                <div class="slds-grid slds-wrap slds-p-around_small">
                                    <div class="slds-list_vertical slds-list_vertical-space slds-size_1-of-1">
                                        <div class="slds-item">
                                            <lightning-combobox label={labels.LBL_Number_Of_Fixed_Columns}
                                                options={fixedColumnsOptions} value={nbOfFixedColumns}
                                                onchange={setnumberOfFixedColumns}>
                                            </lightning-combobox>
                                        </div>
                                        <div title={labels.BusinessUnit__c.Format__c}>
                                            <p>{labels.BusinessUnit__c.Format__c}</p>
                                                <c-neg-optim-custom-picklist
                                                    data-name={API_NAMES.BusinessUnit__c.Format__c}
                                                placeholder={labels.BusinessUnit__c.Format__c}
                                                selected-values={selectedFormatsJSON} options={formatOriginOptions}
                                                selected-event={Events.handleChangeFormat}
                                                data-field={API_NAMES.BusinessUnit__c.Format__c}
                                                onhandlechangeformat={handleChangeFormat}>
                                            </c-neg-optim-custom-picklist>
                                        </div>
                                        <div title={labels.LBL_Client}>
                                                <lightning-record-picker class="requiredField" label={labels.LBL_Client}
                                                    filter={BUfilter} required value={filterWrapper.buTarget}
                                                    placeholder={labels.LBL_Client} onchange={handleChangeBU}
                                                object-api-name={API_NAMES.BusinessUnit__c.objectApiName}>
                                            </lightning-record-picker>
                                        </div>
                                        <div title={labels.Assortment__c.Hierarchy__c}>
                                            <lightning-record-picker class="requiredField"
                                                label={labels.Assortment__c.Hierarchy__c} required
                                                value={filterWrapper.orgaHe}
                                                placeholder={labels.Assortment__c.Hierarchy__c}
                                                onchange={handleChangeHE}
                                                object-api-name={API_NAMES.Hierarchy__c.objectApiName}>
                                            </lightning-record-picker>
                                        </div>
                                        <div class=" filterInput" title={labels.Assortment__c.Year__c}>
                                            <lightning-input class="requiredField" type="number"
                                                value={filterWrapper.year} label={labels.Assortment__c.Year__c}
                                                    placeholder={labels.Assortment__c.Year__c}
                                                    onchange={handleChangeYear} required></lightning-input>
                                        </div>
                                        <div class="slds-m-top--medium"
                                            style="white-space:nowrap;min-width:max-content;">
                                            <lightning-button-group>
                                                <template for:each={recordTypeOptions} for:item="optionRT">
                                                    <lightning-button key={optionRT.value} label={optionRT.label}
                                                        variant="brand" onclick={handleSelectRecordType}
                                                        data-recordtype={optionRT.value}
                                                        if:true={optionRT.isSelected}></lightning-button>
                                                    <lightning-button key={optionRT.value} label={optionRT.label}
                                                        variant="neutral" onclick={handleSelectRecordType}
                                                        data-recordtype={optionRT.value}
                                                        if:false={optionRT.isSelected}></lightning-button>
                                                </template>
                                            </lightning-button-group>
                                        </div>
                                        <div class="slds-m-top--x-small">
                                                <lightning-input type="text" label={labels.LBL_Global_Search}
                                                    field-level-help={productFilterTooltip}
                                                    placeholder={labels.searchPlaceHolder}
                                                    value={filterWrapper.searchTerm}
                                                onchange={handleChangeSearchTerm}></lightning-input>
                                        </div>
                                        <div class="slds-m-top--x-small">
                                                <lightning-input type="checkbox"
                                                    label={labels.LBL_Matrix_Comparator_HideEmptyConsoRecords}
                                                    checked={filterWrapper.hideEmptyConsoRecords}
                                                    value={filterWrapper.hideEmptyConsoRecords}
                                                    onchange={handleChangeIsEmptyConsoRecords}></lightning-input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div
                                class="slds-card__footer slds-grid slds-m-top_none slds-p-vertical_small filterPanelFooter">
                                <div class="slds-col">
                                        <lightning-button onclick={handleSearch} label={labels.LBL_Search}
                                            variant="brand">
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div if:false={hasNoData} class="footerDiv slds-grid slds-m-around--xx-small">
                <span class="slds-m-horizontal_x-small slds-m-top_xxx-small">
                    <lightning-combobox dropdown-alignment="auto" name="pageSelect" value={pageSize}
                        variant="label-hidden" placeholder="Select Progress" options={pageSizeOptions}
                        onchange={changePageSizeHandler}></lightning-combobox>
                </span>
                <span>
                    <lightning-button-group>
                        <lightning-button label={labels.LBL_First} disabled={firstDisabled}
                            onclick={handleFirst}></lightning-button>
                        <lightning-button label={labels.LBL_Previous} disabled={previousDisabled}
                            onclick={handlePrevious}></lightning-button>
                        <lightning-button label={labels.LBL_Next} disabled={nextDisabled}
                            onclick={handleNext}></lightning-button>
                        <lightning-button label={labels.LBL_Last} disabled={lastDisabled}
                            onclick={handleLast}></lightning-button>
                    </lightning-button-group>
                    <span class="slds-p-left_small slds-badge" style="margin-left: 10px;">
                        {pageRecordCount} {labels.LBL_Of} {noOfRecords}
                    </span>
                </span>
            </div>
        </template>
        </template>
    </div>
</template>
