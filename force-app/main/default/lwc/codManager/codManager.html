<template>
    <div class="mainDiv slds-is-relative">
        <div class="mainContainer">
            <div class="slds-grid pageHeader slds-p-horizontal_medium slds-p-vertical_small slds-page-header ">
                <div class="slds-col slds-has-flexi-truncate">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__body slds-p-around_x-small slds-grid slds-p-left_none">
                            <div class="slds-border_right">
                                <h2 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
                                    {labels.LBL_Connect_COD_Manager_Title}
                                </h2>
                            </div>
                            <div class="slds-m-horizontal_small badgeDiv">
                                <span class="slds-badge badgeDiv active-btn" onclick={toggleActive}>
                                    {labels.LBL_Active_GL}
                                </span>
                            </div>
                            <div class="badgeDiv">
                                <span class="slds-badge badgeDiv inactive-btn" onclick={toggleInactive}>
                                    {labels.LBL_Inactive}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-grid">
                    <lightning-input class="slds-m-around_xx-small" variant="label-hidden" type="text"
                        style="margin-top: 1.6% !important;min-width:200px !important;" value={searchTerm}
                        onchange={searchContacts} placeholder={labels.LBL_Connect_Contact_Search}
                        disabled={isSearchDisabled}>
                    </lightning-input>
                    <lightning-button lwc:if={allowNewContact}
                        class="slds-button  slds-m-around_xx-small slds-m-right_none addButton"
                        label={labels.LBL_Connect_Add_Contact} variant="brand" onclick={handleNewContact}
                        style=" margin-right: 1.7%;">
                    </lightning-button>
                </div>
            </div>
            <div class="pageBody">
                <template lwc:if={isLoading}>
                    <div class="slds-spinner_container greyBg">
                        <div class="loader slds-spinner_container slds-align_absolute-center"></div>
                    </div>
                </template>
                <template lwc:else>
                    <div lwc:if={isEmpty} class="emptyBody">
                        <div class="emptyContainer slds-m-top_large">
                            <div class="emptyIconDiv">
                                <img src={icons.emptyIcon} />
                            </div>
                            <div class="emptyTitle slds-page-header__title">
                                {labels.LBL_Connect_Empty_Title}
                            </div>
                            <div class="emptySubtitle">
                                {labels.LBL_Connect_Empty_Subtitle}
                            </div>
                        </div>
                    </div>
                    <div>
                        <div lwc:ref="tileContainer" class="tile-container ">
                            <template for:each={contactList} for:item="currentContact" for:index="contactIndex">
                                <div key={currentContact.id} class="tile slds-p-around_medium" data-index={contactIndex}
                                    style={cardStyle} onclick={openContactPanel} if:true={currentContact}>
                                    <div data-index={contactIndex} style="overflow: hidden;">
                                        <div data-index={contactIndex} class="tile-image"
                                            style={currentContact.imageUrl}>
                                        </div>
                                        <div data-index={contactIndex}>
                                            <div data-index={contactIndex}
                                                class="slds-m-bottom_small slds-grid slds-wrap"
                                                style="float:left;width:55%;">
                                                <div class="slds-size_1-of-1" data-index={contactIndex}>
                                                    <p data-index={contactIndex} class="tile-Name slds-truncate"
                                                        title={currentContact.name}>{currentContact.name}</p>
                                                </div>
                                                <div data-index={contactIndex}
                                                    class="slds-size_1-of-1 slds-grid slds-grid_vertical-align-center">
                                                    <div data-index={contactIndex}>
                                                        <img src={icons.caseIcon} data-index={contactIndex}
                                                            alt="Case Icon" class="custom-icon slds-m-right_x-small" />
                                                    </div>
                                                    <div data-index={contactIndex} class="tile-Job">
                                                        {currentContact.title}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div data-index={contactIndex}>
                                        <template lwc:if={currentContact.isMailbox}>
                                            <div class="slds-m-bottom_xx-small" data-index={contactIndex}>
                                                <span data-index={contactIndex}><img src={icons.emailIcon}
                                                        data-index={contactIndex} alt="Email Icon"
                                                        class="custom-icon" /></span>
                                                <span data-index={contactIndex} style="font-weight: bold;"
                                                    class="slds-m-left_x-small slds-m-right_xx-small">
                                                    {labels.LBL_Email}
                                                </span>
                                                <span data-index={contactIndex}
                                                    class="slds-p-left_x-small tile-Summary">
                                                    {currentContact.email}
                                                </span>
                                                <template if:false={currentContact.isEmailVerified}>
                                                    <span data-index={contactIndex}
                                                        class="slds-p-left_x-small email-not-verified">
                                                        {labels.LBL_NotVerified}
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="slds-m-bottom_xx-small" data-index={contactIndex}>
                                                <span data-index={contactIndex}><img src={icons.faxIcon}
                                                        data-index={contactIndex} alt="Fax Icon"
                                                        class="custom-icon" /></span>
                                                <span data-index={contactIndex} style="font-weight: bold;"
                                                    class="slds-m-left_x-small slds-m-right_xx-small">
                                                    {labels.LBL_Fax}
                                                </span>
                                                <span data-index={contactIndex}
                                                    class="slds-p-left_x-small tile-Summary">
                                                    {currentContact.fax}
                                                </span>
                                            </div>
                                            <div class="slds-m-bottom_xx-small" data-index={contactIndex}>
                                                <span data-index={contactIndex}><img src={icons.infoIcon}
                                                        data-index={contactIndex} alt="Info Icon"
                                                        class="custom-icon" /></span>
                                                <span data-index={contactIndex} style="font-weight: bold;"
                                                    class="slds-m-left_x-small slds-m-right_xx-small">{labels.LBL_Invoice_Recipient}</span>
                                                <div class="slds-checkbox slds-p-left_x-small tile-Summary"
                                                    style="width:fit-content" data-index={contactIndex}>
                                                    <input type="checkbox" value={currentContact.isInvoiceRecipient}
                                                        checked={currentContact.isInvoiceRecipient}
                                                        data-index={contactIndex} />
                                                    <label class="slds-checkbox__label" data-index={contactIndex}>
                                                        <span class="slds-checkbox_faux"
                                                            data-index={contactIndex}></span>
                                                    </label>
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:else for:each={currentContact.summaryFields} for:item='field'>
                                            <div class="slds-m-bottom_xx-small" data-index={contactIndex}
                                                key={field.fieldName}>
                                                <span data-index={contactIndex}>
                                                    <template lwc:if={field.isEmail}>
                                                        <img src={icons.emailIcon} data-index={contactIndex}
                                                            alt="Email Icon" class="custom-icon" />
                                                    </template>
                                                    <template lwc:elseif={field.isPhone}>
                                                        <img src={icons.telephoneIcon} data-index={contactIndex}
                                                            alt="Telephone Icon" class="custom-icon" />
                                                    </template>
                                                    <template lwc:else>
                                                        <img src={icons.infoIcon} data-index={contactIndex}
                                                            alt="Info Icon" class="custom-icon" />
                                                    </template>
                                                    <span data-index={contactIndex} style="font-weight: bold;"
                                                        class="slds-m-left_x-small slds-m-right_xx-small">
                                                        {field.fieldLabel}
                                                    </span>
                                                    <span data-index={contactIndex}
                                                        class="slds-p-left_x-small tile-Summary">
                                                        <lightning-formatted-number lwc:if={field.isNumberField}
                                                            maximum-fraction-digits={field.scale}
                                                            value={field.fieldValue}>
                                                        </lightning-formatted-number>
                                                        <a lwc:elseif={field.isReference} href={field.link}
                                                            target="_blank" data-index={contactIndex}>
                                                            {field.fieldValue}</a>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit"></lightning-formatted-date-time>
                                                        <template lwc:elseif={field.isPicklist}>
                                                            {field.fieldOutputValue}
                                                        </template>
                                                        <template lwc:elseif={field.isBoolean}>
                                                            <div class="slds-checkbox" style="width:fit-content"
                                                                data-index={contactIndex}>
                                                                <input type="checkbox" value={field.fieldValue}
                                                                    checked={field.fieldValue}
                                                                    data-index={contactIndex} />
                                                                <label class="slds-checkbox__label"
                                                                    data-index={contactIndex}>
                                                                    <span class="slds-checkbox_faux"
                                                                        data-index={contactIndex}></span>
                                                                </label>
                                                            </div>
                                                        </template>
                                                        <template lwc:else>{field.fieldValue}</template>
                                                        <template lwc:if={field.isEmail}>
                                                            <template if:false={currentContact.isEmailVerified}>
                                                                <span class="slds-p-left_x-small email-not-verified">
                                                                    {labels.LBL_NotVerified}
                                                                </span>
                                                            </template>
                                                        </template>
                                                    </span>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                    <div data-index={contactIndex} class="tile-icons-container"
                                        if:false={currentContact.isMailbox}>
                                        <!-- <lightning-icon data-index={contactIndex} icon-name="utility:preview"
                                            alternative-text="preview" title="preview" size="x-small" class="tile-icon">
                                        </lightning-icon> -->
                                        <div class="icon-container slds-m-right_small" data-index={contactIndex}>
                                            <img src={icons.previewIcon} data-index={contactIndex} alt="Preview Icon"
                                                class="custom-icon" />
                                        </div>
                                        <!--  <lightning-icon data-index={contactIndex} icon-name="utility:app_web_messaging"
                                                alternative-text="app_web_messaging" title="messaging" size="x-small"
                                                class="tile-icon">
                                            </lightning-icon> -->
                                        <div class="icon-container slds-m-right_small" data-index={contactIndex}>
                                            <img src={icons.textMessageIcon} data-index={contactIndex}
                                                alt="Text Message Icon" class="custom-icon" />
                                        </div>
                                        <!--  <lightning-icon data-index={contactIndex} icon-name="utility:lock"
                                                alternative-text="access" title="access" size="x-small" class="tile-icon">
                                            </lightning-icon> -->
                                        <!-- Lock Icon with green background and green outline -->
                                        <div class="icon-container green-background  slds-m-right_small"
                                            if:true={currentContact.isActivated} data-index={contactIndex}>
                                            <img src={icons.activeProtalIcon} data-index={contactIndex} alt="Lock Icon"
                                                class="custom-icon green" />
                                        </div>
                                        <!-- Unlock Icon with red background and red outline -->
                                        <div class="icon-container red-background  slds-m-right_small"
                                            if:false={currentContact.isActivated} data-index={contactIndex}>
                                            <img src={icons.inactiveProtalIcon} data-index={contactIndex}
                                                alt="Unlock Icon" class="custom-icon red" />
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        <div lwc:if={showSidePanel} class="modal">
            <div class="sidePanelTransparent" onclick={closePanel}></div>
            <div class="sidePanel slds-p-around_small">
                <div class={panelContainerClass}>
                    <template lwc:if={showContactTypePanel}>
                        <div style="height: 100%;background:white;color:#08484B;">
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="slds-text-heading_large slds-text-align_center slds-p-top_x-large"
                                        style="font-weight: bold;">{labels.LBL_Connect_ContactTypeSelection}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="slds-grid slds-wrap slds-gutters slds-grid_align-center">
                                        <div class="slds-col slds-size_2-of-12 slds-p-around_xx-large"
                                            style="max-width: 300px;">
                                            <div
                                                style="display: flex;flex-direction:column;align-items:center;justify-content:center;">
                                                <div style="width: 100%;background: #F3F3F3; border-radius: 2rem;border: 1px solid #999999;cursor:pointer;"
                                                    class="slds-m-bottom_large slds-p-around_x-large"
                                                    data-contact-type="individual" onclick={handleContactTypeChoice}>
                                                    <img style="width: 100%;" src={icons.individualIcon}
                                                        data-contact-type="individual"
                                                        onclick={handleContactTypeChoice} />
                                                </div>
                                                <div class="slds-text-heading_medium slds-text-align_center"
                                                    style="font-weight: bold;">
                                                    {labels.LBL_Connect_IndividualContact}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_2-of-12 slds-p-around_xx-large"
                                            style="max-width: 300px;">
                                            <div
                                                style="display: flex;flex-direction:column;align-items:center;justify-content:center;">
                                                <div style="width: 100%;background: #F3F3F3; border-radius: 2rem;border: 1px solid #999999;cursor:pointer;"
                                                    class="slds-m-bottom_large slds-p-around_x-large"
                                                    data-contact-type="mailbox" onclick={handleContactTypeChoice}>
                                                    <img style="width: 100%;" src={icons.mailboxIcon}
                                                        data-contact-type="mailbox" onclick={handleContactTypeChoice} />
                                                </div>
                                                <div class="slds-text-heading_medium slds-text-align_center"
                                                    style="font-weight: bold;">
                                                    {labels.LBL_Connect_GenericMailbox}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template lwc:elseif={showContactPanel}>
                        <div class="panelHeader" if:true={contact}>
                            <div class="contact-headerSection slds-p-around--large">
                                <div class="contact-titleSection">
                                    <div class="banner-image" style={contact.imageUrl}></div>
                                    <div>
                                        <div class="slds-grid">
                                            <div class="banner-Name">
                                                <template lwc:if={isReadOnly}>
                                                    <span class="panel-contact-name ">{contact.name}</span>
                                                </template>
                                                <template lwc:else>
                                                    <a href={contact.link} data-contact-id={contact.Id}
                                                        target="_blank">{contact.name}</a>
                                                </template>
                                                <template if:true={contact.isMailbox}>
                                                    <br> <span class="slds-text-heading_small"
                                                        style="font-weight:normal;">{contact.title}</span>
                                                </template>
                                            </div>
                                            <div lwc:if={allowAdd} class="slds-p-left_medium"
                                                style="align-items:center;">
                                                <lightning-icon icon-name="utility:new_direct_message" size="small"
                                                    alternative-text="Settings" title="Settings"
                                                    onclick={handleActivateEditContact}></lightning-icon>
                                            </div>
                                        </div>
                                        <br>
                                        <div if:false={contact.isMailbox} class="banner-summaryContainer">
                                            <template for:each={contact.headerFields} for:item='field'>
                                                <span key={field.fieldName}>
                                                    <span if:false={field.isFirst} class="slds-p-horizontal_x-small"> •
                                                    </span>
                                                    <lightning-icon lwc:if={field.isEmail} icon-name="utility:email"
                                                        alternative-text="email" title="email" size="x-small">
                                                    </lightning-icon>
                                                    <lightning-icon lwc:elseif={field.isPhone} icon-name="utility:call"
                                                        alternative-text="phone" title="phone" size="x-small">
                                                    </lightning-icon>
                                                    <lightning-icon lwc:else icon-name="utility:info_alt"
                                                        alternative-text="info" title={field.fieldLabel} size="x-small">
                                                    </lightning-icon>
                                                    <span class="slds-p-left_x-small">
                                                        <lightning-formatted-number lwc:if={field.isNumberField}
                                                            maximum-fraction-digits={field.scale}
                                                            value={field.fieldValue}>
                                                        </lightning-formatted-number>
                                                        <a lwc:elseif={field.isReference} href={field.link}
                                                            target="_blank">
                                                            {field.fieldValue}</a>
                                                        <span lwc:elseif={field.isBoolean} data-index={contactIndex}>
                                                            {field.fieldLabel}
                                                            <div class="slds-checkbox slds-p-left_x-small tile-Summary"
                                                                style="width:fit-content" data-index={contactIndex}>
                                                                <input type="checkbox" value={field.fieldValue}
                                                                    checked={field.fieldValue}
                                                                    data-index={contactIndex} />
                                                                <label class="slds-checkbox__label"
                                                                    data-index={contactIndex}>
                                                                    <span class="slds-checkbox_faux"
                                                                        data-index={contactIndex}></span>
                                                                </label>
                                                            </div>
                                                        </span>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit"></lightning-formatted-date-time>
                                                        <template lwc:elseif={field.isPicklist}>
                                                            {field.fieldOutputValue}
                                                        </template>
                                                        <template lwc:else>
                                                            {field.fieldValue}
                                                        </template>
                                                    </span>
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="contact-buttonContainer">
                                    <lightning-button class="slds-button slds-m-around_xx-small slds-m-right_none"
                                        label={labels.LBL_Connect_Back} variant="neutral"
                                        onclick={toggleContactPanel}></lightning-button>
                                    <template if:false={contact.isMailbox}>
                                        <template lwc:if={portalActivationPanel}>
                                            <lightning-button
                                                class="slds-button slds-m-around_xx-small slds-m-right_none"
                                                label={labels.LBL_Connect_Contact_Profile} variant="neutral"
                                                onclick={togglePortalActivationScreen}></lightning-button>
                                        </template>
                                        <template lwc:else>
                                            <template lwc:if={contact.isActivated}>
                                                <lightning-button lwc:if={isManager}
                                                    class="greenButton slds-m-around_xx-small slds-m-right_none"
                                                    label={labels.LBL_Connect_Portal_Activated} variant="brand"
                                                    onclick={togglePortalActivationScreen}></lightning-button>
                                                <div lwc:else
                                                    class="greenDisabledButton slds-p-horizontal_medium slds-p-vertical_x-small slds-m-around_xx-small slds-m-right_none">
                                                    {labels.LBL_Connect_Portal_Activated}</div>
                                            </template>
                                            <lightning-button lwc:elseif={contact.isRequested}
                                                class="orangeButton slds-m-around_xx-small slds-m-right_none"
                                                label={labels.LBL_Connect_Portal_Activation_Requested} variant="brand"
                                                onclick={togglePortalActivationScreen}></lightning-button>
                                            <template lwc:else>
                                                <lightning-button lwc:if={isManager}
                                                    class="grayButton slds-m-around_xx-small slds-m-right_none"
                                                    label={labels.LBL_Connect_Portal_Inactive} variant="brand"
                                                    onclick={togglePortalActivationScreen}></lightning-button>
                                                <div lwc:else
                                                    class="grayDisabledButton slds-p-horizontal_medium slds-p-vertical_x-small slds-m-around_xx-small slds-m-right_none">
                                                    {labels.LBL_Connect_Portal_Inactive}</div>
                                            </template>
                                        </template>
                                    </template>
                                </div>
                            </div>
                            <div
                                class="contact-bannerFieldsSection slds-p-around--large slds-border_top slds-border_bottom">
                                <template lwc:if={contact.isMailbox}>
                                    <div data-index={contactIndex} class="flex-item slds-m-horizontal_medium">
                                        <div class="header-Name">{labels.LBL_Email}</div>
                                        <span>{contact.email}</span>
                                    </div>
                                    <div data-index={contactIndex} class="flex-item slds-m-horizontal_medium">
                                        <div class="header-Name">{labels.LBL_Fax}</div>
                                        <span>{contact.fax}</span>
                                    </div>
                                    <div data-index={contactIndex} class="flex-item slds-m-horizontal_medium">
                                        <div class="header-Name">{labels.LBL_Invoice_Recipient}</div>
                                        <span>
                                            <lightning-input type="checkbox" class="input-center" variant="label-hidden"
                                                checked={contact.isInvoiceRecipient} disabled>
                                            </lightning-input>
                                        </span>
                                    </div>
                                </template>
                                <template lwc:else for:each={contact.additionalFields} for:item='field'>
                                    <div data-index={contactIndex} key={field.fieldName}
                                        class="flex-item slds-m-horizontal_medium">
                                        <div class="header-Name">{field.fieldLabel}</div>
                                        <span>
                                            <lightning-formatted-number lwc:if={field.isNumberField}
                                                maximum-fraction-digits={field.scale} value={field.fieldValue}>
                                            </lightning-formatted-number>
                                            <a lwc:elseif={field.isReference} href={field.link} target="_blank">
                                                {field.fieldValue}</a>
                                            <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                class="input-center" variant="label-hidden" checked={field.fieldValue}
                                                disabled>
                                            </lightning-input>
                                            <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                value={field.fieldValue} year="numeric" month="2-digit"
                                                day="2-digit"></lightning-formatted-date-time>
                                            <template lwc:elseif={field.isPicklist}>
                                                {field.fieldOutputValue}
                                            </template>
                                            <template lwc:else>
                                                {field.fieldValue}
                                            </template>
                                        </span>
                                    </div>
                                </template>
                                <div if:true={contactEditMode} class="slds-card popupContainter ">
                                    <section lwc:if={contact.isMailbox} aria-label="Dialog title"
                                        aria-describedby="popover-body-id"
                                        class="slds-popover slds-nubbin_top popupContent" role="dialog"
                                        style="min-width: 500px;">
                                        <div id="popover-body-id" class="slds-popover__body slds-grid"
                                            style="min-width:500px;flex-wrap:wrap;gap:4%">
                                            <div class="inputDiv">
                                                <lightning-input class="info-input" type='text'
                                                    label={labels.LBL_Connect_MailboxName} data-fieldtype="string"
                                                    data-fieldname={CONTACT_API_NAMES.LastName} value={contact.lastName}
                                                    onchange={handleEditContactInfos}>
                                                </lightning-input>
                                            </div>
                                            <div class="inputDiv">
                                                <lightning-input class="info-input" type='text'
                                                    label={labels.LBL_Connect_MailboxRole} data-fieldtype="string"
                                                    data-fieldname={CONTACT_API_NAMES.Title} value={contact.title}
                                                    onchange={handleEditContactInfos}>
                                                </lightning-input>
                                            </div>
                                            <div class="inputDiv">
                                                <lightning-input class="info-input" type='email'
                                                    label={labels.LBL_Email} data-fieldtype="email"
                                                    data-fieldname={CONTACT_API_NAMES.Email} value={contact.email}
                                                    onchange={handleEditContactInfos} required>
                                                </lightning-input>
                                            </div>
                                            <div class="inputDiv">
                                                <lightning-input class="info-input" type='tel' label={labels.LBL_Fax}
                                                    message-when-pattern-mismatch={labels.LBL_Connect_Invalid_Phone_Number}
                                                    pattern="[0-9]*" data-fieldtype='phone'
                                                    data-fieldname={CONTACT_API_NAMES.Fax} value={contact.fax}
                                                    onchange={handleEditContactInfos}>
                                                </lightning-input>
                                            </div>
                                            <div class="inputDiv">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label">
                                                        {labels.LBL_Invoice_Recipient}</label>

                    <div class="slds-modal__footer">
