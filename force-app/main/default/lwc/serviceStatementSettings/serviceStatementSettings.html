<template>
  <template if:true={loading}>
    <div
      class="loading-overlay"
      style="position:fixed; inset:0; z-index:10000;
             display:flex; align-items:center; justify-content:center;
             background:rgba(255,255,255,0.55);">
      <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
    </div>
  </template>

    <!-- Settings profile header: sticky, white, and non-overlapping -->
      <div class="slds-page-header slds-page-header_joined"
           style="position:sticky; top:0; z-index:7; background:#ffffff; border-bottom:1px solid #e5e5e5;">
        <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
          <!-- Left: label + picker -->
          <div class="slds-col slds-grow">
            <div class="section-label slds-p-top_small">
              {labels.LBL_ServiceStatementSettings_Select_Page_Settings}
            </div>
            <div class="slds-m-left_medium" style="max-width:320px;">
              <lightning-combobox
                name="PageSettings"
                value={selectedPageSettingsName}
                variant="label-hidden"
                placeholder={labels.LBL_ServiceStatementSettings_Select_Settings}
                options={pageSettingsOptions}
                onchange={handleChangePageSettings}>
              </lightning-combobox>
            </div>
          </div>
          <!-- Right: actions -->
          <div class="slds-col slds-no-flex slds-p-right_medium">
            <template if:true={hasProfile}>
              <div class="slds-button-group" role="group">
                <lightning-button variant="neutral" label={labels.LBL_Cancel} onclick={handleCancel}></lightning-button>
                <lightning-button class="slds-m-left_x-small" variant="brand"
                                  disabled={saveStatus} label={labels.LBL_Save} onclick={handleSave}></lightning-button>
              </div>
            </template>
            <template if:false={hasProfile}>
              <lightning-button variant="brand"
                                label={labels.LBL_ServiceStatementSettings_Add_New_Settings}
                                onclick={togglePopupAddPageSettings}></lightning-button>
            </template>
          </div>
        </div>
      </div>

      <template if:true={addNewRowPageSettings}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-33"
                 class="slds-modal slds-fade-in-open">
          <div class="slds-modal__container">
            <div class="slds-button slds-button_icon slds-modal__close">
              <lightning-button-icon variant="bare" size="large" icon-name="utility:close"
                                     onclick={togglePopupAddPageSettings}></lightning-button-icon>
            </div>
            <div class="slds-modal__header">
              <h1 class="slds-modal__title slds-hyphenate">{labels.LBL_PageSettings_Add_New_Settings}</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium">
              <lightning-input label="Name" required value={newPageSettings.name} data-field="name"
                               onchange={handleChangeNewPageSettings}>
              </lightning-input>
              <lightning-input label="Description" required value={newPageSettings.description}
                               data-field="description" onchange={handleChangeNewPageSettings}>
              </lightning-input>
              <div>
                <div class="slds-form-element__label"
                     style="display: inline-block; width: 50%; margin-bottom: 20px; margin-top: 20px;">
                  {labels.pageSettings.Icon}
                </div>
                <template if:true={newPageSettings.icon}>
                  <img class="slds-m-horizontal_small slds-m-top--small" src={newPageSettings.icon}
                       alt="Icon preview" style="width: 100px; height: auto;" />
                </template>
                <div style="display: inline-block;">
                  <lightning-button-icon icon-name="utility:replace" size="small" data-field="icon"
                                         onclick={handleChangeNewPageSettings}>
                  </lightning-button-icon>
                </div>
              </div>
              <div>
                <div class="slds-form-element__label" style="display: inline-block; width: 50%;">
                  {labels.pageSettings.HeaderBackground}
                </div>
                <template if:true={newPageSettings.headerBackground}>
                  <img class="slds-m-horizontal_small slds-m-top--small"
                       src={newPageSettings.headerBackground} alt="Background preview"
                       style="width: 100px; height: auto;" />
                </template>
                <div style="display: inline-block;">
                  <lightning-button-icon icon-name="utility:replace" size="small"
                                         data-field="headerBackground" onclick={handleChangeNewPageSettings}>
                  </lightning-button-icon>
                </div>
              </div>
            </div>
            <div class="slds-modal__footer">
              <lightning-button label="Add Page Settings" variant="brand"
                                onclick={handleAddNewPageSettings}></lightning-button>
            </div>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
      </template>

      <template if:true={deletePopup.visibility}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                 class="slds-modal slds-fade-in-open">
          <div class="slds-modal__container">
            <div class="slds-modal__header">
              <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">
                {deletePopup.title}</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
              <p>{deletePopup.body}</p>
            </div>
            <div class="slds-modal__footer">
              <button data-id="cancel" class="slds-button slds-button_neutral"
                      aria-label="Cancel and close" onclick={handlePopupAction}>{labels.LBL_Cancel}</button>
              <button data-id="confirm" class="slds-button slds-button_destructive"
                      onclick={handlePopupAction}>{labels.LBL_Delete}</button>
            </div>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
      </template>


    <!-- Hide the entire settings form until a profile is selected/loaded -->
  <template if:true={hasProfile}>
    <!-- ========== Section 1 ========== -->
    <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
      <div class="sectionTitle slds-media__body">
        {labels.LBL_Connect_SellInStatementInitializationParameters}
      </div>
      <!-- <lightning-button class="slds-button slds-m-right_x-small" variant="brand"
                        label={labels.LBL_Save} onclick={handleSave}>
      </lightning-button> -->
    </div>

    <!-- Explanatory -->
    <div class="ml20 slds-m-top_small">
      <div class="label" style="padding-left:0;">
        {labels.LBL_Connect_SellInStatementInitializationDescription}
      </div>
      <div class="slds-m-top_x-small">
        <lightning-formatted-rich-text value={labels.LBL_ConnectSettings_SalesTermsStatementGenerationDescription} class="lh15">
        </lightning-formatted-rich-text>
      </div>
      <div class="slds-m-top_x-small">
        <lightning-formatted-rich-text value={labels.LBL_ConnectSettings_SalesTermsStatementGenerationNote} class="italic lh15">
        </lightning-formatted-rich-text>
      </div>
    </div>

    <!-- Generation Mode -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.generationModeLabel}</div>
      <div class="info-container-w">
        <lightning-combobox class="comboBox" variant="label-hidden"
                            options={genModeOptions}
                            value={mainData.serviceStatementSettings.generationMode}
                            data-field="generationMode"
                            onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>

    <!-- Auto specific -->
    <template if:true={isAuto}>
      <div class="slds-m-top_small slds-p-vertical_x-small slds-p-horizontal_small ml20"
           style="background:#d9f3f6;border-radius:4px;max-width:calc(100% - 40px);">
        <lightning-formatted-rich-text value={labels.LBL_ConnectSettings_SalesTermsSelfPublishWarning} class="lh15">
        </lightning-formatted-rich-text>
      </div>

      <!-- Auto-send date -->
      <div class="section-Container slds-m-top_medium">
        <div class="section-label disp">
          Date de publication annuelle de la demande de déclaration
          <span class="slds-required" style="margin-left:4px;">*</span>
        </div>
        <div class="info-container-w">
          <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-6">
              <lightning-input type="number" min="1" max="31" variant="label-hidden" required={isAuto}
                               value={mainData.serviceStatementSettings.autoPublishDay}
                               data-field="autoPublishDay"
                               onchange={handleFieldEdits}>
              </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-6">
              <lightning-combobox variant="label-hidden" options={monthOptions} required={isAuto}
                                  value={mainData.serviceStatementSettings.autoPublishMonth}
                                  data-field="autoPublishMonth"
                                  onchange={handleFieldEdits}>
              </lightning-combobox>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Toggles -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.isNSLevelLabel}</div>
      <div class="info-container-w">
        <lightning-input class="connect-toggle" type="toggle" variant="label-hidden"
                         checked={mainData.serviceStatementSettings.isNSLevel}
                         data-field="isNSLevel"
                         onchange={handleFieldEdits}>
        </lightning-input>
      </div>
    </div>

    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.allowSelfSubmitLabel}</div>
      <div class="info-container-w">
        <lightning-input class="connect-toggle" type="toggle" variant="label-hidden"
                         checked={mainData.serviceStatementSettings.allowSelfSubmit}
                         data-field="allowSelfSubmit"
                         onchange={handleFieldEdits}>
        </lightning-input>
      </div>
    </div>

    <!-- Sales Term Statement - Creation Flow -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.creationFlowLabel}</div>
      <div class="info-container-w">
        <lightning-combobox class="comboBox" variant="label-hidden" name="creationFlow"
                            placeholder="Select an active Screen Flow"
                            options={flows}
                            value={mainData.serviceStatementSettings.creationFlow}
                            data-field="creationFlow"
                            onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>

    <!-- Descriptions -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.descriptionFRLabel}</div>
      <div class="info-container-w">
        <div class="w36">
          <lightning-textarea variant="label-hidden"
                              value={mainData.serviceStatementSettings.descriptionFR}
                              data-field="descriptionFR"
                              onchange={handleFieldEdits}>
          </lightning-textarea>
        </div>
      </div>
    </div>

    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.descriptionENLabel}</div>
      <div class="info-container-w">
        <div class="w36">
          <lightning-textarea variant="label-hidden"
                              value={mainData.serviceStatementSettings.descriptionEN}
                              data-field="descriptionEN"
                              onchange={handleFieldEdits}>
          </lightning-textarea>
        </div>
      </div>
    </div>

    <div class="add-breaks"></div>

    <!-- ========== Section 2 ========== -->
    <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
      <div class="sectionTitle slds-media__body">
        {labels.LBL_ConnectSettings_SalesTermsSubmissionRulesSectionTitle}
      </div>
    </div>

    <!-- Helper -->
    <div class="ml20 slds-m-top_small">
      <div class="label" style="padding-left:0;">
        {labels.LBL_ConnectSettings_SalesTermsSubmissionRulesSectionSubTitle}
      </div>
      <div class="slds-m-top_x-small">
        <lightning-formatted-rich-text value={labels.LBL_ConnectSettings_SalesTermsSubmissionRulesDescription} class="lh15">
        </lightning-formatted-rich-text>
      </div>
    </div>

    <!-- Closing date -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">Date de clôture</div>
      <div class="info-container-w">
        <div class="slds-grid slds-wrap slds-gutters">
          <div class="slds-col slds-size_1-of-6">
            <lightning-input type="number" min="1" max="31" variant="label-hidden"
                             value={mainData.serviceStatementSettings.annualClosingDay}
                             data-field="annualClosingDay"
                             onchange={handleFieldEdits}>
            </lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-6">
            <lightning-combobox variant="label-hidden" options={monthOptions}
                                value={mainData.serviceStatementSettings.annualClosingMonth}
                                data-field="annualClosingMonth"
                                onchange={handleFieldEdits}>
            </lightning-combobox>
          </div>
        </div>
      </div>
    </div>

    <!-- Supplier submission flow -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.submissionFlowLabel}</div>
      <div class="info-container-w">
        <lightning-combobox class="comboBox" variant="label-hidden" name="submissionFlow"
                            placeholder="Select an active Screen Flow"
                            options={flows}
                            value={mainData.serviceStatementSettings.submissionFlow}
                            data-field="submissionFlow"
                            onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>

    <!-- ========= Requested Documents ========= -->
    <div class="slds-m-top_medium slds-p-vertical_x-small slds-p-horizontal_small ml20"
         style="background:#d9f3f6;border-radius:4px;max-width:calc(100% - 40px);">
      <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
        <div class="slds-text-title_bold">{labels.LBL_RequestedDocuments}</div>
        <lightning-button-icon icon-name="utility:add" alternative-text="+ Ajouter un document"
                               onclick={addRequestedDoc} title="+ Ajouter un document">
        </lightning-button-icon>
      </div>
    </div>

    <!-- Column headers -->
    <div class="ml20 slds-p-horizontal_small slds-m-top_small" style="max-width:calc(100% - 40px);">
      <div class="slds-grid slds-gutters slds-m-bottom_x-small">
        <div class="slds-col slds-size_3-of-12 slds-text-title_caps slds-text-color_weak">TYPE</div>
        <div class="slds-col slds-size_3-of-12 slds-text-title_caps slds-text-color_weak">SOUS-TYPE</div>
        <div class="slds-col slds-size_4-of-12 slds-text-title_caps slds-text-color_weak">NOM DU DOCUMENT</div>
        <div class="slds-col slds-size_1-of-12 slds-text-title_caps slds-text-color_weak slds-text-align_center">OBLIGATOIRE ?</div>
        <div class="slds-col slds-size_1-of-12 slds-text-title_caps slds-text-color_weak"></div>
      </div>
    </div>

    <!-- Rows -->
    <template for:each={requestedDocs} for:item="doc" for:index="index">
      <div key={doc.uid} class="ml20 slds-p-horizontal_small slds-m-bottom_x-small" style="max-width:calc(100% - 40px);">
        <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-center">
          <div class="slds-col slds-size_3-of-12">
             <lightning-combobox required variant="label-hidden" label="Type"
                                placeholder="Sélectionner un type"
                                options={fileDirectoryTypeOptions}
                                value={doc.type}
                                data-idx={index} data-field="type"
                                onchange={handleDocInput}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_3-of-12">
            <lightning-combobox required variant="label-hidden" label="Sous-Type"
                                placeholder="Sélectionner un sous-type"
                                options={fileDirectorySubTypeOptions}
                                value={doc.subType}
                                data-idx={index} data-field="subType"
                                onchange={handleDocInput}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_4-of-12">
            <lightning-input required variant="label-hidden" label="Nom du document" value={doc.name} data-idx={index} data-field="name" onchange={handleDocInput}></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-align_absolute-center">
            <lightning-input class="connect-toggle" type="toggle" variant="label-hidden" message-toggle-active="Oui" message-toggle-inactive="Non"
                             checked={doc.mandatory} data-idx={index} data-field="mandatory" onchange={handleDocInput}>
            </lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-align_absolute-center">
            <lightning-button-icon icon-name="utility:delete" alternative-text="Supprimer" title="Supprimer"
                                   data-idx={index} onclick={deleteRequestedDoc}>
            </lightning-button-icon>
          </div>
        </div>
      </div>
    </template>

    <div class="add-breaks"></div>

    <!-- ========== Section 3 ========== -->
    <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
      <div class="sectionTitle slds-media__body">
        Paramétrage des relances
      </div>
    </div>

    <!-- Supplier Reminder Flow -->
    <!-- <div class="section-Container slds-m-top_medium">
      <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
        <div class="section-label disp">Flux utilisé pour relancer le fournisseur</div>
        <div class="slds-col slds-size_5-of-12">
          <lightning-combobox class="comboBox" variant="label-hidden" label=" "
                              placeholder="Select an active Screen Flow"
                              options={flows}
                              value={rr.reminderFlow}
                              data-field="reminderFlow"
                              onchange={handleInput}>
          </lightning-combobox>
        </div>
      </div>
    </div> -->

    <!-- Supplier Reminder Flow (moved from Reminder Rules to Service Statement Settings) -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.reminderFlowLabel}</div>
      <div class="info-container-w">
        <lightning-combobox
          class="comboBox"
          variant="label-hidden"
          placeholder="Select an active Screen Flow"
          options={flows}
          value={mainData.serviceStatementSettings.reminderFlow}
          data-field="reminderFlow"
          onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>

    <!-- Reminder Rule selector (choose an existing ReminderRuleSettings profile to save in metadata) -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp">{labels.ServiceStatementSettings__mdt.reminderRuleLabel}</div>
      <div class="info-container-w">
        <lightning-combobox
          class="comboBox"
          variant="label-hidden"
          placeholder="Select a Reminder Rule profile"
          options={reminderRuleOptions}
          value={mainData.serviceStatementSettings.reminderRule}
          data-field="reminderRule"
          onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>

    <div class="add-breaks"></div>

    <!-- ========== Section 4 ========== -->
    <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
      <div class="sectionTitle slds-media__body">
        {labels.LBL_ConnectSettings_SalesTermsReponseRulesSectionTitle}
      </div>
    </div>
    <!-- Helper sentences -->
    <div class="ml20 slds-m-top_small">
      <div class="label" style="padding-left:0;">
        {labels.LBL_ConnectSettings_SalesTermsResponseRulesSectionSubTitle}
      </div>
      <div class="slds-m-top_x-small">
        <lightning-formatted-rich-text
          value={labels.LBL_ConnectSettings_SalesTermsResponseRulesDescription}
          class="lh15">
        </lightning-formatted-rich-text>
      </div>
    </div>
    <!-- Optional: flow used on response/objection -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp"> {labels.ServiceStatementSettings__mdt.validationFlowLabel} </div>
      <div class="info-container-w">
        <lightning-combobox
          class="comboBox"
          variant="label-hidden"
          placeholder="Select an active Screen Flow"
          options={flows}
          value={mainData.serviceStatementSettings.validationFlow}
          data-field="validationFlow"
          onchange={handleFieldEdits}>
        </lightning-combobox>
      </div>
    </div>
    <!-- Light band: documents -->
    <div class="slds-m-top_medium slds-p-vertical_x-small slds-p-horizontal_small ml20"
         style="background:#d9f3f6;border-radius:4px;max-width:calc(100% - 40px);">
      <div class="slds-text-title_bold">Documents partagés automatiquement</div>
    </div>
    <!-- Toggle: Framework Agreement Template -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp"> {labels.ServiceStatementSettings__mdt.addFrameworkAgreementTemplateLabel} </div>
      <div class="info-container-w">
        <lightning-input
          class="connect-toggle"
          type="toggle"
          variant="label-hidden"
          message-toggle-active="Oui"
          message-toggle-inactive="Non"
          checked={mainData.serviceStatementSettings.addFrameworkAgreementTemplate}
          data-field="addFrameworkAgreementTemplate"
          onchange={handleFieldEdits}>
        </lightning-input>
      </div>
    </div>
    <!-- Toggle: CGA -->
    <div class="section-Container slds-m-top_medium">
      <div class="section-label disp"> {labels.ServiceStatementSettings__mdt.addPurchasingTermsLabel} </div>
      <div class="info-container-w">
        <lightning-input
          class="connect-toggle"
          type="toggle"
          variant="label-hidden"
          message-toggle-active="Oui"
          message-toggle-inactive="Non"
          checked={mainData.serviceStatementSettings.addPurchasingTerms}
          data-field="addPurchasingTerms"
          onchange={handleFieldEdits}>
        </lightning-input>
      </div>
    </div>
  </template>
</template>
