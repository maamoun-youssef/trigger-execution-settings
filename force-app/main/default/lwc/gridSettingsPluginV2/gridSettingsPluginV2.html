<template>
    <div class="mainContainer slds-card">
        <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header pageHeader">
            <div class="slds-col slds-has-flexi-truncate">
                <div class="slds-media slds-media_center slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small">
                    <div>
                        <template lwc:if={pluginIcon}>
                            <img lwc:if={pluginIcon} src={pluginIcon}
                                style="width:30px; height:30px; margin-left:6px; cursor:pointer; border-radius:3px;" />
                        </template>
                        <lightning-icon lwc:else icon-name={headerLabels.iconName}>
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body slds-m-left--small">
                        <div class="slds-text-title">
                            <p class="slds-text-title slds-line-height_reset">
                                <template lwc:if={headerLabels.layoutSlogan}>
                                    {headerLabels.layoutSlogan}
                                </template>
                                <template lwc:else>
                                    {headerLabels.objectLabel}
                                </template>
                            </p>
                        </div>
                        <div class="slds-text-heading_small slds-text-title_bold">{headerLabels.layoutLabel}</div>
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-media--center">
                <lightning-button label={Labels.LBL_Cancel} class="slds-m-right--xx-small" onclick={handleCancel}>
                </lightning-button>
                <lightning-button if:true={showSave} label={Labels.LBL_Save} variant="brand"
                    class="slds-m-right--xx-small" onclick={handleSave}>
                </lightning-button>
                <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                    class="slds-var-p-left_xx-small" if:true={hasMenu}>
                    <template if:true={allowDelete}>
                        <lightning-menu-item label={Labels.LBL_Delete} prefix-icon-name="utility:delete"
                            onclick={deleteSelected} if:true={selectedRecordsIds.length}></lightning-menu-item>
                        <lightning-menu-item label={Labels.LBL_Delete} prefix-icon-name="utility:delete" disabled
                            if:false={selectedRecordsIds.length}></lightning-menu-item>
                    </template>
                    <template if:true={displayShowHideColumns}>
                        <lightning-menu-item label={Labels.LBL_Show_Hide_Columns}
                            prefix-icon-name="utility:freeze_column" onclick={showHideColumns}></lightning-menu-item>
                    </template>
                    <template if:true={displayListViewActions}>
                        <template if:true={selectedActions.length}>
                            <template if:true={showFirstDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                            <template for:each={selectedActions} for:item="action">
                                <lightning-menu-item class="slds-var-p-left-xx-small" variant="neutral" key={action.Id}
                                    label={action.MasterLabel} data-action={action.Name} data-url={action.Url}
                                    data-id={action.ScontrolId} onclick={handleActionsChange}>
                                </lightning-menu-item>
                            </template>
                            <template if:true={showSecondDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                        </template>
                    </template>
                    <lightning-menu-item label={Labels.LBL_Export} prefix-icon-name="doctype:excel"
                        if:true={allowExport} onclick={exportExcel}></lightning-menu-item>
                    <lightning-menu-item label={Labels.LBL_Import} prefix-icon-name="utility:upload"
                        if:true={allowImport} onclick={handleOpenImport}></lightning-menu-item>
                    <template for:each={actionFlows} for:item="flow">
                        <lightning-menu-item if:true={flow.value} key={flow.value} label={flow.label}
                            prefix-icon-name={flow.icon} data-flow-name={flow.value} data-flow-label={flow.label}
                            onclick={toggleFlow}>
                        </lightning-menu-item>
                    </template>
                </lightning-button-menu>
                <lightning-button-icon-stateful icon-name="utility:filterList" selected={isFilterOpen}
                    variant="border-filled" onclick={toggleFilter} if:true={hasFilterSettingsFields}
                    class="slds-m-right--xx-small">
                </lightning-button-icon-stateful>
            </div>
        </div>
        <template if:true={isLoading}>
            <div class="slds-spinner_container">
                <div class="loader slds-spinner_container slds-align--absolute-center">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </template>
        <div class="slds-card" style="margin-top: 0; border-top: 0;">
            <div class="slds-grid">
                <div class="slds-size_1-of-1 slds-grid">
                    <div class="slds-col slds-grid slds-wrap slds-scrollable">
                        <div class="main-panel slds-scrollable">
                            <table if:true={displayedFields.length}
                                class="slds-table slds-table_bordered slds-table_col-bordered main-table slds-no-row-hover">
                                <thead class="stickyHeader">
                                    <tr>
                                        <!-- <th style={firstsThStyle}>
                                            <lightning-input class="input-center" type="checkbox"
                                                title={Labels.LBL_Select_All_Checkbox_Tooltip} value={isAllSelected}
                                                checked={isAllSelected} onchange={toggleAllSelected}></lightning-input>
                                        </th> -->
                                        <th class="slds-grid--vertical-align-center slds-text-align--center sticky-header limited-cell"
                                            scope="col" if:true={showSelectRecords} style={firstThStyle}>
                                            <lightning-input type="checkbox" checked if:true={isAllSelected}
                                                variant="label-hidden" onchange={toggleAllSelected}>
                                            </lightning-input>
                                            <lightning-input type="checkbox" if:false={isAllSelected}
                                                variant="label-hidden" onchange={toggleAllSelected}>
                                            </lightning-input>
                                        </th>
                                        <template for:each={displayedFields} for:item="field">
                                            <th key={field.fieldName} title={field.fieldLabel} style={field.headerStyle}
                                                class="rowspanHeightTh slds-text-align_center"
                                                if:false={field.isSortable}>
                                                {field.fieldLabel}
                                            </th>
                                            <th key={field.fieldName} title={field.fieldLabel} style={field.headerStyle}
                                                class="rowspanHeightTh slds-text-align_center"
                                                data-field={field.fieldName} onclick={handleChangeSortField}
                                                if:true={field.isSortable}>
                                                {field.fieldLabel}
                                                <template if:true={field.sortedField}>
                                                    <lightning-icon icon-name="utility:arrowdown" size="xx-small"
                                                        class="sortSelected-icon slds-m-left--xxx-small"
                                                        data-field={field.fieldName} if:true={isSortASC}>
                                                    </lightning-icon>
                                                </template>
                                                <template if:false={field.sortedField}>
                                                    <lightning-icon icon-name="utility:arrowup" size="xx-small"
                                                        class="white-icon slds-m-left--xxx-small"
                                                        data-field={field.fieldName}>
                                                    </lightning-icon>
                                                </template>
                                            </th>
                                        </template>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={records} for:item="item" for:index="index"
                                        lwc:if={records.length}>
                                        <tr key={item.Id} class="trHeight">
                                            <td class="slds-border_left" style={item.firstTdStyle}>
                                                <div
                                                    class="slds-grid slds-grid_vertical-align-center slds-gutters_xx-small">
                                                    <template if:true={item.scanStatusIcon}>
                                                        <lightning-icon icon-name={item.scanStatusIcon.icon}
                                                            size="xx-small" title={item.scanStatusIcon.title}
                                                            class={item.scanStatusIcon.class}>
                                                        </lightning-icon>
                                                    </template>
                                                    <lightning-input class="input-center slds-m-left--xx-small"
                                                        type="checkbox" checked={item.isSelected} data-id={item.Id}
                                                        data-index={index} value={item.isSelected}
                                                        onchange={toggleSelectedRecords}></lightning-input>
                                                </div>
                                            </td>
                                            <template for:each={item.values} for:item="field">
                                                <td key={field.fieldName} style={field.style}>
                                                    <!-- ----- READ MODE (isReadOnly === false ) ----- -->
                                                    <template if:false={isReadOnly}>
                                                        <lightning-formatted-number lwc:if={field.isNumberField}
                                                            maximum-fraction-digits={field.scale}
                                                            minimum-fraction-digits={field.scale}
                                                            value={field.fieldValue} variant="label-hidden">
                                                        </lightning-formatted-number>
                                                        <template lwc:elseif={field.isText}>
                                                            <template if:true={field.nameAsURL}>
                                                                <a href={field.nameURL} target="_blank">
                                                                    {field.fieldValue}</a>
                                                            </template>
                                                            <template if:false={field.nameAsURL}>
                                                            <template lwc:if={field.isHTMLFormatted}>
                                                                    <lightning-formatted-rich-text
                                                                        value={field.fieldValue} variant="label-hidden">
                                                                </lightning-formatted-rich-text>
                                                            </template>
                                                            <template lwc:else>
                                                                {field.fieldValue}
                                                                </template>
                                                            </template>
                                                        </template>
                                                        <template lwc:elseif={field.isReference}>
                                                            <a href={field.link} target="_blank">
                                                                {field.fieldOutputValue}</a>
                                                        </template>
                                                        <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                            class="input-center" variant="label-hidden"
                                                            checked={field.fieldValue} disabled>
                                                        </lightning-input>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit"></lightning-formatted-date-time>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                            value={field.fieldValue} year="numeric" month="2-digit"
                                                            day="2-digit" hour="2-digit"
                                                            minute="2-digit"></lightning-formatted-date-time>
                                                        <template lwc:elseif={field.isPicklist}>
                                                            {field.fieldOutputValue}
                                                        </template>
                                                        <template lwc:elseif={field.isMultiPicklist}>
                                                            {field.fieldOutputValue}
                                                        </template>
                                                        <template lwc:elseif={field.isCurrency}>
                                                            <template if:true={showCurrency}>
                                                                <template if:true={showCurrencyAsSymbol}>
                                                                    <div if:true={field.CurrencyExist} class="textCell">
                                                                        <lightning-formatted-number value={field.value}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-code={field.CurrencyIsoCode}>
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                    <div if:false={field.CurrencyExist}>
                                                                        <lightning-formatted-number value={field.value}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}>
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                </template>
                                                                <template if:false={showCurrencyAsSymbol}>
                                                                    <div if:true={field.CurrencyExist} class="textCell">
                                                                        <lightning-formatted-number value={field.value}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-code={field.CurrencyIsoCode}
                                                                            currency-display-as="code">
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                    <div if:false={field.CurrencyExist}>
                                                                        <lightning-formatted-number value={field.value}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-display-as="code">
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                </template>
                                                            </template>
                                                        </template>
                                                        <template lwc:else>
                                                            {field.fieldValue}
                                                        </template>
                                                    </template>

                                                    <!-- ----- EDIT MODE (isReadOnly === true originally in your file — input fields) ----- -->
                                                    <template if:true={isReadOnly}>
                                                        <template if:true={field.isInputField}>
                                                            <!-- Text -->
                                                            <lightning-input lwc:if={field.isText} data-id={item.Id}
                                                                data-field={field.fieldName} data-index={index}
                                                                onchange={handleFieldEdits} label={field.fieldLabel}
                                                                variant="label-hidden" value={field.fieldValue}>
                                                            </lightning-input>

                                                            <!-- Textarea -->
                                                            <lightning-textarea lwc:if={field.isTextarea}
                                                                data-id={item.Id} data-field={field.fieldName}
                                                                data-index={index} onchange={handleFieldEdits}
                                                                variant="label-hidden" value={field.fieldValue}>
                                                            </lightning-textarea>

                                                            <!-- Number -->
                                                            <lightning-input lwc:elseif={field.isNumberField}
                                                                type="number" data-id={item.Id}
                                                                data-field={field.fieldName} data-index={index}
                                                                onchange={handleFieldEdits} variant="label-hidden"
                                                                step={field.step} value={field.fieldValue}
                                                                class="input-right">
                                                            </lightning-input>

                                                            <!-- Reference -->
                                                            <template lwc:elseif={field.isReference}>
                                                                <lightning-record-edit-form
                                                                    object-api-name={detailApiName}>
                                                                    <lightning-input-field variant="label-hidden"
                                                                        field-name={field.fieldName}
                                                                        value={field.fieldValue}
                                                                        data-field={field.fieldName} data-index={index}
                                                                        onchange={handleFieldEdits} data-id={item.Id}>
                                                                    </lightning-input-field>
                                                                </lightning-record-edit-form>
                                                            </template>

                                                            <!-- Boolean -->
                                                            <lightning-input lwc:elseif={field.isBoolean}
                                                                type="checkbox" variant="label-hidden" data-id={item.Id}
                                                                data-field={field.fieldName} data-index={index}
                                                                onchange={handleFieldEdits} checked={field.fieldValue}>
                                                            </lightning-input>

                                                            <!-- Picklist (single) -->
                                                            <template lwc:elseif={field.isPicklist}>
                                                                <select onchange={handleFieldEdits} data-id={item.Id}
                                                                    data-field={field.fieldName} data-index={index}>
                                                                    <template for:each={field.pickListValues}
                                                                        for:item="option">
                                                                        <template lwc:if={option.isDisabled}>
                                                                            <option key={option.value}
                                                                                value={option.value}
                                                                                selected={option.isSelected} disabled>
                                                                                {option.label}
                                                                            </option>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <option key={option.value}
                                                                                value={option.value}
                                                                                selected={option.isSelected}>
                                                                                {option.label}
                                                                            </option>
                                                                        </template>
                                                                    </template>
                                                                </select>
                                                            </template>

                                                            <!-- Date -->
                                                            <lightning-input lwc:elseif={field.isDate} type="date"
                                                                data-id={item.Id} data-field={field.fieldName}
                                                                data-index={index} onchange={handleFieldEdits}
                                                                variant="label-hidden" value={field.fieldValue}>
                                                            </lightning-input>

                                                            <!-- DateTime -->
                                                            <lightning-input lwc:elseif={field.isDateTime}
                                                                type="datetime" data-id={item.Id}
                                                                data-field={field.fieldName} data-index={index}
                                                                onchange={handleFieldEdits} variant="label-hidden"
                                                                value={field.fieldValue}>
                                                            </lightning-input>

                                                            <!-- Currency -->
                                                            <lightning-input lwc:elseif={field.isCurrency} type="number"
                                                                step={field.increment} data-id={item.Id}
                                                                data-field={field.fieldName} data-index={index}
                                                                onchange={handleFieldEdits} class="input-right"
                                                                variant="label-hidden" value={field.fieldValue}>
                                                            </lightning-input>

                                                            <!-- Multi-picklist -->
                                                            <lightning-record-edit-form
                                                                lwc:elseif={field.isMultiPicklist}
                                                                object-api-name={instance.objectName}
                                                                record-id={item.value.Id}>
                                                                <lightning-input-field variant="label-hidden"
                                                                    field-name={field.key} value={field.value}
                                                                    data-field-name={field.key} data-id={item.value.Id}
                                                                    onchange={genericChangeHandler}
                                                                    data-grouped-index={groupedIndex}>
                                                                </lightning-input-field>
                                                            </lightning-record-edit-form>

                                                            <!-- Rich Text -->
                                                            <template lwc:elseif={field.isTextArea}>
                                                                <lightning-input-rich-text type="number"
                                                                    step={field.increment} value={field.value}
                                                                    variant="label-hidden" if:true={field.isRichText}
                                                                    class="slds-text-align_right"
                                                                    data-field-name={field.key} data-id={item.value.Id}
                                                                    onchange={genericChangeHandler}
                                                                    data-grouped-index={groupedIndex}>
                                                                </lightning-input-rich-text>
                                                                <lightning-textarea value={field.value}
                                                                    variant="label-hidden" if:false={field.isRichText}
                                                                    data-field-name={field.key} data-id={item.value.Id}
                                                                    onchange={genericChangeHandler}
                                                                    data-grouped-index={groupedIndex}>
                                                                </lightning-textarea>
                                                            </template>

                                                            <!-- URL -->
                                                            <template lwc:elseif={field.isURL}>
                                                                <lightning-input value={field.value}
                                                                    variant="label-hidden" if:false={field.hasFileInput}
                                                                    data-field-name={field.key} data-id={item.value.Id}
                                                                    onchange={genericChangeHandler}
                                                                    data-grouped-index={groupedIndex}>
                                                                </lightning-input>
                                                            </template>

                                                        </template>

                                                        <template if:false={field.isInputField}>
                                                            <lightning-formatted-number lwc:if={field.isNumberField}
                                                                maximum-fraction-digits={field.scale}
                                                                minimum-fraction-digits={field.scale}
                                                                value={field.fieldValue} variant="label-hidden">
                                                            </lightning-formatted-number>
                                                            <template lwc:elseif={field.isText}>
                                                                <template lwc:if={field.isHTMLFormatted}>
                                                                    <lightning-formatted-rich-text
                                                                        value={field.fieldValue} variant="label-hidden">
                                                                    </lightning-formatted-rich-text>
                                                                </template>
                                                                <template lwc:else>
                                                                    {field.fieldValue}
                                                                </template>
                                                            </template>
                                                            <template lwc:elseif={field.isReference}>
                                                                <a href={field.link} target="_blank">
                                                                    {field.fieldOutputValue}</a>
                                                            </template>
                                                            <lightning-input lwc:elseif={field.isBoolean}
                                                                type="checkbox" class="input-center"
                                                                variant="label-hidden" checked={field.fieldValue}
                                                                disabled>
                                                            </lightning-input>
                                                            <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                                value={field.fieldValue} year="numeric" month="2-digit"
                                                                day="2-digit"></lightning-formatted-date-time>
                                                            <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                                value={field.fieldValue} year="numeric" month="2-digit"
                                                                day="2-digit" hour="2-digit"
                                                                minute="2-digit"></lightning-formatted-date-time>
                                                            <template lwc:elseif={field.isPicklist}>
                                                                {field.fieldOutputValue}
                                                            </template>
                                                            <template lwc:else>
                                                                {field.fieldValue}
                                                            </template>
                                                        </template>
                                                    </template>
                                                </td>
                                            </template>
                                            <td scope="col" style={item.lastTdStyle}
                                                class="slds-text-align_center limited-cell slds-border_left">
                                                <div class="slds-grid slds-gutters_xxx-small" if:true={item.Id}>
                                                    <div class="slds-col">
                                                        <a href={item.link} target="_blank">
                                                            <lightning-icon icon-name="utility:threedots"
                                                                size="xx-small">
                                                            </lightning-icon>
                                                        </a>
                                                    </div>
                                                    <!-- <div class="slds-col">
                                                        <lightning-icon icon-name="utility:delete" size="xx-small"
                                                            data-id={item.Id} data-type="Single"
                                                            onclick={popups.deletePopup.togglePopup}>
                                                        </lightning-icon>
                                                    </div> -->
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template lwc:else>
                                        <tr class="trHeight">
                                            <td colspan={displayedFields.length} class="slds-text-align--center">
                                                {Labels.LBL_No_Record_To_Display}
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div if:true={hasPagination}
                style="position: relative; height: fit-content;background: white;padding: 10px;"
                class="slds-grid footerDiv">
                <span style="margin-right: 10px; color: black;">
                    <lightning-combobox dropdown-alignment="auto" name="pageSelect" value={pageSize}
                        variant="label-hidden" options={pageSizeOptions} onchange={handlePageSize}></lightning-combobox>
                </span>
                <span>
                    <lightning-button-group>
                        <lightning-button label={Labels.LBL_First} disabled={previousDisabled} data-type="First"
                            onclick={handleChangePage}></lightning-button>
                        <lightning-button label={Labels.LBL_Previous} disabled={previousDisabled} data-type="Previous"
                            onclick={handleChangePage}></lightning-button>
                        <lightning-button label={Labels.LBL_Next} disabled={nextDisabled} data-type="Next"
                            onclick={handleChangePage}></lightning-button>
                        <lightning-button label={Labels.LBL_Last} disabled={nextDisabled} data-type="Last"
                            onclick={handleChangePage}></lightning-button>
                    </lightning-button-group>
                    <lightning-badge label={paginationBadge}></lightning-badge>
                </span>
            </div>
        </div>

    </div>
</template>
