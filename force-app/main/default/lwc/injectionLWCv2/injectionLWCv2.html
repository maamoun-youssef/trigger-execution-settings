<template>
    <div class="mainContainer slds-card">
        <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header pageHeader">
            <div class="slds-col slds-has-flexi-truncate">
                <!-- HEADING AREA -->
                <!-- MEDIA OBJECT = FIGURE + BODY -->
                <div
                    class="slds-media slds-media_center slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small">
                    <div>
                        <template lwc:if={pluginIcon}>
                            <img lwc:if={pluginIcon} src={pluginIcon}
                                style="width:30px; height:30px; margin-left:6px; cursor:pointer; border-radius:3px;" />
                        </template>
                        <lightning-icon lwc:else icon-name={headerLabels.iconName}>
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body slds-m-left--small">
                        <div class="slds-text-title">
                            <p class="slds-text-title slds-line-height_reset">
                                <template lwc:if={headerLabels.layoutSlogan}>
                                    {headerLabels.layoutSlogan}
                                </template>
                                <template lwc:else>
                                    {headerLabels.objectLabel}
                                </template>
                            </p>
                            <h1>
                                <template if:false={isTreeGrid}>
                                    <template lwc:if={displaylistView}>
                                        <div class="slds-list--inline">
                                            <template if:true={selectedListViews}>
                                                <div
                                                    class="slds-text-heading_small slds-text-title_bold slds-align_absolute-center">
                                                    {headerLabels.layoutLabel}
                                                </div>
                                                <lightning-button-menu variant="bare"
                                                    class="slds-button_icon-small slds-var-p-left_xx-small"
                                                    icon-size="small" menu-alignment="right">
                                                    <template for:each={listViewOptions} for:item="listView">
                                                        <lightning-menu-item key={listView.name} label={listView.label}
                                                            value={listView.name}
                                                            onclick={listViewChangeHandler}></lightning-menu-item>
                                                    </template>
                                                </lightning-button-menu>
                                            </template>
                                            <template if:false={selectedListViews}>
                                                <div class="slds-text-heading_small slds-text-title_bold">
                                                    {headerLabels.layoutLabel}</div>
                                                <lightning-button-menu
                                                    class="slds-button_icon-small slds-var-p-left_xx-small" disabled
                                                    title={Labels.LBL_No_Templates_Selected_as_List_View}
                                                    icon-size="small" menu-alignment="right">
                                                </lightning-button-menu>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <div class="slds-text-heading_small slds-text-title_bold">
                                            {headerLabels.layoutLabel}</div>
                                    </template>
                                    <!-- Hidden reusable helper component for data loading (used for Excel export) -->
                                    <c-data-loader-helper query={loadDataWrapper.query} record-id={recordId}
                                        onsuccess={handleExcelSuccess} onerror={handleExcelError} style="display:none">
                                    </c-data-loader-helper>
                                </template>
                                <template if:true={isTreeGrid}>
                                    <div class="slds-text-heading_small slds-text-title_bold"
                                        title={headerLabels.layoutLabel}>
                                        {headerLabels.layoutLabel}
                                    </div>
                                </template>
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-media--center" if:false={isTreeGrid}>
                <!--            buttons            -->
                <!-- SEARCH -->
                <lightning-input variant="label-hidden" oncommit={searchInputChangeHandler}
                    onkeypress={submitSearchKeyPressHandler} type="search" class="slds-var-p-left_xx-small">
                </lightning-input>
                <!-- NEW -->
                <lightning-button title={Labels.LBL_New} label={Labels.LBL_New} onclick={newRecord}
                    class="slds-var-p-left_xx-small" if:true={displayNewButton}></lightning-button>
                <!-- NEW INLINE -->
                <lightning-button title={labelNewInlineButton} label={labelNewInlineButton} onclick={newInlineRecord}
                    class="slds-var-p-left_xx-small slds-m-right--xx-small" if:true={displayNewInlineButton}
                    data-group-index={groupIndex}>
                </lightning-button>
                <!-- BACK -->
                <lightning-button label={Labels.LBL_Cancel} class="slds-m-right--xx-small" onclick={handleCancel}
                    if:true={hasChanges}>
                </lightning-button>
                <!-- SAVE -->
                <lightning-button if:true={hasChanges} label={Labels.LBL_Save} variant="brand" class=""
                    onclick={handleSave}>
                </lightning-button>
                <!-- FLOW ICONS AND BUTTONS -->
                <template for:each={iconFlows} for:item="flow">
                    <img key={flow.value} if:true={flow.value} src={flow.icon} alt={flow.label}
                        data-flow-name={flow.value} data-flow-label={flow.label} onclick={toggleFlow}
                        style="width:30px; height:30px; margin-left:6px; cursor:pointer; border-radius:3px;" />
                </template>

                <template for:each={buttonFlows} for:item="flow">
                    <lightning-button key={flow.value} if:true={flow.value} label={flow.label}
                        class="slds-var-p-left_xx-small" data-flow-name={flow.value} data-flow-label={flow.label}
                        onclick={toggleFlow}>
                    </lightning-button>
                </template>

                <!-- DROPDOWN MENU -->
                <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                    class="slds-var-p-left_xx-small" if:true={hasMenu}>
                    <template if:true={allowDelete}>
                        <lightning-menu-item label={Labels.LBL_Delete} prefix-icon-name="utility:delete"
                            onclick={popups.deletePopup.togglePopup}
                            if:true={selectedRecordIds.length}></lightning-menu-item>
                        <lightning-menu-item label={Labels.LBL_Delete} prefix-icon-name="utility:delete" disabled
                            if:false={selectedRecordIds.length}></lightning-menu-item>
                    </template>
                    <template if:true={displayShowHideColumns}>
                        <lightning-menu-item label={Labels.LBL_Show_Hide_Columns}
                            prefix-icon-name="utility:freeze_column" onclick={showHideColumns1}></lightning-menu-item>
                    </template>
                    <template if:true={displayListViewActions}>
                        <template if:true={selectedActions.length}>
                            <template if:true={showFirstDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                            <template for:each={selectedActions} for:item="action">
                                <lightning-menu-item class="slds-var-p-left-xx-small" variant="neutral" key={action.Id}
                                    label={action.MasterLabel} data-action={action.Name} data-url={action.Url}
                                    data-id={action.ScontrolId} onclick={handleActionsChange}>
                                </lightning-menu-item>
                            </template>
                            <template if:true={showSecondDivider}>
                                <lightning-menu-divider></lightning-menu-divider>
                            </template>
                        </template>
                    </template>
                    <!-- EXPORT EXCEL -->
                    <lightning-menu-item label={Labels.LBL_Export} prefix-icon-name="doctype:excel"
                        if:true={allowExport} onclick={exportExcel}></lightning-menu-item>
                    <!-- IMPORT EXCEL -->
                    <lightning-menu-item label={Labels.LBL_Import} prefix-icon-name="utility:upload"
                        if:true={allowImport} onclick={handleOpenImport}></lightning-menu-item>

                    <template for:each={actionFlows} for:item="flow">
                        <lightning-menu-item if:true={flow.value} key={flow.value} label={flow.label}
                            prefix-icon-name={flow.icon} data-flow-name={flow.value} data-flow-label={flow.label}
                            onclick={toggleFlow}>
                        </lightning-menu-item>
                    </template>
                </lightning-button-menu>
                <lightning-button-icon icon-name="utility:refresh" onclick={initData} variant="border-filled"
                    class="slds-var-p-left_xx-small">
                </lightning-button-icon>
                <lightning-button-icon-stateful icon-name="utility:filterList" selected={isFilterOpen}
                    variant="border-filled" onclick={toggleFilter} if:true={hasFilterSettingsFields}
                    class="slds-var-p-left_xx-small">
                </lightning-button-icon-stateful>
                <lightning-button-icon icon-name="utility:sort" variant="border-filled" onclick={toggleSortingPopup}
                    class="slds-var-p-left_xx-small" title="Sort">
                </lightning-button-icon>
            </div>
            <template if:true={showFileGenerationBar}>
                {fileGenerationLabel} <lightning-progress-bar value={fileGenerationValue}
                    variant="circular"></lightning-progress-bar>
            </template>
            <template if:true={showFileDownloadBar}>
                {Labels.LBL_File_Download} <lightning-progress-bar value={fileDownloadValue}
                    variant="circular"></lightning-progress-bar>
            </template>
        </div>
        <div class="slds-card" style="margin-top: 0; border-top: 0;">
            <div class="slds-grid">
                <div class="slds-size_1-of-1 slds-grid">
                    <div class="slds-col slds-wrap slds-scrollable">
                        <div class="main-panel slds-scrollable" style={tableStyle}>
                            <template if:false={isTreeGrid}>
                                <table if:true={displayedFields.length}
                                    class="initial-table slds-table slds-table_bordered slds-table_col-bordered main-table slds-no-row-hover slds-border_right">
                                    <thead class="stickyHeader">
                                        <tr class="sticky-thead">
                                            <th if:true={initDataWrapper.gridSettingsManager.groupedField}
                                                class="sticky-header limited-cell" style={groupedFieldTh.headerStyle}>
                                                {groupedFieldTh.label}
                                            </th>
                                            <th class="slds-grid--vertical-align-center slds-text-align--center sticky-header limited-cell"
                                                scope="col" if:true={showSelectRecords} style={firstThStyle}>
                                                <lightning-input type="checkbox" checked if:true={isAllSelected}
                                                    title={Labels.LBL_Select_All_Checkbox_Tooltip}
                                                    variant="label-hidden" onchange={toggleAllSelected}>
                                                </lightning-input>
                                                <lightning-input type="checkbox" if:false={isAllSelected}
                                                    title={Labels.LBL_Select_All_Checkbox_Tooltip}
                                                    variant="label-hidden" onchange={toggleAllSelected}>
                                                </lightning-input>
                                            </th>
                                            <th class="slds-text-align_center sticky-header limited-cell slds-align-bottom"
                                                scope="col" if:true={displayCloneButton} style={firstThStyle}>
                                            </th>
                                            <template for:each={displayedFields} for:item="field" for:index="index">
                                                <template if:false={field.isHidden}>
                                                    <th key={field.fieldName} title={field.fieldLabel}
                                                        style={field.headerStyle}
                                                        class="rowspanHeightTh slds-text-align_center">
                                                        <!-- if:false={field.isSortable} -->
                                                        <div>{field.fieldLabel}</div>
                                                        <div class="icons-container slds-grid">
                                                            <div if:true={field.isMassUpdate}>
                                                                <lightning-icon style={field.iconStyle}
                                                                    icon-name="utility:edit" size="xx-small"
                                                                    data-field={field.fieldName}
                                                                    onclick={toggleMassUpdatePanel}
                                                                    alternative-text={Labels.LBL_Mass_update}
                                                                    title={Labels.LBL_Mass_update}>
                                                                </lightning-icon>
                                                            </div>
                                                            <div if:true={field.isMassUpdate}
                                                                class="slds-hide slds-dropdown slds-p-around_x-small slds-col_bump-left"
                                                                data-updatefield={field.fieldName}
                                                                style={enableMassPopup}>
                                                                <span
                                                                    style="position: absolute;right: 0;top: 0; z-index: 5;">
                                                                    <lightning-button-icon variant="container"
                                                                        size="small" icon-name="utility:close"
                                                                        data-field={field.fieldName}
                                                                        onclick={toggleMassUpdatePanel}
                                                                        alternative-text="Close" title="Close">
                                                                    </lightning-button-icon>
                                                                </span>
                                                                <ul class="slds-dropdown__list slds-p-top--medium"
                                                                    role="menu" aria-label="Show More">
                                                                    <li class="slds-dropdown__item" role="presentation"
                                                                        style="text-align: left;">
                                                                        <template if:true={field.isText}>
                                                                            <lightning-input value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isBoolean}>
                                                                            <lightning-input type="checkbox" checked
                                                                                variant="label-hidden"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isTextArea}>
                                                                            <lightning-input-rich-text type="number"
                                                                                value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                if:true={field.isRichText}
                                                                                class="slds-text-align_right"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input-rich-text>
                                                                            <lightning-textarea value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                if:false={field.isRichText}
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-textarea>
                                                                        </template>
                                                                        <template if:true={field.isNumberField}>
                                                                            <lightning-input type="number"
                                                                                value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                class="slds-text-align_right"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <!-- Picklist -->
                                                                        <template if:true={field.isPicklist}>
                                                                            <lightning-record-edit-form
                                                                                object-api-name={objectApiName}
                                                                                onmouseenter={handleEnterHasDropDownElementSticky}>
                                                                                <template
                                                                                    if:false={field.hasDependentPicklist}>
                                                                                    <div class="slds-m-vertical--small">
                                                                                        <select
                                                                                            onchange={massUpdateHandler}
                                                                                            data-field={field.fieldName}
                                                                                            data-index={index}
                                                                                            data-field-dependancy="principal">
                                                                                            <template
                                                                                                for:each={field.options}
                                                                                                for:item="option">
                                                                                                <option
                                                                                                    key={option.value}
                                                                                                    value={option.value}
                                                                                                    selected={option.isSelected}>
                                                                                                    {option.label}
                                                                                                </option>
                                                                                            </template>
                                                                                        </select>
                                                                                    </div>
                                                                                </template>
                                                                                <template
                                                                                    if:true={field.hasDependentPicklist}>
                                                                                    <template
                                                                                        for:each={field.controlledByFields}
                                                                                        for:item="controlledField"
                                                                                        for:index="dependancyIndex">
                                                                                        <div key={controlledField.controlledByName}
                                                                                            class="slds-m-vertical--small">
                                                                                            {controlledField.controlledByLabel}
                                                                                            <select
                                                                                                onchange={massUpdateHandler}
                                                                                                data-field={controlledField.controlledByName}
                                                                                                data-index={index}
                                                                                                data-field-dependancy="controlledBy"
                                                                                                disabled={controlledField.disabled}
                                                                                                data-field-dependancy-index={dependancyIndex}>
                                                                                                <template
                                                                                                    for:each={controlledField.options}
                                                                                                    for:item="option">
                                                                                                    <option
                                                                                                        key={option.value}
                                                                                                        value={option.value}
                                                                                                        disabled={option.disabled}
                                                                                                        selected={option.isSelected}>
                                                                                                        {option.label}
                                                                                                    </option>
                                                                                                </template>
                                                                                            </select>
                                                                                        </div>
                                                                                    </template>
                                                                                </template>
                                                                            </lightning-record-edit-form>
                                                                            <!--</template>-->
                                                                        </template>
                                                                        <!-- MultiPicklist -->
                                                                        <lightning-record-edit-form
                                                                            if:true={field.isMultiPicklist}
                                                                            object-api-name={objectApiName}>
                                                                            <lightning-input-field
                                                                                variant="label-hidden"
                                                                                field-name={field.fieldName}
                                                                                value={field.fieldValue}
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input-field>
                                                                        </lightning-record-edit-form>
                                                                        <template if:true={field.isCurrency}>
                                                                            <lightning-input type="number"
                                                                                value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                class="slds-text-align_right"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isPercent}>
                                                                            <lightning-input type="number"
                                                                                variant="label-hidden"
                                                                                value={field.fieldValue}
                                                                                formatter="percent-fixed"
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isReference}>
                                                                            <lightning-record-edit-form
                                                                                if:false={field.isRecordType}
                                                                                onmouseenter={handleEnterHasDropDownElementSticky}
                                                                                object-api-name={objectApiName}
                                                                                class="lookup">
                                                                                <lightning-input-field
                                                                                    variant="label-hidden"
                                                                                    field-name={field.fieldName}
                                                                                    value={field.fieldValue}
                                                                                    data-field={field.fieldName}
                                                                                    onchange={massUpdateHandler}
                                                                                    data-index={index}>
                                                                                </lightning-input-field>
                                                                            </lightning-record-edit-form>
                                                                            <template if:true={field.isRecordType}>
                                                                                <lightning-combobox
                                                                                    variant="label-hidden"
                                                                                    value={field.fieldValue}
                                                                                    options={field.pickListValues}
                                                                                    data-field={field.fieldName}
                                                                                    onchange={massUpdateHandler}
                                                                                    data-index={index}></lightning-combobox>
                                                                            </template>
                                                                        </template>
                                                                        <template if:true={field.isUrl}>
                                                                            <lightning-input value={field.fieldValue}
                                                                                variant="label-hidden"
                                                                                if:false={field.hasFileInput}
                                                                                data-field={field.fieldName}
                                                                                onchange={massUpdateHandler}
                                                                                data-index={index}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <lightning-input if:true={field.isDate}
                                                                            variant="label-hidden"
                                                                            field-name={field.fieldName}
                                                                            value={field.fieldValue}
                                                                            data-field={field.fieldName} type="date"
                                                                            onchange={massUpdateHandler}
                                                                            data-index={index}>
                                                                        </lightning-input>
                                                                        <lightning-input if:true={field.isDateTime}
                                                                            variant="label-hidden"
                                                                            field-name={field.fieldName}
                                                                            value={field.fieldValue}
                                                                            data-field={field.fieldName} type="datetime"
                                                                            onchange={massUpdateHandler}
                                                                            data-index={index}>
                                                                        </lightning-input>
                                                                    </li>
                                                                    <li class="slds-dropdown__item" role="presentation"
                                                                        style="text-align: left;">
                                                                        {getMassUpdateLines}</li>
                                                                    <li class="slds-has-divider_top-space"
                                                                        role="separator">
                                                                    </li>
                                                                    <div>
                                                                        <button type="submit" title={Labels.LBL_Apply}
                                                                            style="width: 100%;"
                                                                            data-field={field.fieldName}
                                                                            onclick={handleApplyMassUpdate}
                                                                            class="slds-button slds-button_brand">
                                                                            {Labels.LBL_Apply}
                                                                        </button>
                                                                    </div>
                                                                </ul>
                                                            </div>
                                                            <div if:true={field.isSortable}>
                                                                <template if:true={field.sortedField}>
                                                                    <lightning-icon icon-name="utility:arrowdown"
                                                                        size="xx-small" variant="brand"
                                                                        data-field={field.fieldName}
                                                                        if:true={field.sortedDescending}
                                                                        title="Sorted Descending"
                                                                        onclick={changeSortDirection}><!-- if:false={isSortASC} -->
                                                                    </lightning-icon>
                                                                    <lightning-icon icon-name="utility:arrowup"
                                                                        size="xx-small" variant="brand"
                                                                        data-field={field.fieldName}
                                                                        if:true={field.sortedAscending}
                                                                        onclick={changeSortDirection}
                                                                        title="Sorted Ascending"><!-- if:true={isSortASC} -->
                                                                    </lightning-icon>
                                                                </template>
                                                                <!-- <template if:false={field.sortedField}>
                                                                    <lightning-icon style={field.iconStyle}
                                                                        icon-name="utility:arrowup" size="xx-small"
                                                                        data-field={field.fieldName}
                                                                        onclick={changeSortDirection}>
                                                                    </lightning-icon>
                                                                </template> -->
                                                            </div>
                                                            <div if:true={field.isFilterable}>
                                                                <lightning-icon style={field.iconStyle}
                                                                    if:false={field.hasFilter} size="xx-small"
                                                                    icon-name="utility:filterList"
                                                                    data-field={field.fieldName}
                                                                    onclick={openDropDownFilter}
                                                                    alternative-text={Labels.LBL_Filter}
                                                                    title={Labels.LBL_Filter}>
                                                                </lightning-icon>
                                                                <lightning-icon if:true={field.hasFilter}
                                                                    variant="brand" size="xx-small"
                                                                    icon-name="utility:filterList"
                                                                    data-field={field.fieldName}
                                                                    onclick={openDropDownFilter}
                                                                    alternative-text={Labels.LBL_Filter}
                                                                    title={Labels.LBL_Filter}>
                                                                </lightning-icon>
                                                                <div class="slds-hide slds-dropdown slds-p-horizontal--medium"
                                                                    data-filter-field={field.fieldName}
                                                                    style="box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;top: 100%; z-index:6;">
                                                                    <span
                                                                        style="position: absolute;right: 0;top: 0; z-index: 7;">
                                                                        <lightning-button-icon variant="container"
                                                                            size="small" icon-name="utility:close"
                                                                            data-field={field.fieldName}
                                                                            onclick={openDropDownFilter}
                                                                            alternative-text='close'>
                                                                        </lightning-button-icon>
                                                                    </span>
                                                                    <ul class="slds-dropdown__list slds-scrollable--y"
                                                                        role="menu" aria-label="Show More"
                                                                        style={field.popUpStyle}>
                                                                        <li class="slds-dropdown__item"
                                                                            role="presentation"
                                                                            style="text-align: left;margin-top: 5px;">
                                                                            <lightning-checkbox-group
                                                                                if:true={field.isSearchableCheckboxes}
                                                                                name="filter" label='label'
                                                                                variant="label-hidden"
                                                                                options={field.options}
                                                                                data-field={field.fieldName}
                                                                                value={field.filterValue.values}
                                                                                onchange={handleChangeFilter}
                                                                                style="top:10px">
                                                                            </lightning-checkbox-group>
                                                                            <lightning-input
                                                                                if:true={field.isSearchableText}
                                                                                type="text"
                                                                                placeholder={Labels.LBL_Search}
                                                                                data-field={field.fieldName}
                                                                                variant="label-hidden" slot="actions"
                                                                                onchange={handleChangeFilter}
                                                                                value={field.filterValue.values}
                                                                                style="top:10px">
                                                                            </lightning-input>
                                                                            <div class="slds-form-element__control slds-grid slds-gutters"
                                                                                if:true={field.isSearchableInput}>
                                                                                <lightning-input type="number"
                                                                                    placeholder={Labels.LBL_Minimum}
                                                                                    data-field={field.fieldName}
                                                                                    step={field.step}
                                                                                    variant="label-hidden"
                                                                                    slot="actions" data-range='value1'
                                                                                    onchange={setSelectedRangeValue}
                                                                                    value={field.filterValue.value1}
                                                                                    style="top:10px;width:100px;"
                                                                                    class="slds-m-horizontal--medium">
                                                                                </lightning-input>
                                                                                <span
                                                                                    style='margin-top: 1.75rem;'>-</span>
                                                                                <lightning-input type="number"
                                                                                    placeholder={Labels.LBL_Maximum}
                                                                                    data-field={field.fieldName}
                                                                                    step={field.step}
                                                                                    variant="label-hidden"
                                                                                    slot="actions" data-range='value2'
                                                                                    onchange={setSelectedRangeValue}
                                                                                    value={field.filterValue.value2}
                                                                                    style="top:10px;width:100px;"
                                                                                    class="slds-m-horizontal--medium">
                                                                                </lightning-input>
                                                                            </div>
                                                                            <div class="slds-form-element__control slds-grid slds-gutters"
                                                                                if:true={field.isSearchableDateInput}>
                                                                                <lightning-input type="date"
                                                                                    placeholder={Labels.LBL_Minimum}
                                                                                    data-field={field.fieldName}
                                                                                    variant="label-hidden"
                                                                                    slot="actions" data-range='value1'
                                                                                    onchange={setSelectedRangeValue}
                                                                                    value={field.filterValue.value1}
                                                                                    style="top:10px;width:100px;"
                                                                                    class="slds-m-horizontal--medium">
                                                                                </lightning-input>
                                                                                <span
                                                                                    style='margin-top: 1.75rem;'>-</span>
                                                                                <lightning-input type="date"
                                                                                    placeholder={Labels.LBL_Maximum}
                                                                                    data-field={field.fieldName}
                                                                                    variant="label-hidden"
                                                                                    slot="actions" data-range='value2'
                                                                                    onchange={setSelectedRangeValue}
                                                                                    value={field.filterValue.value2}
                                                                                    style="top:10px;width:100px;"
                                                                                    class="slds-m-horizontal--medium">
                                                                                </lightning-input>
                                                                            </div>
                                                                        </li>
                                                                        <li class="slds-has-divider_top-space"
                                                                            role="separator"></li>
                                                                    </ul>
                                                                    <div class="slds-grid">
                                                                        <div style="width: max-content;"
                                                                            class="slds-col slds-align--absolute-center slds-m-right--x-small">
                                                                            <button type="submit"
                                                                                title={Labels.LBL_Reset}
                                                                                onclick={handleResetFilters}
                                                                                class="slds-button slds-button_neutral"
                                                                                data-field={field.fieldName}>
                                                                                {Labels.LBL_Reset}
                                                                            </button>
                                                                        </div>
                                                                        <div style="width: max-content;"
                                                                            class="slds-col slds-align--absolute-center">
                                                                            <button type="submit"
                                                                                title={Labels.LBL_Apply}
                                                                                data-field={field.fieldName}
                                                                                onclick={handleApplyFilters}
                                                                                class="slds-button slds-button_brand">
                                                                                {Labels.LBL_Apply}
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div if:true={field.hasHelpText}>
                                                                <lightning-icon style={field.iconStyle} size="xx-small"
                                                                    icon-name="utility:info" title={field.helpText}>
                                                                </lightning-icon>
                                                            </div>
                                                        </div>
                                                    </th>
                                                </template>
                                            </template>
                                            <!-- empty th -->
                                            <th class="slds-text-align_center sticky-header limited-cell slds-align-bottom"
                                                scope="col" if:true={displayLastTd} style={lastThStyle}>
                                            </th>
                                        </tr>
                                        <tr if:true={hasTotalFields} class="total-row slds-color__background_gray-4">
                                            <td class="slds-color__background_gray-4"
                                                if:true={initDataWrapper.gridSettingsManager.groupedField}></td>
                                            <td class="slds-color__background_gray-4" if:true={showSelectRecords}></td>
                                            <td class="slds-color__background_gray-4" if:true={displayCloneButton}></td>
                                            <template for:each={displayedFields} for:item="field">
                                                <template if:false={field.isHidden}>
                                                    <td key={field}
                                                        class="slds-text-align_center limited-cell slds-color__background_gray-4"
                                                        scope="col">
                                                        <template lwc:if={field.isPercent}>
                                                            <lightning-formatted-number value={field.total}
                                                                format-style="percent-fixed"
                                                                minimum-fraction-digits={field.scale}
                                                                maximum-fraction-digits={field.scale}></lightning-formatted-number>
                                                        </template>
                                                        <template lwc:elseif={field.isCurrency}>
                                                            <template if:true={showCurrency}>
                                                                <template if:true={showCurrencyAsSymbol}>
                                                                    <div if:true={field.CurrencyExist} class="textCell">
                                                                        <lightning-formatted-number value={field.total}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-code={field.CurrencyIsoCode}>
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                    <div if:false={field.CurrencyExist}>
                                                                        <lightning-formatted-number value={field.total}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}>
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                </template>
                                                                <template if:false={showCurrencyAsSymbol}>
                                                                    <div if:true={field.CurrencyExist} class="textCell">
                                                                        <lightning-formatted-number value={field.total}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-code={field.CurrencyIsoCode}
                                                                            currency-display-as="code">
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                    <div if:false={field.CurrencyExist}>
                                                                        <lightning-formatted-number value={field.total}
                                                                            format-style="currency"
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}
                                                                            currency-display-as="code">
                                                                        </lightning-formatted-number>
                                                                    </div>
                                                                </template>
                                                            </template>
                                                            <template if:false={showCurrency}>
                                                                <div if:true={field.CurrencyExist} class="textCell">
                                                                    <lightning-formatted-number value={field.total}
                                                                        minimum-fraction-digits={field.scale}
                                                                        maximum-fraction-digits={field.scale}>
                                                                    </lightning-formatted-number>
                                                                </div>
                                                                <template if:false={field.CurrencyExist}>
                                                                    <lightning-formatted-number value={field.total}
                                                                        minimum-fraction-digits={field.scale}
                                                                        maximum-fraction-digits={field.scale}>
                                                                    </lightning-formatted-number>
                                                                </template>
                                                            </template>
                                                        </template>
                                                        <lightning-formatted-number lwc:else value={field.total}
                                                            minimum-fraction-digits={field.scale}
                                                            maximum-fraction-digits={field.scale}></lightning-formatted-number>
                                                    </td>
                                                </template>
                                            </template>
                                            <td class="slds-color__background_gray-4" if:true={displayLastTd}></td>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={records} for:item="record" for:index="groupIndex">
                                            <template iterator:item={record.records} lwc:if={record.records.length}>
                                                <template if:true={item.first}>
                                                    <template
                                                        if:true={initDataWrapper.gridSettingsManager.groupedField}>
                                                        <tr key={record.GroupId} class="firsthierarchyRow">
                                                            <th rowspan={record.rowspan}
                                                                class="headerRow slds-p-around_x-small groupedFieldTextStyle"
                                                                style={groupedFieldTh.bodyStyle}>
                                                                <a if:true={isReferenceField} href={record.link}
                                                                    target="_blank">
                                                                    {record.GroupName}</a>
                                                                <span
                                                                    if:false={isReferenceField}>{record.GroupName}</span>
                                                            </th>
                                                        </tr>
                                                    </template>
                                                </template>
                                                <tr key={item.value.Id} class="trHeight" data-row-index={item.index}>
                                                    <td if:true={showSelectRecords} class="slds-border_left"
                                                        style={item.value.firstTdStyle}>
                                                        <!-- <div class="slds-grid slds-grid_vertical-align-center slds-gutters_xx-small"> -->
                                                            <lightning-input class="input-center slds-gutters_xx-small"
                                                                type="checkbox" checked={item.value.isSelected}
                                                                data-id={item.value.Id} data-index={item.index}
                                                                value={item.value.isSelected}
                                                                data-group-index={groupIndex}
                                                                onchange={toggleSelectedRecords}></lightning-input>
                                                        <!-- </div> -->
                                                        <template if:true={item.value.hasError}>
                                                            <lightning-icon icon-name="utility:error" size="xx-small"
                                                                class="error-icon">
                                                            </lightning-icon>
                                                        </template>
                                                    </td>
                                                    <td data-row-index={item.index} style={item.value.firstTdStyle}
                                                        if:true={displayCloneButton}>
                                                        <lightning-button-icon onclick={cloneRecord}
                                                            if:false={item.value.isNew} icon-name="utility:copy"
                                                            data-id={item.value.Id} variant="bare"
                                                            data-group-index={groupIndex}>
                                                        </lightning-button-icon>
                                                        <lightning-button-icon if:true={item.value.isNew}
                                                            onclick={cloneRecord} icon-name="utility:copy"
                                                            variant="bare" disabled>
                                                        </lightning-button-icon>
                                                    </td>
                                                    <template for:each={item.value.values} for:item="field">
                                                        <template if:false={field.isHidden}>
                                                            <td key={field.fieldName} style={field.style}
                                                                if:false={field.isPersonalised} class={field.class}>
                                                                <!-- -----(isReadOnly === false) ----isPersonalised- -->
                                                                <template if:true={field.isInputField}>
                                                                    <!-- Text -->
                                                                    <lightning-input lwc:if={field.isText}
                                                                        data-id={item.value.Id}
                                                                        data-field={field.fieldName}
                                                                        data-index={item.index}
                                                                        onchange={handleFieldEdits}
                                                                        data-group-index={groupIndex}
                                                                        label={field.fieldLabel} variant="label-hidden"
                                                                        value={field.fieldValue}>
                                                                    </lightning-input>
                                                                    <!-- URL -->
                                                                    <template lwc:elseif={field.isUrl}>
                                                                        <lightning-input value={field.fieldValue}
                                                                            variant="label-hidden"
                                                                            if:false={field.hasFileInput}
                                                                            data-field={field.fieldName}
                                                                            data-id={item.value.Id}
                                                                            data-index={item.index}
                                                                            onchange={handleFieldEdits}
                                                                            data-group-index={groupIndex}>
                                                                        </lightning-input>
                                                                        <div if:true={field.hasFileInput}
                                                                            class='slds-grid'>
                                                                            <div class="slds-truncate">
                                                                                <a href={field.fieldValue}
                                                                                    target="_blank">{field.fieldValue}</a>
                                                                            </div>
                                                                            <div class='slds-col_bump-left'>
                                                                                <lightning-button-icon
                                                                                    data-row-index={item.index}
                                                                                    icon-name="utility:delete"
                                                                                    size="small"
                                                                                    alternative-text={Labels.LBL_Delete}
                                                                                    class="slds-m-left_xx-small"
                                                                                    data-id={item.value.Id}
                                                                                    data-index={item.index}
                                                                                    data-field={field.fieldName}
                                                                                    data-field-value={field.fieldValue}
                                                                                    onclick={handleDeleteInputFilePopup}
                                                                                    if:true={field.fieldValue}>
                                                                                </lightning-button-icon>
                                                                                <lightning-button-icon
                                                                                    data-row-index={item.index}
                                                                                    icon-name="utility:upload"
                                                                                    size="small"
                                                                                    alternative-text={Labels.LBL_Upload_File}
                                                                                    class="slds-m-left_xx-small"
                                                                                    data-id={item.value.Id}
                                                                                    data-field={field.fieldName}
                                                                                    data-field-value={field.fieldValue}
                                                                                    data-index={item.index}
                                                                                    onclick={handleToggleInputFilePopup}>
                                                                                </lightning-button-icon>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                    <!-- Boolean ??-->
                                                                    <lightning-input lwc:elseif={field.isBoolean}
                                                                        type="checkbox" variant="label-hidden"
                                                                        data-id={item.value.Id}
                                                                        data-field={field.fieldName}
                                                                        data-index={item.index}
                                                                        onchange={handleFieldEdits}
                                                                        data-group-index={groupIndex}
                                                                        checked={field.fieldValue}>
                                                                    </lightning-input>
                                                                    <!-- Rich Text -->
                                                                    <template lwc:elseif={field.isTextArea}>
                                                                        <lightning-input-rich-text type="number"
                                                                            step={field.increment}
                                                                            value={field.fieldValue}
                                                                            variant="label-hidden"
                                                                            if:true={field.isRichText}
                                                                            class="slds-text-align_right"
                                                                            data-field={field.fieldName}
                                                                            data-id={item.value.Id}
                                                                            data-index={item.index}
                                                                            onchange={handleFieldEdits}
                                                                            data-group-index={groupIndex}>
                                                                        </lightning-input-rich-text>
                                                                        <lightning-textarea value={field.fieldValue}
                                                                            variant="label-hidden"
                                                                            if:false={field.isRichText}
                                                                            data-field={field.fieldName}
                                                                            data-id={item.value.Id}
                                                                            data-index={item.index}
                                                                            onchange={handleFieldEdits}
                                                                            data-group-index={groupIndex}>
                                                                        </lightning-textarea>
                                                                    </template>

                                                                    <!-- Date -->
                                                                    <lightning-input lwc:elseif={field.isDate}
                                                                        type="date" data-id={item.value.Id}
                                                                        data-field={field.fieldName}
                                                                        data-index={item.index}
