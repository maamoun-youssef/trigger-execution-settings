<template>
    <div class="slds-card mainContainer">
        <!-- Empty State: No PWF Data -->
        <template if:false={allRecords.length}>
            <div class="slds-card__body slds-card__body_inner slds-m-around--x-small">
                <div class="slds-align--absolute-center" style={noDataHeight}>
                    <div class="slds-illustration slds-illustration_large" style={noDataImageStyle} aria-hidden="true">
                        <img src="/img/chatter/Desert.svg" class="slds-illustration__svg" alt="" />
                        <div class="slds-text-color_weak">
                            <b class="slds-text-heading_medium">{labels.LBL_NS_PG_No_Data}
                            </b>
                        </div>
                        <div class="slds-text-longform">
                            <h3 class="slds-text-heading_medium">{labels.LBL_CockpitPWF_No_Data}</h3>
                            <a href="javascript:void(0)" class="slds-m-top_small empty-state-link" onclick={executeBatch}>
                                {labels.LBL_CockpitPWF_Init_PWF}
                            </a>
                        </div>
                        <div class="slds-align--absolute-center">
                            <span class="slds-popover__body">
                                <lightning-formatted-rich-text value={labels.LBL_NS_PG_No_Data_Help}>
                                </lightning-formatted-rich-text>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Normal State: PWF Data Exists -->
        <template if:true={allRecords.length}>
            <!-- New Header with Sync Status and Action Buttons -->
            <div class="slds-p-around--x-small">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <!-- Left side: Icon, Title, Status, and Last Run Date -->
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom19" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <h2 class="slds-text-heading_medium slds-m-right_medium">{labels.LBL_CockpitPWF_Title}
                                </h2>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span class={syncStatusClass}>● {syncStatusLabel}</span>
                                    <span class="slds-m-left_medium slds-text-body_small">
                                        {labels.LBL_CockpitPWF_LastRun}&nbsp;
                                        <template lwc:if={lastSync}>
                                            <lightning-formatted-date-time value={lastSync} day="2-digit"
                                                month="2-digit" year="numeric" hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </template>
                                        <template lwc:else>{labels.LBL_CockpitPWF_NotSynchronized}</template>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Right side: Action Buttons -->
                    <div class="slds-grid slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label={labels.LBL_CockpitPWF_Init_PWF} onclick={executeBatch}
                                variant="brand" disabled={isLoading}>
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button label={labels.LBL_CockpitPWF_Open_PWF} onclick={openLatestPWFMatrix}
                                variant="neutral" disabled={disableOpenPWF}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Data Grid -->
            <div class="slds-scrollable body" style="max-height: 400px;">
                <table
                    class="slds-table slds-table_cell-buffer slds-table_bordered slds-border--left slds-border--right">
                    <thead>
                        <tr>
                            <template for:each={displayedFields} for:item="field">
                                <th key={field.fieldName} title={field.fieldLabel} style={field.headerStyle} class="table-header-cell">
                                    <div class="table-header-text">{field.fieldLabel}</div>
                                </th>
                            </template>
                            <th style="width:90px" class="table-header-cell actions-column">
                                <div class="table-header-text">{labels.LBL_CockpitPWF_Actions}</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={records} for:item="rec" lwc:if={records.length}>
                            <tr key={rec.id}>
                                <template for:each={rec.values} for:item="field">
                                    <td key={field.fieldName} style={field.style} class="slds-truncate">
                                        <div>
                                            <template lwc:if={field.isNumberField}>
                                                <lightning-formatted-number minimum-fraction-digits={field.scale}
                                                    maximum-fraction-digits={field.scale} value={field.fieldValue}>
                                                </lightning-formatted-number>
                                            </template>

                                            <template lwc:elseif={field.isNameField}>
                                                <a href={field.link} target="_blank">
                                                    {field.fieldValue}
                                                </a>
                                            </template>

                                            <template lwc:elseif={field.isReference}>
                                                <a href={field.link} target="_blank">
                                                    {field.fieldValue}
                                                </a>
                                            </template>

                                            <lightning-input lwc:elseif={field.isBoolean} type="checkbox"
                                                class="input-center" variant="label-hidden" checked={field.fieldValue}
                                                disabled>
                                            </lightning-input>

                                            <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                value={field.fieldValue} year="numeric" month="2-digit" day="2-digit">
                                            </lightning-formatted-date-time>

                                            <lightning-formatted-date-time lwc:elseif={field.isDateTime}
                                                value={field.fieldValue} year="numeric" month="2-digit" day="2-digit"
                                                hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>

                                            <template lwc:elseif={field.isPicklist}>
                                                {field.fieldOutputValue}
                                            </template>

                                            <template lwc:else>
                                                {field.fieldValue}
                                            </template>
                                        </div>
                                    </td>
                                </template>

                                <td class="actions-column">
                                    <lightning-button-icon icon-name="utility:preview"
                                        alternative-text={labels.LBL_CockpitPWF_OpenMatrix}
                                        title={labels.LBL_CockpitPWF_OpenMatrix} variant="bare" onclick={openPWFMatrix}
                                        data-id={rec.id}>
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>

                        <template lwc:else>
                            <tr>
                                <td style="text-align: center;" colspan={noItemToDisplayColspan}>
                                    {labels.LBL_No_Item_To_Display}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>
    </div>
</template>
