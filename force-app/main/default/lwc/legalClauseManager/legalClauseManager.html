                                                style="gap:5px;">
                                                <!-- Past Version (Display Only) -->
                                                <div class="slds-grid slds-grid--vertical slds-size_1-of-3">

                                                    <div class="version-header past-header slds-grid">
                                                        <h4 class="version-title slds-col slds-m-vertical--medium">
                                                            {Labels.LBL_PastVersion}</h4>
                                                        <!-- Only show dropdown if there are other versions to compare -->
                                                        <template if:true={clause.hasVersionsToCompare}>
                                                            <lightning-combobox value={clause.selectedCompareVersionId}
                                                                options={clause.compareVersionOptions}
                                                                onchange={handleCompareVersionChange}
                                                                data-id={clause.Id} variant="label-hidden"
                                                                class="version-selector slds-col slds-m-vertical--small"
                                                                dropdown-alignment="left">
                                                            </lightning-combobox>
                                                        </template>
                                                    </div>
                                                    <div class="slds-col  version-column">

                                                        <div class="version-content past-content">
                                                            <lightning-formatted-rich-text
                                                                value={clause.pastVersionContent} class="version-text">
                                                            </lightning-formatted-rich-text>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Current Version (Display Only with Track Changes) -->
                                                <div class="slds-grid slds-grid--vertical slds-size_1-of-3">
                                                    <div class="version-header current-header slds-grid">
                                                        <h4 class="version-title slds-col slds-m-vertical--medium">
                                                            {Labels.LBL_CurrentVersion}
                                                        </h4>
                                                    </div>
                                                    <div class="slds-col  version-column">
                                                        <lightning-formatted-rich-text
                                                            value={clause.currentVersionContent} class="version-text">
                                                        </lightning-formatted-rich-text>
                                                    </div>
                                                </div>

                                                <!-- New Version (Editable) -->
                                                <div class="slds-grid slds-grid--vertical slds-size_1-of-3">
                                                    <div class="version-header new-header slds-grid">
                                                        <h4 class="version-title slds-col slds-m-vertical--medium">
                                                            {Labels.LBL_NewVersion}</h4>
                                                        <lightning-button-icon icon-name="utility:edit"
                                                            alternative-text={Labels.LBL_Edit} variant="bare"
                                                            onclick={handleToggleEditMode} data-id={clause.Id}
                                                            class="edit-version-btn slds-col slds-m-vertical--small slds-x-small-size_xxx-small"
                                                            title={Labels.LBL_Edit}>
                                                        </lightning-button-icon>
                                                    </div>
                                                    <div class="slds-col  version-column ">
                                                        <template if:false={clause.isEditingNewVersion}>
                                                            <lightning-formatted-rich-text
                                                                value={clause.newVersionContent} class="version-text">
                                                            </lightning-formatted-rich-text>
                                                        </template>
                                                        <template if:true={clause.isEditingNewVersion}>
                                                            <lightning-input-rich-text
                                                                value={clause.editingClause._Clause__c} data-field={LegalDocClause_API.Clause__c}
                                                                onchange={handleEditClauseChange} data-id={clause.Id}
                                                                class="new-version-editor version-content">
                                                            </lightning-input-rich-text>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Options Row - Non-portal only -->
                                            <template if:true={isLegal}>
                                                <div class="slds-p-horizontal_small slds-p-bottom_small">
                                                    <lightning-input type="checkbox"
                                                        label={fieldLabels.LegalDocClause__c.IsNegotiable__c}
                                                        checked={clause.editingClause._IsNegotiable__c}
                                                        onchange={handleEditClauseChange}
                                                        data-id={clause.Id}
                                                        data-field={LegalDocClause_API.IsNegotiable__c}>
                                                    </lightning-input>
                                                </div>
                                            </template>
                                            <!-- Action Buttons -->
                                            <div class="comparison-footer slds-p-around_small">
                                                <div class="slds-grid slds-grid_align-end">
                                                    <!-- Cancel - Always visible -->
                                                    <lightning-button label={Labels.LBL_Cancel}
                                                        onclick={handleCloseInlineEdit} data-id={clause.Id}
                                                        class="slds-m-right_x-small" data-type="full">
                                                    </lightning-button>
                                                    <!-- Save Draft - Always visible -->
                                                    <lightning-button variant="brand" label={Labels.LBL_Save}
                                                        class="slds-m-right_x-small" data-id={clause.Id} data-type="full"
                                                        onclick={handleSaveClause}>
                                                    </lightning-button>
                                                </div>
                                            </div>
                                            <!-- <c-comment-manager ...> -->
                                            <template if:true={hasSupplier}>
                                                <template if:true={isPortalUser}>
                                                    <c-comment-manager record-id={clause.Id} islegal={isLegal}
                                                        isbo={isBOUser} isportal={isPortalUser} type="portal"
                                                        track-action-records={clause.relatedActivities}
                                                        user={currentUser} account={supplierAccount}
                                                        ontrackactioncreated={handleTrackActionCreated}
                                                        ontrackactionupdated={handleTrackActionUpdated} read-only={readOnlyChat}
                                                        onresolve={handleResolveComments}></c-comment-manager>
                                                </template>
                                                <template if:false={isPortalUser}>
                                                    {Labels.LBL_LD_CommentToSupp}:
                                                    <c-comment-manager record-id={clause.Id} islegal={isLegal}
                                                        isbo={isBOUser} isportal={isPortalUser} type="portal"
                                                        track-action-records={clause.relatedActivities}
                                                        user={currentUser} account={supplierAccount}
                                                        ontrackactioncreated={handleTrackActionCreated}
                                                        ontrackactionupdated={handleTrackActionUpdated} read-only={readOnlyChat}
                                                        onresolve={handleResolveComments}></c-comment-manager>
                                                    {Labels.LBL_LD_CommentToBO}:
                                                    <c-comment-manager record-id={clause.Id} islegal={isLegal}
                                                        isbo={isBOUser} isportal={isPortalUser} type="nonportal"
                                                        track-action-records={clause.relatedActivities}
                                                        user={currentUser} account={supplierAccount}
                                                        ontrackactioncreated={handleTrackActionCreated}
                                                        ontrackactionupdated={handleTrackActionUpdated} read-only={readOnlyChat}
                                                        onresolve={handleResolveComments}></c-comment-manager>
                                                </template>
                                            </template>

                                        </div>

                                    </template>
                                </template>
                            </div>
                            <div key={clause.Id} class="separator slds-m-around--xx-small"></div>
                        </template>
                    </div>
                </template>

                <template if:true={noRecordsToDisplay}>
                    <div class="slds-align_absolute-center slds-p-around_large no-clauses">
                        <div class="slds-text-align_center">
                            <lightning-icon icon-name="utility:info" size="large"
                                class="slds-m-bottom_small"></lightning-icon>
                            <p class="slds-text-heading_small">{Labels.LBL_LD_NoLegalClause}</p>
                            <p if:true={isLegal} class="slds-text-body_small slds-m-top_x-small">
                                {Labels.LBL_LD_AccordionNoClauseBody}</p>
                        </div>
                    </div>
                </template>

                <!-- Inline Add New Clause (no popup, no chatter, clause type only when adding) -->
                <template if:true={isAddingNewClause}>
                    <div class={clausesListClass}>
                        <div class="clause-item-wrapper clause-new-inline">
                            <div class="simple-edit-inline slds-box slds-theme_shade greyBackground new-clause-inline">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-col slds-shrink-none slds-text-align--right">
                                        <template if:true={isMyTurn}>
                                            <lightning-button if:false={hasSupplier}
                                                label={Labels.LBL_Insert_Merge_Field} variant="neutral" data-id=""
                                                onclick={openMergeFieldModal} class="slds-m-right--large">
                                            </lightning-button>
                                        </template>
                                        <lightning-button-icon icon-name="utility:close" alternative-text="Fermer"
                                            variant="bare" onclick={handleCancelNewClauseInline}
                                            title={Labels.LBL_Close} class="close-inline-btn">
                                        </lightning-button-icon>
                                    </div>
                                </div>
                                <div class="simple-edit-content slds-p-around_medium">
                                    <div class="slds-m-bottom_small">
                                        <label class="slds-form-element__label"><abbr class="slds-required">*</abbr>
                                            {fieldLabels.LegalDocClause__c.Clause__c}</label>
                                        <lightning-input-rich-text value={newClause._Clause__c}
                                            onchange={handleNewClauseFieldChange}
                                            data-field={LegalDocClause_API.Clause__c}
                                            placeholder={Labels.LBL_LD_EnterTextOfClause}
                                            class="clause-rich-text-editor new-clause-editor">
                                        </lightning-input-rich-text>
                                    </div>
                                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input type="number"
                                                label={fieldLabels.LegalDocClause__c.DisplayOrder__c}
                                                value={newClause._DisplayOrder__c} onchange={handleNewClauseFieldChange}
                                                data-field={LegalDocClause_API.DisplayOrder__c}
                                                data-wrapper="displayOrder" disabled>
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox label={fieldLabels.LegalDocClause__c.ClauseType__c}
                                                value={newClause._ClauseType__c}
                                                options={clauseTypeOptions}
                                                onchange={handleNewClauseFieldChange}
                                                data-field={LegalDocClause_API.ClauseType__c} data-wrapper="clauseType"
                                                required>
                                            </lightning-combobox>
                                        </div>
                                    </div>
                                    <div class="slds-m-bottom_small">
                                        <lightning-input type="checkbox"
                                            label={fieldLabels.LegalDocClause__c.IsNegotiable__c}
                                            checked={newClause._IsNegotiable__c}
                                            onchange={handleNewClauseFieldChange}
                                            data-field={LegalDocClause_API.IsNegotiable__c} data-wrapper="isNegotiable">
                                        </lightning-input>
                                    </div>
                                    <div class="slds-m-bottom_small">
                                        <lightning-dual-listbox label={fieldLabels.LegalDocClause__c.BusinessOwners__c}
                                            source-label={Labels.LBL_Available} selected-label={Labels.LBL_Select}
                                            options={businessOwnerOptions}
                                            value={selectedBusinessOwners}
                                            onchange={handleNewClauseFieldChange}
                                            data-field={LegalDocClause_API.BusinessOwners__c}>
                                        </lightning-dual-listbox>
                                    </div>
                                </div>
                                <div class="simple-edit-footer slds-p-around_small">
                                    <div class="slds-grid slds-grid_align-end">
                                        <lightning-button label={Labels.LBL_Cancel}
                                            onclick={handleCancelNewClauseInline} class="slds-m-right_x-small">
                                        </lightning-button>
                                        <lightning-button variant="brand" label={Labels.LBL_Add}
                                            onclick={handleSaveNewClause}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

            </div>
            <!-- </lightning-accordion-section>
                </lightning-accordion> -->
        </template>
    </lightning-card>

    <!-- Supplier Selection Modal (Standard Mode Only) -->
    <template if:true={showSupplierModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseSupplierModal} title={Labels.LBL_Close}>
                        <lightning-icon icon-name="utility:close" alternative-text={Labels.LBL_Close} size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {Labels.LBL_SendToSupplier}
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium supplier-modal-content">
                    <!-- Header with count on left and search on right -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <div class="slds-col">
                            <p class="slds-text-body_small slds-text-color_weak">
                                {headerCountLabel}
                            </p>
                        </div>
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-input type="search" placeholder={Labels.LBL_Placeholder_Search}
                                value={supplierSearchTerm} onchange={handleSupplierSearch} variant="label-hidden">
                            </lightning-input>
                        </div>
                    </div>

                    <template lwc:if={isLoadingSuppliers}>
                        <div class=" greyBg">
                            <div class="loader slds-spinner_container slds-align_absolute-center">
                            </div>
                        </div>
                    </template>
                    <!-- Supplier Table - Dynamic Grid -->
                    <template if:false={isLoadingSuppliers}>
                        <div class="supplier-table-container">
                            <table
                                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered supplier-table">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" class="checkbox-col">
                                            <lightning-input type="checkbox" checked={isAllSuppliersSelected}
                                                onchange={handleSelectAllSuppliers} variant="label-hidden">
                                            </lightning-input>
                                        </th>
                                        <template for:each={supplierGridFields} for:item="field">
                                            <th key={field.fieldName} scope="col" style={field.headerStyle}>
                                                <div title={field.fieldLabel}>{field.fieldLabel}</div>
                                            </th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template if:true={filteredSuppliers.length}>
                                        <template for:each={filteredSuppliers} for:item="supplier">
                                            <tr key={supplier.Id} class={supplier.rowClass}>
                                                <td class="checkbox-col" title={supplier.disabledTooltip}>
                                                    <lightning-input type="checkbox" checked={supplier.isSelected}
                                                        data-id={supplier.Id} onchange={handleSupplierCheckboxChange}
                                                        variant="label-hidden" label={Labels.LBL_Select}
                                                        disabled={supplier.isDisabled}>
                                                    </lightning-input>
                                                </td>
                                                <template for:each={supplier.values} for:item="val">
                                                    <td key={val.fieldName} style={val.style}>
                                                        <template if:true={val.isReference}>
                                                            <div class="slds-truncate" title={val.fieldOutputValue}>
                                                                <a href={val.link} target="_blank"
                                                                    class="supplier-link">{val.fieldOutputValue}</a>
                                                            </div>
                                                        </template>
                                                        <template if:true={val.isText}>
                                                            <div class="slds-truncate" title={val.fieldOutputValue}>
                                                                {val.fieldOutputValue}</div>
                                                        </template>
                                                        <template if:true={val.isPicklist}>
                                                            <div class="slds-truncate" title={val.fieldOutputValue}>
                                                                {val.fieldOutputValue}</div>
                                                        </template>
                                                        <template if:true={val.isDate}>
                                                            <lightning-formatted-date-time value={val.fieldValue}
                                                                year="numeric" month="2-digit"
                                                                day="2-digit"></lightning-formatted-date-time>
                                                        </template>
                                                        <template if:true={val.isBoolean}>
                                                            <lightning-input type="checkbox" checked={val.fieldValue}
                                                                disabled variant="label-hidden"
                                                                label="value"></lightning-input>
                                                        </template>
                                                        <template if:true={val.isNumber}>
                                                            <div class="slds-truncate slds-text-align_right"
                                                                title={val.fieldOutputValue}>{val.fieldOutputValue}
                                                            </div>
                                                        </template>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </template>
                                    <template if:false={filteredSuppliers.length}>
                                        <tr>
                                            <td colspan="9" class="slds-text-align_center slds-p-around_medium">
                                                <p class="slds-text-color_weak">{Labels.LBL_No_Item_To_Display}</p>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                    <lightning-button label={Labels.LBL_Close} onclick={handleCloseSupplierModal}>
                    </lightning-button>

                    <lightning-button class="slds-m-left_small" variant="brand" label={Labels.LBL_Next}
                        onclick={handleSendToSuppliers} disabled={isSendDisabled}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- Contacts Modal -->
    <template if:true={showContactModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseContactModal} title={Labels.LBL_Close}>
                        <lightning-icon icon-name="utility:close" alternative-text={Labels.LBL_Close} size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {Labels.LBL_LD_ContactModalTitle}
                    </h2>
                </header>
                <!-- Content -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Search -->
                    <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
                        <div class="slds-col slds-size_4-of-12 ">
                            <lightning-input type="search" placeholder={Labels.LBL_Placeholder_Search}
                                value={contactSearchTerm} onchange={handleContactSearch} variant="label-hidden">
                            </lightning-input>
                        </div>
                    </div>
                    <div class="supplier-table-container">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr>
                                    <template for:each={contactGridFields} for:item="field">
                                        <th key={field.fieldName} style={field.headerStyle}>
                                            {field.fieldLabel}
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template if:true={filteredContacts.length}>
                                    <template for:each={filteredContacts} for:item="contact">
                                        <tr key={contact.Id}>
                                            <template for:each={contact.values} for:item="val">
                                                <td key={val.fieldName} style={val.style}>
                                                    <template if:true={val.isReference}>
                                                        <a href={val.link} target="_blank">
                                                            {val.fieldOutputValue}
                                                        </a>
                                                    </template>
                                                    <template if:true={val.isText}>
                                                        {val.fieldOutputValue}
                                                    </template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </template>
                                <template if:false={filteredContacts.length}>
                                    <tr>
                                        <td colspan="3" class="slds-text-align_center slds-p-around_medium">
                                            {Labels.LBL_LD_NoContacts}
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Footer -->
                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                    <lightning-button label={Labels.LBL_Close} onclick={handleCloseContactModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={modalConfig.isOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 40rem; width: 100%;">
                <header class="slds-modal__header slds-theme_info">
                    <h2 class="slds-text-heading_medium">
                        {modalConfig.title}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-align_center">
                        {modalConfig.message}
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>
                        {Labels.LBL_Cancel}
                    </button>
                    <button class="slds-button slds-button_brand slds-m-left_small" onclick={handleConfirm}>
                        {modalConfig.confirmLabel}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={isMergeFieldModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" class="slds-modal__close"
                        onclick={closeMergeFieldModal}></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">{Labels.LBL_Insert_Merge_Field}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_2-of-3">
                            <lightning-combobox label={Labels.LBL_Select_Object} options={objectOptions}
                                value={selectedObject} onchange={handleObjectChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <div class="slds-grid slds-gutters slds-m-top_medium">
                        <div class="slds-col slds-size_2-of-3">
                            <lightning-combobox label={Labels.LBL_Select_Field} options={fieldOptions}
                                value={selectedField} onchange={handleFieldChange} disabled={isFieldDisabled}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-m-top_large">
                            <template if:true={selectedFieldInfo}>
                                <p class="slds-text-body_small"><strong>{Labels.LBL_LDLabel}:</strong>
                                    {selectedFieldInfo.fieldLabel}
                                </p>
                                <p class="slds-text-body_small" style="word-break: break-word;">
                                    <strong>{Labels.LBL_LDAPI}:</strong>
                                    {selectedFieldInfo.fieldValue}
                                </p>
                            </template>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label={Labels.LBL_Close} onclick={closeMergeFieldModal}></lightning-button>
                    <lightning-button class="slds-m-left--small" variant="brand" label={Labels.LBL_Insert}
                        onclick={insertSelectedMergeFields}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Confirmation Modal for Save Global Variables -->
    <template if:true={showSaveConfirmationModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-save" aria-modal="true"
            aria-describedby="modal-content-save" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 60rem; width: 100%;">
                <header class="slds-modal__header slds-theme--info">
                    <h2 id="modal-heading-saveGl" class="slds-text-heading_medium slds-hyphenate">
                        {Labels.LBL_Confirm}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-saveGL">
                    <p class="slds-align_absolute-center">{Labels.LBL_LD_confirmationMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button class="slds-m-right--small" label={Labels.LBL_Close}
                        onclick={closeSaveConfirmationModal}></lightning-button>
                    <lightning-button variant="brand" label={Labels.LBL_Save}
                        onclick={confirmSaveGlobalVariables}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={showGlobalVariablesPopup}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-delete" aria-modal="true"
            aria-describedby="modal-content-delete" class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container" style="max-width: 60rem; width: 100%;">

                <!-- Header -->
                <header class="slds-modal__header ">
                    <h2 id="modal-heading-variables" class="slds-text-heading_medium slds-hyphenate">
                        {Labels.LBL_LD_GlobalVariables}
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-variables">

                    <template for:each={mergeObjects} for:item="section">
                        <div key={section.fieldValue} class="slds-m-bottom_medium">

                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                {section.fieldLabel}
                            </h3>

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th style="font-weight:bold;">{Labels.LBL_LDLabel}</th>
                                        <th style="font-weight:bold;">API</th>
                                        <th style="font-weight:bold;">{Labels.LBL_Value}</th>
                                        <th style="font-weight:bold;">{Labels.LBL_New}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={section.wFieldWrapperList} for:item="field">
                                        <tr key={field.fieldValue}>
                                            <td class="slds-size--1-of-4" style="font-weight:bold;">{field.fieldLabel}
                                            </td>
                                            <td class="slds-size--1-of-4">{field.fieldAPI}</td>
                                            <td class="slds-size--1-of-4">{field.fieldOrgValue}</td>
                                            <td class="slds-size--1-of-4">
                                                <lightning-input type="text" placeholder='' value={field.overrideValue}
                                                    data-field-key={field.fieldValue}
                                                    data-original-value={field.fieldOrgValue}
                                                    onchange={handleGlobalVariableChange} variant="label-hidden"
                                                    disabled={field.isDisabled}>
                                                </lightning-input>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                        </div>
                    </template>

                </div>
                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCloseGlobalVariablesPopup}>
                        {Labels.LBL_Cancel}
                    </button>

                    <button class="slds-button slds-button_brand slds-m-left_small" onclick={confirmSaveGlobalVariables}
                        disabled={isGlobalVariablesSaveDisabled}>
                        {Labels.LBL_Save}
                    </button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
