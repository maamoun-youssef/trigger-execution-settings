<template>
    <template if:true={loadingData}>
        <div class="slds-spinner_container">
            <div class="loader slds-spinner_container slds-align_absolute-center">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </template>
    <div class="slds-card">
        <div class="settings-header">
            <lightning-icon icon-name='utility:settings' class="custom-icon-settings">
            </lightning-icon>
            <div>
                <p class="settings-subtitle">
                    {labels.LBL_myOffer}
                </p>
                <h1 class="slds-page-header__title settings-header-title">
                    {labels.LBL_Assortment_Settings}
                </h1>
            </div>
        </div>
        <div class="slds-grid slds-grid_align-end">
            <div class="slds-col save-button-container">
                <lightning-button class="slds-button slds-m-right_x-small" variant="brand" label={labels.LBL_Save}
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
        <div class="slds-scrollable">
            <lightning-tabset variant="vertical" class="tab-set-style slds-m-bottom_x-small">
                <lightning-tab label={labels.LBL_Global} class="slds-scrollable_y " style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_NS_Stg_General_Settings}
                                    </div>
                                </div>
                            </div>
                            <div class="add-space"></div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.applyCalcFullYearQtyP1}
                                </div>
                                <lightning-input data-field="applyCalcFullYearQty_P1" onchange={handleFieldChangeMdt}
                                    variant="label-hidden" type="toggle"
                                    checked={assortmentSettings.applyCalcFullYearQty_P1}
                                    class="slds-m-horizontal_small slds-m-top--small" message-toggle-active=""
                                    message-toggle-inactive="">
                                </lightning-input>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentProductSelectionRespectBU}
                                </div>
                                <lightning-input data-field="assortmentProductSelectionRespectBU" variant="label-hidden"
                                    onchange={handleFieldChangeMdt} type="toggle"
                                    checked={assortmentSettings.assortmentProductSelectionRespectBU}
                                    class="slds-m-horizontal_small slds-m-top--small" message-toggle-active=""
                                    message-toggle-inactive="">
                                </lightning-input>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentProductSelectionRespectMarket}
                                </div>
                                <lightning-input data-field="assortmentProductSelectionRespectMarket"
                                    variant="label-hidden" onchange={handleFieldChangeMdt} type="toggle"
                                    checked={assortmentSettings.assortmentProductSelectionRespectMarket}
                                    class="slds-m-horizontal_small slds-m-top--small" message-toggle-active=""
                                    message-toggle-inactive="">
                                </lightning-input>
                            </div>
                            <div class="add-breaks"> </div>

                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentProductSelectionRespectHierarchy}
                                </div>
                                <lightning-input data-field="assortmentProductSelectionRespectHierarchy"
                                    variant="label-hidden" onchange={handleFieldChangeMdt} type="toggle"
                                    checked={assortmentSettings.assortmentProductSelectionRespectHierarchy}
                                    class="slds-m-horizontal_small slds-m-top--small" message-toggle-active=""
                                    message-toggle-inactive="">
                                </lightning-input>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.kpi}
                                </div>
                                <lightning-radio-group name="radioGroup" options={KPIoptions}
                                    onchange={handleFieldChangeMdt} data-field="KPI" value={assortmentSettings.KPI}
                                    type="radio"></lightning-radio-group>
                            </div>
                            <div class="add-breaks"> </div>
                        </div>
                    </div>
                </lightning-tab>
                <lightning-tab label={labels.LBL_Page_Layout} class="slds-scrollable_y" style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_NS_Stg_General_Settings}
                                    </div>
                                </div>
                            </div>
                            <div class="label">
                                Assortment Screens Layouts
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentMatrixNego}
                                </div>
                                <lightning-combobox data-field="assortmentMatrixNego" variant="label-hidden"
                                    value={assortmentSettings.assortmentMatrixNego} onchange={handleFieldChangeMdt}
                                    class="input-w" placeholder="Select Template"
                                    options={asdTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentMatrixTarget}
                                </div>
                                <lightning-combobox data-field="assortmentMatrixTarget" variant="label-hidden"
                                    value={assortmentSettings.assortmentMatrixTarget} onchange={handleFieldChangeMdt}
                                    class="input-w" placeholder="Select Template"
                                    options={asdTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentMatrixBudget}
                                </div>
                                <lightning-combobox data-field="assortmentMatrixBudget" variant="label-hidden"
                                    value={assortmentSettings.assortmentMatrixBudget} onchange={handleFieldChangeMdt}
                                    class="input-w" placeholder="Select Template"
                                    options={asdTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="label">
                                Product Selection Screen Layouts
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentProductSelectionGrid}
                                </div>
                                <lightning-combobox data-field="assortmentProductSelectionGrid" variant="label-hidden"
                                    value={assortmentSettings.assortmentProductSelectionGrid}
                                    onchange={handleFieldChangeMdt} class="input-w" placeholder="Select Template"
                                    options={prodTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentProductSelectionUNGrid}
                                </div>
                                <lightning-combobox data-field="assortmentProductSelectionUNGrid" variant="label-hidden"
                                    value={assortmentSettings.assortmentProductSelectionUNGrid}
                                    onchange={handleFieldChangeMdt} class="input-w" placeholder="Select Template"
                                    options={prodTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="label">
                                Other Screens Layouts
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.assortmentSettings.assortmentDirectAccessPlugin}
                                </div>
                                <lightning-combobox data-field="assortmentDirectAccessPluginGrid" variant="label-hidden"
                                    value={assortmentSettings.assortmentDirectAccessPluginGrid}
                                    onchange={handleFieldChangeMdt} class="input-w" placeholder="Select Template"
                                    options={asTemplates}></lightning-combobox>
                            </div>
                            <div class="add-breaks"> </div>
                        </div>
                    </div>
                </lightning-tab>
                <lightning-tab label={labels.LBL_Scope_Settings} class="slds-scrollable_y" style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_NS_Stg_General_Settings}
                                    </div>
                                </div>
                            </div>
                            <table
                                class="slds-table slds-border--left slds-border_right slds-no-row-hover table-mt table-w"
                                if:true={assortmentSettings}>
                                <thead>
                                    <tr class="table-header">
                                        <th class="table-th">{labels.LBL_Scope_Name}</th>
                                        <th class="table-th">{labels.LBL_Scope_Attribute}</th>
                                        <th class="table-th">{labels.LBL_Scope_Hierarchy_Level}</th>
                                        <th class="table-th"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={scopes} for:item="scope" for:index="scopeIndex">
                                        <tr key={scope.Name}>
                                            <td class="slds-grid">
                                                <lightning-input type="text" variant="label-hidden" value={scope.label}
                                                    class="slds-col" data-scope-index={scopeIndex} data-field="label"
                                                    onchange={handleChangeScope}></lightning-input>
                                                <lightning-helptext
                                                    content="to use a Custom Label, apply this format {yourLabelAPIName}"
                                                    class="helptext-trans"></lightning-helptext>
                                            </td>
                                            <td>
                                                <lightning-combobox variant="label-hidden" value={scope.Name}
                                                    options={productFields} data-scope-index={scopeIndex}
                                                    data-field="Name" onchange={handleChangeScope}></lightning-combobox>
                                            </td>
                                            <td>
                                                <template if:true={scope.isHierarchy}>
                                                    <lightning-input type="Number" variant="label-hidden"
                                                        value={scope.level} data-scope-index={scopeIndex}
                                                        data-field="level"
                                                        onchange={handleChangeScope}></lightning-input>
                                                </template>
                                                <template if:false={scope.isHierarchy}>
                                                    <lightning-input type="Number" variant="label-hidden"
                                                        value={scope.level} disabled></lightning-input>
                                                </template>
                                            </td>
                                            <td class="slds-align_absolute-center">
                                                <div
                                                    class="slds-icon_container custom-icon-delete edit-icon delete-pos">
                                                    <lightning-icon size="xx-small" class="delete-trans"
                                                        icon-name="utility:delete" data-index={scopeIndex}
                                                        onclick={handleDeleteScopeSettings}>
                                                    </lightning-icon>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="add-breaks"></div>
                            <div class="slds-grid slds-p-bottom_xx-small add-button">
                                <div class="slds-col slds-has-flexi-truncate">
                                </div>
                                <lightning-button variant="brand" label="Add Scope" onclick={handleAddScope}
                                    icon-name="utility:add" class="slds-p-around--large slds-p-top--none"
                                    disabled={isAddScopeDisabled}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </lightning-tab>
                <lightning-tab label={labels.assortmentSettings.salesCannibalizationRates} class="slds-scrollable_y"
                    style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_NS_Stg_General_Settings}
                                    </div>
                                </div>
                            </div>
                            <div class="break-app"></div>
                            <div class="slds-grid slds-p-bottom_xx-small add-button">
                                <div class="slds-col slds-has-flexi-truncate">
                                </div>
                                <lightning-button class="slds-button slds-m-right_x-small" variant="brand-outline"
                                    label={labels.LBL_Apply_HR_Config_to_BU} onclick={togglePopup}
                                    icon-name="standard:manual_discounts">
                                </lightning-button>
                            </div>
                            <div class="break-app"></div>
                            <table class="slds-table slds-border--left slds-border_right slds-no-row-hover"
                                if:true={assortmentSettings}>
                                <thead>
                                    <tr class="table-header">
                                        <th class="table-th-third">
                                            {labels.LBL_TypeHR}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_Sales_Cannibalization}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_DescriptionHR}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_API}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_Std_Perc}
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template if:true={salesCannibalizationRatesRecords.length}>
                                        <template for:each={salesCannibalizationRatesRecords} for:item="record"
                                            for:index="index">
                                            <!-- <template iterator:record={records}> -->
                                            <tr key={record.api}>
                                                <td>
                                                    <lightning-combobox variant="label-hidden" data-index={index}
                                                        data-property="typeHR" value={record.typeHR} options={types}
                                                        onchange={handleChangeHR}></lightning-combobox>
                                                </td>
                                                <td>
                                                    <lightning-input type="text" variant="label-hidden"
                                                        data-index={index} data-property="label" value={record.label}
                                                        onchange={handleChangeHR}></lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-input type="text" variant="label-hidden"
                                                        data-index={index} data-property="description"
                                                        value={record.description}
                                                        onchange={handleChangeHR}></lightning-input>
                                                </td>
                                                <td>
                                                    {record.api}
                                                </td>
                                                <td>
                                                    <lightning-input type="number" variant="label-hidden"
                                                        data-index={index} data-property="stdPerc"
                                                        value={record.stdPerc}
                                                        onchange={handleChangeHR}></lightning-input>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </lightning-tab>
                <lightning-tab label="Fields To Import" class="slds-scrollable_y" style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_NS_Stg_General_Settings}
                                    </div>
                                </div>
                            </div>
                            <table class="slds-table slds-border--left slds-border_right slds-no-row-hover table-mt"
                                if:true={assortmentSettings}>
                                <thead>
                                    <tr class="table-header">
                                        <th class="table-th-third">
                                            {labels.LBL_Import_Field_Label}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_Import_Field_Name}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_Import_Field_SysAdmin}
                                        </th>
                                        <th class="table-th-third">
                                            {labels.LBL_Import_Field_User}
                                        </th>
                                        <th class="table-th-third">
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template if:true={availableImportFields.length}>
                                        <template for:each={availableImportFields} for:item="item" for:index="index">
                                            <tr key={item.fieldName}>
                                                <template if:true={item.isEAN}>
                                                    <td>
                                                        {item.fieldLabel}
                                                    </td>
                                                    <td>
                                                        {item.fieldName}
                                                    </td>
                                                    <td>
                                                        <lightning-input type="checkbox" checked={item.isAdmin}
                                                            value={item.isAdmin} data-field={item.fieldName}
                                                            data-index={index} disabled>
                                                        </lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input type="checkbox" checked={item.isUser}
                                                            value={item.isUser} data-field={item.fieldName}
                                                            data-index={index} disabled>
                                                        </lightning-input>
                                                    </td>
                                                    <td>
                                                    </td>
                                                </template>
                                                <template if:false={item.isEAN}>
                                                    <td>
                                                        <lightning-combobox variant="label-hidden" data-index={index}
                                                            value={item.fieldName} data-key={item.fieldName}
                                                            data-field={item.fieldName} options={ASDFields}
                                                            onchange={handleChangeImportField}></lightning-combobox>
                                                    </td>
                                                    <td>
                                                        {item.fieldName}
                                                    </td>
                                                    <td>
                                                        <lightning-input type="checkbox" checked={item.isAdmin}
                                                            value={item.isAdmin} data-field="isAdmin"
                                                            data-key={item.fieldName} data-index={index}
                                                            onchange={handleChangeImportField}>
                                                        </lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input type="checkbox" checked={item.isUser}
                                                            value={item.isUser} data-field="isUser"
                                                            data-key={item.fieldName} data-index={index}
                                                            onchange={handleChangeImportField}>
                                                        </lightning-input>
                                                    </td>
                                                    <td class="slds-align_absolute-center">
                                                        <div
                                                            class="slds-icon_container custom-icon-delete edit-icon trans-del">
                                                            <lightning-icon size="xx-small" class="delete-trans"
                                                                icon-name="utility:delete" data-index={index}
                                                                data-array="availableImportFields"
                                                                onclick={handleDeleteImportField}>
                                                            </lightning-icon>
                                                        </div>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                            <div class="break-app"></div>
                            <div class="slds-grid slds-p-bottom_xx-small add-button">
                                <template if:true={isNewImportFieldDone}>
                                    <div class="slds-col slds-has-flexi-truncate">
                                    </div>
                                    <lightning-button variant="brand" label="Add Field" title="Add Field"
                                        onclick={handleAddImportField} icon-name="utility:add"
                                        class="slds-p-around--large slds-p-top--none">
                                    </lightning-button>
                                </template>

                                <template if:false={isNewImportFieldDone}>
                                    <div class="slds-col slds-has-flexi-truncate">
                                    </div>
                                    <lightning-button disabled variant="brand" label="Add Field" title="Add Field"
                                        onclick={handleAddImportField} icon-name="utility:add"
                                        class="slds-p-around--large slds-p-top--none">
                                    </lightning-button>
                                </template>
                            </div>
                            <div class="add-breaks"></div>
                        </div>
                    </div>
                </lightning-tab>
                <!-- Assortment Simulator Settings -->
                <lightning-tab label={labels.LBL_AssortmentSettings_AssortmentSimulatorConfig} class="slds-scrollable_y"
                    style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_AssortmentSettings_AssortmentSimulatorConfig}
                                    </div>
                                </div>
                            </div>
                            <div class="slds-m-top_medium slds-grid slds-gutters slds-m-top--x-large slds-m-left--medium">
                                <div class="slds-text-align--center">
                                    <lightning-formatted-rich-text value={labels.LBL_AssortmentSettings_AssortmentRTsPreviousYear}>
                                    </lightning-formatted-rich-text>
                                </div>
                                <div class="slds-col">
                                    <lightning-dual-listbox source-label={labels.LBL_Available} selected-label={labels.LBL_Selected}
                                        options={assortmentRTsOptions} value={assortmentSimulatorRTs.previous}
                                        data-target-year="previous" onchange={handleAssortmentSimulatorRTsChange}>
                                    </lightning-dual-listbox>
                                </div>
                                <div class="slds-text-align--center">
                                    <lightning-formatted-rich-text value={labels.LBL_AssortmentSettings_AssortmentRTsCurrentYear}>
                                    </lightning-formatted-rich-text>
                                </div>
                                <div class="slds-col">
                                    <lightning-dual-listbox source-label={labels.LBL_Available} selected-label={labels.LBL_Selected}
                                        options={assortmentRTsOptions} value={assortmentSimulatorRTs.current} data-target-year="current"
                                        onchange={handleAssortmentSimulatorRTsChange}>
                                    </lightning-dual-listbox>
                                </div>
                                <div class="slds-text-align--center">
                                    <lightning-formatted-rich-text value={labels.LBL_AssortmentSettings_AssortmentRTsNextYear}>
                                    </lightning-formatted-rich-text>
                                </div>
                                <div class="slds-col">
                                    <lightning-dual-listbox source-label={labels.LBL_Available} selected-label={labels.LBL_Selected}
                                        options={assortmentRTsOptions} value={assortmentSimulatorRTs.next} data-target-year="next"
                                        onchange={handleAssortmentSimulatorRTsChange}>
                                    </lightning-dual-listbox>
                                </div>
                            </div>
                            <div class="slds-m-top--xx-large slds-m-bottom--xx-large">
                                <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
                                    <div class="sectionTitle slds-media__body">
                                        {labels.LBL_AssortmentSettings_KPISetupConfiguration}
                                    </div>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-p-left--medium slds-text-title_bold slds-p-bottom--xx-small slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"
                                            class="slds-m-right_x-small slds-align-middle">
                                        </lightning-icon>
                                        {labels.LBL_AssortmentSettings_FieldLimitRecommendation}
                                    </div>
                                    <div>
                                        <lightning-button label={labels.LBL_AssortmentSettings_AddKPI} style="padding-right: 5px;"
                                            class="slds-m-around_xx-small slds-button button-mt slds-p-right--xx-small" disabled={isAddKPIDisabled}
                                            onclick={handleAddNewKPIWrapper} icon-name="utility:add" icon-position="left">
                                        </lightning-button>
                                    </div>
                                </div>
                                <div>
                                    <table
                                        class="slds-table slds-table_bordered slds-border--left slds-border--right slds-no-row-hover slds-scrollable_y">
                                        <thead class="table-header">
                                            <th class="table-th td-5">KPI</th>
                                            <th class="table-th td-5">{labels.LBL_Background}</th>
                                            <th class="table-th td-5">{labels.LBL_Color}</th>
                                            <th class="table-th td-5" style="width:50px;"></th>
                                            <th class="table-th td-5" style="width:50px;"></th>
                                            <th class="table-th td-5" style="width:50px;"></th>
                                        </thead>
                                        <tbody>
                                            <template for:each={kpiFields} for:item="KPIWrapper" for:index="KPIWrapperIndex">
                                                <tr key={KPIWrapper} class={KPIWrapper.rowClass} data-index={KPIWrapperIndex}
                                                    ondragover={handleKPIDragOver} ondrop={handleKPIDrop}
                                                    ondragenter={handleKPIDragEnter} ondragleave={handleKPIDragLeave}>
                                                    <td>
                                                        KPI {KPIWrapper.kpiIndex}
                                                    </td>
                                                    <td>
                                                        <lightning-input type="color" variant="label-hidden"
                                                            value={KPIWrapper.backgroundColor} data-kpi-index={KPIWrapperIndex}
                                                            data-field="backgroundColor" onchange={handleChangeKPIWrapper}>
                                                        </lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input type="color" variant="label-hidden"
                                                            value={KPIWrapper.textColor} data-kpi-index={KPIWrapperIndex}
                                                            data-field="textColor" onchange={handleChangeKPIWrapper}>
                                                        </lightning-input>
                                                    </td>
                                                    <td>
                                                        <div class="slds-icon_container custom-icon-delete edit-icon">
                                                            <lightning-icon size="x-small" class="delete-trans"
                                                                icon-name="utility:delete" dropdown-alignment="auto"
                                                                data-kpi-index={KPIWrapperIndex} onclick={handleDeleteKPIWrapper}>
                                                            </lightning-icon>
                                                        </div>
                                                    </td>
                                                    <td class="section-check-box table-td">
                                                        <lightning-button-icon icon-name="utility:summarydetail" size="small"
                                                            data-kpi-index={KPIWrapperIndex} data-cell="image"
                                                            onclick={handleKPIWrapperSelection}>
                                                        </lightning-button-icon>
                                                    </td>
                                                    <td class="alignCenter drag-handle-cell" draggable="true"
                                                        ondragstart={handleKPIDragStart} ondragend={handleKPIDragEnd}>
                                                        <lightning-icon icon-name="utility:drag_and_drop" size="small">
                                                        </lightning-icon>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div if:true={selectedKPIWrapper}>
                                <div class="slds-grid subSectionHeader">
                                    <div class="slds-p-left--large" style="font-weight: 600; font-size: 20px; color: white;">
                                        KPI {selectedKPIWrapper.kpiIndex} ({labels.LBL_AssortmentSettings_Fields})
                                    </div>
                                    <div class="slds-grid slds-p-right--xx-small">
                                        <lightning-combobox options={availableKPIFieldOptions}
                                            value={selectedFieldToAdd} variant="label-hidden" onchange={handleKPIFieldSelection}>
                                        </lightning-combobox>
                                        <lightning-button class="slds-m-left--medium" label={labels.LBL_AssortmentSettings_AddField} onclick={handleAddNewFieldWrapper}
                                            icon-name="utility:add">
                                        </lightning-button>
                                    </div>
                                </div>
                                <div if:false={selectedKPIWrapper.fields.length} style="height: 20px;"></div>
                                <template if:true={selectedKPIWrapper.fields.length}>
                                    <div>
                                        <table
                                            class="slds-table slds-table_bordered slds-border--left slds-border--right slds-no-row-hover slds-scrollable_y">
                                            <thead class="table-header">
                                                <th class="table-th td-5">{labels.assortmentobjectLabel}</th>
                                                <th class="table-th td-5">{labels.assortmentDetailobjectLabel}</th>
                                                <th class="table-th td-5"></th>
                                            </thead>
                                            <tbody>
                                                <template for:each={selectedKPIWrapper.fields} for:item="field" for:index="fieldIndex">
                                                    <tr key={field.fieldName}>
                                                        <td>
                                                            <template if:true={field.isAssortment}>
                                                                {field.label} ({field.fieldName})
                                                            </template>
                                                        </td>
                                                        <td>
                                                            <template if:true={field.isASD}>
                                                                {field.label} ({field.fieldName})
                                                            </template>
                                                            <template if:false={field.isASD}>
                                                                <div
                                                                    style="display: flex; align-items: center; justify-content: center;">
                                                                    <lightning-icon icon-name="utility:warning" size="xx-small" class="custom-warning-icon slds-m-right_x-small">
                                                                    </lightning-icon>
                                                                    <span style="color: darkkhaki;">
                                                                        {labels.LBL_AssortmentSettings_FieldNotExist}
                                                                    </span>
                                                                </div>
                                                            </template>
                                                        </td>
                                                        <td>
                                                            <div class="slds-icon_container custom-icon-delete edit-icon">
                                                                <lightning-icon size="x-small" class="delete-trans"
                                                                    icon-name="utility:delete" data-field-index={fieldIndex}
                                                                    onclick={handleDeleteFieldWrapper}>
                                                                </lightning-icon>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <div if:true={selectedKPIWrapper.fields.length} style="height: 20px;"></div>
                            </div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.LBL_AssortmentSettings_EvolutionArrowsConfiguration}
                                    </div>
                                </div>
                            </div>
                            <div class="section-container slds-m-top_medium">
                                <div class="section-label">
                                    {labels.LBL_AssortmentSettings_DisplayEvolutionArrows}
                                </div>
                                <lightning-input variant="label-hidden" type="toggle"
                                    checked={displayEvolutionArrows}
                                    onchange={handleDisplayEvolutionArrowsChange} class="slds-m-horizontal_small slds-m-top--small"
                                    message-toggle-active="" message-toggle-inactive="">
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </lightning-tab>
                <!-- Assortment BU configuration -->
                <lightning-tab label={labels.assortmentSettings.assortmentBUConfiguration} class="slds-scrollable_y" style="flex:1;">
                    <div style={mainPanelHeight}>
                        <div>
                            <div class="slds-media__body slds-p-around_x-small stickyHeader slds-grid">
                                <div>
                                    <div class="sectionTitle">
                                        {labels.assortmentSettings.assortmentBUConfiguration}
                                    </div>
                                </div>
                            </div>
                            <div class="section-container slds-m-top_medium slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical-align-center slds-gutters_small">
                                    <label class="slds-col slds-size_1-of-2 section-label">
                                        {labels.LBL_AssortmentSettings_AssortmentBULevel}
                                    </label>
                                    <lightning-combobox
                                        class="slds-col slds-size_1-of-2"
                                        variant="label-hidden"
                                        value={assortmentBUConfiguration.assortmentBuLevel}
                                        onchange={handleChangeASBUConfiguration}
                                        data-field="assortmentBuLevel"
                                        options={assortmentBUConfigurationOptions}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical-align-center slds-gutters_small">
                                    <label class="slds-col slds-size_1-of-2 section-label">
                                        {labels.LBL_AssortmentSettings_PeriodDays}
                                    </label>
                                    <lightning-input
                                        class="slds-col slds-size_1-of-2"
                                        type="number"
                                        variant="label-hidden"
                                        label={labels.LBL_AssortmentSettings_PeriodDays}
                                        value={assortmentBUConfiguration.periodDays}
                                        data-field="periodDays"
                                        onchange={handleChangeASBUConfiguration}>
                                    </lightning-input>
                                </div>
                            </div>
                            <!-- Cluster Movement Matrix Table -->
                            <div class="slds-m-top_large">
                                <table class="slds-table slds-border--left slds-border_right slds-no-row-hover">
                                    <thead>
                                        <tr class="table-header">
                                            <th class="table-th-third">
                                                {labels.LBL_AssortmentSettings_ClusterMovement}
                                            </th>
                                            <th class="table-th-third">
                                                {labels.LBL_AssortmentSettings_TodayltStartDate}
                                            </th>
                                            <th class="table-th-third">
                                                {labels.LBL_AssortmentSettings_TodayGtStartDate}
                                            </th>
                                            <th class="table-th-third">
                                                {labels.LBL_AssortmentSettings_TodayGtStartDateAndPeriod}
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="row-increase">
                                                {labels.LBL_AssortmentSettings_increase}
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="increaseBeforeStart"
                                                    data-property="label" value={clusterMovementTable.increaseBeforeStart}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="increaseWithinPeriod"
                                                    data-property="label" value={clusterMovementTable.increaseWithinPeriod}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="increaseAfterPeriod"
                                                    data-property="label" value={clusterMovementTable.increaseAfterPeriod}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="row-decrease">
                                                {labels.LBL_AssortmentSettings_decrease}
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="decreaseBeforeStart"
                                                    data-property="label" value={clusterMovementTable.decreaseBeforeStart}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="decreaseWithinPeriod"
                                                    data-property="label" value={clusterMovementTable.decreaseWithinPeriod}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <lightning-input type="text" variant="label-hidden" data-field="decreaseAfterPeriod"
                                                    data-property="label" value={clusterMovementTable.decreaseAfterPeriod}
                                                    onchange={handleChangeASBUConfiguration} class="slds-text-align_center"></lightning-input>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </div>
        <template if:true={applyHRtoBU}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-33"
                class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">
                    <div class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                        <lightning-button-icon variant="bare-inverse" size="large" icon-name="utility:close"
                            onclick={togglePopup}></lightning-button-icon>
                    </div>
                    <div class="slds-modal__content slds-p-around--small"
                        style="overflow: unset !important;overflow-y: unset !important;">
                        <lightning-checkbox-group label="BU RTs" options={buRecordTypesOptions}
                            value={selectedBURecordTypes} onchange={handleChangeBURT}></lightning-checkbox-group>
                        <lightning-radio-group class="slds-has-divider_top-space" variant="label-hidden"
                            options={replaceOptions} value={replaceValue} type="radio"
                            onchange={handleChangeReplaceValue}></lightning-radio-group>
                    </div>
                    <div class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral"
                            onclick={togglePopup}>{labels.LBL_Cancel}</button>
                        <button class="slds-button slds-button_brand"
                            onclick={applyHRtoBUConfirm}>{labels.LBL_Confirm}</button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
