<template>
    <!-- Explorer: search box with a dropdown tree -->
    <template lwc:if={isExplorer}>
        <div class="slds-is-relative">
            <div class="slds-grid slds-grid_vertical-align-end">
                <lightning-input class="slds-col" type="search" variant="label-hidden" placeholder={label}
                    value={explorerSearch} is-loading={loading} onchange={handleSearch} onclick={toggleList} onblur={toggleList}>
                </lightning-input>
                <template lwc:if={selected}>
                    <template lwc:if={isVideo}>
                        <video src={selected.url} class="srs-preview slds-box slds-box_xx-small slds-theme_shade slds-m-left_x-small" muted></video>
                    </template>
                    <template lwc:else>
                        <img src={selected.url} class="srs-preview slds-box slds-box_xx-small slds-theme_shade slds-m-left_x-small" alt={selected.name} title={selected.name} />
                    </template>
                </template>
            </div>

            <template lwc:if={error}>
                <p class="slds-text-color_error slds-m-top_small">{error}</p>
            </template>
            <template lwc:elseif={isOpen}>
                <ul class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-10" onmousedown={keepFocus}>
                    <template for:each={rows} for:item="row">
                        <li key={row.id} data-id={row.id} class={row.css} style={row.style} onclick={handleRowClick}>
                            <template lwc:if={row.expandable}>
                                <span class="srs-chevron">
                                    <template lwc:if={row.chevron}>
                                        <lightning-icon icon-name={row.chevron} size="xx-small"></lightning-icon>
                                    </template>
                                </span>
                            </template>
                            <template lwc:if={row.isImage}>
                                <img src={row.url} class="srs-thumb" alt="" />
                            </template>
                            <template lwc:elseif={row.icon}>
                                <lightning-icon icon-name={row.icon} size="small"></lightning-icon>
                            </template>
                            <span class="slds-truncate" title={row.name}>{row.name}</span>
                            <template lwc:if={row.loading}>
                                <span class="slds-text-color_weak">Unzipping…</span>
                            </template>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </template>

    <!-- Gallery: filters and a scrolling grid, plus a preview pane while an image is selected -->
    <template lwc:else>
        <div class="slds-grid slds-gutters_x-small slds-card" style={layoutStyle} lwc:ref="layout">
            <div class="slds-col">
                <div class="srs-pane slds-card">
                    <div class="slds-p-around_small slds-border_bottom">
                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-end">
                            <lightning-input class="slds-col" type="search" name="gallerySearch" label="Search images" placeholder={label}
                                value={gallerySearch} is-loading={loading} onchange={handleFilter}>
                            </lightning-input>
                            <lightning-combobox class="slds-col slds-size_1-of-4" name="folder" label="Folder"
                                value={folder} options={folderOptions} onchange={handleFilter}>
                            </lightning-combobox>
                            <!-- Resize disabled for now
                            <lightning-button-group class="slds-col slds-no-flex">
                                <lightning-button-icon icon-name="utility:dash" variant="border-filled" alternative-text="Smaller tiles"
                                    data-name="tileSize" data-step="-16" onclick={resize}></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:add" variant="border-filled" alternative-text="Bigger tiles"
                                    data-name="tileSize" data-step="16" onclick={resize}></lightning-button-icon>
                            </lightning-button-group>
                            -->
                        </div>
                        <template lwc:if={error}>
                            <p class="slds-text-color_error slds-m-top_x-small">{error}</p>
                        </template>
                        <template lwc:elseif={loading}>
                            <p class="slds-text-color_weak slds-text-body_small slds-m-top_x-small">Unzipping {zipsDone} of {zipsTotal}…</p>
                        </template>
                    </div>

                    <div class="srs-scroll srs-gallery slds-p-around_small" style={galleryStyle} lwc:ref="gallery">
                        <template for:each={tiles} for:item="tile">
                            <div key={tile.id} data-id={tile.id} class={tile.css} role="button" tabindex="0" title={tile.path} onclick={handleSelect}>
                                <img src={tile.url} alt={tile.name} loading="lazy" />
                                <span class="slds-truncate slds-text-align_center slds-text-body_small slds-m-top_xx-small">{tile.name}</span>
                            </div>
                        </template>
                        <!-- Scrolling this into view loads the next batch -->
                        <template lwc:if={countLabel}>
                            <div lwc:ref="more" class="srs-more slds-text-align_center slds-text-color_weak slds-text-body_small">{countLabel}</div>
                        </template>
                    </div>
                </div>
            </div>

            <template lwc:if={selected}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="srs-pane slds-card">
                        <div class="slds-p-around_small slds-border_bottom slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col slds-has-flexi-truncate">
                                <h2 class="slds-text-heading_small slds-truncate" title={selected.name}>{selected.name}</h2>
                            </div>
                            <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Close preview" onclick={handleSelect}>
                            </lightning-button-icon>
                        </div>

                        <div class="srs-scroll slds-p-around_small">
                            <div class="srs-stage slds-box">
                                <img src={selected.url} alt={selected.name} style={previewStyle} />
                            </div>
                            <!-- Resize disabled for now
                            <lightning-button-group class="slds-grid slds-grid_align-center slds-m-top_x-small">
                                <lightning-button-icon icon-name="utility:dash" variant="border-filled" alternative-text="Smaller"
                                    data-name="previewSize" data-step="-32" onclick={resize}></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:add" variant="border-filled" alternative-text="Bigger"
                                    data-name="previewSize" data-step="32" onclick={resize}></lightning-button-icon>
                            </lightning-button-group>
                            -->

                            <template for:each={snippets} for:item="snippet">
                                <div key={snippet.label} class="slds-m-top_medium">
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <span class="slds-text-title_caps">{snippet.label}</span>
                                        <lightning-button-icon icon-name="utility:copy" variant="bare" alternative-text={snippet.label}
                                            data-value={snippet.value} disabled={snippet.disabled} onclick={copy}>
                                        </lightning-button-icon>
                                    </div>
                                    <div class="slds-box slds-box_xx-small slds-theme_shade slds-text-font_monospace slds-text-body_small slds-hyphenate slds-m-top_xx-small">{snippet.value}</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
</template>
