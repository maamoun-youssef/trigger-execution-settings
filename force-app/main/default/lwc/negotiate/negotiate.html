<template>
    <div class="slds-is-relative" style="min-height: 70vh;">
        <template if:true={instance.readyToDisplay}>
            <div class="header slds-page-header" if:true={instance.loadingSelection}>
                <!-- LAYOUT GRID -->
                <div class="slds-grid">
                    <!-- GRID COL -->
                    <div class="slds-col slds-has-flexi-truncate">
                        <div class="slds-media slds-no-space slds-grow">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:report"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p class="slds-text-title slds-line-height_reset">
                                </p>
                                <h1
                                    class="slds-page-header__title slds-var-m-right_small slds-align-middle slds-truncate">
                                    {Label.Negotiate}
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__detail-row">
                    <div class="slds-col slds-grid slds-grid_align-end slds-gutters_direct-x-small slds-align_absolute-center"
                        style="justify-content: flex-start;">
                        <div class="slds-col">
                            <lightning-combobox options={instance.negoYearOptions} value={instance.negoYear}
                                onchange={instance.handleYearChange} class="slds-var-p-left_xx-small"
                                label={Label.SelectNegoYear} onkeydown={blockSubmit}>
                            </lightning-combobox>
                        </div>

                                    <div class="slds-combobox_container">

                                            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                                role="none">
                                                <lightning-input value={instance.supplier.searchTerm}
                                                    onchange={instance.supplier.getData} label={Label.SelectSupplier}
                                                    placeholder={Label.EnterCodeOrName} type="search"
                                                    onkeydown={blockSubmit}></lightning-input>
                                            </div>
                                            <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-align_absolute-center"
                                                style="z-index: 10;" role="listbox"
                                                if:true={instance.supplier.hasSearchTerm}>
                                                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                    <template for:each={instance.supplier.data} for:item='item'>
                                                        <li role="presentation" class="slds-listbox__item slds-truncate"
                                                            key={item.Id}>
                                                            <div class="slds-truncate" title={item.Name}>
                                                                <div data-id={item.Id}
                                                                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                    role="option"
                                                                    onclick={instance.supplier.setCurrentItem}>
                                                                    <span class="slds-media__body"
                                                                        data-id={item.Id}>{item.Name}</span>
                                                                </div>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                            <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-align_absolute-center"
                                                role="listbox" if:true={instance.supplier.isNoItemToDisplay}>
                                                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                    <li role="presentation" class="slds-listbox__item slds-truncate">
                                                        <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                            role="option">
                                                            <span
                                                                class="slds-media__body">{Label.LBL_No_Item_To_Display}</span>
                                                        </div>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col">
                            {Label.LBL_Or}
                        </div>
                        <div class="slds-col">
                            <div class="slds-form-element">
                                <div class="slds-form-element__control">
                                    <div class="slds-combobox_container">
                                        <div
                                            class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                                            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                                role="none">
                                                <lightning-input value={instance.negoscope.searchTerm}
                                                    onchange={instance.negoscope.getData} label={Label.SelectNegoscope}
                                                    placeholder={Label.EnterCodeOrName} type="search"
                                                    onkeydown={blockSubmit}></lightning-input>
                                            </div>
                                            <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-align_absolute-center"
                                                style="z-index: 10;" role="listbox"
                                                if:true={instance.negoscope.hasSearchTerm}>
                                                <ul class="slds-listbox slds-listbox_vertical " role="presentation">
                                                    <template for:each={instance.negoscope.data} for:item='item'>
                                                        <li role="presentation" class="slds-listbox__item slds-truncate"
                                                            key={item.Id}>
                                                            <div class="slds-truncate" title={item.Name}>
                                                                <div data-id={item.Id}
                                                                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                    role="option"
                                                                    onclick={instance.negoscope.setCurrentItem}>
                                                                    <span class="slds-media__body"
                                                                        data-id={item.Id}>{item.Name}</span>
                                                                </div>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                            <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-align_absolute-center"
                                                role="listbox" if:true={instance.negoscope.isNoItemToDisplay}>
                                                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                    <li role="presentation" class="slds-listbox__item slds-truncate">
                                                        <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                            role="option">
                                                            <span
                                                                class="slds-media__body">{Label.LBL_No_Item_To_Display}</span>
                                                        </div>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class={headerClass} if:false={instance.loadingSelection}>
                <!-- LAYOUT GRID -->
                <div class="slds-grid">
                    <!-- GRID COL -->
                    <div class="slds-col slds-has-flexi-truncate">

                            </div>
                            <div class="slds-media__body">

                                    {Label.Negotiate}
                                </p>
                                <h1
                                    class="slds-page-header__title slds-var-m-right_small slds-align-middle slds-truncate">

                            </div>

                    <div class="slds-button-group">

                                        </lightning-menu-divider>

                                            onclick={menuItem.action}>
                                        </lightning-menu-item>
                                    </template>
                                </lightning-button-menu>
                            </template>

                    </div>

            </div>
            <div if:false={instance.loadingSelection}>
                <div class="slds-grid">
                    <!-- <c-negotiate-contract-list data-id="negotiate-contracts-cmp" contract-ids={instance.contractIds} -->
                    <c-negotiate-contract-list nonce={nonce} data-id="negotiate-contracts-cmp"
                        nego-discount-type-labels-map={instance.negoDiscountTypeLabelsMap}
                        index-labels-map={instance.indexLabelsMap} slabs-method-map={instance.slabsMethodMap}
                        nego-year={instance.negoYear} negoscope-id={instance.selectedNegoScopeId}
                        available-pol-coms={instance.validTariff}
                        has-top-not-simulation={instance.hasTopNotSimulation} translation={translation}
                        has-pe={instance.hasPE} has-pe-signed={instance.hasPeSigned} class="slds-size_full"
                        if:true={instance.hasData} locked-actions={lockedActions}
                        contract-r-t-n1-settings={instance.contractRTN1Settings} current-url={instance.currentUrl} header-height={headerHeight}>

                                                                </div>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                    <div class="slds-combobox_container">
                                        <div

                                                    placeholder={Label.LBL_Filter_Contracts}
                                                    onclick={instance.showContractsList}
                                                    onmouseleave={instance.hideContractsList} type="search">
                                                </lightning-input>
                                            </div>
                                            <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-align_absolute-center"
                                                if:true={instance.displayContractsList} style="z-index: 10;"
                                                role="listbox" onmouseenter={instance.clearHideContractsList}
                                                onmouseleave={instance.hideContractsList}>
                                                <ul class="slds-listbox slds-listbox_vertical slds-p-left_xx-small"
                                                    role="presentation">
                                                    <template for:each={instance.contractsOptions} for:item='item'
                                                        for:index="index">
                                                        <li role="presentation" class={item.class} key={item.value}>
                                                            <lightning-input type="checkbox" label={item.label}
                                                                title={item.label} checked={item.checked}
                                                                disabled={item.disabled}
                                                                onchange={instance.toggleShowContract}
                                                                onkeydown={blockSubmit} data-index={index}>
                                                            </lightning-input>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-m-top_xx-small slds-grid">

                                    message-toggle-inactive={Label.LBL_Show_Brief}>
                                </lightning-input>
                                <lightning-input class="slds-p-right_small" type="toggle" variant="label-hidden"
                                    onchange={instance.toggleBrief} onkeydown={blockSubmit}
                                    message-toggle-active={Label.LBL_Hide_Brief} if:false={instance.showBrief}

                                </lightning-input>

                                </lightning-input>
                                <lightning-input class="slds-p-right_small" type="toggle" variant="label-hidden"
                                    onchange={instance.toggleHeader} onkeydown={blockSubmit}
                                    message-toggle-active={Label.LBL_Hide_Header} if:false={instance.showHeader}
                                    message-toggle-inactive={Label.LBL_Show_Header}>
                                </lightning-input>
                            </div>

                                            </td>

                                                    {Label.LBL_Nego_Intro}
                                                </div>
                                            </th>
                                            <td class="negoPlanRow1 slds-text-align_right">
