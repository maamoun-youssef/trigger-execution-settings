<template>
    <div class="slds-card slds-m-top_small" if:true={readyToDisplay}>
        <div class="slds-m-bottom_x-small" id="fullscreen">
            <div class="slds-p-horizontal_small slds-card__header slds-grid">
                <header class=" slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="header-title-container">
                            <span class="slds-card__header-title slds-truncate" title={Label.LBL_Brief}>
                                {Label.LBL_Brief}
                            </span>
                        </h2>
                    </div>
                </header>
            </div>
            <div class="slds-p-horizontal_small slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters_direct-xx-small slds-wrap">
                    <template for:each={section1Fields} for:item="field" for:index="index">
                        <div class="slds-size_1-of-2" key={field}>
                            <lightning-record-edit-form record-id={negoPlan.Id}
                                object-api-name={API_NAMES.Nego_Plan__c.objectApiName}>
                                <lightning-input-field field-name={field.fieldApiName}
                                    onchange={handleInputChangeSection1} value={field.value} data-index={index}
                                    onkeydown={blockSubmit}>
                                </lightning-input-field>
                            </lightning-record-edit-form>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <!-- Section for  Nego intro table -->
        <table class="slds-table slds-table_bordered slds-no-row-hover negoIntroTable">
            <thead>
                <tr>
                    <th>
                        {Label.LBL_Nego_Intro}
                    </th>
                    <th>
                        {Label.LBL_V0}
                    </th>
                    <th>
                        {Label.LBL_V1}
                    </th>
                    <th>
                        {Label.LBL_V2}
                    </th>
                    <th>
                        {Label.LBL_V3}
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={section2Fields} for:item="fields" for:index="rowIndex">
                    <tr style="text-align:center;" key={fields}>
                        <template for:each={fields} for:item="field" for:index="colIndex">
                            <th key={field} if:false={field.isVal}>
                                {field.label}
                            </th>
                            <td key={field} if:true={field.isVal}>
                                <lightning-record-edit-form record-id={negoPlan.Id}
                                    object-api-name={API_NAMES.Nego_Plan__c.objectApiName}>
                                    <lightning-input-field field-name={field.fieldApiName} variant="label-hidden"
                                        onchange={handleInputChangeSection2} onkeydown={blockSubmit} value={field.value}
                                        data-row-index={rowIndex} data-col-index={colIndex}>
                                    </lightning-input-field>
                                </lightning-record-edit-form>
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</template>
