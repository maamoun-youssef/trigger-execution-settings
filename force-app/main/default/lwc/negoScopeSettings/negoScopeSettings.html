<template>
    <template if:true={loading}>
        <div class="slds-spinner_container">
            <div class="slds-spinner_container greyBg">
                <div class="loader slds-spinner_container slds-align_absolute-center"></div>
            </div>
        </div>
    </template>
    <div class="slds-card">
        <div class="slds-grid slds-grid_align-end">
            <div class="slds-col save-button-container">
                <lightning-button class="slds-button slds-m-right_x-small" variant="brand" label={labels.LBL_Save}
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
        <div>
            <div>
                <div class="slds-media__body slds-p-around_x-small stickyHeader">
                    <div class="sectionTitle">
                        {labels.LBL_NS_Stg_General_Settings}
                    </div>
                </div>
                <div class="section-m">
                    <div class="slds-m-vertical_medium" if:false={loading}>
                        <div class="slds-m-top_large">
                            <div class="label">
                                {labels.LBL_NS_Stg_RT_Phrase}
                            </div>
                        </div>
                        <ul class="labelList">
                            <li if:true={recordTypeMap.Regular}>
                                <span class="disk"></span>
                                {recordTypeMap.Regular.label}: {recordTypeMap.Regular.description}
                            </li>
                            <li if:true={recordTypeMap.Advanced}>
                                <span class="disk"></span>
                                {recordTypeMap.Advanced.label}: {recordTypeMap.Advanced.description}
                            </li>
                            <li if:true={recordTypeMap.NSProject}>
                                <span class="disk"></span>
                                {recordTypeMap.NSProject.label}: {recordTypeMap.NSProject.description}
                            </li>
                            <li if:true={recordTypeMap.SubNS}>
                                <span class="disk"></span>
                                {recordTypeMap.SubNS.label}: {recordTypeMap.SubNS.description}
                            </li>
                        </ul>
                    </div>
                    <div class="slds-m-top_large">
                        <div class="label">
                            {labels.LBL_NS_Stg_RT_Availability_Phrase}
                        </div>
                    </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {IsNSProjectActiveLabel}
                        </div>
                        <lightning-input type="toggle" value={negoScopeSettings.isNSProjectActive}
                            checked={negoScopeSettings.isNSProjectActive} data-field="isNSProjectActive"
                            variant="label-hidden" onchange={handleFieldEdits}></lightning-input>
                    </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.LBL_NS_Stg_IsNSProjectDefaultRT_Phrase}
                        </div>
                        <lightning-radio-group name="projectDefault" data-field="isNSProjectDefaultRT"
                            onchange={handleFieldEdits} options={projectDefaultOptions}
                            value={negoScopeSettings.isNSProjectDefaultRT} type="radio"></lightning-radio-group>
                    </div>
                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.LBL_NS_Stg_isNSProjectToRegularOnValidation_Phrase}
                        </div>
                        <lightning-radio-group name="projectSettings" data-field="isNSProjectToRegularOnValidation"
                            onchange={handleFieldEdits} options={projectSettingsOptions}
                            value={negoScopeSettings.isNSProjectToRegularOnValidation}
                            type="radio"></lightning-radio-group>
                    </div>
                    <div class="add-breaks"> </div>
                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {IsAdvancedActiveLabel}
                        </div>
                        <lightning-input type="toggle" value={negoScopeSettings.isAdvancedActive}
                            checked={negoScopeSettings.isAdvancedActive} data-field="isAdvancedActive"
                            variant="label-hidden" onchange={handleFieldEdits}></lightning-input>
                    </div>
                    <div class="add-breaks"> </div>
                </div>
            </div>
            <div>
                <div class="slds-media__body slds-p-around_x-small stickyHeader">
                    <div class="sectionTitle">
                        {labels.LBL_NS_Stg_NegoScope_Manager_Settings}
                    </div>
                </div>
                <div class="section-m">
                    <div class="slds-m-top_large label-link label">
                        {labels.LBL_NS_Stg_Grid_Settings_Phrase} <a href={gridSettingsLink} target="_blank"
                            class="grid-settings-link">{labels.LBL_Grid_Settings}</a>
                    </div>
                    <div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label display-divs">
                                {labels.NegoScopeSettings__mdt.brandGridLabel}
                                <div class="infoIcon display-divs">
                                    <lightning-helptext content={labels.NegoScopeSettings__mdt.brandGridHelpText}>
                                    </lightning-helptext>
                                    <section lwc:if={brandGridInfoOpen} aria-describedby="dialog-body-id-110"
                                        aria-label="Dialog Title" class="infoPopover slds-popover slds-nubbin_left"
                                        role="dialog">
                                        <div class="slds-popover__body" id="dialog-body-id-110">
                                            <div class="slds-media">
                                                <div class="slds-media__body">
                                                    <p>{labels.NegoScopeSettings__mdt.brandGridHelpText}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>

                            <div class="add-breaks"> </div>

                            <div class="info-container-w">
                                <lightning-combobox name="negoScopeManagerBrandGrid" label=" " variant="label-hidden"
                                    dropdown-alignment="auto" value={negoScopeSettings.negoScopeManagerBrandGrid}
                                    options={negoScopeManagerBrandGridOptions} onchange={handleFieldEdits}
                                    data-field="negoScopeManagerBrandGrid">
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="add-breaks"> </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label display-divs">
                                {labels.NegoScopeSettings__mdt.productGridLabel}
                                <div class="infoIcon display-divs">
                                    <lightning-helptext content={labels.NegoScopeSettings__mdt.productGridHelpText}>
                                    </lightning-helptext>
                                    <section lwc:if={pgGridInfoOpen} aria-describedby="dialog-body-id-110"
                                        aria-label="Dialog Title" class="infoPopover slds-popover slds-nubbin_left"
                                        role="dialog">
                                        <div class="slds-popover__body">
                                            <div class="slds-media">
                                                <div class="slds-media__body">
                                                    <p>{labels.NegoScopeSettings__mdt.productGridHelpText}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>

                            <div class="add-breaks"> </div>

                            <div class="info-container-w">
                                <lightning-combobox name="negoScopeManagerPGGrid" label=" " variant="label-hidden"
                                    dropdown-alignment="auto" value={negoScopeSettings.negoScopeManagerPGGrid}
                                    options={negoScopeManagerPGGridOptions} onchange={handleFieldEdits}
                                    data-field="negoScopeManagerPGGrid">
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="add-breaks"> </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label display-divs">
                                {labels.NegoScopeSettings__mdt.negoScopeGridLabel}
                                <div class="infoIcon display-divs">
                                    <lightning-helptext content={labels.NegoScopeSettings__mdt.negoScopeGridHelpText}>
                                    </lightning-helptext>
                                    <section lwc:if={negoScopeGridInfoOpen} aria-describedby="dialog-body-id-110"
                                        aria-label="Dialog Title" class="infoPopover slds-popover slds-nubbin_left"
                                        role="dialog">
                                        <div class="slds-popover__body">
                                            <div class="slds-media">
                                                <div class="slds-media__body">
                                                    <p>{labels.NegoScopeSettings__mdt.negoScopeGridHelpText}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>
                            <div class="add-breaks"> </div>
                            <div class="info-container-w">
                                <lightning-combobox name="negoScopeManagerNSGrid" label=" " variant="label-hidden"
                                    dropdown-alignment="auto" value={negoScopeSettings.negoScopeManagerNSGrid}
                                    options={negoScopeManagerNegoScopeGridOptions} onchange={handleFieldEdits}
                                    data-field="negoScopeManagerNSGrid">
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="add-breaks"> </div>
                    </div>
                    <div class="label">
                        {labels.LBL_NS_Stg_IsNSManagerGLTabActive_Phrase}
                    </div>

                    <div class="section-Container slds-m-top_medium">
                        <div class="section-label">
                            {labels.NegoScopeSettings__mdt.IsNSManagerGLTabActiveLabel}
                        </div>
                        <lightning-input type="toggle" value={negoScopeSettings.isNSManagerGLTabActive}
                            checked={negoScopeSettings.isNSManagerGLTabActive} data-field="isNSManagerGLTabActive"
                            variant="label-hidden" onchange={handleFieldEdits}>
                        </lightning-input>
                    </div>

                </div>
                <div>
                    <div class="sectionTitle">
                        {labels.LBL_NS_Stg_Guided_Mode_Title}
                    </div>
                    <div class="slds-card">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <lightning-formatted-rich-text value={labels.LBL_NS_Stg_Guided_Mode_Phrase}>
                                    </lightning-formatted-rich-text>
                                </div>
                            </header>
                            <div>
                                <lightning-button icon-name="utility:add"
                                    class="slds-m-left--small slds-m-bottom--small slds-float_right"
                                    label={labels.LBL_Add_Case} size="small" variant="brand" onclick={handleAddNewCase}>
                                </lightning-button>
                            </div>
                        </div>
                        <div class="negoptim-tablesection">
                            <table
                                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-border--right slds-border--left">
                                <thead>
                                    <tr class="table-header">
                                        <th class="table-th" style="width: 150px;max-width: 150px;min-width: 150px;">
                                            {labels.LBL_NS_Stg_Guided_Mode_Case_Name}</th>
                                        <th class="table-th" style="width: 150px;max-width: 200px;min-width: 200px;">
                                            {labels.LBL_NS_Stg_Guided_Mode_Case_Title}</th>
                                        <th class="table-th" style="width: 200px;max-width: 200px;min-width: 200px;">
                                            {labels.LBL_NS_Stg_Guided_Mode_Case_Description}
                                        </th>
                                        <th class="table-th">{labels.LBL_Case_Conditions}</th>
                                        <th class="table-th" style="width: 50px;max-width: 50px;min-width: 50px;"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={negoScopeSettings.nsManagerGuidedModeConfiguration}
                                        for:item="item" for:index="index">
                                        <tr key={item.Id}>
                                            <td class="table-td"
                                                style="width: 150px;max-width: 150px;min-width: 150px;word-break: break-word;overflow-wrap: break-word;white-space: normal;">
                                                {item.caseName}</td>
                                            <td class="table-td"
                                                style="width: 150px;max-width: 150px;min-width: 150px;word-break: break-word;overflow-wrap: break-word;white-space: normal;">
                                                {item.caseTitle}
                                            </td>
                                            <td class="table-td"
                                                style="width: 200px;max-width: 200px;min-width: 200px;word-break: break-word;overflow-wrap: break-word;white-space: normal;">
                                                {item.caseDescription}
                                            </td>
                                            <td class="table-td">
                                                <template lwc:if={item.fieldValues} for:each={item.fieldValues}
                                                    for:item="conditionField" for:index="targetIndex">
                                                    <div key={conditionField.fieldName}>
                                                        <div class="slds-p-left--small">
                                                            <div class="slds-form-element slds-grid">
                                                                <label
                                                                    class="slds-form-element__label slds-size--2-of-3"
                                                                    for="text-input-id">{conditionField.fieldLabel}</label>
                                                                <div class="slds-form-element__control slds-size--1-of-3"
                                                                    style="white-space: pre-wrap;">
                                                                    <template lwc:if={conditionField.displayValue}>
                                                                        {conditionField.displayValue}
                                                                    </template>
                                                                    <template lwc:else>
                                                                        {conditionField.fieldValue}
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </td>
                                            <td class="table-td">
                                                <div class="slds-align--absolute-center">
                                                    <!-- <lightning-icon size="xx-small"
                                                        class="clickable slds-icon slds-input__icon_right slds-icon-text-default slds-align_absolute-center slds-button--icon-border"
                                                        icon-name="utility:edit" dropdown-alignment="auto"
                                                        data-index={index} variant="success" onclick={handleEditCase}>
                                                    </lightning-icon>
                                                    <div class="slds-p-left_xxx-small">
                                                        <lightning-icon size="xx-small"
                                                            class="clickable red-icon slds-icon slds-input__icon_right slds-icon-text-default slds-align_absolute-center slds-button--icon-border"
                                                            icon-name="utility:delete" dropdown-alignment="auto"
                                                            data-index={index} onclick={handleDeleteCase}>
                                                        </lightning-icon>
                                                    </div> -->
                                                    <div class="display-divs">
                                                        <div class="slds-icon_container custom-icon-edit edit-icon">
                                                            <lightning-icon icon-name='utility:edit'
                                                                alternative-text='edit' size='x-small'
                                                                title={labels.LBL_Modify} onclick={handleEditCase}
                                                                data-index={index} class="edit-trans"></lightning-icon>
                                                        </div>
                                                    </div>
                                                    <div class="display-divs">
                                                        <div class="slds-icon_container custom-icon-delete edit-icon">
                                                            <lightning-icon icon-name='utility:delete'
                                                                alternative-text='delete' size='x-small'
                                                                title={labels.LBL_Delete} onclick={handleDeleteCase}
                                                                data-index={index}
                                                                class="delete-trans"></lightning-icon>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div if:true={addCondition}>
                        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                            class="slds-modal slds-modal--large slds-fade-in-open">
                            <div class="slds-modal__container">
                                <lightning-button-icon class="slds-button slds-button_icon slds-modal__close"
                                    icon-name="utility:close" onclick={togglePopup}></lightning-button-icon>
                                <div class="slds-modal__header">
                                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">
                                        {labels.LBL_NS_Stg_Guided_Mode_New_Case_Title}</h1>
                                </div>
                                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                    <lightning-formatted-rich-text value={labels.LBL_NS_Stg_Guided_Mode_Case_HelpText}>
                                    </lightning-formatted-rich-text>
                                    <div class="slds-grid slds-wrap slds-gutters">
                                        <lightning-input type="text" label={labels.LBL_NS_Stg_Guided_Mode_Case_Name}
                                            data-field="caseName" value={selectedCase.caseName}
                                            onchange={handleChangeCase} required class="slds-col slds-size_1-of-2">
                                        </lightning-input>
                                        <lightning-input type="text" label={labels.LBL_NS_Stg_Guided_Mode_Case_Title}
                                            data-field="caseTitle" value={selectedCase.caseTitle}
                                            onchange={handleChangeCase} required class="slds-col slds-size_1-of-2">
                                        </lightning-input>
                                        <lightning-textarea label={labels.LBL_NS_Stg_Guided_Mode_Case_Description}
                                            data-field="caseDescription" value={selectedCase.caseDescription}
                                            onchange={handleChangeCase} required class="slds-col slds-size_1-of-1">
                                        </lightning-textarea>
                                    </div>
                                    <div class="slds-grid slds-wrap slds-gutters">
                                        <template for:each={selectedCase.fieldValues} for:item="conditionField"
                                            for:index="targetIndex">
                                            <div key={conditionField.fieldName}
                                                class="slds-p-top_small slds-size_1-of-2 slds-col">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label"
                                                        for="text-input-id">{conditionField.fieldLabel}</label>
                                                    <div class="slds-form-element__control">
                                                        <lightning-combobox variant="label-hidden" data-index={index}
                                                            data-target-index={targetIndex}
                                                            options={conditionField.fieldOptions}
                                                            dropdown-alignment="auto" value={conditionField.fieldValue}
                                                            onchange={handleRelatedFieldChange}
                                                            if:true={conditionField.isCombobox}>
                                                        </lightning-combobox>
                                                        <lightning-input type="toggle" variant="label-hidden"
                                                            checked={conditionField.fieldValue} data-index={index}
                                                            data-target-index={targetIndex}
                                                            onchange={handleRelatedFieldChange}
                                                            if:true={conditionField.isBoolean}></lightning-input>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="slds-modal__footer">
                                    <lightning-button class="slds-m-right--small" label={labels.LBL_Cancel}
                                        onclick={togglePopup}></lightning-button>
                                    <lightning-button label={labels.LBL_Confirm} variant="brand"
                                        onclick={confirmCase}></lightning-button>
                                </div>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</template>
