<template>
    <div class="notify_container">
        <template for:each={toastContainer} for:item="toast" for:index="index">
            <div class={toast.themeColor} role="status" key={toast} data-key={toast.id}>
                <lightning-icon icon-name={toast.eventIcon} size="small" class="slds-m-right_x-small" variant="inverse">
                </lightning-icon>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">{toast.title}</h2>
                    <div>{toast.message}</div>
                </div>
                <div class="slds-notify__close" if:true={toast.manualDismiss}>
                    <button
                        class="slds-button slds-button_icon toastClose slds-button_icon-inverse slds-button_icon-bare">
                        <span aria-hidden="true">
                            <lightning-icon icon-name="utility:close" size="x-small" onclick={closeToast} data-id={toast.id} variant="inverse" alternative-text="close">
                            </lightning-icon>
                        </span>
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>
