<template>
    <!-- <template if:true={loading}>
        <lightning-spinner size="large" variant="brand"></lightning-spinner>
    </template> -->
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                onclick={closeImport}>
                <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
                <span class="slds-assistive-text">Cancel</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">LBL_Import</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <span>
                    <div class="slds-grid slds-p-top_x-small">
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input type="file" label="Attachment" accept={acceptedFormats}
                                onchange={handleFileSelect} multiple>
                            </lightning-input>
                        </div>
                        <template if:true={isFileReady}>
                            <div class="slds-col slds-m-top_large slds-size_1-of-4">
                                <lightning-button label={Label.LBL_Upload} variant="brand"
                                    onclick={handleStartUploading}></lightning-button>
                            </div>
                        </template>
                    </div>
                </span>
                <template if:true={file}>
                    <!-- <div class="slds-media"> -->
                    <div class="slds-grid slds-p-top_x-small">
                        <div class="slds-col">
                            {file.name}
                        </div>
                    </div>
                </template>
                <div class="slds-grid slds-p-top_x-small">
                    <template if:true={isFileReady}>
                        <template if:true={isUploading}>
                            <div class="slds-col">
                                <div class="demo-only" style="height:1rem;position:relative">
                                    <div class="slds-spinner_container">
                                      <div role="status" class="slds-spinner slds-spinner_small">
                                        <div class="slds-spinner__dot-a"></div>
                                        <div class="slds-spinner__dot-b"></div>
                                      </div>
                                    </div>
                                  </div>
                            </div>
                        </template>
                        <template if:true={isSuccessfullyImported}>
                            <div class="slds-col">
                                <div class="slds-text-color_success slds-text-align_center">{Label.MSG_Successfully_Imported}</div>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label={Label.LBL_Close} variant="neutral" onclick={closeImport}
                    class="slds-m-right_x-small"></lightning-button>
                <!-- <lightning-button label={Label.LBL_Ok} variant="brand" onclick={confirmImport}></lightning-button> -->
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

</template>
