<template>
    <div class="mainContainer relativeDiv slds-card" style="overflow: unset;">
        <template lwc:if={isLoading}>
            <div class="slds-spinner_container greyBg">
                <div class="loader slds-spinner_container slds-align_absolute-center"></div>
            </div>
        </template>
        <template if:false={isLoading}>
            <div class="header slds-page-header slds-page-header_record-home slds-p-around--xx-small slds-grid">
                <template if:true={popup.visibility}>
                    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                        class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <div class="slds-modal__header">
                                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">
                                    {popup.title}</h1>
                            </div>
                            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                <p>{popup.body}</p>
                            </div>
                            <div class="slds-modal__footer">
                                <button data-id="cancel" class="slds-button slds-button_neutral"
                                    aria-label="Cancel and close" onclick={submitPopUp}>{labels.LBL_Cancel}</button>
                                <button data-id="confirm" class="slds-button slds-button_destructive"
                                    onclick={submitPopUp}>{labels.LBL_Confirm}</button>
                            </div>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                </template>
                <div class="slds-grid" style="width: 38%">
                    <div class="slds-col slds-p-around_xx-small slds-has-flexi-truncate">
                        <div class="slds-media slds-no-space slds-grow">
                            <div class="slds-p-around_xx-small slds-m-left_x-small slds-icon_container">
                                <lightning-icon icon-name="utility:product_warranty_term" class="headerIconColor">
                                </lightning-icon>
                            </div>
                            <div class="slds-m-top_xxx-small slds-media__body">
                                <h1 class="slds-page-header__title slds-m-right_small slds-align-middle"
                                    style="font-size: 15px;">
                                    {sellinStatementName}
                                </h1>
                                <p class="slds-line-height_reset">
                                    {sellInWelcomeMessage}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="rightControlsClass " style="width:40%; display: flex; justify-content: right;"
                    lwc:if={rullerFields.active}>
                    <div class="slds-page-header__control slds-grid slds-m-right--medium" style="align-items:center">
                        <div class="rightControlsClass " style="display: flex;width: 100%;justify-content: right;">
                            <div class="slds-grid slds-grid_vertical">
                                <div class="slds-grid">
                                    <div class="tracking-label slds-text-body--small">
                                        {labels.LBL_ConnectSellInTrackingPeriods}</div>
                                    <div class="header-ruller header-ruller-Period-enable header-ruller-period-enable">
                                        {rullerFields.title}</div>
                                    <template for:each={rullerFields.fields} for:item="field">
                                        <button key={field} class={field.class} data-value={field.value}
                                            onclick={handleChangePeriodNumber} title={field.status}
                                            disabled={field.disabled}>{field.value}
                                        </button>
                                    </template>
                                    <div style="background-color: #516231; width: 2px; margin-left: 10px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="rightControlsClass " style="width: 20%; display: flex; flex:1; justify-content: right;">
                    <div class="slds-page-header__control slds-grid slds-m-right--medium" style="align-items:center">
                        <!-- BACK -->
                        <lightning-button label={labels.LBL_Back} variant="brand" onclick={handleBack}
                            class="custom-button slds-m-right_x-small"></lightning-button>
                        <!-- SAVE -->
                        <lightning-button variant="brand" label={labels.LBL_Save} onclick={handleSave}
                            class="custom-button slds-m-right_x-small"></lightning-button>
                        <!-- Send -->
                        <button
                            class="slds-button slds-button_icon slds-button_icon-border-filled slds-m-right_xxx-small"
                            onclick={handleOpenModal}>
                            <lightning-icon size="x-small" icon-name="utility:send"
                                alternative-text={labels.LBL_SubmitStatement}
                                title={labels.LBL_SubmitStatement}></lightning-icon>
                        </button>
                        <!-- Restitution -->
                        <div class="slds-button slds-button_icon-border-filled slds-m-right_x-small"
                            style="cursor: pointer;">
                            <img src={restitIconSource} title={labels.LBL_Connect_CollaborativeRestitution}
                                style={iconStyle} onclick={handleOpenRestitMatrix} />
                        </div>
                        <!-- menu -->
                        <lightning-button-menu menu-alignment="right" alternative-text="Show menu"
                            variant="border-filled" icon-name="utility:connected_apps">
                            <!-- Excel-->
                            <lightning-menu-item label={labels.LBL_Export_To_Excel} onclick={downloadCSV}
                                icon-name="doctype:excel" icon-position="left">
                            </lightning-menu-item>
                        </lightning-button-menu>
                    </div>
                </div>
            </div>
            <div class="bodyDiv">
                <div class="negoptim-tablesection slds-scrollable relativeDiv" style="height:100%">
                    <table
                        class="sticky main-table no-help-text slds-scrollable_y slds-table slds-table_bordered slds-table_col-bordered slds-border_left slds-no-row-hover slds-border_right"
                        style="width:100%;">
                        <thead class="tableHeader">
                            <tr>
                                <template for:each={fieldsWrapperList} for:item="field" for:index="index">
                                    <th rowspan="2" key={field.Id} style={field.headerStyle}
                                        class="centerText relativeDiv">
                                        <div style="text-wrap: auto;">
                                            {field.fieldLabel}
                                        </div>
                                        <div class="icons-container slds-grid slds-m-right--xxx-small">
                                            <div if:true={field.fieldHelpText}>
                                                <lightning-icon class="white-icon" if:true={field.fieldHelpText}
                                                    size="xx-small" icon-name="utility:info"
                                                    title={field.fieldHelpText}>
                                                </lightning-icon>
                                                <!-- <lightning-helptext content={field.fieldHelpText} class="white-icon"
                                                        icon-name="utility:info"></lightning-helptext> -->
                                            </div>
                                            <div if:false={field.hideFilter}>
                                                <lightning-icon class="white-icon" if:false={field.isFiltered}
                                                    size="xx-small" icon-name="utility:filterList"
                                                    data-field={field.fieldName} onclick={toggleFilterPanel}
                                                    alternative-text={labels.LBL_Filter} title={labels.LBL_Filter}>
                                                </lightning-icon>
                                                <lightning-icon if:true={field.isFiltered} variant="brand"
                                                    size="xx-small" icon-name="utility:filterList"
                                                    data-field={field.fieldName} onclick={toggleFilterPanel}
                                                    alternative-text={labels.LBL_Filter} title={labels.LBL_Filter}>
                                                </lightning-icon>
                                                <div class="slds-hide slds-dropdown slds-p-around_x-small"
                                                    data-filter-field={field.fieldName}
                                                    style="box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;top: 100%; z-index:6; position: absolute;min-width: 150px;left:-50px;">
                                                    <span style="position: absolute;right: 0;top: 0; z-index: 7;">
                                                        <lightning-button-icon variant="container" size="small"
                                                            icon-name="utility:close" data-field={field.fieldName}
                                                            onclick={toggleFilterPanel}
                                                            alternative-text={labels.LBL_Close}
                                                            title={labels.LBL_Close}>
                                                        </lightning-button-icon>
                                                    </span>
                                                    <ul class="slds-dropdown__list" role="menu" aria-label="Show More">
                                                        <li class="slds-dropdown__item" role="presentation"
                                                            style="text-align: left;">
                                                            <template lwc:if={field.isText}>
                                                                <lightning-input name="filter" type="text"
                                                                    class="slds-p-top_medium" variant="label-hidden"
                                                                    value={field.fieldSearchValue}
                                                                    data-field={field.fieldName} data-type="text"
                                                                    data-nsfield={field.isNSField}
                                                                    onchange={handleChangeFilter}
                                                                    placeholder={labels.LBL_InputSearch}>
                                                                </lightning-input>
                                                            </template>
                                                            <template lwc:if={field.isReference}>
                                                                <lightning-input name="filter" type="text"
                                                                    class="slds-p-top_medium" variant="label-hidden"
                                                                    value={field.fieldSearchValue}
                                                                    data-field={field.fieldName} data-type="text"
                                                                    data-nsfield={field.isNSField}
                                                                    onchange={handleChangeFilter}
                                                                    placeholder={labels.LBL_InputSearch}>
                                                                </lightning-input>
                                                            </template>
                                                            <template lwc:if={field._isNumber}>
                                                                <lightning-input name="filter" type="number"
                                                                    class="slds-p-top_medium" variant="label-hidden"
                                                                    value={field.fieldSearchValue1} data-number="1"
                                                                    data-field={field.fieldName} data-type="number"
                                                                    data-nsfield={field.isNSField}
                                                                    onchange={handleChangeFilter}
                                                                    placeholder={labels.LBL_From}>
                                                                </lightning-input>
                                                                <lightning-input name="filter" type="number"
                                                                    value={field.fieldSearchValue2} data-number="2"
                                                                    data-field={field.fieldName} data-type="number"
                                                                    data-nsfield={field.isNSField}
                                                                    onchange={handleChangeFilter}
                                                                    placeholder={labels.LBL_TO}>
                                                                </lightning-input>
                                                            </template>
                                                            <template lwc:if={field.isPicklist}>
                                                                <lightning-checkbox-group name="Checkbox Group"
                                                                    data-nsfield={field.isNSField}
                                                                    class="slds-p-top_medium " variant="label-hidden"
                                                                    value={field.selectedValues}
                                                                    options={field.pickListValues}
                                                                    onchange={handlePicklistChange}
                                                                    data-field={field.fieldName}>
                                                                </lightning-checkbox-group>
                                                            </template>
                                                        </li>
                                                        <li class="slds-has-divider_top-space" role="separator"></li>
                                                        <div style="width: 100%;">
                                                            <button type="submit" title={labels.LBL_Apply}
                                                                onclick={handleApplyFilters}
                                                                class="slds-button slds-button_brand"
                                                                style="width:100%">
                                                                {labels.LBL_Apply}
                                                            </button>
                                                        </div>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </th>
                                </template>
                                <template for:each={periodFields} for:item="item">
                                    <th colspan={item.colspan} key={item.title} style={item.style} data-id={item.title}>
                                        <div class="slds-grid slds-grid_align-center">
                                            {item.label}
                                            <!-- Icon Container with fixed size -->
                                            <div style="margin-left: 10px; width: 16px; height: 16px;">
                                                <template lwc:if={canEditRecords}>
                                                    <template if:false={item.focus}>
                                                        <!-- If not in focus, show one of two icons based on item.edit -->
                                                        <template if:true={item.edit}>
                                                            <lightning-icon variant="inverse" icon-name="utility:check"
                                                                onclick={handleEdit} title={labels.LBL_Confirm}
                                                                size="xx-small">
                                                            </lightning-icon>
                                                        </template>
                                                        <template if:false={item.edit}>
                                                            <lightning-icon variant="inverse" icon-name="utility:edit"
                                                                data-type="Edit" onclick={handleEdit}
                                                                title={labels.LBL_Edit} size="xx-small">
                                                            </lightning-icon>
                                                        </template>
                                                    </template>
                                                    <template if:true={item.focus}>
                                                        <span
                                                            style="display: inline-block; width: 16px; height: 16px;"></span>
                                                    </template>
                                                </template>
                                            </div>
                                        </div>
                                    </th>
                                </template>
                            </tr>
                            <tr>
                                <template for:each={periodFields} for:item="item">
                                    <template for:each={item.fields} for:item="subType">
                                        <th key={subType} style={subType.style} class="centerText relativeDiv">
                                            {subType.label}
                                            <div class="icons-container slds-grid slds-m-right--xxx-small">
                                                <div if:true={subType.fieldHelpText}>
                                                    <lightning-icon class="white-icon" if:true={subType.fieldHelpText}
                                                        size="xx-small" icon-name="utility:info"
                                                        title={subType.fieldHelpText}>
                                                    </lightning-icon>
                                                </div>
                                            </div>
                                        </th>
                                    </template>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={tables} for:item="table" lwc:if={tables.length}>
                                <template lwc:if={table.records.length} for:each={table.records} for:item="record"
                                    for:index="index">
                                    <tr key={record.Id} data-index={index} data-id={record.Id}>
                                        <template for:each={record.columns} for:item="field" for:index="index">
                                           <td key={field.Id} style={field.modifiedStyle} title={field.value}>
                                                <template if:false={field.isInput}>
                                                    <template if:true={field.icon}>
                                                        <!--img class='statusLogoIcon' src={field.iconSource} /-->
                                                        <img src={field.link} title={field.title}
                                                            style={field.iconStyle}>
                                                    </template>
                                                    <template if:false={field.icon}>
                                                        <div lwc:if={field.isNumberField}>
                                                            {field.value}
                                                        </div>
                                                        <template lwc:elseif={field.isReference}>
                                                            {field.value}
                                                        </template>
                                                        <!--a lwc:elseif={field.isReference} href={field.link} target="_blank">
                                                                    {field.value}</a-->
                                                        <label lwc:elseif={field.isBoolean}>
                                                            <lightning-input ltype="checkbox" class="input-center"
                                                                variant="label-hidden" checked={field.value} disabled>
                                                            </lightning-input>
                                                        </label>
                                                        <template lwc:elseif={field.isStatementBase}>
                                                            <div style="text-align: left; display: flex;">
                                                                <img style="align-self: center; width: 30px; height:30px;"
                                                                    src={table.headerIconSrc} title={table.headerLabel}
                                                                    class="slds-m-right_small" data-key={table.key}>
                                                                <div style="align-content: center;">{field.value}</div>
                                                            </div>
                                                        </template>
                                                        <lightning-formatted-date-time lwc:elseif={field.isDate}
                                                            value={field.value} year="numeric" month="2-digit"
                                                            day="2-digit"></lightning-formatted-date-time>
                                                        <template lwc:else>
                                                            {field.value}
                                                        </template>
                                                    </template>
                                                </template>
                                                <div if:true={field.isInput}>
                                                    <template if:false={field.isEdit}>
                                                        <lightning-formatted-number
                                                            value={field.value}></lightning-formatted-number>
                                                    </template>
                                                    <template if:true={field.isEdit}>
                                                        <lightning-input variant="label-hidden" type="number"
                                                            value={field.value} data-id={record.Id}
                                                            data-field={field.fieldName} onblur={onChangePeriodInput}
                                                            class="field-input"
                                                            message-when-step-mismatch={labels.LBL_SellinStepMismatchMsg}></lightning-input>
                                                    </template>
                                                </div>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                            <template lwc:else>
                                <tr>
                                    <td colspan={colspanDisplayedFields}>
                                        <div class="slds-text-heading_small"
                                            style="height: 5vh; width: fit-content; position: sticky; left: 50%; transform: translateX(-50%);">
                                            <p style="height: 100%; align-content: center;">
                                                {labels.LBL_No_Item_To_Display}
                                            </p>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="footerDiv slds-grid slds-m-around--xx-small">
                <lightning-combobox options={pageSizeOptions} variant="label-hidden" dropdown-alignment="auto"
                    class="slds-size_xx-small slds-p-horizontal_x-small" value={pageSize}
                    onchange={handleChangePageSize}>
                </lightning-combobox>
                <span>
                    <lightning-button-group style="height: 100%;">
                        <lightning-button label={labels.LBL_First} disabled={previousDisabled} data-type="First"
                            onclick={handleChangePage}>
                        </lightning-button>
                        <lightning-button label={labels.LBL_Previous} disabled={previousDisabled} data-type="Previous"
                            onclick={handleChangePage}>
                        </lightning-button>
                        <lightning-button label={labels.LBL_Next} disabled={nextDisabled} data-type="Next"
                            onclick={handleChangePage}>
                        </lightning-button>
                        <lightning-button label={labels.LBL_Last} disabled={nextDisabled} data-type="Last"
                            onclick={handleChangePage}>
                        </lightning-button>
                    </lightning-button-group>
                    <lightning-badge class="slds-m-left--x-small" label={pagesBadge}>
                    </lightning-badge>
                </span>
            </div>
        </template>
    </div>
    <template if:true={showWarningPopupBeforeSave}>
        <div role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            onclick={closePopuUp} size="small">
                        </lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {labels.LBL_Warning}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{labels.MSG_Warning_SellInDiscRegularP_Empty}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button class="slds-button" label={labels.LBL_Cancel} onclick={closePopuUp}>
                    </lightning-button>
                    <lightning-button class="slds-button" label={labels.LBL_Save} variant="brand" onclick={applySave}>
                    </lightning-button>
                </footer>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- MODAL -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-modal_medium slds-fade-in-open">
            <div class="slds-modal__container" style={modalContainerStyle}>
                <lightning-button-icon icon-name="utility:close" alternative-text="Cancel and close" size="large"
                    class="dc-modal-close-button-icon slds-m-bottom_xx-small" variant="border-filled"
                    onclick={handleCloseModal}></lightning-button-icon>
                <div class="slds-modal__content slds-p-around_medium" style={modalContentStyle}>
                    <div style="position: relative;">
                        <lightning-flow flow-api-name={flowApiName} flow-input-variables={flowInputVariables}
                            onstatuschange={handleflowStatusChange} flow-finish-behavior="NONE">
                        </lightning-flow>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
