<template>
    <template if:true={pageLoading}>
        <lightning-spinner variant="brand" size="large" alternative-text="Loading...">
        </lightning-spinner>
    </template>
    <div class="slds-wrap ">
        <div class="header slds-page-header slds-page-header_record-home">
            <div class="slds-grid">
                <div class="slds-col slds-p-around_xx-small slds-has-flexi-truncate">
                    <!-- HEADING AREA -->
                    <!-- MEDIA OBJECT = FIGURE + BODY -->
                    <div class="slds-media slds-no-space slds-grow">
                        <div
                            class="slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small slds-icon_container">
                            <lightning-icon icon-name="standard:partner_fund_claim">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body slds-p-around_x-small">
                            <p class="slds-text-title slds-line-height_reset">
                                {label.LBL_BU_Clustering}
                            </p>
                            <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                if:true={currentBU}>
                                {currentBU.Name}
                            </h1>
                        </div>
                    </div>
                </div>
                <!-- ACTION BUTTONS -->
                <div class="slds-col slds-no-flex slds-grid  slds-icon_container">
                    <!-- cancel -->
                    <lightning-button class="slds-button slds-m-around_xx-small" variant="border-filled"
                        label={label.LBL_Cancel} onclick={handleCancel}>
                    </lightning-button>
                    <!-- save -->
                    <lightning-button class="slds-button slds-m-around_xx-small" variant="brand" label={label.LBL_Save}
                        onclick={handleSave}></lightning-button>
                    <!-- more actions menu toggle -->
                    <lightning-button-menu menu-alignment="right" icon-name="utility:connected_apps"
                        class="slds-align_absolute-center">
                        <lightning-menu-item value={label.LBL_Weighted_Distribution}
                            label={label.LBL_Weighted_Distribution} onclick={toggleWeightedDistributionModal}>
                        </lightning-menu-item>
                    </lightning-button-menu>
                    <!-- toggle filter button -->
                    <lightning-button-icon icon-name="utility:filterList" variant="border-filled"
                        class="slds-button slds-button-icon slds-m-around_xx-small" onclick={toggleFilter}>
                    </lightning-button-icon>
                </div>
            </div>
            <template if:true={isShowWeightedDistributionModal}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                    <div class="slds-modal__container">
                        <!-- modal header start -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title='close' onclick={toggleWeightedDistributionModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                    size="small"></lightning-icon>
                                <span class="slds-assistive-text">{label.LBL_close}</span>
                            </button>
                            <h2 class="slds-text-heading_medium slds-hyphenate">{label.LBL_Weighted_Distribution}</h2>
                        </header>
                        <div class="slds-modal__content" style="overflow:auto;width:100%;height:300px">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <template iterator:headfield={wStoresFields}>
                                            <th key={headfield}>{headfield.value} </th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template iterator:store={wStoresList}>
                                        <tr key={store}>
                                            <template iterator:field={store.value.fields}>
                                                <template if:false={field.value.isInput}>
                                                    <template if:true={field.value.isText}>
                                                        <td key={field}>{field.value.fieldValue}
                                                        </td>
                                                    </template>
                                                    <template if:true={field.value.isLink}>
                                                        <td key={field}>
                                                            <a href={field.value.storeLink}
                                                                target="_blank">{field.value.fieldValue}</a>
                                                        </td>
                                                    </template>
                                                    <template if:true={field.value.isDouble}>
                                                        <td key={field}>
                                                            <lightning-formatted-number value={field.value.fieldValue}
                                                                format-style="decimal">
                                                            </lightning-formatted-number>
                                                        </td>
                                                    </template>
                                                    <template if:true={field.value.isPercent}>
                                                        <td key={field}>
                                                            <lightning-formatted-number value={field.value.fieldValue}
                                                                format-style="decimal">
                                                            </lightning-formatted-number>
                                                        </td>
                                                    </template>
                                                    <template if:true={field.value.isCurrency}>
                                                        <td key={field}>
                                                            <lightning-formatted-number value={field.value.fieldValue}
                                                                format-style="currency" currency-code={field.value.currencyCode}>
                                                            </lightning-formatted-number>
                                                        </td>
                                                    </template>
                                                </template>
                                                <template if:true={field.value.isInput}>
                                                    <template if:true={field.value.isDouble}>
                                                        <td key={field}>
                                                            <lightning-input variant="label-hidden"
                                                                value={field.value.fieldValue} type="number"
                                                                formatter="decimal" onblur={handleStoresEdit}
                                                                data-field={field.value.fieldApiName}
                                                                data-store-id={store.value.storeId}>
                                                            </lightning-input>
                                                        </td>

                                                    </template> 
                                                    <template if:true={field.value.isCurrency}>
                                                        <td key={field}>
                                                            <lightning-input type="number" variant="label-hidden"
                                                                value={field.value.fieldValue}
                                                                onblur={handleStoresEdit}
                                                                data-field={field.value.fieldApiName}
                                                                data-store-id={store.value.storeId}
                                                                currency-code={field.value.currencyCode}>
                                                            </lightning-input>
                                                        </td>
                                                    </template> 
                                                    <template if:true={field.value.isText}>
                                                        <td key={field}>
                                                            <lightning-input variant="label-hidden"
                                                                value={field.value.fieldValue} onblur={handleStoresEdit}
                                                                data-field={field.value.fieldApiName}
                                                                data-store-id={store.value.storeId}>
                                                            </lightning-input>
                                                        </td>

                                                    </template>
                                                    <template if:true={field.value.isPercent}>
                                                        <td key={field}>
                                                            <lightning-input variant="label-hidden"
                                                                value={field.value.fieldValue} type="number"
                                                                formatter="decimal" onblur={handleStoresEdit}
                                                                data-field={field.value.fieldApiName}
                                                                data-store-id={store.value.storeId}>
                                                            </lightning-input>
                                                        </td>

                                                    </template>
                                                </template>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button class="slds-button" variant="border-filled" label={label.LBL_Cancel}
                                onclick={toggleWeightedDistributionModal}>
                            </lightning-button>
                            <!-- save -->
                            <lightning-button class="slds-button" variant="brand" label={label.LBL_Save}
                                onclick={handleSaveWeighted}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
        <div class="slds-grid">
            <!-- table Container-->
            <div class="slds-grid slds-card slds-col slds-scrollable ">
                <!-- Main Table Section -->
                <div class="main-panel slds-col slds-scrollable--x">
                    <div if:false={pageLoading} class="table-scroll slds-scrollable slds-col" style={tableHeight}>
                        <table class="outter-table" style="border-top: 0px;">
                            <tbody>
                                <template for:each={assortmentStoreData} for:item="hierarchy">
                                    <!-- hierarchy banner -->
                                    <tr key={hierarchy.hierarchyId} class="hierarchy-band">
                                        <td colspan="1"
                                            style="padding: 0; background-color: #0d807d; color: white; font-weight: bold;">
                                            <span style="position: sticky; left: 0; display: inline-block; padding: 0.5%;">
                                            {hierarchy.hierarchyName}
                                            </span>
                                        </td>
                                    </tr>
                                    <!-- client categories within this hierarchy -->
                                    <template for:each={hierarchy.clientCategories} for:item="clientCategory">
                                        <tr key={clientCategory}>
                                            <td class="slds-p-around--none " style="border: 0px;">
                                                <table style="border:0px" class="inner-table slds-size--1-of-1">
                                                    <thead>
                                                        <template if:true={clientCategory.hasClientCategoryName}>
                                                            <tr key={clientCategory.clientCategoryId} class="client-category-band">
                                                                <th colspan="100"
                                                                    style="padding: 0; background-color: #5aa9a6; color: white; font-weight: bold; text-align: left;">
                                                                    <span style="position: sticky; left: 0; display: inline-block; padding: 0.5%;">
                                                                        {clientCategory.clientCategoryName}
                                                                    </span>
                                                                </th>
                                                            </tr>
                                                        </template>
                                                        <tr>
                                                            <template for:each={buFields} for:item="field">
                                                                <th rowspan="2" style={field.style}
                                                                    key={field.fieldLabel}>{field.fieldLabel}
                                                                </th>
                                                            </template>
                                                            <template iterator:year={clientCategory.clientCategoryClusters}>
                                                                <template if:true={year.value.isDisplayed}>
                                                                    <th key={year.value} colspan={year.value.colSpan}
                                                                        data-year-index={year.value.yearIndex}
                                                                        class="slds-border_right"
                                                                        style="min-width: 450px;border-right: 1.5mm ridge rgb(137 122 122 / 58%);">
                                                                        {year.value.year}</th>
                                                                </template>
                                                            </template>
                                                        </tr>
                                                        <tr>
                                                            <template for:each={clientCategory.clientCategoryClusters} for:item="year">
                                                                <template if:true={year.isDisplayed}>
                                                                    <template if:true={year.hasCluster}>
                                                                        <template if:true={isShowSellOutFact}>
                                                                            <th key={year.totals.sellOutFact} rowspan="2"
                                                                                class="totals-col slds-border_left slds-border_right"
                                                                                data-year-index={year.yearIndex}
                                                                                style="min-width: 35px; width: 35px;">
                                                                                {year.totals.sellOutFact}</th>
                                                                        </template>
                                                                        <template if:true={isShowWD}>
                                                                            <th key={year.totals.weightedDistribution} rowspan="2"
                                                                                class="totals-col slds-border_left slds-border_right"
                                                                                data-year-index={year.yearIndex}
                                                                                style="min-width: 35px; width: 35px;">
                                                                                {year.totals.weightedDistribution}
                                                                            </th>
                                                                        </template>
                                                                        <template iterator:clust={year.Clusters}>
                                                                            <th key={clust} style={clust.value.clusterStyle}>
                                                                                <a href={clust.value.clusterLink} target="_blank">
                                                                                    {clust.value.clusterName}
                                                                                </a><br />
                                                                                <span>{clust.value.clusterSiteOfSalesNumb}</span>
                                                                            </th>
                                                                        </template>
                                                                    </template>
                                                                    <template if:false={year.hasCluster}>
                                                                        <template if:true={isShowSellOutFact}>
                                                                            <th key={year} style="border-left: 0px;border-right: 0px;"></th>
                                                                        </template>
                                                                        <template if:true={isShowWD}>
                                                                            <th key={year} style="border-left: 0px;border-right: 1.5mm ridge rgb(137 122 122 / 58%);"></th>
                                                                        </template>
                                                                        <template if:false={displayTotal}>
                                                                            <th key={year} style="border-left: 0px;border-right: 1.5mm ridge rgb(137 122 122 / 58%);"></th>
                                                                        </template>
                                                                    </template>
                                                                </template>
                                                            </template>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template lwc:if={hasData}>
                                                            <template for:each={clientCategory.stores} for:item="store">
                                                                <tr key={store}>
                                                                    <td class="slds-border_right">{store.storeBuCode}</td>
                                                                    <td class="slds-border_right">
                                                                        <a href={store.storeLink} target="_blank">
                                                                            {store.storeBuName}
                                                                        </a>
                                                                    </td>
                                                                    <template iterator:bud={store.details}>
                                                                        <template if:true={bud.value.isDisplayed}>
                                                                            <template if:true={bud.value.hasCluster}>
                                                                                <template if:true={isShowSellOutFact}>
                                                                                    <td key={bud} class="totals-col slds-border_left slds-border_right"
                                                                                        data-year-index={bud.value.yearIndex}>
                                                                                        {bud.value.totals.sellOutFact}
                                                                                    </td>
                                                                                </template>
                                                                                <template if:true={isShowWD}>
                                                                                    <td key={bud.value} class="totals-col slds-border_left slds-border_right"
                                                                                        data-year-index={bud.value.yearIndex}>
                                                                                        {bud.value.totals.weightedDistribution}
                                                                                    </td>
                                                                                </template>
                                                                                <template
                                                                                    iterator:budetail={bud.value.Clusters}>
                                                                                    <td key={budetail.value.BUIndex}
                                                                                        class={budetail.value.BUClass}
                                                                                        style={budetail.value.BUstyle}>
                                                                                        <lightning-input type="checkbox"
                                                                                            variant="label-hidden"
                                                                                            checked={budetail.value.isSelected}
                                                                                            value={budetail.value.isSelected}
                                                                                            disabled={budetail.value.isDisabled}
                                                                                            data-storeid={store.storeId}
                                                                                            data-year-index={bud.value.yearIndex}
                                                                                            data-year={bud.value.year}
                                                                                            data-clust-id={budetail.value.clustId}
                                                                                            data-detail-id={budetail.value.id}
                                                                                            data-store-index={store.storeIndex}
                                                                                            data-client-category-index={clientCategory.clientCategoryIndex}
                                                                                            data-hierarchy-index={clientCategory.hierarchyIndex}
                                                                                            data-bu-index={budetail.value.BUIndex}
                                                                                            data-is-cplt={budetail.value.isCplt}
                                                                                            onchange={handlecheckBoxes}>
                                                                                        </lightning-input>
                                                                                    </td>
                                                                                </template>
                                                                            </template>
                                                                            <template if:false={bud.value.hasCluster}>
                                                                                <template if:true={isShowSellOutFact}>
                                                                                    <td key={bud} style="border-left: 0px;border-right: 0px;"></td>
                                                                                </template>
                                                                                <template if:true={isShowWD}>
                                                                                    <td key={bud} style="border-left: 0px;border-right: 1.5mm ridge rgb(137 122 122 / 58%);"></td>
                                                                                </template>
                                                                                <template if:false={displayTotal}>
                                                                                    <td key={bud} style="border-left: 0px;border-right: 1.5mm ridge rgb(137 122 122 / 58%);"></td>
                                                                                </template>
                                                                            </template>
                                                                        </template>
                                                                    </template>
                                                                </tr>
                                                            </template>
                                                            <tr style="background-color:  #c9c9c9;" if:true={displayTotal}>
                                                                <td style="background-color: #c9c9c9;"></td>
                                                                <td style="background-color: #c9c9c9; border-right: 1.5mm ridge rgb(137 122 122 / 58%);"></td>
                                                                <template iterator:total={clientCategory.stratTotal}>
                                                                    <template if:true={total.value.isDisplayed}>
                                                                        <template if:true={total.value.hasCluster}>
                                                                            <template if:true={isShowSellOutFact}>
                                                                                <td key={total} class="totals-col" data-year-index={total.value.yearIndex}
                                                                                    style="background-color: #c9c9c9;"></td>
                                                                            </template>
                                                                            <template if:true={isShowWD}>
                                                                                <td key={total} class="totals-col" data-year-index={total.value.yearIndex}
                                                                                    style="background-color: #c9c9c9;"></td>
                                                                            </template>
                                                                            <template iterator:wd={total.value.strats}>
                                                                                <td key={wd} style={wd.value.stratStyle}>
                                                                                    <template if:true={isShowWD}>
                                                                                        <template if:true={isShowSellOutFact}>
                                                                                            <lightning-helptext
                                                                                                icon-name="utility:chart"
                                                                                                content={wd.value.sellOutFactWDStr}
                                                                                                style="margin-right:8px;">
                                                                                            </lightning-helptext>
                                                                                        </template>
                                                                                        <template if:false={isShowSellOutFact}>
                                                                                            <lightning-helptext
                                                                                                icon-name="utility:chart"
                                                                                                content={wd.value.weightedDistributionStr}
                                                                                                style="margin-right:8px;">
                                                                                            </lightning-helptext>
                                                                                        </template>
                                                                                    </template>
                                                                                    <template if:true={isShowSellOutFact}>
                                                                                        <template if:false={isShowWD}>
                                                                                            <lightning-helptext
                                                                                                icon-name="utility:chart"
                                                                                                content={wd.value.sellOutFactStr}
                                                                                                style="margin-right:8px;">
                                                                                            </lightning-helptext>
                                                                                        </template>
        
                                                                                    </template>
                                                                                </td>
                                                                            </template>
                                                                        </template>
                                                                        <template if:false={total.value.hasCluster}>
                                                                            <template if:true={isShowSellOutFact}>
                                                                                <td key={total}></td>
                                                                            </template>
                                                                            <template if:true={isShowWD}>
                                                                                <td key={total}
                                                                                    style="border-right: 1.5mm ridge rgb(137 122 122 / 58%);">
                                                                                </td>
                                                                            </template>
                                                                        </template>
                                                                    </template>
                                                                </template>
                                                            </tr>
                                                        </template>
                                                        <tr lwc:else>
                                                            <td colspan="100">
                                                                <div class="slds-align_absolute-center slds-text-heading_small slds-p-top_large">
                                                                    <h3>{label.LBL_No_Item_To_Display}</h3>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template if:false={pageLoading}>
                        <div class="paginationSection slds-grid slds-m-around--small slds-text-align--left">
                            <lightning-combobox options={pageSizeOptions} value={pageSize} onchange={handleChangePageSize}
                                dropdown-alignment="bottom-left" variant="label-hidden"
                                class="slds-size_xx-small slds-var-p-right_small">
                            </lightning-combobox>
                            <lightning-button-group>
                                <lightning-button disabled={isFirstDisabled} label={label.First} data-type="First"
                                    onclick={handleChangePage}>
                                </lightning-button>
                                <lightning-button disabled={isPreviousDisabled} label={label.Previous}
                                    data-type="Previous" onclick={handleChangePage}>
                                </lightning-button>
                                <lightning-button disabled={isNextDisabled} label={label.Next} data-type="Next"
                                    onclick={handleChangePage}>
                                </lightning-button>
                                <lightning-button disabled={isNextDisabled} label={label.Last} data-type="Last"
                                    onclick={handleChangePage}>
                                </lightning-button>
                            </lightning-button-group>
                        </div>
                    </template>
                </div>
                <!-- FILTER SECTION-->
                <div class="filter-section" if:true={isFilterOpen} style="float: right; z-index:7;">
                    <div id="filter-panel" style="height: 100%;" class="slds-grid slds-no-flex">
                        <div class="slds-panel slds-size_medium slds-panel_docked slds-panel_docked-right slds-grid slds-grid_vertical"
                            style="overflow: unset;">
                            <div class="slds-panel__header">
                                <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate"
                                    title={label.LBL_Filter}>
                                    {label.LBL_Filter}
                                </h2>
                                <lightning-button-icon variant="bare" icon-name="utility:close"
                                    onclick={toggleFilter}>
                                </lightning-button-icon>
                            </div>
                            <div class="slds-col slds-scrollable filterPanelBody" id="filterPanelBody" lwc:if={optionsReady}>
                                <div class="slds-grid slds-wrap slds-p-around_small">
                                    <div class="slds-list_vertical slds-list_vertical-space slds-size_1-of-1">
                                        <!--Search FILTER -->
                                        <div class="slds-item">
                                            <lightning-input label={label.LBL_Search} onchange={fillFilterData}
                                                placeholder={label.LBL_BuClustering_GlobalSearchPlaceHolder}
                                                value={filters.store}>
                                            </lightning-input>
                                        </div>
                                        <!--hierarchy search Box -->
                                        <div class="slds-item">
                                            {label.hierarchy}
                                            <c-neg-optim-custom-picklist selected-values={selectedHierarchy}
                                                options={hierarchyOptions}
                                                selected-event={Events.handleHierarchyChange}
                                                onhandlehierarchychange={handleHierarchyChange}>
                                            </c-neg-optim-custom-picklist>
                                        </div>
                                        <!--Client Category search Box -->
                                        <div class="slds-item">
                                            {label.clientCategory}
                                            <template lwc:if={showClientCategoryPicklist}>
                                                <c-neg-optim-custom-picklist selected-values={selectedClientCategory}
                                                    options={clientCategoriesOptions}
                                                    selected-event={Events.handleClientCategoryChange}
                                                    onhandleclientcategorychange={handleClientCategoryChange}>
                                                </c-neg-optim-custom-picklist>
                                            </template>
                                        </div>
                                        <div class="slds-item">
                                            {label.year}
                                            <c-neg-optim-custom-picklist options={yearsOptions}
                                                selected-event={Events.handleMultiYearSelection}
                                                selected-values={selectedYearsJson}
                                                onhandlemultiyearselection={handleMultiYearSelection}>
                                            </c-neg-optim-custom-picklist>
                                        </div>
                                        <div class="slds-item">
                                            <lightning-input type="checkbox" label={label.LBL_WD} checked={isShowWD}
                                                onchange={showWD}>
                                            </lightning-input>
                                            <lightning-input type="checkbox" label={label.LBL_SellOutFact}
                                                checked={isShowSellOutFact} onchange={showSellOutFact}>
                                            </lightning-input>

                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="searchButtons"
                                class="slds-card__footer slds-grid slds-m-top_none slds-p-vertical_small">
                                <div class="slds-col">
                                    <lightning-button onclick={handleReset} label={label.LBL_Reset}>
                                    </lightning-button>
                                </div>
                                <div class="slds-col">
                                    <lightning-button onclick={loadData} label={label.LBL_Search}
                                        variant="brand">
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
