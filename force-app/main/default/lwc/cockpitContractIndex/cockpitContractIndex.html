<template>
    <div class={customClass}>
        <div class="slds-p-left--x-small slds-grid">
            <template if:true={dataIndexes}>
                <div class="whiteBackground slds-align_absolute-center contract-title cl-ribbon">
                    <span>{labels.LBL_Index_Table}</span>
                </div>
            </template>
            <div class="slds-scrollable back-color cl-main" style={tableHeightCond}>
                <div class="cl-container">
                    <table class="cl-table" role="grid" aria-label="Index Table">
                        <thead>
                            <tr class="cl-header headerIndHeight">
                                <th scope="col" class="index-cell contract-header"></th>
                                <th scope="col" class="index-cell slds-text-align_center contract-header">
                                    <div class="slds-truncate">{contractName}</div>
                                </th>
                                <th scope="col" class="index-cell slds-text-align_center contract-header">
                                    <div class="slds-truncate">{parentContractName}</div>
                                </th>
                                <th scope="col" class="index-cell slds-text-align_center contract-header">
                                    <div class="slds-truncate">{labels.LBL_Evoluation_Rate}</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="cl-row baseHeader contract-base">
                                <td>Base</td>
                                <td style="text-align: center;">
                                    <lightning-formatted-number value={baseIndex} maximum-fraction-digits="2"
                                        minimum-fraction-digits="2">
                                    </lightning-formatted-number>
                                </td>
                                <td style="text-align: center;">
                                    <lightning-formatted-number value={baseIndexParent} maximum-fraction-digits="2"
                                        minimum-fraction-digits="2">
                                    </lightning-formatted-number>
                                </td>
                                <td></td>
                            </tr>
                            <template for:each={dataIndexes} for:item="item">
                                <tr key={item.indexName} class="cl-row">
                                    <td class="tdIndHeight">{item.indexName}</td>
                                    <template for:each={item.indexValue} for:item="val">
                                        <td key={item.indexName} style="text-align: center;">
                                            <lightning-formatted-number value={val} maximum-fraction-digits="2"
                                                minimum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</template>
