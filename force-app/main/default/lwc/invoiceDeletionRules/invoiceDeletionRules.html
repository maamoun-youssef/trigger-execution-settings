<template>
    <template lwc:if={isLoading}>
        <div class="slds-spinner_container">
            <div class="slds-spinner_container greyBg">
                <div class="loader slds-spinner_container slds-align_absolute-center"></div>
            </div>
        </div>
    </template>
    <template lwc:else>
        <div>
            <div class="save-btn">
                <lightning-button variant="brand" label={labels.LBL_Save} onclick={handleSaveInvoiceSettings}>
                </lightning-button>
            </div>
            <div class="slds-p-around_x-small slds-grid slds-grid_align-spread stickyHeader">
                <div class="sectionTitle slds-media__body">
                    {labels.LBL_InvoiceDeletionRules_PageTitle}
                </div>
            </div>
            <div class="section-Container slds-m-top_medium">
                <div class="label-toggle">
                    {labels.LBL_InvoiceDeletionRules_Description}
                </div>
            </div>
            <div class="slds-m-top--medium dp slds-size_1-of-2">
                <template for:each={accDocsFields} for:item="field" for:index="index">
                    <div key={field.value} class="accdocs-field slds-m-top--small">
                        <div class="slds-text-align--left acc-label slds-size_1-of-5 accfield">{field.label}</div>
                        <c-neg-optim-custom-picklist lwc:if={statusPicklist} data-type="picklist" class="acc-picklist slds-grow"
                            options={statusPicklist} show-all-option="true" data-key={field.value} data-index={index} placeholder=''
                            selected-event={Events.handleChangeMultiPicklistValues} selected-values={field.stringifySelectedValue}
                            onhandlechangemultipicklistvalues={handleChangePickList}>
                        </c-neg-optim-custom-picklist>
                    </div>
                </template>
            </div>
        </div>
    </template>
</template>
