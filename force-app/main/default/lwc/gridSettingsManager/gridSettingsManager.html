<template>
    <div class="main-container">
        <div class="slds-is-relative">
            <template if:true={Loading}>
                <!-- <lightning-spinner variant="brand" size="large"></lightning-spinner> -->
                <div class="slds-spinner_container">
                    <div class="loader slds-spinner_container slds-align--absolute-center">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </template>
            <div class="pageHeader negoptimHeader slds-page-header">
                <!-- LAYOUT GRID -->
                <div class="header">
                    <div class="slds-grid slds-show_small">
                        <!-- GRID COL -->
                        <div class="slds-col">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:matrix"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-line-height_reset">{Label.LBL_Grid_Settings}</p>
                                    <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                        title={Label.LBL_Grid_Layout}>
                                        <div class="slds-grid">
                                            <div>{Label.LBL_Grid_Layout}</div>
                                            <div if:true={instance.currentTemplate.name}>
                                                <span>: {instance.currentTemplate.label}</span>
                                            </div>
                                        </div>
                                    </h1>
                                </div>
                            </div>
                        </div>
                        <lightning-button value={Label.LBL_Close} label={Label.LBL_Close} onclick={cancelBtnHandler}
                            class="slds-p-right--xx-small slds-button_text-destructive" if:true={instance.showButtons}>
                        </lightning-button>
                        <lightning-button label={Label.LBL_Customize_List_View_Order} if:false={instance.showButtons}
                            variant="success" class="slds-p-right--xx-small" onclick={openListViewPopup}>
                        </lightning-button>
                        <lightning-button value={Label.LBL_New} if:false={instance.showButtons} label={Label.LBL_New}
                            onclick={newBtnHandler} class="slds-p-right--xxx-small">
                        </lightning-button>
                        <lightning-button variant="brand" onclick={checkCompileAndSave} label={Label.LBL_Save}
                            class="slds-p-right--xxx-small" if:true={instance.isEnableTemplateSave}>
                        </lightning-button>
                        <lightning-button variant="brand" disabled label={Label.LBL_Save}
                            if:true={instance.isDisableTemplateSave}>
                        </lightning-button>
                        <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                            class="slds-p-left--xxx-small" if:false={disableSaveAs}>
                            <lightning-menu-item onclick={saveAsBtnHandler} label={Label.LBL_Save_As}
                                prefix-icon-name="utility:save">
                            </lightning-menu-item>
                            <lightning-menu-divider></lightning-menu-divider>
                            <lightning-menu-item onclick={checkCompile} label={Label.LBL_Compile}>
                            </lightning-menu-item>
                        </lightning-button-menu>
                    </div>
                    <div class="slds-grid slds-wrap slds-hide_small">
                        <!-- GRID COL -->
                        <div class="slds-size_1-of-1">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:settings"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-line-height_reset">
                                        {Label.LBL_Grid_Settings}
                                    </p>
                                    <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                        title={Label.LBL_Grid_Layout}>
                                        {Label.LBL_Grid_Layout}
                                    </h1>
                                </div>
                            </div>
                        </div>
                        <div class="slds-size_1-of-1 slds-grid slds-p-top_x-small">
                            <lightning-button value={Label.LBL_Cancel} label={Label.LBL_Cancel}
                                onclick={cancelBtnHandler} class="slds-p-right--xxx-small">
                            </lightning-button>
                            <lightning-button value={Label.LBL_New} label={Label.LBL_New} onclick={newBtnHandler}
                                class="slds-p-right--xxx-small">
                            </lightning-button>
                            <lightning-button variant="brand" onclick={checkSave} label={Label.LBL_Save}>
                            </lightning-button>
                            <lightning-button-menu icon-name="utility:connected_apps" menu-alignment="right" nubbin
                                class="slds-p-left--xxx-small" if:false={disableSaveAs}>
                                <lightning-menu-item onclick={saveAsBtnHandler} label={Label.LBL_Save_As}
                                    prefix-icon-name="utility:save">
                                </lightning-menu-item>
                            </lightning-button-menu>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__detail-row slds-grid slds-wrap body" style="padding: 0;">
                    <div class="slds-col slds-grid slds-truncate" style="height: -webkit-fill-available;">
                        <div class="slds-col slds-size_1-of-4 slds-border_right "
                            style="background-color: white; height: inherit">
                            <div class="templatesSplitView slds-split-view_container slds-panel_docked-left slds-is-open"
                                style="height: -webkit-fill-available;">
                                <div class="slds-panel__header slds-p-around_x-small searchBox" id="filterHeader">
                                    <div style="padding: 0;" class="slds-page-header__col-details">
                                        <lightning-input type="search" data-form="first" variant="label-hidden"
                                            autocomplete="off" onfocus={focusTemplateInput} onchange={searchTemplate}
                                            onblur={closeDropdownTemplate} onkeyup={searchTemplate}
                                            onkeydown={searchTemplate} value={searchTermTemplate}>
                                        </lightning-input>
                                    </div>
                                </div>
                                <template if:false={hasLayouts}>
                                    <div class="slds-align_absolute-center slds-m-vertical_small">
                                        <span class="slds-truncate" title={Label.LBL_No_Item_To_Display}>
                                            {Label.LBL_No_Item_To_Display}
                                        </span>
                                    </div>
                                </template>
                                <div class="slds-scrollable--y" if:true={hasLayouts}>
                                    <article aria-hidden="false" id="split-view-id"
                                        class="slds-split-view slds-grid slds-grid_vertical slds-scrollable">
                                        <div class="slds-grid slds-grid_vertical">
                                            <ul aria-multiselectable="true" class="slds-scrollable_y" role="listbox"
                                                aria-label="Select an item to open it in a new workspace tab.">
                                                <template if:true={hasLayouts} for:each={layouts} for:item="layout">
                                                    <li class="slds-split-view__list-item" role="presentation"
                                                        key={layout.value} data-id={layout.value}
                                                        onclick={TemplateChangeHandler}>
                                                        <a href="#" role="option" data-id={layout.value}
                                                            class="menuItem slds-split-view__list-item-action slds-grow slds-has-flexi-truncate"
                                                            tabindex="0">
                                                            <div class="slds-grid slds-wrap">
                                                                <b>
                                                                    <span
                                                                        class="slds-truncate slds-text-body_regular slds-text-color_default"
                                                                        title={layout.label}>{layout.label}</span>
                                                                </b>
                                                                <span class="slds-truncate slds-col_bump-left"
                                                                    title="packageIcon">
                                                                    <lightning-icon if:true={layout.namespacePrefix}
                                                                        icon-name="utility:package" size="xx-small">
                                                                    </lightning-icon>
                                                                </span>
                                                            </div>
                                                            <div class="slds-grid">
                                                                <span class="slds-truncate"
                                                                    title={layout.currentObject}>{layout.currentObject}
                                                                    <span if:true={layout.masterObject}
                                                                        title={layout.masterObject}> •
                                                                        {layout.masterObject} </span>
                                                                </span>
                                                                <span class="slds-truncate slds-col_bump-left"
                                                                    title={layout.type}>{layout.type}</span>
                                                            </div>
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </article>
                                </div>
                            </div>
                        </div>
                        <div class="slds-form_stacked slds-col slds-scrollable" if:true={instance.displayGrid}>
                            <lightning-tabset style="height: 100%;">
                                <lightning-tab class="slds-p-around_small" style="height: 100%;"
                                    label={Label.LBL_General_Settings}>
                                    <ul class="slds-wrap slds-m-left--xxx-small">
                                        <li>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                                <template if:true={instance.currentTemplate.value}>
                                                    <div class="slds-m-left_small slds-grid slds-grid_vertical-align-center slds-wrap slds-color__text-gray-7"
                                                        style="background-color: #e9e9e9; padding: 6px; border-radius: 32px;">
                                                        <lightning-icon icon-name="utility:orders" size="xx-small"
                                                            class="slds-m-right_xx-small"></lightning-icon>
                                                        <span class="slds-text-title_caps">API :</span>
                                                        <span
                                                            class="slds-m-left_xx-small"><strong>{instance.currentTemplate.value}</strong></span>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="slds-grid">
                                                <div class="slds-col slds-size--1-of-2">
                                                    <lightning-input label={Label.LBL_Template_Name}
                                                        field-level-help={helpTextLabels.Grid_Settings__mdt.MasterLabel}
                                                        placeholder={Label.LBL_Template_Name} max-length="40"
                                                        onchange={setTemplateNameHandler}
                                                        value={instance.currentTemplate.label}
                                                        class="slds-p-right_x-small">
                                                    </lightning-input>
                                                    <lightning-input label={Label.LBL_Grid_Description_Slogan}
                                                        field-level-help={helpTextLabels.Grid_Settings__mdt.Grid_Slogan__c}
                                                        placeholder={Label.LBL_Grid_Description_Slogan} max-length="40"
                                                        onchange={setTemplateSloganHandler}
                                                        value={instance.currentTemplate.slogan}
                                                        class="slds-p-right_x-small">
                                                    </lightning-input>
                                                    <lightning-combobox options={instance.types}
                                                        field-level-help={helpTextLabels.Grid_Settings__mdt.Type__c}
                                                        value={instance.currentTemplate.type}
                                                        label={Label.LBL_Template_Type}
                                                        onchange={setTemplateTypeHandler}>
                                                    </lightning-combobox>
                                                    <template if:true={currentTypeDescription}>
                                                        <div class="slds-wrap slds-p-around--x-small slds-m-around--xx-small"
                                                            style="border: 1px black;border-style: solid;background-color: #e9e9e9;">
                                                            <strong
                                                                class="slds-m-right_xx-small">{Label.LBL_GridSettingsManager_TypeDescription}:</strong>
                                                            <span class="slds-wrap"
                                                                style="font-weight: normal;white-space: pre-wrap;">
                                                                <lightning-formatted-rich-text
                                                                    value={currentTypeDescription}></lightning-formatted-rich-text>
                                                            </span>
                                                        </div>
                                                    </template>
                                                    <lightning-combobox label={Label.LBL_Select_Master_Object}
                                                        field-level-help={helpTextLabels.Grid_Settings__mdt.Master_Object_Name__c}
                                                        options={instance.masterObjects}
                                                        value={instance.currentMasterObject.key}
                                                        onchange={MasterObjectTypeChangeHandler}
                                                        if:true={instance.currentTemplate.displayMaster}>
                                                    </lightning-combobox>
                                                    <lightning-combobox class="slds-p-right_x-small"
                                                        field-level-help={helpTextLabels.Grid_Settings__mdt.Object_Name__c}
                                                        label={Label.LBL_Select_Object} options={instance.objects}
                                                        value={instance.currentObject.value}
                                                        onchange={ObjectTypeChangeHandler}
                                                        if:true={instance.currentTemplate.displayDetail}>
                                                    </lightning-combobox>
                                                    <!-- Import Settings Section -->
                                                    <lightning-combobox label={Label.LBL_Select_Import_Template}
                                                        class="slds-col" placeholder={Label.LBL_Select_Import_Template}
                                                        options={importSettingsOptions}
                                                        value={instance.currentTemplate.importSettingsTemplate}
                                                        onchange={handleImportSettingsTemplateChange}>
                                                    </lightning-combobox>
                                                    <div class="slds-wrap slds-p-around--x-small slds-m-around--xx-small"
                                                        style="border: 1px black;border-style: solid;background-color: #e9e9e9;">
                                                        <strong
                                                            class="slds-m-right_xx-small">{Label.LBL_Import}:</strong>
                                                        <span class="slds-wrap"
                                                            style="font-weight: normal;white-space: pre-wrap;">
                                                            <lightning-formatted-rich-text
                                                                value="Select an import settings template to enable advanced import functionality in the Grid Plugin.">
                                                            </lightning-formatted-rich-text>
                                                        </span>
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-m-left--large slds-size--1-of-2">
                                                    <div class="slds-grid">
                                                        <div class="slds-grid" style="margin-top: 5px;">
                                                            <c-neg-optim-searchable-picklist label={Label.LBL_Icon}
                                                                help-text={helpTextLabels.Grid_Settings__mdt.Icon__c}
                                                                value={instance.currentTemplate.icon}
                                                                options={instance.iconNamesList}
                                                                placeholder="Search Icons" data-field="value"
                                                                onchange={iconChangeHandler} enable-list-icons>
                                                            </c-neg-optim-searchable-picklist>
                                                            <div class="slds-grid slds-m-top--large">
                                                                <lightning-button-icon icon-name="utility:loop"
                                                                    onclick={resetIconhandler}
                                                                    class="slds-p-left_x-small">
                                                                </lightning-button-icon>
                                                                <div class="slds-m-left--xx-small">
                                                                    <lightning-icon size="medium"
                                                                        icon-name={instance.currentTemplate.icon}>
                                                                    </lightning-icon>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="slds-grid" style="width: 320px;">
                                                        <lightning-combobox class="slds-col"
                                                            label={Label.LBL_Default_Page_Size}
                                                            field-level-help={Label.LBL_GridSettingsManager_DefaultPageSizeDescription}
                                                            value={instance.currentTemplate.Default_Page_Size}
                                                            options={defaultPageSizeOptions}
                                                            onchange={handleDefaultPageSizeChange}>
                                                        </lightning-combobox>
                                                    </div>
                                                    <!-- Select Grid Type -->
                                                    <div class="slds-grid" style="width: 320px;">
                                                        <lightning-combobox class="slds-col"
                                                            label={Label.LBL_GridSettingsManager_GridType}
                                                            field-level-help={Label.LBL_GridSettingsManager_GridTypeDescription}
                                                            value={instance.currentTemplate.gridTypeValue}
                                                            options={gridTypeOptions} onchange={handleGridTypeChange}>
                                                        </lightning-combobox>
                                                    </div>
                                                    <lightning-input type="checkbox"
                                                        label={Label.LBL_Show_Calendar_Settings}
                                                        checked={instance.calendarSettingsData.showCalendarSettings}
                                                        value={instance.calendarSettingsData.showCalendarSettings}
                                                        onclick={showCalendarSettingsHandler} disabled>
                                                    </lightning-input>
                                                    <lightning-input type="checkbox"
                                                        label={Label.LBL_Show_Tree_Settings}
                                                        checked={instance.timeLineSettings.isTimeLineSettings}
                                                        value={instance.timeLineSettings.isTimeLineSettings}
                                                        onclick={showTimeLineSettings} disabled>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </lightning-tab>
                                <lightning-tab class="slds-p-around_small" style="height: 100%;"
                                    label={Label.LBL_Master_Object} if:true={instance.currentTemplate.displayMaster}
                                    value="master" onactive={clearSearchQueries}>
                                    <div class="slds-grid">
                                        <div class="slds-col">
                                            <div class="slds-grid slds-wrap custom_slds-grid_align-start">
                                                <div class="slds-col slds-p-right_x-small">
                                                    <lightning-badge label={masterObjectName}
                                                        icon-name="action:view_relationship"></lightning-badge>
                                                </div>
                                            </div>
                                            <div class="slds-grid">
                                                <lightning-input data-tab="master"
                                                    label={Label.LBL_Search_For_Available_Fields}
                                                    value={queryTermMaster} style="padding: 0; !important"
                                                    onkeyup={handleSearchFields} onchange={handleSearchFields}
                                                    onkeypress={handleSearchFields} type="search"
                                                    class="slds-col slds-form-element inputWidth">
                                                </lightning-input>
                                            </div>
                                            <div
                                                class="slds-m-top--small slds-grid slds-wrap slds-grid_align-end custom_slds-grid_align-start">
                                                <div class="slds-col">
                                                    <div>{Label.LBL_Available_Fields}</div>
                                                    <div class="slds-p-right_small">
                                                        <select data-recordid="MasterObjectFields" size="7" multiple
                                                            onchange={MasterObjectFieldsSelectChangedHandler}
                                                            class="oSelect slds-input slds-scrollable">
                                                            <template for:each={filteredMasterObjFieldsList}
                                                                for:item="item">
                                                                <option key={item} value={item.value} title={item.label}
                                                                    class={item.cssClass}>
                                                                    {item.label}
                                                                </option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="btn-group slds-p-right_small slds-col slds-p-top--x-small">
                                                    <lightning-button-icon title={Label.LBL_Add_Fields}
                                                        icon-name="utility:add" class="blue-icon" size="medium"
                                                        onclick={addSelectedMasterFieldsHandler}>
                                                    </lightning-button-icon>
                                                </div>
                                                <div class="slds-col">
                                                    <div>
                                                        {instance.currentTemplate.masterfieldslength}
                                                        {Label.LBL_Selected_Fields}
                                                    </div>
                                                    <div class="slds-col slds-grid">
                                                        <div
                                                            class="slds-dueling-list__column slds-p-right_small slds-col">
                                                            <select
                                                                class="oSelect slds-input slds-p-top_small slds-scrollable"
                                                                data-recordid="wantedMasterFields" size="7" multiple
                                                                onchange={WantedMasterFieldsChangeHandler}>
                                                                <template
                                                                    for:each={instance.currentTemplate.masterfields}
                                                                    for:item="item" if:false={Loading}>
                                                                    <option key={item} value={item.value} class='Out'
                                                                        data-id={item.value}>
                                                                        {item.label}
                                                                    </option>
                                                                </template>
                                                            </select>
                                                        </div>
                                                        <div
                                                            class="slds-grid slds-grid--vertical slds-grid_align-spread">
                                                            <lightning-button-icon icon-name="utility:arrow_top"
                                                                size="medium" variant="bare" onclick={moveToTopBottom}
                                                                data-target="masterFields" data-direction="top">
                                                            </lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:up" size="medium"
                                                                variant="bare" onclick={moveUpMasterHandler}>
                                                            </lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:down"
                                                                size="medium" variant="bare"
                                                                onclick={moveDownMasterHandler}>
                                                            </lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:arrow_bottom"
                                                                size="medium" variant="bare" onclick={moveToTopBottom}
                                                                data-target="masterFields" data-direction="bottom">
                                                            </lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:delete"
                                                                size="medium" variant="bare"
                                                                onclick={removeSelectedMasterFieldsHandler}>
                                                            </lightning-button-icon>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-m-top--small">
                                        <c-grid-settings-expression-editor data-comp="gridSettingsExpressionEditor"
                                            criterias-wrapperjson={readOnlyCriteriasJSON}
                                            onconfirmreadonlyexpressioneditor={confirmReadOnlyExpressionEditor}
                                            confirm-event={Events.confirmReadOnlyExpressionEditor}
                                            card-label={Label.LBL_Read_Only}>
                                        </c-grid-settings-expression-editor>
                                    </div>
                                </lightning-tab>
                                <lightning-tab class="slds-p-around_small" label={Label.LBL_Detail_Object}
                                    if:true={instance.currentTemplate.displayDetail} value="detail"
                                    onactive={clearSearchQueries}>
                                    <div class="slds-grid">
                                        <div class="slds-col">
                                            <div class="slds-grid slds-wrap custom_slds-grid_align-start">
                                                <div class="slds-col slds-p-right_x-small">
                                                    <lightning-badge label={objectName}
                                                        icon-name="utility:standard_objects"></lightning-badge>
                                                </div>
                                            </div>
                                            <div class="slds-grid">
                                                <lightning-input data-tab="detail"
                                                    label={Label.LBL_Search_For_Available_Fields}
                                                    value={queryTermDetail} style="padding: 0; !important"
                                                    onkeyup={handleSearchFields} onchange={handleSearchFields}
                                                    onkeypress={handleSearchFields} type="search"
                                                    class="slds-col slds-form-element inputWidth"></lightning-input>
                                                <lightning-input if:true={ObjectRelatedFieldsFieldsShowStatus}
                                                    label={Label.LBL_Search_For_Reference_Fields} data-tab="ref-detail"
                                                    style="padding: 0; !important" onkeyup={handleSearchFields}
                                                    onkeypress={handleSearchFields} onchange={handleSearchFields}
                                                    type="search"
                                                    class="slds-col slds-form-element inputWidth slds-m-left_small">
                                                </lightning-input>
                                            </div>
                                            <div
                                                class="slds-m-top--small slds-grid slds-wrap slds-grid_align-end custom_slds-grid_align-start">
                                                <div class="slds-col">
                                                    <div>{Label.LBL_Available_Fields}</div>
                                                    <div class="slds-p-right_small">
                                                        <select data-recordid="ObjectFields" size="7" multiple
                                                            onchange={ObjectFieldsSelectChangedHandler}
                                                            class="oSelect slds-input slds-scrollable">
                                                            <template for:each={filteredFieldsList} for:item="item">
                                                                <option key={item} value={item.value} title={item.label}
                                                                    class={item.cssClass}>
                                                                    {item.label}
                                                                </option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                </div>
                                                <template if:true={ObjectRelatedFieldsFieldsShowStatus}>
                                                    <div class="slds-p-right_small slds-col">
                                                        <div>{selectedObjectRefFieldLabel}
                                                        </div>
                                                        <select data-recordid="ObjectRelatedFieldsFields" size="7"
                                                            multiple onchange={ObjectRefFieldFieldsSelectChangedHandler}
                                                            class="oSelect slds-input slds-scrollable"
                                                            disabled={ObjectRelatedFieldsFieldsDisableStatus}>
                                                            <template for:each={filteredRefFieldsList} for:item="item">
                                                                <option key={item} value={item.value}
                                                                    class={item.cssClass}>
                                                                    {item.label}
                                                                </option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                </template>
                                                <div class="btn-group slds-p-right_small slds-col slds-p-top--x-small">
                                                    <lightning-button-icon title={Label.LBL_Add_As_Input}
                                                        icon-name="utility:forward" class="blue-icon" size="medium"
                                                        onclick={addSelectedFieldsHandler} data-recordid="input">
                                                    </lightning-button-icon>
                                                    <lightning-button-icon title={Label.LBL_Add_As_Output}
                                                        icon-name="utility:forward" class="orange-icon" size="medium"
                                                        onclick={addSelectedFieldsHandler} data-recordid="output">
                                                    </lightning-button-icon>
                                                    <lightning-button-icon icon-name="utility:add"
                                                        class="lago-black-icon" size="medium" title="add Custom Field"
                                                        onclick={toggleAddCustomField}>
                                                    </lightning-button-icon>
                                                    <div class={filterIconClass}>
                                                        <lightning-button-icon variant={filterIconVariant}

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
        </div>
        <div if:false={showSaveAsMenu}>
            <div if:true={showConfirmOverwrite}>
                <!-- Modal/Popup Box starts here-->
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-04" aria-modal="true"
                    aria-describedby="modal-content-id-5" class="slds-modal slds-fade-in-open ">
                    <div class="slds-modal__container">
                        <!-- Modal/Popup Box Header Starts here-->
                        <header class="slds-modal__header">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                {Label.LBL_Overwrite}
                            </div>
                        </header>
                        <!--Modal/Popup Box Body Starts here-->
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-5">
                            {Label.MSG_Template_Name_Used_Overwrite} "{instance.currentTemplate.name}"?
                        </div>
                        <!--Modal/Popup Box Footer Starts here-->
                        <footer class="slds-modal__footer">
                            <lightning-button title={Label.LBL_No} label={Label.LBL_No} onclick={cancelConfirmOverwrite}
                                class="slds-p-right_x-small">
                            </lightning-button>
                            <lightning-button title={Label.LBL_Yes} label={Label.LBL_Yes} variant="brand"
                                onclick={confirmSave} if:false={showSaveAsMenu}>
                            </lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
            </div>
        </div>
        <div if:true={showPersonalizedAddForm}>
            <!-- Modal/Popup Box starts here-->
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-07" aria-modal="true"
                aria-describedby="modal-content-id-7" class="slds-modal slds-fade-in-open ">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box Header Starts here-->
                    <header class="slds-modal__header">
                        <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            {Label.LBL_Personalised_Field}
                        </div>
                    </header>
                    <!--Modal/Popup Box Body Starts here-->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-7"
                        style="overflow: unset;">
                        <lightning-input label={Label.LBL_Field_Name} onchange={personalisedFieldNameChangeHandler}>
                        </lightning-input>
                        <lightning-combobox label={Label.LBL_Field_Type} onchange={personalisedFieldTypeChangeHandler}
                            options={instance.personalisedField.options}>
                        </lightning-combobox>
                        <lightning-input label={Label.LBL_Action} onchange={personalisedActionChangeHandler}>
                        </lightning-input>
                        <lightning-input label={Label.LBL_Rerender} onchange={personalisedRerenderChangeHandler}
                            field-level-help={Label.MSG_Rerender_Help_Text}>
                        </lightning-input>
                    </div>
                    <!--Modal/Popup Box Footer Starts here-->
                    <footer class="slds-modal__footer">
                        <lightning-button title={Label.LBL_Cancel} label={Label.LBL_Cancel}
                            onclick={personalisedFieldHide} class="slds-p-right--xxx-small">
                        </lightning-button>
                        <lightning-button title={Label.LBL_Yes} label={Label.LBL_Yes} variant="brand"
                            onclick={confirmPersonalisedField}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
        </div>
        <div if:true={showAddrelatedPopup}>
            <!-- Modal/Popup Box starts here-->
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-08" aria-modal="true"
                aria-describedby="modal-content-id-8" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box Header Starts here-->
                    <header class="slds-modal__header">
                        <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            {instance.addrelatedFields.originafieldLabel}
                        </div>
                    </header>
                    <!--Modal/Popup Box Body Starts here-->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-8"
                        style="overflow: unset;">
                        <div>
                            {Label.MSG_Add_Related_Fields}
                        </div>
                        <div>
                            {instance.addrelatedFields.relatedFieldsLabel}
                        </div>
                    </div>
                    <!--Modal/Popup Box Footer Starts here-->
                    <footer class="slds-modal__footer">
                        <lightning-button title={Label.LBL_Cancel} label={Label.LBL_Cancel} onclick={removeFromStack}
                            class="slds-p-right--xxx-small">
                        </lightning-button>
                        <lightning-button title={Label.LBL_Yes} label={Label.LBL_Yes} variant="brand"
                            onclick={addFromStack}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.8;"></div>
        </div>
    </div>
</template>
