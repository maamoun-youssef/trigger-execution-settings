<template>
<div class="mainContainer" id="main-page">
<div class="slds-page-header slds-m-bottom_small loadingScreen" if:true={loading}>
<div class="slds-col slds-has-flexi-truncate">
<div class="slds-media slds-no-space slds-grow">
<div class="slds-media__figure">
<div class="slds-avatar">
<c-negoptim-stencil circle="true" height="50" width="50"></c-negoptim-stencil>
</div>
</div>
<div class="slds-media__body">
<p class="slds-line-height_reset" style="font-size: var(--lwc-fontSize2,0.75rem);">
<c-negoptim-stencil width="200"></c-negoptim-stencil>
</p>
<h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
<c-negoptim-stencil width="400"></c-negoptim-stencil>
</h1>
</div>
</div>
</div>
</div>
<template if:true={isDeleteRow}>
<div class="slds-backdrop slds-backdrop_open">
<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
class="slds-modal slds-fade-in-open slds-modal_small">
<div class="slds-modal__container deletePopUp">
<div class="slds-modal__header">
<h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">
{labels.LBL_Confirm}
</h1>
</div>
<div class="slds-modal__content slds-text-align_center slds-p-around_x-small"
id="modal-content-id-4">
<div class="slds-modal__content slds-text-align_center slds-p-around_x-small"
id="modal-content-id-2">
<h4 class="slds-hyphenate">{labels.MSG_Confirm_Delete}</h4>
</div>
</div>
<div class="slds-modal__footer">
<lightning-button label={labels.LBL_Cancel} variant="neutral"
onclick={handleCPDDeleteCancel} class="slds-m-right_x-small"></lightning-button>
<lightning-button label={labels.LBL_Delete} variant="brand" onclick={handleCPDDelete}>
</lightning-button>
</div>
</div>
</section>
</div>
</template>
<div class="slds-page-header slds-m-bottom_small slds-grid pageHeader" id='pageHeader' if:false={loading}>
<!-- LAYOUT GRID -->
<!-- GRID COL -->
<div class="slds-col slds-has-flexi-truncate">
<!-- HEADING AREA -->
<!-- MEDIA OBJECT = FIGURE + BODY -->
<div class="slds-media slds-no-space slds-grow">
<div class="slds-media__body">
<p class="slds-line-height_reset" style="font-size: var(--lwc-fontSize2,0.75rem);">
Commercial Plan Simulation Matrix
</p>
<h1 class="slds-page-header__title slds-m-right_small slds-p-around_xx-small slds-align-middle slds-truncate"
title="">
{currentCommercialPlan.Name}
</h1>
</div>
</div>
<!-- / MEDIA OBJECT -->
<!-- /HEADING AREA -->
</div>
<div class="slds-col slds-no-flex slds-grid slds-align-top">
<div class="slds-grid">
<lightning-button label={labels.LBL_Cancel} title={labels.LBL_Cancel} onclick={handleCancel}
class="slds-m-left_x-small header_button">
</lightning-button>
<lightning-button label={labels.LBL_New} title={labels.LBL_New} onclick={createNewCPD}
class="slds-m-left_x-small header_button">
</lightning-button>
<lightning-button label={labels.LBL_Save} title={labels.LBL_Save} onclick={saveSimulation}
variant="brand" class="slds-m-left_x-small header_button">
</lightning-button>
<lightning-button-menu menu-alignment="right" alternative-text="Show menu" variant="border-filled"
onselect={showFieldManagerHandler} icon-name="utility:connected_apps"
class="slds-m-left_x-small header_button">
<lightning-menu-item value="fieldManager" icon-name="utility:freeze_column"
label={labels.LBL_Show_Hide_Columns}></lightning-menu-item>
<lightning-menu-item value="exportExcel" icon-name="utility:download" label={labels.LBL_Export}>
</lightning-menu-item>
</lightning-button-menu>
<lightning-button-icon-stateful style="margin-left: 10px;" icon-name="utility:filterList"
onclick={toggleFilter} variant="border-filled" class="filterBtn slds-var-p-right_x-small">
</lightning-button-icon-stateful>

</div>
</div>
</div>
<div id="mainTable" class="slds-grid slds-card tableBody mainTable">
<div class="slds-col slds-scrollable" style={tableStyle}>
<!-- commecialPlan TABLE -->
<div class="tableContainer" if:false={Loading}>
<template if:true={tableLoading}>
<lightning-spinner variant="brand" size="large"></lightning-spinner>
</template>
<table
class="initial-table no-help-text main-table slds-scrollable slds-scrollable_y slds-table slds-table_bordered slds-table_cell-buffer slds-border_left slds-border_right">
<!-- HEADER -->
<thead>
<tr style="height: 50px" class="mainTableHeader">
<th style="padding-left:0px;position: sticky; z-index: 6; left: 0;" class={tableHeader}
rowspan="2"></th>
<template for:each={displayedFields} for:item="displayedField"
for:index="displayedFieldIndex">
<th class="slds-text-align_center" rowspan="2" style={displayedField.thStyle}
key={displayedField.key}>
<div class="slds-grid slds-align-content-center slds-truncate">
<div>
{displayedField.fieldLabel}
</div>
<template if:true={displayHelpText}>
<template if:true={displayedField.helpText}>
<lightning-helptext class="slds-p-left_small"
content={displayedField.helpText}></lightning-helptext>
</template>
</template>
<template if:true={displayedField.isShowFilterOnColumnHeader}>
<lightning-button-icon-stateful
style="right: 0px;top:0;position:absolute;"
icon-name="utility:filterList" onclick={toggleDropDownFilter}
selected={displayedField.hasFilter} variant="border-filled"
size="x-small" class="filter-btn"
data-field={displayedField.fieldName}
data-button-field={displayedField.fieldName}>
</lightning-button-icon-stateful>

<div class="slds-hide slds-scrollable headerFilterSection slds-dropdown slds-p-around_x-small slds-dropdown_left"
data-filter-field={displayedField.fieldName}
style={displayedField.divStyle}>
<span style="position: absolute;right: 0;top: 0; z-index: 7;">
<lightning-button-icon variant="container" size="small"
icon-name="utility:close"
data-field={displayedField.fieldName}
onclick={toggleDropDownFilter} alternative-text='close'>
</lightning-button-icon>
</span>
<div class="slds-scrollable" style="overflow:visible;">
<ul class="slds-dropdown__list" role="menu"
aria-label="Show More">
<li class="slds-dropdown__item" role="presentation"
style="text-align: left;">
<template if:true={displayedField.isSearchBar}>
<lightning-input name={displayedField.fieldName}
data-mode="one" type='text'
data-header-filter={displayedField.fieldName}
class="dataFilter"
label={displayedField.fieldLabel}
onchange={setSelectedValues}>
</lightning-input>
</template>
<template if:true={displayedField.isRange}>
<div class='slds-form-element'>
<legend
class="slds-form-element__label slds-form-element__legend">
{displayedField.fieldLabel}
</legend>
<div
class="slds-form-element__control slds-grid slds-gutters">
<lightning-input
type={displayedField.dataType}
label={labels.LBL_Minimum}
class='slds-col dataFilter'
name={displayedField.fieldName}
data-header-filter={displayedField.fieldName}
step={displayedField.stepHtml}
data-range='value1'
onchange={setSelectedRangeValue}>
</lightning-input>
<span style='margin-top: 1.75rem;'>-</span>
<lightning-input
type={displayedField.dataType}
data-header-filter={displayedField.fieldName}
label={labels.LBL_Maximum}
step={displayedField.stepHtml}
class='slds-col dataFilter'
name={displayedField.fieldName}
data-range='value2'
onchange={setSelectedRangeValue}>
</lightning-input>
</div>
</div>
</template>
<template if:true={displayedField.isPicklist}>
<lightning-checkbox-group
if:true={displayedField.isPicklist}
data-name={displayedField.fieldName}
class="dataFilter"
data-header-filter={displayedField.fieldName}
name={displayedField.fieldName}
label={displayedField.fieldLabel}
options={displayedField.pickListValues}
value={displayedField.values}
onchange={setSelectedValues}>
</lightning-checkbox-group>
</template>
</li>
<li class="slds-has-divider_top-space" role="separator">
</li>
<div style="width: max-content;"
class="slds-align_absolute-center slds-grid">
<div class="slds-col slds-var-p-right_xx-large">
<button type="submit" title={labels.LBL_Reset}
data-field={displayedField.fieldName}
onclick={reset} data-type="filter"
class="slds-button slds-button_neutral">
{labels.LBL_Reset}
</button>
<button type="submit" title={labels.LBL_Search}
data-field={displayedField.fieldName}
onclick={toggleDropDownFilter}
data-actiontype="search"
class="slds-button slds-button_brand">
{labels.LBL_Search}
</button>
</div>
<!--div class="slds-col">
<button type="submit" title={labels.LBL_Search}
data-field={displayedField.fieldName} onclick={toggleDropDownFilter}
data-actiontype="search" class="slds-button slds-button_brand">
{labels.LBL_Search}
</button>
</div-->
</div>
</ul>
</div>
</div>
</template>
<template if:true={displayedField.isMassUpdate}>
<lightning-button-icon variant="container" size="small"
icon-name="utility:edit" data-field={displayedField.fieldName}
onclick={toggleMassUpdatePanel}
alternative-text={labels.LBL_Mass_update}
title={labels.LBL_Mass_update} class="massUpdateBtn">
</lightning-button-icon>
<template if:true={displayedField.displayMassUpdate}>
<div class="slds-dropdown slds-p-around_x-small"
data-updatefield={displayedField.fieldName}
style="width: 255px;box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;top: 100%; z-index:6;">
<span style="position: absolute;right: 0;top: 0; z-index: 5;">
<lightning-button-icon variant="container" size="small"
icon-name="utility:close"
data-field={displayedField.fieldName}
onclick={toggleMassUpdatePanel} alternative-text="Close"
title="Close">
</lightning-button-icon>
</span>
<ul class="slds-dropdown__list slds-p-top--medium" role="menu"
aria-label="Show More">
<li class="slds-dropdown__item" role="presentation"
style="text-align: left;">
<template if:true={displayedField.isNumberField}>
<lightning-input variant="label-hidden"
data-field-name={displayedField.fieldName}
onchange={massUpdateHandler}
data-index={displayedFieldIndex}
value={displayedField.massUpdateValue}>
</lightning-input>
</template>
<template if:true={displayedField.isReference}>
<template lwc:if={displayedField.isCategory}>
<lightning-input
data-index={displayedFieldIndex}
data-field-name={displayedField.fieldName}
data-popup="category"
onchange={massUpdateHandler}
onclick={loadPopupHandler}
variant="label-hidden"
value={displayedField.massUpdateLabel}>
</lightning-input>
</template>
<template lwc:elseif={displayedField.isProduct}>
<lightning-input
data-index={displayedFieldIndex}
data-field-name={displayedField.fieldName}
onclick={loadPopupHandler}
data-popup="product"
onchange={massUpdateHandler}
variant="label-hidden"
value={displayedField.massUpdateLabel}>
</lightning-input>
</template>
<template lwc:elseif={displayedField.isBU}>
<lightning-input
data-index={displayedFieldIndex}
data-field-name={displayedField.fieldName}
data-popup="bu" onclick={loadPopupHandler}
onchange={massUpdateHandler}
variant="label-hidden"
value={displayedField.massUpdateLabel}>
</lightning-input>
</template>
<template lwc:else>
<lightning-record-edit-form
object-api-name={CommercialPlanDetailObject}
class="lookup">
<lightning-input-field
variant="label-hidden"
field-name={displayedField.fieldName}
value={displayedField.massUpdateValue}
data-field-name={displayedField.fieldName}
onchange={massUpdateHandler}
data-index={displayedFieldIndex}>
</lightning-input-field>
</lightning-record-edit-form>
</template>
</template>
<template if:true={displayedField.isDate}>
<lightning-input variant="label-hidden" type="date"
value={displayedField.massUpdateValue}
data-field-name={displayedField.fieldName}
onchange={massUpdateHandler}
data-index={displayedFieldIndex}>
</lightning-input>
</template>
<template if:true={displayedField.isString}>
<lightning-input variant="label-hidden"
value={displayedField.massUpdateValue}
data-field-name={displayedField.fieldName}
onchange={massUpdateHandler}
data-index={displayedFieldIndex}>
</lightning-input>
</template>
<template if:true={displayedField.isPicklist}>
<template
if:false={displayedField.hasDependentPicklist}>
<select onchange={massUpdateHandler}
data-field-name={displayedField.fieldName}
data-index={displayedFieldIndex}>
<template
for:each={displayedField.pickListValues}
for:item="option">
<option key={option.value}
value={option.value}
selected={option.isSelected}>
{option.label}</option>
</template>
</select>
</template>
<template
if:true={displayedField.hasDependentPicklist}>
<template
for:each={displayedField.dependentPicklist}
for:item="dependentPicklist"
for:index="depIndex">
{dependentPicklist.fieldLabel}
<select key={dependentPicklist.fieldName}
data-field-name={dependentPicklist.fieldName}
onchange={massUpdateHandler}
data-index={dependentPicklist.fieldIndex}
data-depindex={depIndex}
data-parentindex={displayedFieldIndex}
disabled={dependentPicklist.disabled}>
<template
for:each={dependentPicklist.pickListValues}
for:item="option">
<option key={option.value}
value={option.value}
selected={option.isSelected}>
{option.label}</option>
</template>
</select>
</template>
</template>
</template>
</li>
<li class="slds-dropdown__item" role="presentation"
style="text-align: left;">
{getMassUpdateLines}
</li>
<li class="slds-has-divider_top-space" role="separator">
</li>
<div>
<button type="submit" title={labels.LBL_Apply}
style="width: 100%;" onclick={handleApplyMassUpdate}
class="slds-button slds-button_brand">
{labels.LBL_Apply}
</button>
</div>
</ul>
</div>
</template>
</template>
</div>
</th>
</template>
<th rowspan="2" style="z-index: 6;position: sticky; right: 0;" if={isDisplayLastTD}>
</th>
</tr>
</thead>
<tbody>
<template if:false={Loading}>
<template if:true={isEmpty}>
<tr>
<td colspan={displayedFields.length}>
<h2
class="slds-align_absolute-center slds-text-align_center slds-m-around_xx-large slds-card__header-title slds-align-content-center">
{labels.LBL_No_Item_To_Display}
</h2>
</td>
</tr>
</template>
</template>
<template if:false={isEmpty}>
<template if:false={tableLoading} for:each={wCPDJSList}
for:item="commercialPlanDetailWrapper" for:index="CPDindex">
<tr key={commercialPlanDetailWrapper.commercialPlanDetail.Id}
style="border-collapse: collapse !important;">
<td style={commercialPlanDetailWrapper.firstTdStyle}
onclick={handleClickDetail}>
<div if:false={commercialPlanDetailWrapper.isNew}
class="slds-form-element__row slds-grid">
<lightning-input type="checkbox"
checked={commercialPlanDetailWrapper.isSelected}
variant="label-hidden" data-id={commercialPlanDetailWrapper.id}
data-cpd-index={CPDindex} onchange={toggleRecordSelect}
if:true={enableMassUpdate}></lightning-input>
<template if:true={commercialPlanDetailWrapper.hasChildren}>
<div class="slds-form-element__control">
<lightning-button-icon
icon-name={commercialPlanDetailWrapper.iconName}
alternative-text="Children" variant="bare"
onclick={toggleChildren} data-index={CPDindex}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
<div class="slds-form-element__control" style="visibility: hidden;">
<lightning-button-icon icon-name="utility:chevronright"
alternative-text="Open" variant="bare"
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:copy"
alternative-text="Clone" variant="bare" onclick={cloneCPD}
data-rowindex={commercialPlanDetailWrapper.index}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
<template if:true={displayAddChildrenLine}>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:add"
alternative-text="Add" variant="bare"
onclick={createNewCPDChild}
data-index={commercialPlanDetailWrapper.index}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
<template if:true={displayCloneForMultipleProducts}>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:multi_select_checkbox"
alternative-text={labels.LBL_Multi_Product_Selection}
variant="bare" onclick={createCloneForMultipleProducts}
data-index={commercialPlanDetailWrapper.index}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
</div>
<div if:true={commercialPlanDetailWrapper.isNew}
class="slds-form-element__row slds-grid">
<template if:true={commercialPlanDetailWrapper.hasChildren}>
<div class="slds-form-element__control">
<lightning-button-icon
icon-name={commercialPlanDetailWrapper.iconName}
alternative-text="Children" variant="bare"
onclick={toggleChildren} data-index={CPDindex}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
<template if:false={commercialPlanDetailWrapper.hasChildren}>
<div class="slds-form-element__control" style="visibility: hidden;">
<lightning-button-icon icon-name="utility:chevronright"
alternative-text="Open" variant="bare" disabled
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:copy"
alternative-text="Clone" variant="bare" disabled
data-rowindex={commercialPlanDetailWrapper.index}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
<template if:true={displayAddChildrenLine}>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:add"
alternative-text="Add" variant="bare"
onclick={createNewCPDChild} disabled
data-index={commercialPlanDetailWrapper.index}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
<template if:true={displayCloneForMultipleProducts}>
<div class="slds-form-element__control" style="margin-left: 10px;">
<lightning-button-icon icon-name="utility:multi_select_checkbox"
alternative-text={labels.LBL_Multi_Product_Selection}
variant="bare" onclick={createCloneForMultipleProducts}
data-index={commercialPlanDetailWrapper.index}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
class="slds-m-left_xx-small">
</lightning-button-icon>
</div>
</template>
</div>
</td>
<template for:each={commercialPlanDetailWrapper.values}
for:item="commercialPlanDetailField" for:index="fieldindex">
<template if:false={commercialPlanDetailField.isHidden}>
<td key={commercialPlanDetailField.fieldApiName}
onclick={handleClickDetail}
style={commercialPlanDetailField.tdStyle}>
<template if:false={commercialPlanDetailField.isInput}>
<template if:true={commercialPlanDetailField.isNumberField}>
<lightning-formatted-number
maximum-fraction-digits={commercialPlanDetailField.scale}
value={commercialPlanDetailField.fieldValue}>
</lightning-formatted-number>
</template>
<template if:true={commercialPlanDetailField.isText}>
<template
if:true={commercialPlanDetailField.isHTMLFormatted}>
<lightning-formatted-rich-text
value={commercialPlanDetailField.fieldOutputValue}>
</lightning-formatted-rich-text>
</template>
<template
if:false={commercialPlanDetailField.isHTMLFormatted}>
{commercialPlanDetailField.fieldOutputValue}
</template>
</template>
<template if:true={commercialPlanDetailField.isReference}>
<a href={commercialPlanDetailField.link} target="_blank">
{commercialPlanDetailField.fieldOutputValue}</a>
</template>
<template if:true={commercialPlanDetailField.isBoolean}>
<lightning-input class="slds-p-left_xx-large"
type="checkbox" variant="label-hidden"
checked={commercialPlanDetailField.fieldValue} disabled>
</lightning-input>
</template>
<template if:true={commercialPlanDetailField.isDate}>
<lightning-formatted-date-time
value={commercialPlanDetailField.fieldValue}
year="numeric" month="2-digit"
day="2-digit"></lightning-formatted-date-time>
</template>
</template>
<template if:true={commercialPlanDetailField.isInput}>
<template if:true={commercialPlanDetailField.isText}>
<lightning-input data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
onchange={handleFieldEdits} variant="label-hidden"
value={commercialPlanDetailField.fieldValue}>
</lightning-input>
</template>
<template if:true={commercialPlanDetailField.isNumberField}>
<lightning-input data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
data-isnumber="true" type="number"
onchange={handleFieldEdits} variant="label-hidden"
formatter="decimal"
step={commercialPlanDetailField.step}
value={commercialPlanDetailField.fieldValue}>
</lightning-input>
</template>
<template if:true={commercialPlanDetailField.isReference}>
<template lwc:if={commercialPlanDetailField.isCategory}>
<lightning-input data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
data-popup="category" onchange={handleFieldEdits}
onclick={loadPopupHandler} variant="label-hidden"
value={commercialPlanDetailField.fieldOutputValue}>
</lightning-input>
</template>
<template lwc:elseif={commercialPlanDetailField.isProduct}>
<lightning-input data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
onclick={loadPopupHandler} data-popup="product"
onchange={handleFieldEdits} variant="label-hidden"
value={commercialPlanDetailField.fieldOutputValue}>
</lightning-input>
</template>
<template lwc:elseif={commercialPlanDetailField.isBU}>
<lightning-input data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
data-popup="bu" onclick={loadPopupHandler}
onchange={handleFieldEdits} variant="label-hidden"
value={commercialPlanDetailField.fieldOutputValue}>
</lightning-input>
</template>
<template lwc:else>
<lightning-record-edit-form
object-api-name={CommercialPlanDetailObject}
record-id={commercialPlanDetailWrapper.id}>
<lightning-input-field
field-name={commercialPlanDetailField.fieldApiName}
data-fieldindex={fieldindex}
data-rowindex={CPDindex}
data-id={commercialPlanDetailWrapper.id}
data-field={commercialPlanDetailField.fieldApiName}
onchange={handleFieldEdits}
variant="label-hidden"
value={commercialPlanDetailField.fieldOutputValue}>
</lightning-input-field>
</lightning-record-edit-form>
</template>
</template>
<template if:true={commercialPlanDetailField.isBoolean}>

<div class="slds-modal__content slds-p-around_medium">
<lightning-dual-listbox name="Fields" label="Select Desired Fields" source-label="Hidden"
selected-label="Shown" field-level-help="Select your preferred fields" options={fieldOptions}
value={selectedFields} onchange={handleDisplayedFieldsChange}></lightning-dual-listbox>
</div>
<div class="slds-modal__footer">
<button class="slds-button slds-button_neutral"
onclick={closeFieldManagerHandler}>{labels.LBL_Cancel}</button>
</div>
</div>
</section>
<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
<template if:true={showFileUploadPopup}>
<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-33"
class="slds-modal slds-fade-in-open">
<div class="slds-modal__container" style="width: 50rem;">
<div class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
<lightning-button-icon variant="bare-inverse" size="large" icon-name="utility:close"
onclick={closeFileUploadPopup}></lightning-button-icon>
</div>
<div class="slds-modal__header">
<h1 class="slds-modal__title slds-hyphenate">{labels.LBL_Upload_File}</h1>
</div>
<div class="slds-modal__content slds-p-around_large">
<lightning-file-upload name="fileUploader"
record-id={currentAPEXCommercialPlanDetail.commercialPlanDetail.Id} accept={acceptedFormats}
onuploadfinished={handleUploadFinished}>
</lightning-file-upload>
</div>
<div class="slds-modal__footer">
<button class="slds-button slds-button_neutral"
onclick={closeFileUploadPopup}>{labels.LBL_Cancel}</button>
</div>
</div>
</section>
<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
</template>
