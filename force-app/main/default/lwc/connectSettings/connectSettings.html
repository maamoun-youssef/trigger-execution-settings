<template>
    <div class="mainContainer slds-card">
        <div class="settings-header">
            <lightning-icon icon-name='utility:settings' class="custom-icon-settings">
            </lightning-icon>
            <div>
                <p class="settings-subtitle">
                    {labels.LBL_Connect_Settings_Title}
                </p>
                <h1 class="slds-page-header__title settings-header-title">
                    {labels.LBL_Connect_Settings_SubTitle}
                </h1>
            </div>
        </div>
        <!-- <template lwc:if={showSaveButton}>
            <div class="slds-grid slds-grid_align-end">
                <div class="slds-col save-button-container">
                    <lightning-button class="slds-button slds-m-right_x-small" variant="brand" label={labels.LBL_Save}
                        onclick={handleSave}>
                    </lightning-button>
                </div>
            </div>
        </template> -->
        <lightning-tabset variant="vertical" class="tab-set-style slds-m-bottom_x-small mainHeight"
            active-tab-value="1">
            <template lwc:if={isLoading}>
                <div class="slds-spinner_container greyBg">
                    <div class="loader slds-spinner_container slds-align_absolute-center"></div>
                </div>
            </template>
            <lightning-tab value="1" tabindex="-1" label={labels.LBL_Welcome_Page} class="slds-scrollable_y">
                <div style={mainPanelHeight}>
                    <div class="slds-grid slds-grid_align-end">
                        <div class="slds-col save-button-container">
                            <lightning-button class="slds-button slds-m-right_x-small" variant="brand"
                                label={labels.LBL_Save} onclick={handleSave}>
                            </lightning-button>
                        </div>
                    </div>
                    <div>
                        <div class="slds-media__body slds-p-around_x-small stickyHeader">
                            <div class="sectionTitle">
                                {labels.LBL_Connect_Navigation}
                            </div>

                        </div>
                        <div class="label">
                            {labels.LBL_Connect_NavigationDescription}
                        </div>
                        <div class="negoptim-tablesection">
                            <table>
                                <tr class="table-header">
                                    <th class="table-th th-w7">{labels.LBL_Connect_MenuNumber}</th>
                                    <th class="table-th">{labels.LBL_Connect_MenuName}</th>
                                    <!-- <th class="table-th">{labels.LBL_Connect_MenuShow}</th> -->
                                    <th class="table-th">{labels.LBL_Connect_MenuActivate}</th>
                                    <th class="table-th">{labels.LBL_Connect_MenuIcon}</th>
                                    <th class="table-th">{labels.LBL_Connect_MenuRedirectionType}</th>
                                    <th class="table-th">{labels.LBL_Connect_MenuRedirection}</th>
                                </tr>
                                <template for:each={connectSettings.modulesConfiguration} for:item="module"
                                    for:index="index">
                                    <tr key={module.index}>
                                        <td class="table-td">{module.index}</td>
                                        <td class="table-td">
                                            <lightning-input value={module.name} data-index={index} data-field="name"
                                                onchange={handleChangeModuleConfigurations} variant="label-hidden">
                                            </lightning-input>
                                        </td>
                                        <!-- <td class="table-td">
                                            <label class="switch" data-index={index} data-field="isDisplayed">
                                                <input type="checkbox" checked={module.isDisplayed} data-index={index}
                                                    data-field="isDisplayed" onchange={handleChangeModuleConfigurations} />
                                                <span class="slider">
                                                </span>
                                            </label>
                                        </td> -->
                                        <td class="table-td">
                                            <label class="switch" data-index={index} data-field="isActive">
                                                <input type="checkbox" checked={module.isActive} data-index={index}
                                                    data-field="isActive" onchange={handleChangeModuleConfigurations} />
                                                <span class="slider">
                                                </span>
                                            </label>
                                        </td>
                                        <td class="table-td">
                                            <div>
                                                <div style={module.iconStyle} class="disp">
                                                </div>
                                                <div class="disp button-trans">
                                                    <lightning-button-icon icon-name="utility:replace" size="small"
                                                        data-index={index} data-field="iconUrl"
                                                        onclick={handleChangeModuleConfigurations}>
                                                    </lightning-button-icon>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="table-td">
                                            <div class="slds-align--absolute-center" style="width: fit-content;">
                                                <lightning-radio-group variant="label-hidden" style="text-align: left;"
                                                    options={redirectionOptions} value={module.redirectionType}
                                                    data-index={index} data-field="redirectionType"
                                                    onchange={handleChangeModuleConfigurations} type="radio">
                                                </lightning-radio-group>
                                            </div>
                                        </td>
                                        <td class="table-td">
                                            <template lwc:if={module.isURL}>
                                                <lightning-input value={module.redirection} data-index={index}
                                                    data-field="redirection" onchange={handleChangeModuleConfigurations}
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </template>
                                            <template lwc:else>
                                                <lightning-combobox value={module.redirection}
                                                    options={pageSettingOptions} data-index={index}
                                                    data-field="redirection" variant="label-hidden"
                                                    onchange={handleChangeModuleConfigurations}>
                                                </lightning-combobox>
                                            </template>
                                        </td>

                                    </tr>
                                </template>
                            </table>
                        </div>
                        <div class="slds-media__body slds-p-around_x-small stickyHeader">
                            <div class="sectionTitle">
                                {labels.LBL_Connect_SearchParameters}
                            </div>
                        </div>
                        <div class="label">
                            {labels.LBL_Connect_SearchParametersDescription}
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label">
                                {labels.LBL_Searcheable_Objects}
                            </div>
                            <div class="info-container-w">
                                <div class="search">
                                    <lightning-input value={searchTerm} onchange={handleSearch} type="search">
                                    </lightning-input>
                                </div>
                                <div class="negoptim-firsttable">
                                    <div class="negoptim-available">{labels.LBL_Connect_AvailableObjects}</div>
                                    <div class="negoptim-availableobjects">
                                        <template for:each={objectDescriptions} for:item="objDesc">
                                            <div key={objDesc.apiName} data-id={objDesc.apiName}
                                                onclick={handleObjectSelection}>
                                                <template if:true={objDesc.isSelected}>
                                                    <div class="selected">{objDesc.label}</div>
                                                </template>
                                                <template if:false={objDesc.isSelected}>
                                                    <div>{objDesc.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="negoptim-sorticon">
                                    <div class="negoptim-sortleft">
                                        <img src={sortLeft} onclick={moveSelectedObjectsToLeft} />
                                    </div>
                                    <div class="negoptim-sortright">
                                        <img src={sortRight} onclick={moveSelectedObjectsToRight} />
                                    </div>
                                    <div class="negoptim-sortup">
                                        <img src={sortUp} onclick={moveSelectedObjectsToLeft} />
                                    </div>
                                    <div class="negoptim-sortdown">
                                        <img src={sortDown} onclick={moveSelectedObjectsToRight} />
                                    </div>
                                </div>
                                <div class="negoptim-secondtable">
                                    <div class="negoptim-allowed">{labels.LBL_Connect_SearchableObjects}</div>
                                    <div class="negoptim-allowedobjects">
                                        <template for:each={searchableObjects} for:item="search">
                                            <div key={search.apiName} data-id={search.apiName}
                                                onclick={handleSearchableObjectSelection}>
                                                <template if:true={search.isSelected}>
                                                    <div class="selected">{search.label}</div>
                                                </template>
                                                <template if:false={search.isSelected}>
                                                    <div>{search.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="add-breaks"></div>
                        <div class="slds-media__body slds-p-around_x-small stickyHeader">
                            <div class="sectionTitle">
                                {labels.LBL_Connect_UserOnboardingParameters}
                            </div>
                        </div>
                        <div class="label">
                            {labels.LBL_Connect_UserOnboardingParametersDescription}
                        </div>
                        <div class="negoptim-tablesection">
                            <table>
                                <tr class="table-header">
                                    <th class="table-th">{labels.LBL_Connect_Functionality}</th>
                                    <th class="table-th">{labels.LBL_Connect_Description}</th>
                                    <th class="table-th">{labels.LBL_Connect_MenuActivation}</th>
                                    <th class="table-th">{labels.LBL_Connect_RedirectionURL}</th>
                                </tr>
                                <tr>
                                    <td class="table-td">{labels.LBL_Connect_UserSelfOnboarding}</td>
                                    <td class="table-td">
                                        {labels.LBL_Connect_UserSelfOnboardingDescription}
                                    </td>
                                    <td class="table-td">
                                        <label class="switch">
                                            <input type="checkbox" checked={connectSettings.enableUserSettings}
                                                onchange={handleToggleSettings} />
                                            <span class="slider">
                                            </span>
                                        </label>
                                    </td>
                                    <td class="table-td">{labels.LBL_Connect_UserSelfOnboardingRedirectionUR}</td>
                                </tr>
                                <tr>
                                    <td class="table-td">{labels.LBL_Connect_PresentationVideo}</td>
                                    <td class="table-td">
                                        {labels.LBL_Connect_PresentationVideoDescription}
                                    </td>
                                    <td class="table-td">
                                        <label class="switch">
                                            <input type="checkbox" checked={connectSettings.enableSelfOnboarding}
                                                onchange={handleToggleBoarding} />
                                            <span class="slider">
                                            </span>
                                        </label>
                                    </td>
                                    <td class="table-td"><a href={connectSettings.onboardingVideoUrl}
                                            target="_blank">{labels.LBL_Connect_PresentationVideoRedirectionURL}</a>
                                    </td>
                                </tr>
                            </table>
                        </div>
                        <div class="slds-media__body slds-p-around_x-small stickyHeader">
                            <div class="sectionTitle">
                                {labels.LBL_Connect_BrandLogoUpload}
                            </div>
                        </div>
                        <div class="label">
                            {labels.LBL_Connect_BrandLogoUploadDescription}
                        </div>
                        <div class="negoptim-remember">
                            {labels.MSG_Connect_Saving_Settings_Reminder}
                        </div>
                        <div class="negoptim-mainuploads">
                            <div class="negoptim-uploadlogo">
                                <template if:true={showCloudIcon.portalFav}>
                                    <div class="negoptim-cloudicon" style="margin-bottom: 1rem; text-align: center;">
                                        <img src={uploadCloud} />
                                    </div>
                                </template>
                                <template if:false={showCloudIcon.portalFav}>
                                    <div class="negoptim-cloudicon" style={PortalFavIcon}></div>
                                </template>
                                <!-- <lightning-file-upload name="logoUploader"
                                    accept=".jpg,.jpeg,.png,.gif,.bmp,.tiff,.webp" data-lang="FR" record-id={recordId}
                                    data-field="logo" onuploadfinished={handleUploadFinished} class="img-pos">
                                </lightning-file-upload> -->
                                <input type="file" accept=".jpg,.jpeg,.png,.gif,.bmp,.tiff,.webp"
                                    onchange={handleLogoFileSelect} style="display:none" data-field="logo"
                                    class="logo-file-input" />
                                <lightning-file-upload name="logoUploader"
                                    accept=".jpg,.jpeg,.png,.gif,.bmp,.tiff,.webp" data-lang="FR" record-id={recordId}
                                    data-field="logo" onuploadfinished={handleUploadFinished} class="img-pos">
                                </lightning-file-upload>

                            </div>
                            <div class="negoptim-verticalline"></div>
                            <div class="negoptim-uploadvideo">
                                <template if:true={showCloudIcon.portalVideo}>
                                    <div class="negoptim-cloudicon" style="margin-bottom: 1rem; text-align: center;">
                                        <img src={uploadCloud} />
                                    </div>
                                </template>
                                <template if:false={showCloudIcon.portalVideo}>
                                    <div class="negoptim-videoplay">
                                        <video width="300" height="200" controls>
                                            <source src={videoUrl} type="video/mp4">
                                        </video>
                                    </div>
                                </template>
                                <lightning-file-upload name="videoUploader" data-lang="FR" accept=".mp4,.mov,.avi"
                                    record-id={recordId} data-field="video" onuploadfinished={handleUploadFinished}
                                    class="img-pos">
                                </lightning-file-upload>
                            </div>
                        </div>

                        <div class="negoptim-mainuploads">
                            <div class="negoptim-uploadlogo">
                                <template if:true={showCloudIcon.portalGuide}>
                                    <div style="margin-bottom: 1rem; text-align: center;">
                                        <img src={uploadCloud} alt="Upload Cloud Image" />
                                    </div>
                                </template>
                                <template if:false={showCloudIcon.portalGuide}>
                                    <div style="margin-bottom: 1rem; text-align: center;">
                                        <lightning-icon label="" title="Download Guide" onclick={downloadGuide}
                                            icon-name="utility:download" class="slds-m-top_small">
                                        </lightning-icon>
                                    </div>
                                </template>

                                <lightning-file-upload label={labels.LBL_Connect_UploadUserGuide} name="guideUploader"
                                    accept=".pdf,.doc,.docx,.xls,.xlsx" record-id={recordId} data-field="guide"
                                    onuploadfinished={handleUploadFinished} class="img-pos">
                                </lightning-file-upload>
                            </div>
                        </div>
                    </div>
                </div>
            </lightning-tab>
            <lightning-tab value="2" tabindex="-1" label={labels.LBL_PageSettings_settings} class="slds-scrollable_y">
                <div style={mainPanelHeight}>
                    <c-page-Settings class="component-w"></c-page-Settings>
                </div>
            </lightning-tab>
            <!-- <lightning-tab value="5" tabindex="-1" label={labels.LBL_PageLayout} class="slds-scrollable_y">
                <div style={mainPanelHeight} class="slds-scrollable--y">
                    <c-page-layout-settings class="component-w"></c-page-layout-settings>
                </div>
            </lightning-tab> -->
            <lightning-tab value="3" tabindex="-1" label={labels.LBL_Directory} class="slds-scrollable_y">
                <div style={mainPanelHeight} class="slds-scrollable_y">
                    <div class="slds-grid slds-grid_align-end">
                        <div class="slds-col save-button-container">
                            <lightning-button class="slds-button slds-m-right_x-small" variant="brand"
                                label={labels.LBL_Save} onclick={handleSave}>
                            </lightning-button>
                        </div>
                    </div>
                    <div>
                        <div class="slds-media__body slds-p-around_x-small stickyHeader">
                            <div class="sectionTitle">
                                {labels.LBL_Connect_ContactCreationParameters}
                            </div>
                        </div>
                        <div class="label">
                            {labels.LBL_Connect_ContactCreationParametersDescription}
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_ContactCreationWithoutRFA}
                                <div class="infoIcon disp">
                                    <lightning-helptext
                                        content={labels.LBL_Connect_ContactCreationWithoutRFADescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <div class="firsttable">
                                    <div class="listBoxHeader">{labels.LBL_Connect_Available_Profiles}</div>
                                    <div class="fieldslist">
                                        <template for:each={availableNonApprovalProfiles} for:item="profile"
                                            for:index="index">
                                            <div key={profile.label} data-index={index}
                                                data-array="availableNonApprovalProfiles"
                                                onclick={handleFieldSelection}>
                                                <template if:true={profile.isSelected}>
                                                    <div class="selected">{profile.label}</div>
                                                </template>
                                                <template if:false={profile.isSelected}>
                                                    <div class="listBoxElement">{profile.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="sorticon">
                                    <div class="sortIconContainer">
                                        <div>
                                            <div class="sortleft">
                                                <img src={sortLeft} data-selected-array="selectedNonApprovalProfiles"
                                                    data-available-array="availableNonApprovalProfiles"
                                                    onclick={moveSelectedItemsToLeft} />
                                            </div>
                                            <div class="sortright">
                                                <img src={sortRight} data-selected-array="selectedNonApprovalProfiles"
                                                    data-available-array="availableNonApprovalProfiles"
                                                    onclick={moveSelectedItemsToRight} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="secondtable">
                                    <div class="listBoxHeader">{labels.LBL_Connect_Selected_Profiles}</div>
                                    <div class="fieldslist">
                                        <template for:each={selectedNonApprovalProfiles} for:item="profile"
                                            for:index="index">
                                            <div key={profile.label} data-id={profile.name}
                                                data-array="selectedNonApprovalProfiles" data-index={index}
                                                onclick={handleFieldSelection}>
                                                <template if:true={profile.isSelected}>
                                                    <div class="selected listBoxElement">{profile.label}</div>
                                                </template>
                                                <template if:false={profile.isSelected}>
                                                    <div class="listBoxElement">{profile.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_ContactCreationWithRFA}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_ContactCreationWithRFADescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <div class="firsttable">
                                    <div class="listBoxHeader">{labels.LBL_Connect_Available_Profiles}</div>
                                    <div class="fieldslist">
                                        <template for:each={availableApprovalProfiles} for:item="profile"
                                            for:index="index">
                                            <div key={profile.label} data-index={index}
                                                data-array="availableApprovalProfiles" onclick={handleFieldSelection}>
                                                <template if:true={profile.isSelected}>
                                                    <div class="selected">{profile.label}</div>
                                                </template>
                                                <template if:false={profile.isSelected}>
                                                    <div class="listBoxElement">{profile.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="sorticon">
                                    <div class="sortIconContainer">
                                        <div>
                                            <div class="sortleft">
                                                <img src={sortLeft} data-selected-array="selectedApprovalProfiles"
                                                    data-available-array="availableApprovalProfiles"
                                                    onclick={moveSelectedItemsToLeft} />
                                            </div>
                                            <div class="sortright">
                                                <img src={sortRight} data-selected-array="selectedApprovalProfiles"
                                                    data-available-array="availableApprovalProfiles"
                                                    onclick={moveSelectedItemsToRight} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="secondtable">
                                    <div class="listBoxHeader">{labels.LBL_Connect_Selected_Profiles}</div>
                                    <div class="fieldslist">
                                        <template for:each={selectedApprovalProfiles} for:item="profile"
                                            for:index="index">
                                            <div key={profile.label} data-id={profile.name}
                                                data-array="selectedApprovalProfiles" data-index={index}
                                                onclick={handleFieldSelection}>
                                                <template if:true={profile.isSelected}>
                                                    <div class="selected listBoxElement">{profile.label}</div>
                                                </template>
                                                <template if:false={profile.isSelected}>
                                                    <div class="listBoxElement">{profile.label}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_DirectoryManagerSetting}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_DirectoryManagerSettingDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <lightning-radio-group name="radioGroup" label=" " variant="label-hidden"
                                    options={directoryManagerOptions} onchange={handleChangeDirectoryManager}
                                    value={connectSettings.directoryManager} type="radio">
                                </lightning-radio-group>
                            </div>
                        </div>
                        <div class="add-breaks"></div>

                        <div>
                            <div>
                                <div class="slds-media__body slds-p-around_x-small stickyHeader">
                                    <div class="sectionTitle">
                                        {labels.LBL_Connect_LicenseQuotaSetting}
                                    </div>
                                </div>
                            </div>
                            <div class="label">
                                {labels.LBL_Connect_LicenseQuotaSettingDescription}
                            </div>
                            <div class="pb15"></div>
                            <div>
                                <table>
                                    <tr class="table-header">
                                        <th class="table-th">{labels.LBL_Connect_Functionality}</th>
                                        <th class="table-th">{labels.LBL_Connect_Description}</th>
                                        <th class="table-th">{labels.LBL_Connect_Parameters}</th>
                                    </tr>
                                    <tr>
                                        <td class="table-td">{labels.LBL_License_Quota_Activation}</td>
                                        <td class="table-td">{labels.LBL_License_Quota_Activation_Desc}</td>
                                        <td class="table-td">
                                            <label class="switch">
                                                <input type="checkbox" checked={licenseQuotas.activation}
                                                    data-lisence="activation" onchange={handleLicenseQuota} />
                                                <span class="slider">
                                                </span>
                                            </label>
                                        </td>
                                    </tr>
                                    <template if:true={licenseQuotas.activation}>
                                        <tr>
                                            <td class="table-td">{labels.LBL_License_Quota_per_Supplier}</td>
                                            <td class="table-td">{labels.LBL_License_Quota_per_Supplier_Desc}</td>
                                            <td class="table-td">
                                                <lightning-input class="slds-align_absolute-center slds-size_xx-small"
                                                    type="number" variant="label-hidden"
                                                    data-lisence="licensePerSupplier"
                                                    value={licenseQuotas.licensePerSupplier}
                                                    onchange={handleLicenseQuota}>
                                                </lightning-input>
                                            </td>
                                        </tr>
                                    </template>
                                </table>
                            </div>
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_DefaultUserProfile}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_DefaultUserProfileDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <lightning-combobox class="comboBox" variant="label-hidden" name="defaultUser" label=" "
                                    value={connectSettings.connectUserProfile}
                                    placeholder={labels.LBL_Connect_Select_Profile_Placeholder} options={profileOptions}
                                    onchange={handleChangeUserProfile}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_DefaultUserGroup}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_DefaultUserGroupDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <lightning-combobox class="comboBox" variant="label-hidden" name="defaultUser" label=" "
                                    value={connectSettings.connectUserGroup}
                                    placeholder={labels.LBL_Connect_Select_Group_Placeholder} options={groupOptions}
                                    onchange={handleChangeUserGroup}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_UserPermissionSetGroup}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_UserPermissionSetGroupDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <lightning-combobox class="comboBox" variant="label-hidden"
                                    value={connectSettings.connectUserPermissionSetGroup}
                                    placeholder={labels.LBL_Connect_Select_Group_Placeholder}
                                    options={permissionSetGroupOptions} onchange={handleChangePermissionSetGroup}>
                                </lightning-combobox>
                            </div>
                        </div>

                        </div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_StatementWelcomeMessage}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_StatementWelcomeMessageDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <div class="w36">
                                    <lightning-textarea value={connectSettings.sellInWelcomeMessage}
                                        onchange={handleChangeSellInWelcomeMessage} variant="label-hidden">
                                    </lightning-textarea>
                                </div>
                            </div>
                        </div>
                        <div class="add-breaks"></div>
                        <div class="section-Container slds-m-top_medium">
                            <div class="section-label disp">
                                {labels.LBL_Connect_StatementSubmission}
                                <div class="infoIcon disp">
                                    <lightning-helptext content={labels.LBL_Connect_StatementSubmissionDescription}>
                                    </lightning-helptext>
                                </div>
                            </div>
                            <div class="info-container-w">
                                <lightning-combobox class="comboBox" variant="label-hidden" name="defaultUser" label=" "
                                    value={connectSettings.sellInSubmissionFlow} data-id="sellInSubmissionFlow"
                                    options={flowPickList} onchange={handleChangeFlow}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div class="add-breaks"></div>
                    </div>
                </div>
            </lightning-tab>
        </lightning-tabset>
        <!-- Icon Picker -->
        <template if:true={showIconPicker}>
            <c-icon-resource-picker oniconselect={handleIconSelect} onclose={closeIconPicker}>
            </c-icon-resource-picker>
        </template>
    </div>
</template>
