<template>
    <div class="slds-card">
        <template if:true={tableLoading}>
            <div class="slds-spinner_container">
                <div class="loader slds-spinner_container slds-align--absolute-center">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </template>
        <div class="main-header">
            <div class="slds-card slds-grid slds-p-around_xx-small slds-page-header">
                <div class="slds-col slds-has-flexi-truncate">
                    <!-- HEADING AREA -->
                    <!-- MEDIA OBJECT = FIGURE + BODY -->
                    <div class="slds-media slds-no-space slds-grow">
                        <div
                            class="slds-p-around_xx-small slds-m-top_xxx-small slds-m-left_x-small slds-icon_container">
                            <lightning-icon icon-name="standard:report">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body slds-p-around_x-small">
                            <p class="slds-text-title slds-line-height_reset" if:true={API_NAMES}>
                                {API_NAMES.BusinessUnit__c.objectLabel}
                            </p>
                            <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
                                {labels.LBL_BU_Cluster_mgt}
                            </h1>
                        </div>
                    </div>
                </div>
                <lightning-button class="slds-button header_button slds-m-around_xx-small" variant="border-filled"
                    label={labels.LBL_Back_To_Home_Page} onclick={handleBackToHomePage}
                    if:false={recordId}></lightning-button>
                <lightning-button class="slds-button header_button slds-m-around_xx-small" variant="brand"
                    label={labels.LBL_Save} onclick={handleSave} if:true={isDisplaySaveBtn}></lightning-button>
                <lightning-button-icon icon-name="utility:filterList" alternative-text="Filter" variant="border-filled"
                    class="slds-button slds-button-icon slds-m-around_xx-small" onclick={toggleFilter}
                    if:false={isEmptyList}>
                </lightning-button-icon>
                <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" variant="border-filled"
                    class="slds-button slds-button-icon slds-m-around_xx-small" onclick={toggleEditMode}
                    if:false={isEmptyList}>
                </lightning-button-icon>
            </div>
        </div>
        <div class=" slds-grid">
            <div id="myTable"
                class="table-div slds-card slds-col slds-no-flex main-panel slds-scrollable slds-size--1-of-1">
                <template if:true={isEmptyList}>
                    <div class="slds-media__body">
                        <h1
                            class="slds-text-heading_medium slds-text-color_destructive slds-align_absolute-center slds-m-around_xx-large slds-size_1-of-1">
                            {labels.LBL_No_Record_To_Display}
                        </h1>
                    </div>
                </template>
                <template if:false={isEmptyList}>
                    <table
                        class="main-table slds-table slds-table_bordered main-table slds-border--left slds-border_right slds-no-row-hover">
                        <thead>
                            <tr>
                                <template for:each={firstHeader} for:item="field">
                                    <th key={field.fieldApiName} style="background-color:#0c769e;color:white;"
                                        class={field.fieldClass} rowspan="2">
                                        {field.fieldLabel}
                                    </th>
                                </template>
                                <th colspan="4" class="slds-text-align_center SOSHeaderStyle">{labels.LBL_SOS_Number}
                                </th>
                                <th colspan="4" class="slds-text-align_center WDHeaderStyle">{labels.LBL_WD}</th>
                                <th colspan="12" class="slds-text-align_center WDInnoRiseHeaderStyle">
                                    {labels.LBL_WD_InnoRise}</th>
                                <th colspan="12" class="slds-text-align_center WDSwitchRiseHeaderStyle">
                                    {labels.LBL_WD_SwitchRise}</th>
                                <th colspan="12" class="slds-text-align_center WDStopRiseHeaderStyle">
                                    {labels.LBL_WD_StopRise}</th>
                            </tr>
                            <tr>
                                <template iterator:year={yearsValueHeader}>
                                    <th class="number-th" key={year.value} if:false={year.first}
                                        style="background-color:#f1a983;color:white;">
                                        {year.value}</th>
                                    <th class="number-th borderSeparatorLeft" if:true={year.first} key={year.value}
                                        style="background-color:#f1a983;color:white;">
                                        {year.value}</th>
                                </template>
                                <template iterator:year={yearsValueHeader}>
                                    <th class="number-th" key={year.value} if:false={year.first}
                                        style="background-color:#b5e6a2;color:white;">
                                        {year.value}</th>
                                    <th class="number-th borderSeparatorLeft" if:true={year.first} key={year.value}
                                        style="background-color:#b5e6a2;color:white;">
                                        {year.value}</th>
                                </template>
                                <template iterator:month={monthsValueHeader}>
                                    <th class="number-th" key={month.value} if:false={month.first}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                    <th class="number-th borderSeparatorLeft" if:true={month.first} key={month.value}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                </template>
                                <template iterator:month={monthsValueHeader}>
                                    <th class="number-th" key={month.value} if:false={month.first}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                    <th class="number-th borderSeparatorLeft" if:true={month.first} key={month.value}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                </template>
                                <template iterator:month={monthsValueHeader}>
                                    <template if:false={month.first}>
                                        <template if:false={month.last}>
                                            <th class="number-th" key={month.value} if:false={month.first}
                                                style="background-color:#f2ceef;color:white;">
                                                {month.value}</th>
                                        </template>
                                    </template>
                                    <th class="number-th borderSeparatorLeft" if:true={month.first} key={month.value}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                    <th class="number-th borderSeparatorRight" if:true={month.last} key={month.value}
                                        style="background-color:#f2ceef;color:white;">
                                        {month.value}</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={dataArray} for:item="country" for:index="countryIndex">
                                <template if:true={country.isShowCountry}>
                                    <tr key={country.Id} class="country">
                                        <td colspan="2" class="link country head-td-Style">
                                            <template if:false={country.isDisplayedBanner}>
                                                <lightning-icon icon-name="utility:chevronright" size="xx-small"
                                                    class="white-icon slds-col" style="margin-right: 5px;"
                                                    onclick={handleCollapseBanner} data-country-index={countryIndex}>
                                                </lightning-icon>
                                            </template>
                                            <template if:true={country.isDisplayedBanner}>
                                                <lightning-icon icon-name="utility:chevrondown" size="xx-small"
                                                    class="white-icon slds-col" style="margin-right: 5px;"
                                                    onclick={handleCollapseBanner} data-country-index={countryIndex}>
                                                </lightning-icon>
                                            </template>
                                            <a href={country.link} target="_blank">
                                                {country.Name}</a>
                                        </td>
                                        <td class="country head-td-Style"></td>
                                        <td colspan={bannerColspan} class="head-td-Style"></td>
                                        <td colspan="4" class="borderSeparatorLeft head-td-Style"></td>
                                        <td colspan="4" class="borderSeparatorLeft head-td-Style"></td>
                                        <td colspan="12" class="borderSeparatorLeft head-td-Style"></td>
                                        <td colspan="12" class="borderSeparatorLeft head-td-Style"></td>
                                        <td colspan="12" class="borderSeparatorLeft borderSeparatorRight head-td-Style">
                                        </td>
                                    </tr>
                                    <template if:true={country.isDisplayedBanner}>
                                        <template for:each={country.bannerWrapperList} for:item="banner"
                                            for:index="bannerIndex">
                                            <template if:true={banner.isShowBanner}>
                                                <tr key={banner.Id} class="banner">
                                                    <td colspan="2" style="padding-left: 40px;border-right:none;"
                                                        class="link banner head-td-Style">
                                                        <div class="slds-grid">
                                                            <template if:false={banner.isDisplayedBU}>
                                                                <lightning-icon icon-name="utility:chevronright"
                                                                    size="xx-small" class="white-icon"
                                                                    style="margin-right: 5px;"
                                                                    onclick={handleCollapseBU}
                                                                    data-country-index={countryIndex}
                                                                    data-banner-index={bannerIndex}>
                                                                </lightning-icon>
                                                            </template>
                                                            <template if:true={banner.isDisplayedBU}>
                                                                <lightning-icon icon-name="utility:chevrondown"
                                                                    size="xx-small" class="white-icon"
                                                                    style="margin-right: 5px;"
                                                                    onclick={handleCollapseBU}
                                                                    data-country-index={countryIndex}
                                                                    data-banner-index={bannerIndex}>
                                                                </lightning-icon>
                                                            </template>
                                                            <span class="slds-wrap">
                                                                <a href={banner.link} target="_blank">
                                                                    {banner.Name}
                                                                </a>
                                                            </span>
                                                        </div>
                                                    </td>
                                                    <td class="banner head-td-Style">
                                                        <template if:true={banner.isDisplayedBU}>
                                                            <lightning-icon icon-name="utility:add" size="xx-small"
                                                                class="white-icon" onclick={addNewCluster}
                                                                data-country-index={countryIndex}
                                                                data-banner-index={bannerIndex}>
                                                            </lightning-icon>
                                                        </template>
                                                    </td>
                                                    <td colspan={bannerColspan} class="head-td-Style"></td>
                                                    <template for:each={banner.values} for:item="field"
                                                        for:index="fieldIndex">
                                                        <td key={field.fieldApiName} class={field.styleClass}
                                                            style={field.fieldStyle}>
                                                            <template if:false={field.isInput}>
                                                                <template if:true={field.isName}>
                                                                    <a href={field.link} target="_blank">
                                                                        {field.fieldValue}</a>
                                                                </template>
                                                                <template if:true={field.isText}>
                                                                    {field.fieldValue}
                                                                </template>
                                                                <template if:true={field.isNumber}>
                                                                    <lightning-formatted-number value={field.fieldValue}
                                                                        minimum-fraction-digits={field.scale}
                                                                        maximum-fraction-digits={field.scale}>
                                                                    </lightning-formatted-number>
                                                                </template>
                                                                <template if:true={field.isPicklist}>
                                                                    {field.fieldOutputValue}
                                                                </template>
                                                                <template if:true={field.isReference}>
                                                                    {field.fieldValue}
                                                                </template>
                                                                <template if:true={field.isDate}>
                                                                    {field.fieldOutputValue}
                                                                </template>
                                                            </template>
                                                            <template if:true={field.isInput}>
                                                                <template lwc:if={isEditModeActive}>
                                                                    <template if:true={field.isNumber}>
                                                                        <lightning-input variant="label-hidden"
                                                                            type="number" step={field.step}
                                                                            value={field.fieldValue}
                                                                            data-field={field.fieldApiName}
                                                                            data-id={field.id}
                                                                            onchange={handleEditBanner}
                                                                            style="color: black !important;"
                                                                            class="input-right">
                                                                        </lightning-input>
                                                                    </template>
                                                                </template>
                                                                <template lwc:else>
                                                                    <template if:true={field.isName}>
                                                                        <a href={field.link} target="_blank">
                                                                            {field.fieldValue}</a>
                                                                    </template>
                                                                    <template if:true={field.isText}>
                                                                        {field.fieldValue}
                                                                    </template>
                                                                    <template if:true={field.isNumber}>
                                                                        <lightning-formatted-number
                                                                            value={field.fieldValue}
                                                                            minimum-fraction-digits={field.scale}
                                                                            maximum-fraction-digits={field.scale}>
                                                                        </lightning-formatted-number>
                                                                    </template>
                                                                    <template if:true={field.isPicklist}>
                                                                        {field.fieldOutputValue}
                                                                    </template>
                                                                    <template if:true={field.isReference}>
                                                                        {field.fieldValue}
                                                                    </template>
                                                                    <template if:true={field.isDate}>
                                                                        {field.fieldOutputValue}
                                                                    </template>
                                                                </template>
                                                            </template>
                                                        </td>
                                                    </template>
                                                </tr>
                                                <template if:true={banner.isDisplayedBU}>
                                                    <template for:each={banner.BuWrapperList} for:item="BU"
                                                        for:index="BuIndex">
                                                        <tr key={BU}>
                                                            <template for:each={BU.values} for:item="field"
                                                                for:index="fieldIndex">
                                                                <td key={field} style={field.fieldStyle}
                                                                    class={field.styleClass}>
                                                                    <template if:false={field.isInput}>
                                                                        <template if:true={field.isName}>
                                                                            <a href={field.link} target="_blank">
                                                                                {field.fieldValue}</a>
                                                                        </template>
                                                                        <template if:true={field.isText}>
                                                                            {field.fieldValue}
                                                                        </template>
                                                                        <template if:true={field.isNumber}>
                                                                            <lightning-formatted-number
                                                                                value={field.fieldValue}
                                                                                minimum-fraction-digits={field.scale}
                                                                                maximum-fraction-digits={field.scale}>
                                                                            </lightning-formatted-number>
                                                                        </template>
                                                                        <template if:true={field.isPicklist}>
                                                                            {field.fieldOutputValue}
                                                                        </template>
                                                                        <template if:true={field.isReference}>
                                                                            {field.fieldValue}
                                                                        </template>
                                                                        <template if:true={field.isDate}>
                                                                            {field.fieldOutputValue}
                                                                        </template>
                                                                    </template>
                                                                    <template if:true={field.isInput}>
                                                                        <template lwc:if={isEditModeActive}>
                                                                            <template if:true={field.isText}>
                                                                                <lightning-input variant="label-hidden"
                                                                                    data-field={field.fieldApiName}
                                                                                    data-id={field.id}
                                                                                    value={field.fieldValue}
                                                                                    onchange={handleEditCluster}>
                                                                                </lightning-input>
                                                                            </template>
                                                                            <template if:true={field.isName}>
                                                                                <lightning-input variant="label-hidden"
                                                                                    data-field={field.fieldApiName}
                                                                                    data-id={field.id}
                                                                                    value={field.fieldValue}
                                                                                    onchange={handleEditCluster}>
                                                                                </lightning-input>
                                                                            </template>
                                                                            <template if:true={field.isNumber}>
                                                                                <lightning-input variant="label-hidden"
                                                                                    type="number" step={field.step}
                                                                                    value={field.fieldValue}
                                                                                    data-field={field.fieldApiName}
                                                                                    data-id={field.id}
                                                                                    onchange={handleEditCluster}
                                                                                    class="input-right">
                                                                                </lightning-input>
                                                                            </template>
                                                                            <template if:true={field.isPicklist}>
                                                                                <select data-field={field.fieldApiName}
                                                                                    data-id={field.id}
                                                                                    onchange={handleEditCluster}>
                                                                                    <template
                                                                                        for:each={field.fieldOptions}
                                                                                        for:item="option">
                                                                                        <option key={option.value}
                                                                                            value={option.value}
                                                                                            selected={option.isSelected}>
                                                                                            {option.label}</option>
                                                                                    </template>
                                                                                </select>
                                                                            </template>
                                                                            <template if:true={field.isDate}>
                                                                                <lightning-input type="date"
                                                                                    data-field={field.fieldApiName}
                                                                                    data-id={field.id}
                                                                                    onchange={handleEditCluster}
                                                                                    variant="label-hidden"
                                                                                    value={field.fieldValue}></lightning-input>
                                                                            </template>
                                                                            <template if:true={field.isReference}>
                                                                                <c-neg-optim-custom-lookup
                                                                                    object-name={API_NAMES.Hierarchy__c.objectApiName}
                                                                                    data-field="countryParam"
                                                                                    field-name="Name" is-multi="false"
                                                                                    icon-name=""
                                                                                    selected-event={Events.selectCategory}
                                                                                    data-isdecimal="false"
                                                                                    data-is-category="true"
                                                                                    onselectcategory={handleEditCluster}
                                                                                    search-fields={searchCategoryFields}>
                                                                                </c-neg-optim-custom-lookup>
                                                                            </template>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <template if:true={field.isName}>
                                                                                <a href={field.link} target="_blank">
                                                                                    {field.fieldValue}</a>
                                                                            </template>
                                                                            <template if:true={field.isText}>
                                                                                {field.fieldValue}
                                                                            </template>
                                                                            <template if:true={field.isNumber}>
                                                                                <lightning-formatted-number
                                                                                    value={field.fieldValue}
                                                                                    minimum-fraction-digits={field.scale}
                                                                                    maximum-fraction-digits={field.scale}>
                                                                                </lightning-formatted-number>
                                                                            </template>
                                                                            <template if:true={field.isPicklist}>
                                                                                {field.fieldOutputValue}
                                                                            </template>
                                                                            <template if:true={field.isReference}>
                                                                                {field.fieldValue}
                                                                            </template>
                                                                            <template if:true={field.isDate}>
                                                                                {field.fieldOutputValue}
                                                                            </template>
                                                                        </template>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                        </tr>
                                                    </template>
                                                    <template for:each={banner.newBuWrapperList} for:item="cluster"
                                                        for:index="clusterIndex">
                                                        <tr key={cluster}>
                                                            <template for:each={cluster.values} for:item="field"
                                                                for:index="fieldIndex">
                                                                <td key={field} style={field.fieldStyle}
                                                                    class={field.styleClass}>
                                                                    <template if:true={field.isInput}>
                                                                        <template if:true={field.isText}>
                                                                            <lightning-input variant="label-hidden"
                                                                                value={field.fieldValue}
                                                                                onblur={handleChangeFieldsNewCluster}
                                                                                data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isName}>
                                                                            <lightning-input variant="label-hidden"
                                                                                value={field.fieldValue}
                                                                                onblur={handleChangeFieldsNewCluster}
                                                                                data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}>
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isNumber}>
                                                                            <lightning-input variant="label-hidden"
                                                                                value={field.fieldValue} type="number"
                                                                                step={field.step}
                                                                                onchange={handleChangeFieldsNewCluster}
                                                                                data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}
                                                                                class="input-right">
                                                                            </lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isPicklist}>
                                                                            <select data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}
                                                                                onchange={handleChangeFieldsNewCluster}>
                                                                                <template for:each={field.fieldOptions}
                                                                                    for:item="option">
                                                                                    <option key={option.value}
                                                                                        value={option.value}
                                                                                        selected={option.isSelected}>
                                                                                        {option.label}</option>
                                                                                </template>
                                                                            </select>
                                                                        </template>
                                                                        <template if:true={field.isDate}>
                                                                            <lightning-input type="date"
                                                                                onchange={handleChangeFieldsNewCluster}
                                                                                data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}
                                                                                variant="label-hidden"
                                                                                value={field.fieldValue}></lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isReference}>
                                                                            <c-neg-optim-custom-lookup
                                                                                object-name={API_NAMES.Hierarchy__c.objectApiName}
                                                                                data-field={field.fieldApiName}
                                                                                data-country-index={countryIndex}
                                                                                data-banner-index={bannerIndex}
                                                                                data-cluster-index={clusterIndex}
                                                                                data-field-index={fieldIndex}
                                                                                data-is-category="true"
                                                                                field-name="Name" is-multi="false"
                                                                                icon-name=""
                                                                                selected-event={Events.selectCategory}
                                                                                data-isdecimal="false"
                                                                                onselectcategory={handleChangeFieldsNewCluster}
                                                                                search-fields={searchCategoryFields}>
                                                                            </c-neg-optim-custom-lookup>
                                                                        </template>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                        </tr>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>
                                    </template>
                                </template>
                            </template>
                        </tbody>
                    </table>
                    <lightning-spinner class="slds-align--absolute-center" variant="brand" size="medium"
                        if:true={loadmore} style="position: relative;">
                    </lightning-spinner>
                </template>
            </div>

            <div class="slds-hide filter-panel slds-card slds-m-around_none ">
                <template if:false={tableLoading}>
                    <div class="filter-header slds-panel__header">
                        <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate">
                            {labels.LBL_Filter}</h2>
                        <lightning-button-icon variant="bare" icon-name="utility:close" onclick={toggleFilter}>
                        </lightning-button-icon>
                    </div>
                    <div class="slds-grid slds-grid--vertical slds-size--1-of-1" lwc:if={resultsData}>
                        <template lwc:if={isNotBannerPage}>
                            <div class="slds-col slds-size--1-of-1 slds-p-around--x-small" style="min-height: 50px">
                                <lightning-record-picker if:false={tableLoading} label={labels.LBL_Country}
                                    filter={BuCountryFilter} value={countryParam} onchange={fillFilterParam}
                                    object-api-name={API_NAMES.BusinessUnit__c.objectApiName} data-field="countryParam"
                                    data-isdecimal="false" matching-info={buMatchingInfo} display-info={buDisplayInfo}>
                                </lightning-record-picker>
                            </div>
                        </template>
                        <template lwc:if={isNotBannerPage}>
                            <div class="slds-col slds-size--1-of-1 slds-p-around--x-small" style="min-height: 50px">
                                <lightning-record-picker if:false={tableLoading} label={labels.LBL_Banner}
                                    filter={BuBannerFilter} value={bannerParam} onchange={fillFilterParam}
                                    object-api-name={API_NAMES.BusinessUnit__c.objectApiName} data-field="bannerParam"
                                    data-isdecimal="false" matching-info={buMatchingInfo} display-info={buDisplayInfo}>
                                </lightning-record-picker>
                            </div>
                        </template>
                        <div class="slds-col slds-size--1-of-1 slds-p-around--x-small" style="min-height: 50px">
                            <lightning-record-picker if:false={tableLoading}
                                label={labels.Hierarchy__c} value={categoryParam}
                                onchange={fillFilterParam} object-api-name={API_NAMES.Hierarchy__c.objectApiName}
                                data-field="categoryParam" data-isdecimal="false" matching-info={heMatchingInfo}
                                display-info={heDisplayInfo}>
                            </lightning-record-picker>
                        </div>
                        <div class="slds-col slds-size--1-of-1 slds-p-around--x-small" style="min-height: 50px">
                            <lightning-input if:false={tableLoading} label={labels.ClientCategory__c}
                                value={clientCategParam} onchange={fillFilterParam}
                                object-api-name={API_NAMES.Hierarchy__c.objectApiName} data-field="clientCategParam"
                                data-isdecimal="false">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size--1-of-1 slds-p-around--x-small" style="min-height: 50px">
                            <!-- sldsValidatorIgnoreNextLine -->
                            <lightning-combobox data-field='stratParam'
                                label={labels.AssortmentStrat__c} value={stratParam}
                                options={stratOptions} onchange={fillFilterParam}>
                            </lightning-combobox>
                        </div>
                    </div>
                    <div id="searchButtons" class="slds-card__footer slds-grid slds-m-top_none slds-p-vertical_small">
                        <div class="slds-col">
                            <lightning-button onclick={handleReset} label={labels.LBL_Reset}>
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" onclick={filterData}
                                label={labels.LBL_Search}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
